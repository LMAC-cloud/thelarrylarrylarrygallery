<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Larry's Variety — Stamp Merge Game 12</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:#2f2117}
body{
  min-height:100vh;
  background:#704728;
  background-image:
    linear-gradient(90deg,#5a351f 0 9%,transparent 9% 91%,#5a351f 91% 100%);
}
header{
  text-align:center;
  padding:12px 10px 8px;
  background:#f3e6ca;
  border-bottom:4px solid #4c2d19;
}
h1{margin:0 0 4px;font-size:27px}
#status{min-height:22px;font-size:15px}
.layout{
  width:min(1580px,96vw);
  margin:12px auto 24px;
  display:grid;
  grid-template-columns:minmax(700px,1fr) 310px;
  gap:14px;
  align-items:start;
}
.main{
  min-width:0;
  background:#ead8b7;
  border:4px solid #4c2d19;
  border-radius:14px;
  padding:10px;
  box-shadow:0 7px 18px rgba(0,0,0,.35);
}
.controls{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px
}
button{
  border:2px solid #4e2d18;border-radius:8px;background:#6b4529;color:#fff;
  padding:7px 12px;font:bold 14px Georgia,serif;cursor:pointer
}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:default}
#doubleBonus{background:#557d35}
.board{
  width:100%;
  height:min(72vh,700px);
  min-height:520px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  gap:5px;
  padding:9px;
  background:#24180f;
  border:5px solid #432716;
  border-radius:15px;
  box-shadow:inset 0 0 16px rgba(0,0,0,.45),0 6px 14px rgba(30,15,5,.35);
  contain:layout paint;
  overflow:hidden;
}
.cell{
  min-width:0;min-height:0;
  border-radius:5px;
  border:2px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.cell:nth-child(odd){background:#f4f1e8}
.cell:nth-child(even){background:#171717}
.item{
  width:92%;height:92%;object-fit:cover;user-select:none;
  -webkit-user-drag:none;touch-action:none;cursor:grab;
  box-shadow:0 3px 6px rgba(0,0,0,.28)
}
.item:active{cursor:grabbing}
.stamp{
  width:90%;height:90%;padding:5px;background:white;
  border:3px solid white;outline:1px solid #a99b87;
  box-shadow:0 2px 5px rgba(0,0,0,.32);object-fit:cover
}
.stamp-number{
  position:absolute;right:5px;bottom:4px;background:white;
  border:1px solid #8b7962;border-radius:3px;padding:1px 4px;
  font:bold 11px Arial,sans-serif;z-index:2
}
.generator{
  width:84%;height:84%;position:relative;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
  background:#faf8f1;border:3px solid #9e8e77;
  box-shadow:0 4px 9px rgba(0,0,0,.35);
  clip-path:polygon(4% 8%,10% 3%,17% 8%,24% 3%,31% 8%,38% 3%,45% 8%,52% 3%,59% 8%,66% 3%,73% 8%,80% 3%,87% 8%,96% 3%,96% 95%,4% 95%);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-drag:none
}
.generator .horn-icon{width:62%;height:62%;pointer-events:none}
.generator .horn-icon *{fill:#111}
.generator img,.gen-label{display:none}
.mailbox{
  width:86%;height:86%;position:relative;display:flex;
  align-items:center;justify-content:center;
  background:linear-gradient(#c94a32,#8f2319);
  border:4px solid #641b14;border-radius:12px 12px 8px 8px;
  box-shadow:inset 0 0 9px rgba(0,0,0,.32),0 5px 9px rgba(0,0,0,.35);
  color:white;font-size:34px;cursor:grab;touch-action:none;user-select:none
}
.mailbox:active{cursor:grabbing}
.mailbox:before{
  content:"";position:absolute;top:17%;left:14%;right:14%;height:17%;
  background:#4b1711;border:2px solid #f0d4bb;border-radius:2px
}
.mailbox:after{
  content:"MAIL";position:absolute;bottom:10%;font:bold 14px Georgia,serif;
  letter-spacing:1px;color:#fff4e7
}
.letter{
  width:88%;height:72%;background:#fff8e8;border:2px solid #a88e6c;
  border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;position:relative
}
.letter:after{content:"✉";font-size:34px}
.panel{
  background:rgba(255,248,232,.97);border:2px solid #a98a65;
  border-radius:11px;padding:10px;box-shadow:0 5px 12px rgba(50,30,10,.25)
}
.panel h2{font-size:18px;margin:0 0 8px}
.money{font-size:20px;font-weight:bold;margin-bottom:9px}
.order{
  background:#f8f0df;border:1px solid #b79d79;border-radius:8px;
  padding:8px;margin-bottom:8px;min-height:126px
}
.order-title{font-weight:bold;margin-bottom:5px}
.order-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.order-slots{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}
.order-slot{
  width:29px;height:29px;border:1px dashed #8d795d;background:white;
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  font:bold 12px Arial,sans-serif;color:#4a3a2a
}
.order-slot.filled{background:#e3efd9;border-color:#668b58;color:#397332}
.order.drop-target{outline:3px solid #d6a548;box-shadow:0 0 0 2px rgba(214,165,72,.25)}
#musicStatus{font-size:12px;margin-top:8px}
@media(max-width:1100px){
  .layout{grid-template-columns:1fr}
  .panel{order:-1;min-height:0}
}
@media(max-width:760px){
  .layout{width:98vw}
  .board{height:78vw;min-height:0}
}
</style>
</head>
<body>

<script>

const board=document.getElementById("board");
const statusEl=document.getElementById("status");
const doubleBonus=document.getElementById("doubleBonus");
const musicButton=document.getElementById("musicButton");
const resetBtn=document.getElementById("reset");
const moneyEl=document.getElementById("money");
const ordersEl=document.getElementById("orders");

const cells=[];
let nextId=1;
let money=0;
let activeSeries=1;
let secondGenerator=false;
let mailboxCell=35;
let audioContext=null;
let music=null;
let musicOn=false;

const generators={
  1:{cell:27,level:1,boost:0,unlocked:true},
  2:{cell:28,level:1,boost:0,unlocked:false}
};
const series7Letters={1:false,2:false};
let imagesReady=true;
let nextOrderId=1;

function playTone(type){
  try{
    if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    const now=audioContext.currentTime;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    if(type==="pickup"){
      osc.type="triangle";
      osc.frequency.setValueAtTime(330,now);
      osc.frequency.exponentialRampToValueAtTime(520,now+.07);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(.11,now+.008);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.10);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(now);osc.stop(now+.11);
    }else if(type==="merge"){
      osc.type="sine";
      osc.frequency.setValueAtTime(220,now);
      osc.frequency.exponentialRampToValueAtTime(330,now+.10);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(.15,now+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.16);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(now);osc.stop(now+.17);
    }else{
      osc.type="sine";
      osc.frequency.setValueAtTime(150,now);
      osc.frequency.exponentialRampToValueAtTime(55,now+.16);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(.20,now+.01);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.18);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(now);osc.stop(now+.19);
    }
  }catch(e){}
}

function makeBoard(){
  board.innerHTML="";
  cells.length=0;
  for(let i=0;i<64;i++){
    const c=document.createElement("div");
    c.className="cell";
    c.dataset.index=i;
    board.appendChild(c);
    cells.push(c);
  }
  // Fixed postal mailbox: always visible on the board.
  createMailbox(cells[mailboxCell]);
}

function emptyCells(exclude=[]){
  return cells.filter(c=>!c.querySelector(".item,.generator,.mailbox")&&!exclude.includes(+c.dataset.index));
}

function neighbours(index){
  const r=Math.floor(index/8),col=index%8,a=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    const rr=r+dr,cc=col+dc;
    if(rr>=0&&rr<8&&cc>=0&&cc<8)a.push(rr*8+cc);
  }
  return a.sort(()=>Math.random()-.5);
}

function createStamp(cell,level){
  if(level<1||level>images.length)return;
  const img=document.createElement("img");
  img.className="item stamp";
  img.src=images[level-1];
  img.dataset.level=level;
  img.dataset.id=nextId++;
  img.draggable=false;
  const n=document.createElement("div");
  n.className="stamp-number";
  n.textContent=level;
  cell.append(img,n);
  img.addEventListener("pointerdown",startItemDrag);
}

function createLetter(cell,series){
  const l=document.createElement("div");
  l.className="letter item";
  l.dataset.level="letter";
  l.dataset.series=series;
  l.dataset.id=nextId++;
  l.title="Letter — drag the Level 7 stamp here";
  cell.appendChild(l);
  l.addEventListener("pointerdown",startItemDrag);
}

function createMailbox(cell){
  const existing=cell.querySelector(".mailbox");
  if(existing)return existing;
  const m=document.createElement("div");
  m.className="mailbox";
  m.textContent="✉";
  m.dataset.level="mailbox";
  m.title="MAIL — drag this box to an empty square; drop requested stamps here";
  cell.appendChild(m);
  m.addEventListener("pointerdown",startMailboxDrag);
  return m;
}

function hornSVG(){
  return `<svg class="horn-icon" viewBox="0 0 80 80" aria-hidden="true">
    <path d="M12 46h24l15 12V22L36 34H12z"/>
    <circle cx="20" cy="40" r="6"/>
    <path d="M51 28c10 3 15 10 15 20s-5 17-15 20l-4-7c6-2 9-6 9-13s-3-11-9-13z"/>
    <rect x="61" y="34" width="8" height="12" rx="3"/>
  </svg>`;
}

function createGenerator(cell,which){
  const g=generators[which];
  const d=document.createElement("div");
  d.className="generator";
  d.dataset.generator=which;
  d.innerHTML=hornSVG();
  cell.appendChild(d);
  d.addEventListener("pointerdown",e=>startGeneratorDrag(e,which));
  d.addEventListener("click",e=>{
    if(!d.dataset.moved){
      playTone("generator");
      spill(which);
    }
  });
}

function renderGenerators(){
  Object.entries(generators).forEach(([k,g])=>{
    const old=document.querySelector('.generator[data-generator="'+k+'"]');
    if(old)old.remove();
    if(g.unlocked && cells[g.cell] && !cells[g.cell].querySelector(".item,.mailbox")){
      createGenerator(cells[g.cell],+k);
    }
  });
}

function renderOrders(){
  ordersEl.innerHTML="";
  orders.forEach(o=>{
    const div=document.createElement("div");
    div.className="order";
    div.dataset.orderId=o.id;
    div.innerHTML='<div class="order-title">Order '+o.id+' — '+o.reward+' LAR</div>';

    o.req.forEach(([lvl,count])=>{
      const row=document.createElement("div");
      row.className="order-row";
      row.innerHTML="<span>Stamp "+lvl+"</span><strong>"+count+" needed</strong>";
      div.appendChild(row);
    });

    const slots=document.createElement("div");
    slots.className="order-slots";
    o.req.forEach(([lvl,count])=>{
      const received=o.filled.filter(x=>x===lvl).length;
      for(let j=0;j<count;j++){
        const q=document.createElement("div");
        q.className="order-slot";
        if(j<received){
          q.classList.add("filled");
          q.textContent="✓";
        }else{
          q.textContent=lvl;
        }
        slots.appendChild(q);
      }
    });
    div.appendChild(slots);
    ordersEl.appendChild(div);
  });
  moneyEl.textContent=money;
}

function makeOrder(){
  const patterns=[
    {req:[[1,2],[2,1]],reward:25},
    {req:[[2,2],[3,1]],reward:30},
    {req:[[1,3],[4,1]],reward:40},
    {req:[[2,2],[5,1]],reward:50},
    {req:[[3,2],[4,2]],reward:65},
    {req:[[1,2],[3,2],[6,1]],reward:75},
    {req:[[2,3],[4,2],[7,1]],reward:90},
    {req:[[3,2],[5,2],[8,1]],reward:110},
    {req:[[1,3],[4,2],[8,1]],reward:120},
    {req:[[2,2],[6,2],[9,1]],reward:140},
    {req:[[4,2],[7,2],[10,1]],reward:165},
    {req:[[1,4],[5,2],[10,1]],reward:180},
    {req:[[3,3],[6,2],[12,1]],reward:210},
    {req:[[2,3],[8,2],[14,1]],reward:240}
  ];
  const p=patterns[Math.floor(Math.random()*patterns.length)];
  return {req:p.req,reward:p.reward,id:nextOrderId++,filled:[]};
}

let orders=[makeOrder(),makeOrder(),makeOrder()];

function checkOrder(o){
  const counts={};
  o.filled.forEach(x=>counts[x]=(counts[x]||0)+1);
  const complete=o.req.every(([l,c])=>(counts[l]||0)>=c);
  if(complete){
    money+=o.reward;
    statusEl.textContent="Order "+o.id+" complete: +"+o.reward+" LAR.";
    const pos=orders.findIndex(x=>x.id===o.id);
    if(pos!==-1)orders.splice(pos,1,makeOrder());
  }
  renderOrders();
}

function acceptStampIntoOrder(order,source,from,level){
  const stampLevel=+level;
  if(!Number.isFinite(stampLevel))return false;
  const need=order.req.reduce((n,[l,c])=>n+(l===stampLevel?c:0),0);
  const have=order.filled.filter(x=>x===stampLevel).length;
  if(!need || have>=need)return false;
  from.innerHTML="";
  order.filled.push(stampLevel);
  checkOrder(order);
  if(!order.req.every(([l,c])=>order.filled.filter(x=>x===l).length>=c)){
    statusEl.textContent="Stamp "+stampLevel+" added to Order "+order.id+".";
  }
  return true;
}

function findOrderAtPoint(x,y){
  const el=document.elementFromPoint(x,y);
  return el?.closest(".order");
}

function deliverToMailbox(source,from,level){
  const stampLevel=+level;
  if(!Number.isFinite(stampLevel)){
    statusEl.textContent="Only numbered stamps can be mailed.";
    return;
  }
  let chosen=null;
  for(const o of orders){
    const need=o.req.reduce((n,[l,c])=>n+(l===stampLevel?c:0),0);
    const have=o.filled.filter(x=>x===stampLevel).length;
    if(need>have){chosen=o;break;}
  }
  if(!chosen){
    statusEl.textContent="No current order needs Stamp "+stampLevel+".";
    return;
  }
  acceptStampIntoOrder(chosen,source,from,level);
}

function spill(which){
  const g=generators[which];
  const near=neighbours(g.cell).filter(i=>!cells[i].querySelector(".item,.generator,.mailbox"));
  if(!near.length){
    statusEl.textContent="No empty square surrounds the generator.";
    return;
  }
  let level=g.level;
  if(which===1 && g.boost>0){
    level=Math.min(images.length,g.level+1);
    g.boost--;
  }
  const dest=cells[near[0]];
  createStamp(dest,level);
  statusEl.textContent="Stamp "+level+" generated.";
}

function startGeneratorDrag(e,which){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const g=generators[which],el=e.currentTarget,from=el.parentElement;
  let moved=false;
  const move=ev=>{
    if(Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)>6)moved=true;
  };
  const up=ev=>{
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    if(!moved){
      el.dataset.moved="";
      setTimeout(()=>delete el.dataset.moved,30);
      return;
    }
    const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".cell");
    if(target && !target.querySelector(".item,.generator,.mailbox")){
      from.innerHTML="";
      target.appendChild(el);
      g.cell=+target.dataset.index;
      el.dataset.moved="1";
      setTimeout(()=>delete el.dataset.moved,30);
    }else{
      statusEl.textContent="The generator needs an empty square.";
    }
  };
  document.addEventListener("pointermove",move,{passive:true});
  document.addEventListener("pointerup",up,{once:true});
}

function startMailboxDrag(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();
  e.stopPropagation();

  const source=e.currentTarget;
  const from=source.parentElement;
  const rect=source.getBoundingClientRect();
  let dragging=false;

  const ghost=source.cloneNode(true);
  ghost.style.position="fixed";
  ghost.style.width=rect.width+"px";
  ghost.style.height=rect.height+"px";
  ghost.style.left=rect.left+"px";
  ghost.style.top=rect.top+"px";
  ghost.style.zIndex="99999";
  ghost.style.pointerEvents="none";
  ghost.style.opacity=".88";
  ghost.style.margin="0";
  document.body.appendChild(ghost);
  source.style.opacity=".28";

  const clearOutlines=()=>{
    document.querySelectorAll(".cell,.order").forEach(el=>el.style.outline="");
  };

  const move=ev=>{
    dragging=true;
    ghost.style.left=(ev.clientX-rect.width/2)+"px";
    ghost.style.top=(ev.clientY-rect.height/2)+"px";
    clearOutlines();
    const hit=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=hit?.closest(".cell");
    if(target&&target!==from&&!target.querySelector(".item,.generator,.mailbox")){
      target.style.outline="3px solid #ffe4a8";
    }
  };

  const up=ev=>{
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    clearOutlines();
    source.style.opacity="1";
    ghost.remove();

    if(!dragging)return;

    const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".cell");
    if(target&&target!==from&&!target.querySelector(".item,.generator,.mailbox")){
      from.innerHTML="";
      target.appendChild(source);
      mailboxCell=+target.dataset.index;
      source.style.opacity="1";
      statusEl.textContent="MAIL moved.";
      return;
    }

    statusEl.textContent="MAIL can only move to an empty square.";
  };

  document.addEventListener("pointermove",move,{passive:true});
  document.addEventListener("pointerup",up,{once:true});
}

function startItemDrag(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  playTone("pickup");

  const source=e.currentTarget;
  const from=source.parentElement;
  const rect=source.getBoundingClientRect();
  const level=source.dataset.level;
  let dragging=false;

  const ghost=source.cloneNode(true);
  ghost.style.position="fixed";
  ghost.style.width=rect.width+"px";
  ghost.style.height=rect.height+"px";
  ghost.style.left=rect.left+"px";
  ghost.style.top=rect.top+"px";
  ghost.style.zIndex="99999";
  ghost.style.pointerEvents="none";
  ghost.style.opacity=".86";
  document.body.appendChild(ghost);
  source.style.opacity=".2";

  const move=ev=>{
    dragging=true;
    ghost.style.left=(ev.clientX-rect.width/2)+"px";
    ghost.style.top=(ev.clientY-rect.height/2)+"px";
    document.querySelectorAll(".cell,.order").forEach(el=>el.style.outline="");
    const hit=document.elementFromPoint(ev.clientX,ev.clientY);
    const mb=hit?.closest(".mailbox");
    const order=hit?.closest(".order");
    const cell=hit?.closest(".cell");
    if(mb)mb.style.outline="4px solid #ffe4a8";
    else if(order)order.style.outline="3px solid #d6a548";
    else if(cell)cell.style.outline="3px solid rgba(255,255,255,.9)";
  };

  const up=ev=>{
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.querySelectorAll(".cell,.order").forEach(el=>el.style.outline="");
    source.style.opacity="1";
    ghost.remove();

    if(!dragging)return;

    const hit=document.elementFromPoint(ev.clientX,ev.clientY);
    const mailbox=hit?.closest(".mailbox");
    if(mailbox){
      deliverToMailbox(source,from,level);
      return;
    }

    const directOrder=findOrderAtPoint(ev.clientX,ev.clientY);
    if(directOrder){
      const order=orders.find(o=>o.id===+directOrder.dataset.orderId);
      if(order){
        if(acceptStampIntoOrder(order,source,from,level))return;
        statusEl.textContent="That order does not need another Stamp "+level+".";
        return;
      }
    }

    const target=hit?.closest(".cell");
    if(!target || target===from)return;
    if(target.querySelector(".generator"))return;

    if(target.querySelector(".letter")){
      const letter=target.querySelector(".letter");
      if(level==="7" && +letter.dataset.series===activeSeries){
        from.innerHTML="";
        target.innerHTML="";
        completeSeries(+letter.dataset.series);
        return;
      }
      statusEl.textContent="Only the Level 7 stamp can mail this letter.";
      return;
    }

    if(target.querySelector(".mailbox")){
      deliverToMailbox(source,from,level);
      return;
    }

    const other=target.querySelector(".item");
    if(target.querySelector(".mailbox")){
      deliverToMailbox(source,from,level);
      return;
    }
    if(!other){
      const badge=from.querySelector(".stamp-number");
      from.innerHTML="";
      target.appendChild(source);
      if(badge)target.appendChild(badge);
      return;
    }

    const a=+level,b=+other.dataset.level;
    if(Number.isFinite(a)&&a===b){
      if(a>=images.length){
        statusEl.textContent="The sequence has reached the last supplied painting.";
        return;
      }
      from.innerHTML="";
      target.innerHTML="";
      createStamp(target,a+1);
      playTone("merge");
      statusEl.textContent="Merge: "+a+" + "+a+" → "+(a+1);
      return;
    }
    statusEl.textContent="Only two matching stamps can merge.";
  };

  document.addEventListener("pointermove",move,{passive:true});
  document.addEventListener("pointerup",up,{once:true});
}

function completeSeries(series){
  activeSeries++;
  if(series===1){
    generators[1].level=1;
    generators[1].boost=0;
    series7Letters[1]=false;
    statusEl.textContent="Stamp Series 1 mailed. Build the next series to earn its return letter.";
  }else if(series===2){
    secondGenerator=true;
    generators[2].unlocked=true;
    generators[2].level=1;
    generators[2].boost=0;
    const spot=emptyCells([generators[1].cell])[0];
    if(spot){
      generators[2].cell=+spot.dataset.index;
    }
    statusEl.textContent="Return letter opened: Generator 2 is now yours. Its stamps do not mix with Generator 1.";
  }
  renderGenerators();
}

doubleBonus.addEventListener("click",()=>{
  generators[1].boost=10;
  doubleBonus.textContent="2× Active ("+generators[1].boost+" left)";
  statusEl.textContent="2× bonus active for 10 generator clicks.";
});

function updateBonusButton(){
  if(generators[1].boost>0){
    doubleBonus.textContent="2× Active ("+generators[1].boost+" left)";
  }else{
    doubleBonus.textContent="2× Bonus";
  }
}

musicButton.addEventListener("click",()=>{
  if(!music){
    music=new Audio("larry-background.mp3");
    music.loop=true;
    music.volume=.22;
    music.play().then(()=>{
      musicOn=true;
      musicButton.textContent="Stop Background Sound";
      document.getElementById("musicStatus").textContent="Background music: on";
    }).catch(()=>{
      document.getElementById("musicStatus").textContent="Add larry-background.mp3 beside this HTML file, then click again.";
    });
  }else if(musicOn){
    music.pause();musicOn=false;
    musicButton.textContent="Background Sound";
    document.getElementById("musicStatus").textContent="Background music: off";
  }else{
    music.play();musicOn=true;
    musicButton.textContent="Stop Background Sound";
    document.getElementById("musicStatus").textContent="Background music: on";
  }
});

resetBtn.addEventListener("click",()=>location.reload());

document.addEventListener("pointerdown",()=>{
  if(audioContext&&audioContext.state==="suspended")audioContext.resume();
},{once:false});

makeBoard();
renderOrders();
updateBonusButton();
statusEl.textContent="Ready. Click the postal-stamp generator to make a Stamp 1.";
</script>
</body>
</html>
