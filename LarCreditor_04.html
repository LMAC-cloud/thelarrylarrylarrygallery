<head>

<title>LarCreditor</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;--ink:#f1e7d8;--brass:#dfac71;--line:#544133;--panel:#231b1a}
*{box-sizing:border-box} body{margin:0;background:#170f13;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}button,select,input:not([type=range],[type=checkbox],[type=color]),textarea{border:1px solid var(--line);border-radius:6px;background:#1a1315;padding:.48rem .65rem}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--brass);color:#ffd6a0}button:disabled{opacity:.46;cursor:default}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);background:#201618}
h1{font:600 clamp(19px,3vw,28px) Georgia,serif;margin:0}.transport{display:flex;gap:6px;flex-wrap:wrap}.primary{background:#e7b277;color:#26170f;border-color:#edc98e;font-weight:700}.primary:hover{color:#26170f;background:#ffd09a}
main{display:grid;grid-template-columns:minmax(0,1fr) 342px;min-height:calc(100dvh - 66px)}.viewer{min-width:0;display:flex;flex-direction:column;background:#100b0e}.stage{min-height:430px;height:calc(100dvh - 100px);position:relative;display:grid;place-items:center;overflow:hidden;background:#030203}
.stage.theatre{background:radial-gradient(ellipse at 50% 42%,#42212a 0,#1b1016 54%,#080509 84%)}.stage.booth::after{content:"";position:absolute;inset:0;pointer-events:none;border:clamp(6px,1.8vw,23px) solid #0e090b;box-shadow:inset 0 0 30px #000,inset 0 0 0 2px #543b35;border-radius:12px;z-index:9}
.screen{width:100%;height:100%;background:#080608;position:relative;overflow:hidden;container-type:inline-size;isolation:isolate}.theatre .screen{width:var(--screen-width,78%);height:var(--screen-height,61%);transform:translateY(-6%);border:2px solid #776153;box-shadow:0 0 0 7px #181012,0 0 50px #9a4e4b55}
.media,.shade,.credits,.curtain{position:absolute;inset:0}.media img,.media video{width:100%;height:100%;display:block;object-fit:var(--media-fit,cover)}.media:empty{background:radial-gradient(ellipse at 50% 37%,#49232d,#180f18 45%,#080608 79%)}.shade{background:#000;opacity:var(--dim,.32)}
.credits{display:grid;grid-template:100% / 100%;place-items:center;overflow:hidden;text-align:center;color:var(--text,#f7e4c2);font-family:var(--font,Georgia);pointer-events:none}.credit-block{width:max-content;max-width:88%;padding:.3em .55em;line-height:1.22;font-size:clamp(9px,calc(var(--type-size)*1cqw),105px);white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 2px 8px #0009}.credit-block.roll{max-width:80%;max-height:none}.film-title{display:block;font-size:1.65em;line-height:1.05;margin:0 0 .42em}.card-lines{display:block}
.curtain{border:0!important;border-radius:0!important;z-index:6;transform:translateY(-110%);padding:0!important;transition:transform var(--curtain-time,1.35s) cubic-bezier(.56,.02,.31,1);background:linear-gradient(to bottom,#0008,transparent 22%,#0003 72%,#210008b0),repeating-linear-gradient(90deg,#34050f 0%,#660c21 1.8%,#a91f37 3.9%,#6e1027 5.8%,#3c0713 8%)!important;box-shadow:inset 0 -6px 0 #a3514b88,inset 0 -13px 0 #410c21}.curtain.closed{transform:translateY(0)}
.audience{position:absolute;inset:auto 0 0;pointer-events:none;z-index:7;display:grid;gap:clamp(2px,.5vw,8px);justify-items:center}.row{display:flex;gap:clamp(2px,.55vw,9px);justify-content:center;height:var(--row-height);width:var(--row-width)}.seat{flex:1;max-width:110px;border-radius:36% 36% 8% 8% / 43% 43% 10% 10%;background:linear-gradient(115deg,#3f202b,#2e131d 40%,#150910);box-shadow:inset 0 2px 1px #73445088,0 3px 5px #000c;border:1px solid #2c1620}
.status{padding:7px 12px;color:#d8bfa6;min-height:32px}
aside{border-left:1px solid var(--line);padding:11px;background:#1c1517;max-height:calc(100dvh - 66px);overflow:auto}details{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:8px}summary{padding:10px 11px;cursor:pointer;font-weight:650;color:#f3d7b6}.controls{display:grid;gap:9px;padding:0 11px 11px}.field{display:grid;gap:4px;min-width:0}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;align-items:center;gap:6px}input[type=range]{width:100%;accent-color:var(--brass)}input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:5px;background:#171013}textarea{width:100%;resize:vertical;min-height:94px}small{color:#c8ad99}.toolbar{display:flex;gap:7px;flex-wrap:wrap}[hidden]{display:none!important}
.viewer:fullscreen{background:#090609}.viewer:fullscreen .stage{height:100%;min-height:0}.viewer:fullscreen .status{display:none}
@media(max-width:820px){main{display:block}.stage{height:62dvh;min-height:310px}aside{max-height:none;border-left:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){.curtain{transition-duration:.01ms}}
:root{--ink:#eee;--brass:#efbd9f;--line:#4b3d41}
body{background:#000}
header{height:24px;min-height:24px;padding:3px 12px;background:#090809;border-color:#221b1e}
h1{font:600 12px Georgia,serif;letter-spacing:.13em}
main{position:relative;display:block;min-height:0;height:calc(100dvh - 24px)}
.viewer{position:relative;height:100%;background:#000}
.stage{flex:1;height:auto;min-height:0;background:var(--auditorium,#000)}
.stage.theatre{background:var(--auditorium,#000)}
.media:empty{background:var(--screen-colour,#000)}
.screen{background:var(--screen-colour,#000)}
.credits{color:var(--text,#fff)}
.seat{background:linear-gradient(115deg,var(--seat-colour,#a21c34),color-mix(in srgb,var(--seat-colour,#a21c34),black 65%));border-color:color-mix(in srgb,var(--seat-colour,#a21c34),black 32%)}
.curtain{background:linear-gradient(to bottom,#0008,transparent 24%,#0004 78%,#0008),repeating-linear-gradient(90deg,color-mix(in srgb,var(--curtain-colour,#a41630),black 60%) 0%,var(--curtain-colour,#a41630) 4%,color-mix(in srgb,var(--curtain-colour,#a41630),black 60%) 8%)!important}
.bottomBar{z-index:12;display:flex;align-items:center;gap:9px;min-height:28px;padding:3px 11px;background:#090809;border-top:1px solid #221b1e}
.bottomBar .transport{margin-left:auto;justify-content:flex-end}
.transport,.wordRow,.padTools{display:flex;gap:6px 13px;flex-wrap:wrap;align-items:center}
button.word,.transport button{border:0;background:none;border-radius:0;padding:2px 0;color:#eee;font-size:11px;box-shadow:none;font-weight:500}
button.word:hover,.transport button:hover,button.word[aria-expanded=true],.transport button[aria-pressed=true]{color:#ffac83}
.status{min-height:0;padding:0;font-size:10px;color:#bfaeb1;margin-left:3px}
.viewer:fullscreen .stage{height:auto;flex:1}.viewer:fullscreen .status{display:block}
aside{display:none;min-height:0;max-height:none}
body.work main{display:grid;grid-template-columns:minmax(0,1fr) 330px}
body.work aside{display:block}
.windowHead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.windowHead h2{font:600 15px Georgia,serif;margin:0}
.notepad,.settingsPopup{position:absolute;z-index:13;bottom:36px;left:12px;padding:13px;border:1px solid #614951;border-radius:8px;background:#211a1e;box-shadow:0 10px 40px #000b;max-height:calc(100% - 48px);overflow:auto}
.notepad{width:min(690px,calc(100% - 24px));display:grid;gap:9px}
.padFields{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
#padText{background:#faf5e8;color:#271d20;min-height:120px;height:clamp(120px,33dvh,330px);font:15px/24px 'Courier New',monospace;border-radius:3px;padding:8px 12px;background-image:repeating-linear-gradient(transparent 0 23px,#d1c6b322 23px 24px);background-origin:content-box}
.padTools select,.padTools input{font-size:11px;max-width:100%;min-width:0}
.padTools input{width:160px}.padStatus{font-size:11px;min-height:1em;color:#dbc7ba}
.wordRow{border-top:1px solid var(--line);padding-top:7px}
.settingsPopup{z-index:14;left:auto;right:12px;width:min(336px,calc(100% - 24px))}
.settingsPopup .windowHead{margin-bottom:10px}.settingsPopup details{margin:0}
.swatchGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatchField{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;position:relative}
button.swatch{width:26px;height:23px;padding:0}.swatchField input[type=color]{position:absolute;right:0;bottom:0;width:26px;height:23px;opacity:0;pointer-events:none;padding:0}
#audioPlayer{width:100%;height:36px}
@media(max-width:750px){
 body.work main{display:block;height:auto}
 body.work .viewer{height:65dvh}
 body.work aside{border-top:1px solid var(--line)}
 .bottomBar .status{display:none}

}
body{user-select:none;-webkit-user-select:none}
textarea,input:not([type=range],[type=checkbox],[type=color]){user-select:text;-webkit-user-select:text}
.bottomBar{flex-wrap:wrap}.bottomBar .transport{margin-left:0;justify-content:flex-start}
.transport #curtainToggle{margin-left:10px}
.transport .primary,.transport .primary:hover{background:none}
@keyframes rainbowGlow{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
button:not(:disabled):not(.curtain):is(:hover,:focus-visible),summary:hover{
 color:#fff;text-shadow:0 0 3px #fff,0 0 7px #ff58d4,0 0 12px #7b69ff,0 0 18px #38ddff,0 0 24px #55ffb2;
 filter:hue-rotate(0deg);animation:rainbowGlow var(--rainbow-speed,4s) linear infinite;
}

.notepad .windowHead{min-height:15px;justify-content:flex-end}

.padTools{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:3px}

.padStatus:empty{display:none}
.windowHead,.sideGrip{cursor:grab;touch-action:none}.windowHead:active,.sideGrip:active{cursor:grabbing}

aside.floating{position:absolute;z-index:15;width:min(330px,95vw);max-height:80dvh;border:1px solid var(--line);border-radius:7px;background:rgb(28 21 23 / var(--panel-opacity,1))}
.credit-block{opacity:1;-webkit-text-stroke:var(--outline-width,0px) var(--outline-colour,#000);paint-order:stroke fill}

 transform:rotate(-13deg);animation:usher-cross 4.8s linear forwards}
@keyframes usher-cross{0%{right:-28%;opacity:0}12%,83%{opacity:1}52%{transform:rotate(12deg)}100%{right:107%;opacity:0}}

:root{--panel-surface:#211a1e;--panel-edge:8px;--inner-opacity:1;--menu-font:system-ui}

<body>
<header>
<h1>LarCreditor</h1>

</header>
<main>
<section class="viewer" id="viewer" aria-label="Film preview">
<div class="stage" id="stage">
  <div class="screen" id="screen">
    <div class="media" id="media"></div><div class="shade"></div><div id="credits" class="credits"></div>
    <button class="curtain" type="button" id="curtain" aria-label="Lift curtains" hidden></button>
  </div>
  <div class="stageDeck" id="stageDeck" aria-hidden="true" hidden>
 <div class="steps"><i style="width:30%"></i><i style="width:49%"></i><i style="width:67%"></i><i style="width:84%"></i><i style="width:100%"></i></div>
 <div class="steps"><i style="width:30%"></i><i style="width:49%"></i><i style="width:67%"></i><i style="width:84%"></i><i style="width:100%"></i></div>
</div>
<div id="stageLights" class="stageLights" aria-hidden="true" hidden></div><div class="audience" id="audience" aria-hidden="true"></div>
</div>
<div class="bottomBar">
<button class="word" id="menu" aria-expanded="false">Menu</button>

<nav class="transport" aria-label="Preview controls">
<button id="playAll">Play</button><button id="repeat" aria-pressed="false">Repeat</button>
<span class="rightControls"><button id="surprise" aria-label="Send a theatre visitor">?</button><button id="curtainToggle" aria-pressed="false">Curtains</button><button id="usher">Send usher</button><button id="fullscreen">Fullscreen</button></span>
<button id="workMode" aria-pressed="false">Work mode</button></nav>
</div>
<section class="notepad" id="notepad" aria-label="Credits editor" hidden>
  <div class="windowHead"><button class="word" id="closeNotepad">Close</button></div>
  <div class="padFields">
    <label class="field">Film title<input id="padTitle"></label>
    <label class="field">Section<select id="padSection"><option value="opening">Opening credits</option><option value="closing">Closing credits</option><option value="extras">Closing additions</option></select></label>
  </div>
  <textarea id="padText" aria-label="Credit text" spellcheck="false"></textarea>
  <div class="padTools">
    <input id="draftName" aria-label="Draft or template name" placeholder="Name">
    <button class="word" id="saveDraft">Save</button><button class="word" id="saveTemplate">Template</button>
    <select id="savedDrafts" aria-label="Saved drafts"><option value="">Open a draft…</option></select>
    <select id="templates" aria-label="Credit templates"><option value="">Use a template…</option></select>
    <button class="word" id="loadPadText">Load</button><button class="word" id="newDraft">New</button>
  </div>
  <div id="padStatus" class="padStatus" role="status"></div>
  <nav id="padMenus" class="wordRow" aria-label="Notepad menus"></nav>
</section>
<section class="settingsPopup" id="settingsPopup" aria-labelledby="settingsTitle" hidden>
  <div class="windowHead"><h2 id="settingsTitle"></h2><button class="word" id="closeSettings">Close</button></div>
  <div id="settingsContent"></div>
</section>
<section class="settingsPopup audioOptions" id="audioOptions" aria-label="Audio options" hidden>
<div class="windowHead"><h2>Audio options</h2><button id="closeAudioOptions" class="word">Close</button></div>
<div class="controls">
<div class="toolbar"><label class="check"><input id="audioSync" type="checkbox" checked>Sync to credits</label><button id="removeAudio" class="word" disabled>Remove track</button></div>
<div class="pair"><label class="field">Fade in (s)<input id="audioFadeIn" type="number" min="0" max="60" step=".1" value="0"></label><label class="field">Fade out (s)<input id="audioFadeOut" type="number" min="0" max="60" step=".1" value="0"></label></div>

</div></section>

<aside id="studioAside" aria-label="Studio menus"><div class="sideGrip">Work mode</div>
<details open>
<summary>Credits</summary>
<div class="controls">
<label class="field">Film title<input id="filmTitle" value="" placeholder="Film title"></label>
<label class="field">Opening credits<textarea id="opening" rows="4">A film by
Your Name

Featuring
Your Cast</textarea></label>
<div class="toolbar"><button id="loadOpening">Load opening text</button><button id="loadClosing">Load closing text</button></div>
<small>Leave a blank line between cards. With rolling credits, blank lines add space.</small>

<summary>Playback</summary>

<label class="field">Play<select id="playScope"><option value="all">Opening and closing</option><option value="opening">Opening only</option><option value="closing">Closing only</option></select></label>

<summary>Typography</summary>
<div class="controls">
<label class="field">Font<select id="font"><option value="Georgia,serif">Georgia</option><option value="'Times New Roman',serif">Times New Roman</option><option value="Arial,sans-serif">Arial</option><option value="Verdana,sans-serif">Verdana</option><option value="'Courier New',monospace">Courier New</option><option value="Impact,sans-serif">Impact</option><option value="LarFont0">Bohemian Typewriter</option><option value="LarFont1">ELEGANT TYPEWRITER Regular</option><option value="LarFont2">TyperwriterPress-Regular</option><option value="LarFont3">OldeEnglish</option><option value="LarFont4">silent witness</option><option value="LarFont5">Resident Evil Large</option><option value="LarFont6">Resident Evil Movie Regular</option><option value="LarFont7">SILHILL</option><option value="LarFont8">SLNTHLC</option><option value="LarFont9">SLNTHLE</option><option value="LarFont10">SLNTHLN</option><option value="LarFont11">Chomsky</option><option value="LarFont12">Dune Rise</option><option value="LarFont13">Mom’s Typewriter</option></select></label>

<div id="typeColours"></div>
</div></details>

<summary>Backdrop</summary>
<div class="controls">
<div class="toolbar"><button id="loadMedia">Load image or video</button><button id="removeMedia" disabled>Remove</button></div>
<small id="mediaName">No file selected</small><input id="mediaFile" type="file" accept="image/*,video/*,.mkv" hidden>
<label class="field">Fit<select id="fit"><option value="cover">Fill screen</option><option value="contain">Fit whole image</option><option value="fill">Stretch</option></select></label>

<div class="pair"><label class="field">Screen width<input type="range" id="width" min="34" max="96" value="78"></label><label class="field">Screen height<input type="range" id="height" min="26" max="90" value="61"></label></div>
<label class="field">Seating rows<select id="rows"><option value="0">None</option><option value="1">One row</option><option value="2">Two rows</option><option value="3" selected>Three rows</option><option value="4">Four rows</option><option value="5">Five rows</option></select></label>

<button class="word" id="audioLoop" aria-pressed="false">All</button><span class="audioArrows"><button class="word" id="audioPrevious" aria-label="Previous track" disabled>◀</button><button class="word" id="audioNext" aria-label="Next track" disabled>▶</button></span></div>

</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const screen = byId('screen'), stage = byId('stage'), credits = byId('credits'), curtain = byId('curtain');
const status = message => { byId('padStatus').textContent = message; };
const styles = [['cards','One card at a time'],['up','Roll upward'],['down','Roll downward'],['left','Roll to the left'],['right','Roll to the right']];
for (const id of ['openingStyle','closingStyle']) {
  for (const [value,label] of styles) byId(id).add(new Option(label,value));
}
byId('closingStyle').value = 'up';
const number = (id,fallback) => {
  const input = byId(id);
  return input.value === '' ? fallback : Math.min(Number(input.max), Math.max(Number(input.min), Number(input.value)));
};

let curtainClosed = false, curtainRevision = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const delay = ms => new Promise(resolve => setTimeout(resolve,ms));
async function setCurtain(closed) {
  if (closed === curtainClosed) return;
  const revision = ++curtainRevision;
  curtainClosed = closed;
  byId('curtainToggle').setAttribute('aria-pressed',String(closed));
  if (closed) {
    curtain.hidden = false;
    curtain.getBoundingClientRect();
    curtain.classList.add('closed');
    return;
  }
  curtain.classList.remove('closed');
  await delay(reducedMotion.matches ? 0 : number('curtainTime',1.35)*1000);
  if (revision === curtainRevision) curtain.hidden = true;
}
byId('curtainToggle').onclick = () => setCurtain(!curtainClosed);
curtain.onclick = () => setCurtain(false);
byId('fullscreen').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await byId('viewer').requestFullscreen();
  } catch {
    status('Fullscreen is unavailable in this browser.');
  }
};
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.repeat || event.target.closest('input,textarea,select,button,[contenteditable]')) return;
  if (event.key.toLowerCase() === 'c') setCurtain(!curtainClosed);
  if (event.code === 'Space' && activeRun) {
    event.preventDefault();
    togglePause();
  }
});

let video = null, backdropURL = '';
function applyLook() {
  screen.style.setProperty('--font',byId('font').value);
  screen.style.setProperty('--text',byId('colour').value);
  screen.style.setProperty('--type-size',byId('size').value);
  screen.style.setProperty('--media-fit',byId('fit').value);
  screen.style.setProperty('--dim',byId('dim').value);
  screen.style.setProperty('--curtain-time',number('curtainTime',1.35)+'s');
  if (video) {
    video.loop = byId('loop').checked;
    video.muted = byId('mute').checked;
  }
}
installColours();
for (const id of ['font','colour','size','fit','dim','curtainTime','loop','mute']) byId(id).addEventListener('input',applyLook);
applyLook();

function applyTheatre() {
  const theatre = byId('theatre').checked;
  const booth = byId('viewpoint').value === 'booth';
  stage.classList.toggle('theatre',theatre);
  stage.classList.toggle('booth',theatre && booth);
  byId('stageDeck').hidden = !theatre || !byId('showDeck').checked;
  byId('stageLights').hidden = !theatre || !byId('showLights').checked;
  const rows = Number(byId('rows').value);
  stage.style.setProperty('--usher-height',Math.min(24,3+rows*3.5)+'%');
  stage.style.setProperty('--screen-width',byId('width').value+'%');
  stage.style.setProperty('--screen-height',byId('height').value+'%');
  const audience = byId('audience');
  audience.replaceChildren();
  if (!theatre) return;
  const count = Number(byId('rows').value);
  for (let i = 0; i < count; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--row-width',(66 + (i+1)/count*35)+'%');
    row.style.setProperty('--row-height', (booth ? 2+i*.48 : 3+i*.72)+'dvh');
    for (let n = 0; n < (booth ? 16 : 12); n++) {
      const seat = document.createElement('span');
      seat.className = 'seat';
      row.append(seat);
    }
    audience.append(row);
  }
}
for (const id of ['theatre','width','height','rows','viewpoint','showDeck','showLights']) byId(id).addEventListener('input',applyTheatre);
applyTheatre();

let creditTarget = 'opening';
for (const [button,target] of [['loadOpening','opening'],['loadClosing','closing']]) {
  byId(button).onclick = () => {
    creditTarget = target;
    byId('creditFile').click();
  };
}
function closingVisibility() { byId('closingField').hidden = byId('useOpening').checked; }
byId('useOpening').onchange = closingVisibility;
byId('creditFile').onchange = async event => {
  const file = event.target.files[0], target = creditTarget;
  event.target.value = '';
  if (!file) return;
  try {
    byId(target).value = await file.text();
    if (target === 'closing') {
      byId('useOpening').checked = false;
      closingVisibility();
    }
    refreshPad();
    showIdle();
    status('Loaded '+file.name);
  } catch {
    status('Could not read '+file.name);
  }
};

let customFontCount = 0;
byId('loadFont').onclick = () => byId('fontFile').click();
byId('fontFile').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const family = 'CreditStudioFont'+(++customFontCount);
    const font = await new FontFace(family,await file.arrayBuffer()).load();
    document.fonts.add(font);
    for (const id of ['font','menuFont','editorFont']) byId(id).add(new Option(file.name,family));
    byId('font').value = family;
    applyLook();
    status('Loaded '+file.name);
  } catch {
    status('Could not use '+file.name+' as a font.');
  }
};

function removeBackdrop() {
  if (video) video.pause();
  byId('media').replaceChildren();
  if (backdropURL) URL.revokeObjectURL(backdropURL);
  backdropURL = '';
  video = null;
  byId('removeMedia').disabled = true;
  byId('mediaName').textContent = 'No file selected';
}
byId('loadMedia').onclick = () => byId('mediaFile').click();
byId('removeMedia').onclick = removeBackdrop;
byId('mediaFile').onchange = event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  removeBackdrop();
  const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|m4v|ogv|mkv)$/i.test(file.name);
  const element = document.createElement(isVideo ? 'video' : 'img');
  if (isVideo) {
    video = element;
    video.playsInline = true;
    video.preload = 'auto';
  } else element.alt = '';
  backdropURL = URL.createObjectURL(file);
  element.onerror = () => {
    if (element.isConnected) status('This browser could not open '+file.name);
  };
  element.src = backdropURL;
  byId('media').append(element);
  byId('mediaName').textContent = file.name;
  byId('removeMedia').disabled = false;
  applyLook();
  if (video && (!activeRun || !activeRun.paused)) playVideo();
};
function playVideo() {
  video?.play().catch(() => {
    if (video && !video.error) status('Video playback is blocked. Press Play to try again.');
  });
}

function readSequence(kind) {
  const opening = kind === 'Opening';
  const content = opening || byId('useOpening').checked ? byId('opening').value : byId('closing').value;
  const title = opening || byId('closingTitle').checked ? byId('filmTitle').value.trim() : '';
  const text = [content,opening ? '' : byId('extras').value].map(part => part.trim()).filter(Boolean).join('\n\n');
  return {
    kind, title, text,
    cards:creditCards(title,text),
    style:byId(opening ? 'openingStyle' : 'closingStyle').value,
    effect:byId('effect').value,
    duration:number(opening ? 'openingDuration' : 'closingDuration',opening ? 12 : 18)*1000
  };
}

function creditCards(title,text) {
  const cards = title ? [{title,text:'',gap:.14}] : [];
  if (!text) return cards;
  const pieces = text.split(/(\n(?:[\t \r]*\n)+)/);
  for (let i=0;i<pieces.length;i+=2) {
    const blankLines = (pieces[i+1]?.match(/\n/g)?.length || 1)-1;
    cards.push({title:'',text:pieces[i],gap:blankLines*.18});
  }
  return cards;
}

function makeBlock(title,text,isRoll) {
  const block = document.createElement('div');
  block.className = 'credit-block'+(isRoll ? ' roll' : '');
  if (title) {
    const heading = document.createElement('strong');
    heading.className = 'film-title';
    heading.textContent = title;
    block.append(heading);
  }
  if (text) {
    const lines = document.createElement('span');
    lines.className = 'card-lines';
    lines.textContent = text;
    block.append(lines);
  }
  credits.replaceChildren(block);
  return block;
}

let activeRun = null;
function showIdle() {
  if (!activeRun) makeBlock(byId('filmTitle').value.trim(),'');
}
byId('filmTitle').addEventListener('input',showIdle);
showIdle();

function renderSequence(run,sequence,elapsed) {
  const progress = Math.min(1,elapsed/sequence.duration);
  if (sequence.style === 'cards') {
    let position = progress*sequence.cards.reduce((sum,card) => sum+1+card.gap,0);
    let index = 0;
    while (index+1 < sequence.cards.length && position >= 1+sequence.cards[index].gap) {
      position -= 1+sequence.cards[index].gap;
      index++;
    }
    if (run.card !== index || !run.block) {
      run.card = index;
      const card = sequence.cards[index];
      run.block = makeBlock(card.title,card.text);
    }
    run.block.hidden = position >= 1;
    const phase = Math.min(1,position);
    const opacity = Math.min(1,phase*5,(1-phase)*5);
    run.block.style.opacity = sequence.effect === 'cut' ? '1' : String(opacity);
    if (sequence.effect === 'rise') run.block.style.transform = 'translateY('+((1-phase)*15)+'px)';
    if (sequence.effect === 'zoom') run.block.style.transform = 'scale('+(1+phase*.08)+')';
    return;
  }
  if (!run.block) run.block = makeBlock(sequence.title,sequence.text,true);
  const horizontal = sequence.style === 'left' || sequence.style === 'right';
  const reverse = sequence.style === 'down' || sequence.style === 'right';
  const containerSize = horizontal ? credits.clientWidth : credits.clientHeight;
  const blockSize = horizontal ? run.block.offsetWidth : run.block.offsetHeight;
  const distance = (containerSize+blockSize)/2;
  const offset = (reverse ? -1 : 1)*distance*(1-2*progress);
  run.block.style.transform = horizontal ? 'translateX('+offset+'px)' : 'translateY('+offset+'px)';
}

function syncTransport() {
  byId('playAll').textContent = activeRun && !activeRun.paused ? 'Pause' : 'Play';
}

function stopPlayback(finished = false) {
  if (activeRun) cancelAnimationFrame(activeRun.frame);
  activeRun = null;
  stage.style.setProperty('--house-level','1');
  video?.pause();
  if (byId('audioSync').checked) byId('audioPlayer').pause();
  syncTransport();
  if (finished) {
    credits.replaceChildren();
    if (byId('closeAfter').checked) setCurtain(true);
  } else {
    showIdle();
  }
}

function advance(run,now) {
  if (activeRun !== run || run.paused) return;
  run.elapsed += Math.max(0,now-run.last);
  run.last = now;
  let elapsed = run.elapsed;
  let section = null;
  for (const candidate of run.sections) {
    if (elapsed < candidate.duration) {
      section = candidate;
      break;
    }
    elapsed -= candidate.duration;
  }
  if (!section) {
    if (byId('repeat').getAttribute('aria-pressed') === 'true') startPlayback(run.kinds);
    else stopPlayback(true);
    return;
  }
  run.sectionElapsed = elapsed;
  if (run.section !== section) {
    run.section = section;
    run.block = null;
    run.card = -1;
    credits.replaceChildren();
    if (byId('audioSync').checked) {
      if (section.kind) startSectionSound(section.kind);
      else audioPlayer.pause();
    }
  }
  if (section.houseLead) stage.style.setProperty('--house-level',String(1-.75*elapsed/section.duration));
  else if (byId('dimHouse').checked) stage.style.setProperty('--house-level','.25');
  if (section.kind) {
    renderSequence(run,section,elapsed);
    if (byId('audioSync').checked && audioIndex >= 0) updateAudioVolume();
  }
  run.frame = requestAnimationFrame(time => advance(run,time));
}

function startPlayback(kinds) {
  const sections = kinds.map(readSequence).filter(sequence => sequence.title || sequence.text);
  if (!sections.length) {
    status('Add a film title or some credits first.');
    return;
  }
  const gap = number('gap',0)*1000;
  if (sections.length === 2 && gap) sections.splice(1,0,{duration:gap});
  const house = byId('dimHouse').checked;
  const lead = house ? number('houseFade',2)*1000 : 0;
  if (lead) sections.unshift({duration:lead,houseLead:true});
  stage.style.setProperty('--house-level',house && !lead ? '.25' : '1');
  if (activeRun) cancelAnimationFrame(activeRun.frame);
  const run = {sections,kinds,elapsed:0,last:performance.now(),paused:false,frame:0};
  activeRun = run;
  setCurtain(false);
  closePad();
  syncTransport();
  if (video) {
    video.currentTime = 0;
    playVideo();
  }
  if (byId('audioSync').checked) audioPlayer.pause();
  advance(run,run.last);
}

function togglePause() {
  const run = activeRun;
  if (!run) return;
  run.paused = !run.paused;
  syncTransport();
  if (run.paused) {
    cancelAnimationFrame(run.frame);
    video?.pause();
    if (byId('audioSync').checked) byId('audioPlayer').pause();
  } else {
    run.last = performance.now();
    playVideo();
    if (byId('audioSync').checked && run.section?.kind) playSoundtrack();
    run.frame = requestAnimationFrame(time => advance(run,time));
  }
}

byId('playAll').onclick = () => {
  if (activeRun) { togglePause(); return; }
  const scope = byId('playScope').value;
  startPlayback(scope === 'opening' ? ['Opening'] : scope === 'closing' ? ['Closing'] : ['Opening','Closing']);
};
byId('repeat').onclick = () => {
  const button = byId('repeat');
  button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed') !== 'true'));
};


function installColours() {
  const colours = [
    ['typeColours','colour','Text','#ffffff','--text'],
    ['appearanceColours','outlineColour','Outline colour','#000000','--outline-colour'],
    ['appearanceColours','surfaceColour','Menu colour','#211a1e','--panel-surface'],
    ['theatreColours','auditoriumColour','Auditorium','#000000','--auditorium'],
    ['theatreColours','screenColour','Screen','#000000','--screen-colour'],
    ['theatreColours','seatColour','Seats','#a21c34','--seat-colour'],
    ['theatreColours','curtainColour','Curtains','#a41630','--curtain-colour']
  ];
  for (const [container,id,label,value,property] of colours) {
    const field = document.createElement('div');
    field.className = 'swatchField';
    const title = document.createElement('span');
    title.textContent = label;
    const square = document.createElement('button');
    square.type = 'button';
    square.className = 'swatch';
    square.title = 'Click to change '+label.toLowerCase()+' colour';
    square.setAttribute('aria-label','Choose '+label.toLowerCase()+' colour');
    const picker = document.createElement('input');
    picker.type = 'color';
    picker.id = id;
    picker.value = value;
    picker.tabIndex = -1;
    picker.setAttribute('aria-label',label+' colour');
    const update = () => {
      square.style.background = picker.value;
      (id === 'surfaceColour' ? document.body : container === 'theatreColours' ? stage : screen).style.setProperty(property,picker.value);
    };
    const choose = () => typeof picker.showPicker === 'function' ? picker.showPicker() : picker.click();
    square.onclick = choose;
    picker.oninput = update;
    field.append(title,square,picker);
    byId(container).append(field);
    update();
  }
}

const notepad = byId('notepad'), popup = byId('settingsPopup');
const sidebarPanels = [...byId('studioAside').querySelectorAll('details')];
let openSettings = null;
function closeSettings() {
  closeAudioOptions();
  if (!openSettings) return;
  const {panel,marker,link,wasOpen} = openSettings;
  marker.replaceWith(panel);
  panel.open = wasOpen;
  link.setAttribute('aria-expanded','false');
  popup.hidden = true;
  openSettings = null;
}
for (const panel of sidebarPanels) {
  const name = panel.querySelector('summary').textContent;
  const link = document.createElement('button');
  link.type = 'button';
  link.className = 'word';
  link.textContent = name;
  link.setAttribute('aria-expanded','false');
  link.onclick = () => {
    const alreadyOpen = openSettings?.panel === panel;
    closeSettings();
    if (alreadyOpen) return;
    const marker = document.createComment('settings panel');
    panel.before(marker);
    openSettings = {panel,marker,link,wasOpen:panel.open};
    panel.open = true;
    byId('settingsTitle').textContent = name;
    byId('settingsContent').append(panel);
    popup.hidden = false;
    link.setAttribute('aria-expanded','true');
  };
  byId('padMenus').append(link);
}
byId('closeSettings').onclick = closeSettings;
function closePad() {
  closeSettings();
  notepad.hidden = true;
  byId('menu').setAttribute('aria-expanded','false');
}
byId('closeNotepad').onclick = () => { closePad(); byId('menu').focus(); };
byId('menu').onclick = () => {
  if (!notepad.hidden) { closePad(); return; }
  refreshPad();
  notepad.hidden = false;
  byId('menu').setAttribute('aria-expanded','true');
  byId('padText').focus();
};
byId('workMode').onclick = () => {
  closePad();
  const work = document.body.classList.toggle('work');
  byId('workMode').setAttribute('aria-pressed',String(work));
  byId('workMode').textContent = work ? 'Theatre mode' : 'Work mode';
};

const sectionField = byId('padSection'), padText = byId('padText');
function refreshPad() {
  byId('padTitle').value = byId('filmTitle').value;
  const target = sectionField.value;
  padText.value = target === 'closing' && byId('useOpening').checked ? byId('opening').value : byId(target).value;
}
sectionField.onchange = refreshPad;
byId('padTitle').oninput = () => {
  byId('filmTitle').value = byId('padTitle').value;
  showIdle();
};
padText.oninput = () => {
  const target = sectionField.value;
  byId(target).value = padText.value;
  if (target === 'closing' && byId('useOpening').checked) {
    byId('useOpening').checked = false;
    closingVisibility();
  }
};
for (const id of ['opening','closing','extras','filmTitle','useOpening']) byId(id).addEventListener('input',refreshPad);
byId('loadPadText').onclick = () => {
  creditTarget = sectionField.value;
  byId('creditFile').click();
};

const draftKey = 'larcreditor-credits-v1';
let bank = {drafts:[],templates:[]};
try {
  const saved = JSON.parse(localStorage.getItem(draftKey));
  if (Array.isArray(saved?.drafts) && Array.isArray(saved?.templates)) bank = saved;
} catch {}
const builtIn = [
  {name:'Cast and crew',filmTitle:'[Film title]',opening:'A film by\n[Director]\n\nStarring\n[Actor] as [Character]\n[Actor] as [Character]',closing:'Cast\n[Character] — [Actor]\n\nCrew\nDirected by [Name]\nWritten by [Name]\nProduced by [Name]\nEdited by [Name]',extras:'Special thanks\n[Names]',useOpening:false},
  {name:'Short film',filmTitle:'[Film title]',opening:'[Production company] presents\n\nA film by [Name]',closing:'',extras:'Music by [Name]\n\nThank you for watching',useOpening:true}
];
const padStatus = message => { byId('padStatus').textContent = message; };
function refreshBank() {
  const drafts = byId('savedDrafts'), templates = byId('templates');
  drafts.replaceChildren(new Option('Open a draft…',''));
  templates.replaceChildren(new Option('Use a template…',''));
  bank.drafts.forEach((entry,i) => drafts.add(new Option(entry.name,String(i))));
  [...builtIn,...bank.templates].forEach((entry,i) => templates.add(new Option(entry.name,String(i))));
}
function saveEntry(kind) {
  const name = byId('draftName').value.trim();
  if (!name) {
    padStatus('Enter a name before saving.');
    byId('draftName').focus();
    return;
  }
  const entry = {name,useOpening:byId('useOpening').checked,sound:readSoundSettings()};
  for (const id of ['filmTitle','opening','closing','extras']) entry[id] = byId(id).value;
  const previous = bank[kind].findIndex(item => item.name === name);
  const entries = [...bank[kind]];
  if (previous < 0) entries.push(entry);
  else entries[previous] = entry;
  try {
    localStorage.setItem(draftKey,JSON.stringify({...bank,[kind]:entries}));
    bank[kind] = entries;
    refreshBank();
    padStatus('Saved '+name+'.');
  } catch {
    padStatus('This browser could not save the entry on this device.');
  }
}
function openEntry(entry,message) {
  if (!entry) return;
  for (const id of ['filmTitle','opening','closing','extras']) byId(id).value = entry[id] || '';
  byId('useOpening').checked = Boolean(entry.useOpening);
  applySoundSettings(entry.sound);
  byId('draftName').value = entry.name || '';
  sectionField.value = 'opening';
  closingVisibility();
  refreshPad();
  showIdle();
  padStatus(message);
}
byId('saveDraft').onclick = () => saveEntry('drafts');
byId('saveTemplate').onclick = () => saveEntry('templates');
byId('savedDrafts').onchange = event => {
  const entry = bank.drafts[event.target.value];
  if (entry) openEntry(entry,'Opened '+entry.name+'.');
  event.target.value = '';
};
byId('templates').onchange = event => {
  const entry = [...builtIn,...bank.templates][event.target.value];
  if (entry) openEntry({...entry,name:''},'Using '+entry.name+'.');
  event.target.value = '';
};
byId('newDraft').onclick = () => openEntry({useOpening:true},'New draft.');
refreshBank();
refreshPad();

const audioPlayer = byId('audioPlayer'), audioList = byId('audioTracks');
let audioFiles = [], audioIndex = -1, cueNames = {openingTrack:'',closingTrack:''};
const cueIds = ['openingTrack','closingTrack'];

function closeAudioOptions() {
  byId('audioOptions').hidden = true;
  byId('audioOptionsToggle').setAttribute('aria-expanded','false');
}
byId('audioOptionsToggle').onclick = () => {
  const options = byId('audioOptions');
  if (!options.hidden) { closeAudioOptions(); return; }
  options.hidden = false;
  byId('audioOptionsToggle').setAttribute('aria-expanded','true');
};
byId('closeAudioOptions').onclick = closeAudioOptions;

function readSoundSettings() {
  return {...cueNames,sync:byId('audioSync').checked,in:byId('audioFadeIn').value,out:byId('audioFadeOut').value,
    volume:byId('audioVolume').value,one:audioPlayer.loop};
}
function applySoundSettings(settings) {
  if (!settings) return;
  cueNames = {openingTrack:settings.openingTrack || '',closingTrack:settings.closingTrack || ''};
  byId('audioSync').checked = settings.sync !== false;
  byId('audioFadeIn').value = settings.in ?? 0;
  byId('audioFadeOut').value = settings.out ?? 0;
  byId('audioVolume').value = settings.volume ?? 1;
  setAudioRepeat(Boolean(settings.one));
  refreshCueMenus();
  updateAudioVolume();
}

function refreshCueMenus() {
  for (const id of cueIds) {
    const select = byId(id);
    select.replaceChildren(new Option('Current track',''));
    for (const name of new Set(audioFiles.map(file => file.name))) select.add(new Option(name,name));
    if (cueNames[id] && !audioFiles.some(file => file.name === cueNames[id])) {
      select.add(new Option(cueNames[id]+' (load file)',cueNames[id]));
    }
    select.value = cueNames[id];
  }
}
for (const id of cueIds) byId(id).onchange = () => { cueNames[id] = byId(id).value; };
refreshCueMenus();

function playSoundtrack() {
  if (audioIndex < 0) return;
  updateAudioVolume();
  audioPlayer.play().catch(() => {
    if (!audioPlayer.error) status('Press Play in Audio to start the soundtrack.');
  });
}
function selectSoundtrack(index,play) {
  if (!audioFiles[index]) return;
  audioIndex = index;
  audioList.value = String(index);
  audioPlayer.src = audioFiles[index].url;
  syncAudioDisplay();
  if (play) playSoundtrack();
}
function startSectionSound(kind) {
  if (!audioFiles.length) return;
  const name = cueNames[kind === 'Opening' ? 'openingTrack' : 'closingTrack'];
  const index = name ? audioFiles.findIndex(file => file.name === name) : audioIndex;
  if (index >= 0 && index !== audioIndex) selectSoundtrack(index,false);
  if (audioPlayer.readyState) audioPlayer.currentTime = 0;
  playSoundtrack();
}
function stepSoundtrack(direction,play = !audioPlayer.paused) {
  if (!audioFiles.length) return;
  selectSoundtrack((audioIndex+direction+audioFiles.length)%audioFiles.length,play);
}
function refreshAudioList() {
  audioList.replaceChildren();
  if (!audioFiles.length) audioList.add(new Option('No tracks',''));
  audioFiles.forEach((item,i) => audioList.add(new Option(item.name,String(i))));
  for (const id of ['audioTracks','audioPlay','removeAudio']) byId(id).disabled = !audioFiles.length;
  byId('audioPrevious').disabled = byId('audioNext').disabled = audioFiles.length < 2;
  refreshCueMenus();
}
function clearAudioSource() {
  audioPlayer.pause();
  audioPlayer.removeAttribute('src');
  audioPlayer.load();
  audioIndex = -1;
  syncAudioDisplay();
}
byId('loadAudio').onclick = () => byId('audioFile').click();
byId('removeAudio').onclick = () => {
  if (audioIndex < 0) return;
  const index = audioIndex, wasPlaying = !audioPlayer.paused;
  const [removed] = audioFiles.splice(index,1);
  clearAudioSource();
  URL.revokeObjectURL(removed.url);
  refreshAudioList();
  if (audioFiles.length) selectSoundtrack(Math.min(index,audioFiles.length-1),wasPlaying);
};
byId('audioFile').onchange = event => {
  const files = [...event.target.files];
  event.target.value = '';
  if (!files.length) return;
  const firstAdded = audioFiles.length;
  audioFiles.push(...files.map(file => ({name:file.name,url:URL.createObjectURL(file)})));
  refreshAudioList();
  if (audioIndex < 0) selectSoundtrack(firstAdded,Boolean(activeRun?.section?.kind && !activeRun.paused && byId('audioSync').checked));
  else audioList.value = String(audioIndex);
};
audioList.onchange = () => selectSoundtrack(Number(audioList.value),!audioPlayer.paused);
byId('audioPlay').onclick = () => { if (audioPlayer.paused) playSoundtrack(); else audioPlayer.pause(); };
byId('audioPrevious').onclick = () => stepSoundtrack(-1);
byId('audioNext').onclick = () => stepSoundtrack(1);
function setAudioRepeat(one) {
  audioPlayer.loop = one;
  byId('audioLoop').textContent = one ? 'One' : 'All';
  byId('audioLoop').setAttribute('aria-pressed',String(one));
}
byId('audioLoop').onclick = () => setAudioRepeat(!audioPlayer.loop);
audioPlayer.onended = () => { if (!audioPlayer.loop) stepSoundtrack(1,true); };
audioPlayer.onerror = () => { if (audioIndex >= 0) status('This browser could not open '+audioFiles[audioIndex].name); };
function clock(seconds) {
  const value = Math.max(0,Math.floor(seconds || 0));
  return Math.floor(value/60)+':'+String(value%60).padStart(2,'0');
}
function syncAudioDisplay() {
  const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : 0;
  const progress = byId('audioProgress');
  progress.disabled = !(audioIndex >= 0 && duration > 0);
  progress.max = duration || 1;
  progress.value = audioPlayer.currentTime || 0;
  byId('audioNow').textContent = clock(audioPlayer.currentTime);
  byId('audioLength').textContent = clock(duration);
  byId('audioPlay').textContent = audioPlayer.paused ? 'Play' : 'Pause';
}
function updateAudioVolume() {
  const fadeIn = number('audioFadeIn',0), fadeOut = number('audioFadeOut',0);
  const elapsed = audioPlayer.currentTime || 0;
  const clipLeft = Number.isFinite(audioPlayer.duration) && !audioPlayer.loop ? audioPlayer.duration-elapsed : Infinity;
  const sectionLeft = byId('audioSync').checked && activeRun?.section?.kind
    ? activeRun.section.duration/1000-activeRun.sectionElapsed/1000 : Infinity;
  const level = Math.max(0,Math.min(1,fadeIn ? elapsed/fadeIn : 1,fadeOut ? Math.min(clipLeft,sectionLeft)/fadeOut : 1));
  audioPlayer.volume = Number(byId('audioVolume').value)*level;
}
for (const event of ['timeupdate','durationchange','play','pause','emptied']) {
  audioPlayer.addEventListener(event,() => { syncAudioDisplay(); updateAudioVolume(); });
}
byId('audioProgress').oninput = event => { audioPlayer.currentTime = Number(event.target.value); };
for (const id of ['audioVolume','audioFadeIn','audioFadeOut']) byId(id).oninput = updateAudioVolume;
function makeGrabbable(panel,handle,container) {
  let drag;
  handle.addEventListener('pointerdown',event => {
    if (event.button !== 0 || event.target.closest('button,input,select,textarea')) return;
    const box = panel.getBoundingClientRect();
    const bounds = container.getBoundingClientRect();
    drag = {id:event.pointerId,x:event.clientX-box.left,y:event.clientY-box.top,width:box.width,height:box.height,bounds};
    handle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  handle.addEventListener('pointermove',event => {
    if (drag?.id !== event.pointerId) return;
    const {x,y,width,height,bounds} = drag;
    if (panel.tagName === 'ASIDE') panel.classList.add('floating');
    panel.style.left = Math.max(0,Math.min(bounds.width-width,event.clientX-x-bounds.left))+'px';
    panel.style.top = Math.max(0,Math.min(bounds.height-height,event.clientY-y-bounds.top))+'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']) {
    handle.addEventListener(type,event => { if (drag?.id === event.pointerId) drag = null; });
  }
}
makeGrabbable(notepad,notepad.querySelector('.windowHead'),byId('viewer'));
makeGrabbable(popup,popup.querySelector('.windowHead'),byId('viewer'));
makeGrabbable(byId('audioOptions'),byId('audioOptions').querySelector('.windowHead'),byId('viewer'));
const workSidebar = byId('studioAside');
makeGrabbable(workSidebar,workSidebar.querySelector('.sideGrip'),document.querySelector('main'));

function applyAppearance() {
  const style = document.body.style;
  style.setProperty('--panel-opacity',byId('panelOpacity').value);
  style.setProperty('--inner-opacity',byId('innerOpacity').value);
  style.setProperty('--panel-edge',byId('panelEdge').value+'px');
  style.setProperty('--menu-font',byId('menuFont').value);
  style.setProperty('--editor-font',byId('editorFont').value);
  style.setProperty('--credit-opacity',byId('creditOpacity').value);
  style.setProperty('--outline-width',byId('outlineWidth').value+'px');
  style.setProperty('--rainbow-speed',byId('rainbowSpeed').value+'s');
  document.body.classList.toggle('rainbow-credits',byId('rainbowCredits').checked);
  document.body.classList.toggle('rainbow-controls',byId('rainbowControls').checked);
}
for (const id of ['panelOpacity','creditOpacity','outlineWidth','rainbowSpeed','rainbowCredits','rainbowControls','innerOpacity','panelEdge','menuFont','editorFont']) {
  byId(id).addEventListener('input',applyAppearance);
}
applyAppearance();

let beam = null, usherPass = 0;
const usherRoutes = [
  [[0,0],[.25,.31],[.37,.31],[.75,.73],[1,1]],
  [[0,0],[.26,.4],[.47,.4],[.83,.89],[1,1]],
  [[0,0],[.32,.44],[.55,.44],[1,0]],
  [[0,0],[.24,.12],[.48,.12],[1,0]]
];
byId('usher').onclick = () => {
  beam?.remove();
  const pass = usherPass++;
  const fromRight = pass%2 === 0;
  const route = usherRoutes[pass%usherRoutes.length];
  const light = document.createElement('div');
  light.className = 'usherBeam';
  light.setAttribute('aria-hidden','true');
  stage.append(light);
  beam = light;
  const animation = light.animate(route.map(([offset,fraction],i) => {
    const x = fromRight ? 102-fraction*124 : -22+fraction*124;
    const reach = Math.sin(Math.PI*fraction);
    return {offset,left:x+'%',opacity:i === 0 || i === route.length-1 ? 0 : 1,
      transform:'translateY('+(reach*20)+'px) scale('+(1+reach*.5)+') rotate('+(fromRight?-9:9)+'deg)'};
  }),{duration:reducedMotion.matches ? 650 : 5900,fill:'forwards'});
  animation.finished.then(() => {
    light.remove();
    if (beam === light) beam = null;
  });
};

let visitor = 0;
const creatures = ['🦇','🕊','🦋','🦉'];
byId('surprise').onclick = () => {
  const kind = visitor++%creatures.length;
  const flyer = document.createElement('span');
  flyer.className = 'flyer';
  flyer.setAttribute('aria-hidden','true');
  if (kind === 1) {
    flyer.innerHTML = '<svg width="56" height="30" viewBox="0 0 56 30"><path fill="#fff4ed" d="M2 12q12-7 26 4 13-11 25-9L36 22l-3 4-7-5L2 12Z"/><path fill="#aeb9c1" d="M2 12l9-4 5 4-4 3zm43-2 8-3-6 7-4-1z"/><path fill="#efad4f" d="m34 19 8 2-8 2z"/></svg>';
  } else flyer.textContent = creatures[kind];
  stage.append(flyer);
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const path = [[-65,.38],[w*.24,.25],[w*.5,.43],[w*.73,.23],[w+65,.39]];
  flyer.animate(path.map(([x,y],i) => ({
    transform:'translate('+x+'px,'+(h*y)+'px) rotate('+([8,-14,12,-11,6][i])+'deg)'
  })),{duration:reducedMotion.matches ? 650 : 4900,easing:'linear'}).finished.then(() => flyer.remove());
};

document.addEventListener('wheel',event => {
  const select = event.target.closest('select');
  if (!select || select.disabled || select.options.length < 2 || !event.deltaY) return;
  const direction = Math.sign(event.deltaY);
  const options = [...select.options];
  let index = select.selectedIndex;
  for (let step = 0; step < options.length; step++) {
    index = (index+direction+options.length)%options.length;
    if (!options[index].disabled && !options[index].parentElement.disabled) break;
  }
  if (options[index].disabled || options[index].parentElement.disabled) return;
  event.preventDefault();
  select.selectedIndex = index;
  select.dispatchEvent(new Event('input',{bubbles:true}));
  select.dispatchEvent(new Event('change',{bubbles:true}));
},{passive:false});
</script>
