<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Niagara Falls — Larry's Art</title>

<style>

/* ============================================================
   BASIC PAGE
   ============================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Georgia, serif;
}


/* ============================================================
   NIAGARA VIDEO
   ============================================================ */

#waterfall {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    pointer-events: none;

    /*
       FORCE SILENCE.
    */
    volume: 0;
}


/* ============================================================
   PAINTINGS
   ============================================================ */

.paintingWrap {
    position: fixed;

    z-index: 20;

    cursor: pointer;

    perspective: 900px;

    transform-style: preserve-3d;

    will-change:
        left,
        top,
        transform,
        opacity;

    opacity: 0;
}

.paintingFrame {
    position: relative;

    padding: 9px;

    background:
        linear-gradient(
            135deg,
            #fff8df 0%,
            #d8c58e 18%,
            #fff3c7 35%,
            #b99a4d 55%,
            #f8e9b5 75%,
            #9d7935 100%
        );

    border: 4px solid #8c6b2f;

    box-shadow:
        0 8px 18px rgba(0,0,0,.8),
        inset 0 0 5px rgba(255,255,255,.9),
        inset 0 0 0 3px rgba(91,60,15,.7);

    transform-style: preserve-3d;
}

.paintingFrame::before {
    content: "";

    position: absolute;

    inset: -5px;

    border: 2px solid rgba(255,245,190,.85);

    pointer-events: none;
}

.paintingFrame::after {
    content: "";

    position: absolute;

    inset: 3px;

    border: 2px solid rgba(102,70,20,.7);

    pointer-events: none;
}

.paintingCanvas {
    display: block;

    width: 18vw;

    max-width: 320px;

    height: auto;

    background: white;

    border: 7px solid #f8f8f4;

    box-shadow:
        inset 0 0 5px rgba(0,0,0,.3);

    transform: translateZ(4px);

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;
}


/* physical canvas thickness */

.paintingWrap::before {
    content: "";

    position: absolute;

    left: 5px;
    bottom: -13px;

    width: calc(100% - 10px);
    height: 13px;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #d7d7d2,
            #999
        );

    transform: skewX(-35deg);

    transform-origin: top left;

    z-index: -2;
}

.paintingWrap::after {
    content: "";

    position: absolute;

    right: -13px;
    top: 7px;

    width: 13px;
    height: calc(100% - 14px);

    background:
        linear-gradient(
            to right,
            #f8f8f4,
            #d1d1cc,
            #969691
        );

    transform: skewY(-35deg);

    transform-origin: top left;

    z-index: -2;
}



/* ============================================================
   IMMORTALIZED / SELECTED PAINTINGS
   ============================================================ */

.immortalized {
    z-index: 80;
    cursor: grab;
    opacity: 1 !important;
    user-select: none;
    touch-action: none;
}

.immortalized:active {
    cursor: grabbing;
}

/* Large, museum-style sky paintings. */
.immortalized .paintingCanvas {
    width: 4vw;
    min-width: 45px;
    max-width: 80px;
    border: 3px solid #f8f8f4;
}

.immortalized .paintingFrame {
    padding: 4px;
    border: 4px solid #6f4a18;
    border-radius: 5px;
    background:
        linear-gradient(135deg,
            #6b4312 0%,
            #c99732 12%,
            #f1d47b 22%,
            #8a5b17 34%,
            #d9ad4d 48%,
            #704710 62%,
            #e1b95a 76%,
            #7a4d13 90%,
            #4e300d 100%);
    box-shadow: none !important;
}

/* Ornate Louvre-style moulding. */
.immortalized .paintingFrame::before {
    inset: -4px;
    border: 2px double #e8c567;
    border-radius: 7px;
    box-shadow:
        0 0 0 3px #5a370e,
        0 0 0 6px #c28b27;
}

.immortalized .paintingFrame::after {
    inset: -1px;
    border: 1px solid rgba(255,230,145,.85);
    box-shadow: inset 0 0 0 2px rgba(65,38,8,.75);
}

.immortalized::before,
.immortalized::after {
    opacity: .85;
}

.immortalized .halo {
    width: 38px;
    height: 13px;
    top: -18px;
    border-width: 2px;
    box-shadow: 0 0 22px gold, 0 0 42px rgba(255,210,40,.65);
}


/* ============================================================
   ANGEL / DESKTOP ICON STRIP
   ============================================================ */

#angels {
    position: fixed;

    z-index: 70;

    left: 0;
    top: 0;

    width: 100%;
    height: 20%;

    pointer-events: none;
}

.angel {
    position: absolute;

    width: 3.2vw;

    min-width: 24px;

    max-width: 48px;

    cursor: grab;

    pointer-events: auto;

    user-select: none;

    touch-action: none;
}

.angel:active {
    cursor: grabbing;
}

.angelFrame {
    position: relative;

    padding: 2px;

    background:
        linear-gradient(
            135deg,
            #fff8df,
            #c4a35b,
            #fff1b8,
            #9a702c,
            #ead28c
        );

    border: 2px solid #8c6b2f;

    box-shadow:
        0 3px 8px rgba(0,0,0,.85);
}

.angelFrame img {
    display: block;

    width: 100%;

    background: white;

    border: 2px solid white;

    filter: none !important;

    opacity: 1 !important;

    pointer-events: none;
}

.halo {
    position: absolute;

    width: 16px;
    height: 6px;

    left: 50%;
    top: -11px;

    transform: translateX(-50%);

    border: 2px solid gold;

    border-radius: 50%;

    box-shadow:
        0 0 7px gold;

    z-index: 5;
}


/* ============================================================
   ROPE
   ============================================================ */

.rescueRope {
    position: fixed;

    z-index: 500;

    width: 8px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;

    transform-origin: bottom center;
}

.ropeKnot {
    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    bottom: -8px;

    transform: translateX(-50%);

    border: 4px solid #a78a5b;

    border-radius: 50%;
}

.ropeBreaking {
    animation:
        ropeSnap .5s ease-out forwards;
}

@keyframes ropeSnap {

    0% {
        transform: rotate(0deg);
        opacity: 1;
    }

    35% {
        transform:
            rotate(9deg)
            scaleY(1.05);

        opacity: 1;
    }

    60% {
        transform:
            rotate(-20deg)
            scaleY(.7);

        opacity: 1;
    }

    100% {
        transform:
            rotate(28deg)
            translateY(40px)
            scaleY(.2);

        opacity: 0;
    }
}

.ropePiece {
    position: fixed;

    z-index: 499;

    width: 7px;
    height: 70px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;
}

.ropePiece.left {
    transform-origin: top center;

    animation:
        ropeLeftFall 1s ease-out forwards;
}

.ropePiece.right {
    transform-origin: top center;

    animation:
        ropeRightFall 1s ease-out forwards;
}

@keyframes ropeLeftFall {

    to {
        transform:
            translate(-45px,80px)
            rotate(-35deg);

        opacity: 0;
    }
}

@keyframes ropeRightFall {

    to {
        transform:
            translate(45px,80px)
            rotate(35deg);

        opacity: 0;
    }
}


/* ============================================================
   FISH
   ============================================================ */

.fish {
    position: fixed;

    z-index: 12;

    width: 62px;
    height: 32px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;

    filter:
        brightness(.5)
        contrast(1.35)
        drop-shadow(
            0 3px 3px rgba(0,0,0,.75)
        );
}

.fishBody {
    position: absolute;

    width: 42px;
    height: 23px;

    left: 10px;
    top: 4px;

    background: #292929;

    border-radius:
        55% 45% 45% 55%;
}

.fishTail {
    position: absolute;

    left: 0;
    top: 2px;

    width: 0;
    height: 0;

    border-top:
        14px solid transparent;

    border-bottom:
        14px solid transparent;

    border-right:
        19px solid #181818;
}

.fishEye {
    position: absolute;

    right: 12px;
    top: 9px;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;
}


/* GOLD FISH */

.goldFish {
    filter:
        drop-shadow(
            0 0 9px rgba(255,210,30,.9)
        )
        drop-shadow(
            0 4px 4px rgba(0,0,0,.7)
        );

    z-index: 14;
}

.goldFish .fishBody {
    background:
        linear-gradient(
            135deg,
            #fff3a0,
            #ffd21f,
            #d89400,
            #ffed62
        );
}

.goldFish .fishTail {
    border-right-color:
        #d89400;
}

.goldFish .fishEye {
    background: black;
}


/* ============================================================
   SHARK
   ============================================================ */

.shark {
    position: fixed;

    width: 125px;
    height: 55px;

    z-index: 11;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.8)
        );
}

.sharkBody {
    position: absolute;

    left: 20px;
    top: 14px;

    width: 82px;
    height: 35px;

    background:
        linear-gradient(
            to bottom,
            #686868,
            #292929
        );

    border-radius:
        70% 55% 55% 65%;
}

.sharkTail {
    position: absolute;

    left: 0;
    top: 10px;

    width: 0;
    height: 0;

    border-top: 18px solid transparent;

    border-bottom: 18px solid transparent;

    border-right: 28px solid #353535;
}

.sharkFin {
    position: absolute;

    left: 55px;
    top: 0;

    width: 0;
    height: 0;

    border-left: 10px solid transparent;

    border-right: 10px solid transparent;

    border-bottom: 22px solid #303030;
}

.sharkEye {
    position: absolute;

    right: 30px;
    top: 24px;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;
}


@keyframes larBob {
    0%, 100% {
        margin-top: 0;
    }
    50% {
        margin-top: -12px;
    }
}


/* ============================================================
   BROWN OCTOPUS — click to lose all Lar Bucks
   ============================================================ */

.octopus {
    position: fixed;
    z-index: 17;
    width: 82px;
    height: 68px;
    pointer-events: auto;
    cursor: pointer;
    opacity: 0;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.75));
}

.octopusBody {
    position: absolute;
    left: 16px;
    top: 4px;
    width: 50px;
    height: 42px;
    border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 35% 25%, #9a6940, #5b321d 65%, #3d2113);
    border: 3px solid #321a0e;
}

.octopusEye {
    position: absolute;
    width: 7px;
    height: 7px;
    top: 17px;
    background: #fff4d0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px #201109;
}

.octopusEye.left { left: 30px; }
.octopusEye.right { right: 30px; }

.octopusTentacle {
    position: absolute;
    bottom: 4px;
    width: 15px;
    height: 30px;
    border-radius: 0 0 12px 12px;
    background: linear-gradient(90deg, #3d2113, #754424, #3d2113);
    transform-origin: top center;
}

.octopusTentacle.t1 { left: 4px; transform: rotate(30deg); }
.octopusTentacle.t2 { left: 14px; transform: rotate(15deg); }
.octopusTentacle.t3 { left: 24px; transform: rotate(5deg); }
.octopusTentacle.t4 { left: 34px; transform: rotate(-5deg); }
.octopusTentacle.t5 { left: 44px; transform: rotate(-15deg); }
.octopusTentacle.t6 { left: 54px; transform: rotate(-30deg); }
.octopusTentacle.t7 { left: 62px; transform: rotate(-42deg); }


/* ============================================================
   BROWN PAPER BAG
   ============================================================ */

.paperBag {
    position: fixed;

    width: 48px;
    height: 58px;

    z-index: 10;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            #6d401f,
            #9a6031,
            #71411f
        );

    border:
        2px solid #4c2b16;

    box-shadow:
        0 4px 8px rgba(0,0,0,.7);

    transform-origin: center;
}

.paperBag::before {
    content: "";

    position: absolute;

    left: 8px;
    right: 8px;
    top: -9px;

    height: 15px;

    border:
        3px solid #70451f;

    border-bottom: none;

    border-radius:
        50% 50% 0 0;
}

.paperBag::after {
    content: "LAR";

    position: absolute;

    left: 0;
    right: 0;
    top: 19px;

    text-align: center;

    color:
        rgba(255,235,190,.75);

    font-weight: bold;

    font-size: 11px;
}


/* ============================================================
   BROWN LAR BUCK TOKEN
   ============================================================ */

.brownBuck {
    position: fixed;

    z-index: 16;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #c49a62,
            #79502d 70%,
            #4a2d17
        );

    border:
        3px solid #d4ae79;

    color:
        #f5dfb8;

    font-weight: bold;

    font-size: 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    box-shadow:
        0 4px 8px rgba(0,0,0,.8);

    text-shadow:
        0 1px 2px #000;
}


/* ============================================================
   LAR BUCK POPUP
   ============================================================ */

.larBuckPopup {
    position: fixed;

    z-index: 3000;

    color: #ffd83d;

    font-family: Georgia, serif;

    font-weight: bold;

    font-size: 20px;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;

    animation:
        buckRise 1.6s ease-out forwards;
}

@keyframes buckRise {

    0% {
        transform:
            translate(-50%,0)
            scale(.6);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%,-80px)
            scale(1.2);

        opacity: 0;
    }
}


/* ============================================================
   PIKE FINS
   ============================================================ */

.pikeFin {
    position: fixed;

    z-index: 6;

    width: 0;
    height: 0;

    border-left:
        16px solid transparent;

    border-right:
        16px solid transparent;

    border-bottom:
        75px solid rgba(25,25,25,.82);

    opacity: 0;

    pointer-events: none;
}

.pikeFin.rising {
    animation:
        pikeRise 1.8s ease-out forwards;
}

@keyframes pikeRise {

    0% {
        opacity: 0;

        transform:
            translateY(35px)
            scale(.5);
    }

    25% {
        opacity: .9;
    }

    65% {
        opacity: .9;

        transform:
            translateY(0)
            rotate(5deg)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(35px)
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   TURTLE
   ============================================================ */

#turtle {
    position: fixed;

    z-index: 13;

    width: 180px;
    height: 90px;

    left: 110vw;
    top: 79vh;

    display: none;

    pointer-events: auto;
    cursor: pointer;

    filter:
        brightness(.3)
        contrast(1.55)
        drop-shadow(
            0 6px 6px rgba(0,0,0,.9)
        );
}

.turtleShell {
    position: absolute;

    width: 120px;
    height: 60px;

    left: 20px;
    top: 8px;

    background:
        radial-gradient(
            ellipse,
            #333 0%,
            #171717 70%,
            #080808 100%
        );

    border-radius:
        55% 50% 45% 50%;

    border: 4px solid #111;
}

.turtleHead {
    position: absolute;

    width: 42px;
    height: 36px;

    right: 0;
    top: 21px;

    background: #141414;

    border-radius:
        60% 50% 50% 60%;
}

.turtleEye {
    position: absolute;

    right: 8px;
    top: 9px;

    width: 5px;
    height: 5px;

    background: #ddd;

    border-radius: 50%;
}

.turtleLeg {
    position: absolute;

    width: 43px;
    height: 18px;

    background: #121212;

    border-radius: 60%;
}

.turtleLeg.one {
    left: 24px;
    bottom: 2px;

    transform: rotate(25deg);
}

.turtleLeg.two {
    left: 93px;
    bottom: 2px;

    transform: rotate(-25deg);
}

#turtle.walking {
    display: block;

    animation:
        turtleCurrent 15s linear forwards,
        turtleBob .9s ease-in-out infinite;
}

@keyframes turtleCurrent {

    0% {
        left: 110vw;
        top: 78vh;
        transform: scale(1);
    }

    62% {
        left: 35vw;
        top: 82vh;
        transform: scale(.9);
    }

    84% {
        left: 10vw;
        top: 88vh;
        transform: scale(.58);
    }

    100% {
        left: -18vw;
        top: 98vh;
        transform: scale(.12);
    }
}

@keyframes turtleBob {

    0% {
        margin-top: -3px;
    }

    50% {
        margin-top: 8px;
    }

    100% {
        margin-top: -3px;
    }
}


/* ============================================================
   SEAGULLS
   ============================================================ */

.seagull {
    position: fixed;

    z-index: 15;

    left: 110vw;
    top: 45vh;

    width: 100px;
    height: 50px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;
}

.seagullWing {
    position: absolute;

    width: 55px;
    height: 18px;

    border-top:
        6px solid rgba(250,250,250,.9);

    border-radius:
        70% 70% 0 0;
}

.seagullWing.left {
    left: 0;
    top: 16px;

    transform: rotate(18deg);
}

.seagullWing.right {
    right: 0;
    top: 16px;

    transform: rotate(-18deg);
}

.seagull.swooping {
    opacity: 1;

    animation:
        gullSwoop 5s ease-in-out forwards;
}

@keyframes gullSwoop {

    0% {
        left: 110vw;
        top: 45vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }

    25% {
        left: 76vw;
        top: 60vh;

        transform:
            rotate(18deg)
            scale(.9);
    }

    50% {
        left: 54vw;
        top: 70vh;

        transform:
            rotate(30deg)
            scale(1.05);
    }

    70% {
        left: 32vw;
        top: 61vh;

        transform:
            rotate(-20deg)
            scale(1);
    }

    100% {
        left: -15vw;
        top: 80vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   INSPECTION WINDOW
   ============================================================ */

#inspection {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    overflow: hidden;

    background: #111;
}

#inspection.open {
    display: flex;
}


/* hypnotic rotating background */

#inspection::before {
    content: "";

    position: absolute;

    inset: -50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            #050505 0deg 9deg,
            #f0f0e5 9deg 18deg
        );

    animation:
        hypnosisSpin 18s linear infinite;

    opacity: .20;

    pointer-events: none;
}

@keyframes hypnosisSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* dark veil */

#inspection::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.25),
            rgba(0,0,0,.82)
        );

    pointer-events: none;
}


/* framed inspection artwork */

#inspectionFrame {
    position: relative;
    z-index: 1002;
    padding: 20px;
    background: linear-gradient(135deg, #4a2d12 0%, #9a6b2d 10%, #d3ae64 18%, #704515 28%, #c99a45 42%, #5a3512 55%, #d9b66b 70%, #704515 82%, #3d230d 100%);
    border: 14px solid #6b4318;
    box-shadow: 0 0 0 3px #d5ae5d, 0 0 0 7px #3e240d, inset 0 0 0 3px #e8c66e, inset 0 0 0 8px #4b2b0e, 0 18px 55px rgba(0,0,0,.95);

    max-width: 78vw;
    max-height: 76vh;

    cursor: grab;

    touch-action: none;

    user-select: none;
}

#inspectionFrame.dragging {
    cursor: grabbing;
}

#inspectionPainting {
    position: relative;

    z-index: 1003;

    max-width: 72vw;
    max-height: 66vh;

    width: auto;
    height: auto;

    display: block;

    object-fit: contain;

    background: white;

    border:
        9px solid white;

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;

    pointer-events: none;

    transform-origin: center center;

#inspectionPainting.inspection-blurred {
    filter: blur(28px) !important;
    -webkit-filter: blur(28px) !important;
    opacity: .96 !important;
}

#inspectionPainting.inspection-clear {
    filter: none !important;
    -webkit-filter: none !important;
}

#inspectionFrame::before {
    content: "";
    position: absolute;
    inset: -8px;
    border: 3px double #e5c16a;

/* ============================================================
   INSPECTION SEAGULLS
   ============================================================ */

.inspectionGull {
    position: absolute;

    z-index: 1005;

    width: 115px;
    height: 55px;

    pointer-events: none;
}

.inspectionGull .wing {
    position: absolute;

    width: 62px;
    height: 20px;

    border-top:
        7px solid white;

    border-radius:
        70% 70% 0 0;
}

.inspectionGull .wing.left {
    left: 0;
    top: 17px;

    transform: rotate(18deg);
}

.inspectionGull .wing.right {
    right: 0;
    top: 17px;

    transform: rotate(-18deg);
}

.gullOne {
    animation:
        gullHoldOne 3.2s ease-in-out infinite;
}

.gullTwo {
    animation:
        gullHoldTwo 3.7s ease-in-out infinite;
}

.gullThree {
    animation:
        gullHoldThree 4.1s ease-in-out infinite;
}

.gullFour {
    animation:
        gullHoldFour 3.5s ease-in-out infinite;
}

@keyframes gullHoldOne {

    0% {
        left: 17%;
        top: 17%;
        transform: rotate(-15deg);
    }

    50% {
        left: 27%;
        top: 25%;
        transform: rotate(12deg);
    }

    100% {
        left: 17%;
        top: 17%;
        transform: rotate(-15deg);
    }
}

@keyframes gullHoldTwo {

    0% {
        right: 16%;
        top: 22%;
        transform: rotate(12deg);
    }

    50% {
        right: 27%;
        top: 34%;
        transform: rotate(-18deg);
    }

    100% {
        right: 16%;
        top: 22%;
        transform: rotate(12deg);
    }
}

@keyframes gullHoldThree {

    0% {
        left: 28%;
        bottom: 16%;
        transform: rotate(15deg);
    }

    50% {
        left: 38%;
        bottom: 25%;
        transform: rotate(-8deg);
    }

    100% {
        left: 28%;
        bottom: 16%;
        transform: rotate(15deg);
    }
}

@keyframes gullHoldFour {

    0% {
        right: 28%;
        bottom: 15%;
        transform: rotate(-15deg);
    }

    50% {
        right: 38%;
        bottom: 25%;
        transform: rotate(10deg);
    }

    100% {
        right: 28%;
        bottom: 15%;
        transform: rotate(-15deg);
    }
}

/* SKY PAINTING FRAME — restored from the earlier museum-frame version.
   This applies ONLY to rescued paintings so the restored river frames remain untouched. */
.immortalized .paintingFrame {
    background: #9d8654 !important;
    border: 4px solid #806c45 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
}
.immortalized .paintingFrame::before {
    content: "";
    position: absolute;
    inset: -8px;
    border: 0 !important;
    border-radius: 0 !important;
    background:
        radial-gradient(circle at 8px 8px, #b29a67 0 5px, transparent 5.5px) 0 0 / 16px 16px;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    box-shadow: none !important;
    pointer-events: none;
}
.immortalized .paintingFrame::after {
    content: "";
    position: absolute;
    inset: 2px;
    border: 1px solid #c0ad7c !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    pointer-events: none;
}

/* Sky paintings are a little larger and subtly distant/lightened. */
.immortalized .paintingCanvas {
    width: 3.6vw !important;
    min-width: 48px !important;
    max-width: 76px !important;
    border: 2px solid #f1eee5 !important;
    box-shadow: none !important;
    filter: brightness(1.10) contrast(.92) saturate(.78) !important;
}
.immortalized {
    opacity: .88 !important;
}

/* Sky paintings have no 3-D river-painting side illusion. */
.immortalized::before,
.immortalized::after {
    display: none !important;
}

/* restrained halo */
.immortalized .halo {
    width: 30px !important;
    height: 10px !important;
    top: -15px !important;
    border: 2px solid #b8a36e !important;
    box-shadow: 0 0 8px rgba(184,163,110,.45) !important;
}

/* ============================================================
   RIVER PAINTINGS — SOLID ICE BLOCKS
   The artwork remains visible through the ice, while the frame
   becomes a thick translucent rectangular block with pronounced
   front, bottom, and side depth.
   ============================================================ */
.paintingWrap:not(.immortalized) .paintingFrame {
    padding: 13px !important;
    border: 8px solid rgba(224, 246, 255, .78) !important;
    border-radius: 3px !important;

        0 12px 24px rgba(0,0,0,.78),

        inset 0 0 12px rgba(180,225,248,.9),

}

.paintingWrap:not(.immortalized) .paintingFrame::before {

    box-shadow: inset 0 0 8px rgba(255,255,255,.78) !important;
}

/* Thick transparent ice side and bottom planes. */
.paintingWrap:not(.immortalized)::before {

    bottom: -20px !important;
    width: calc(100% - 16px) !important;

.paintingWrap:not(.immortalized)::after {

    top: 8px !important;

            rgba(238,251,255,.88),
            rgba(151,203,231,.68) 48%,
            rgba(73,132,168,.56)) !important;

    box-shadow: 7px 0 10px rgba(0,0,0,.32), inset 0 0 8px rgba(255,255,255,.62);
    transform: skewY(-35deg);
}

/* Strong river mist: only colours and broad forms should be easy to see. */
.paintingWrap:not(.immortalized) .paintingCanvas {
    filter: blur(5.8px) !important;
    -webkit-filter: blur(5.8px) !important;
}





/* ============================================================
   V5 ICE-CUBE PAINTINGS
   Thick rounded clear ice block around the artwork.
   No bottom wedge: depth is shown on the TOP and RIGHT only.
   ============================================================ */
.paintingWrap:not(.immortalized) .paintingFrame {
    position: relative !important;
    padding: 15px !important;
    border: 0 !important;
    border-radius: 18px !important;

        linear-gradient(145deg,

    transform-style: preserve-3d !important;
    filter: blur(2.8px) !important;
    -webkit-filter: blur(2.8px) !important;
}

/* The actual artwork sits inside the larger clear ice block. */
.paintingWrap:not(.immortalized) .paintingCanvas {

    box-shadow:

}

/* Top ice plane — no bottom extrusion. */
.paintingWrap:not(.immortalized) .paintingFrame::before {
    content: "" !important;
    position: absolute !important;
    left: 12px !important;
    top: -14px !important;
    width: calc(100% - 24px) !important;
    height: 18px !important;
    inset: auto !important;
    border: 0 !important;
    border-radius: 12px 12px 5px 5px !important;

}

/* Right ice plane — the second visible depth surface. */
.paintingWrap:not(.immortalized) .paintingFrame::after {
    content: "" !important;
    position: absolute !important;
    right: -14px !important;
    top: 10px !important;
    width: 18px !important;
    height: calc(100% - 20px) !important;
    inset: auto !important;
    border: 0 !important;
    border-radius: 5px 12px 12px 5px !important;

        linear-gradient(to right,
            rgba(235,250,255,.78),
            rgba(163,214,239,.55) 48%,
            rgba(79,143,181,.40)) !important;
    box-shadow:
        inset -3px 0 6px rgba(255,255,255,.72),
        5px 0 9px rgba(0,0,0,.22) !important;
    transform: skewY(-28deg) !important;
    pointer-events: none !important;
    z-index: 3 !important;
}

/* Remove the old bottom/right wedges completely. */
.paintingWrap:not(.immortalized)::before,
.paintingWrap:not(.immortalized)::after {

}

   at the left of the board.  The board itself remains the only white shape. */
.paintingWrap:not(.immortalized) .surfboard::before {
    content: none !important;
    display: none !important;
}

/* Keep the fin/rudder at the right end. */
.paintingWrap:not(.immortalized) .surfboard::after {
    content: "" !important;
    display: block !important;
    right: 6% !important;
    bottom: -19px !important;
    width: 14px !important;
    height: 26px !important;
    background: linear-gradient(to right,#c7c7c3,#ffffff,#b3b3af) !important;
    clip-path: polygon(50% 0,100% 100%,0 100%) !important;
    border-radius: 0 !important;
}

/* ---------- ONE tall mast, attached to the LEFT edge of the painting ---------- */
.paintingWrap:not(.immortalized) .surfMastLeft,
.paintingWrap:not(.immortalized) .surfMastRight {
    display: none !important;
}

.paintingWrap:not(.immortalized) .surfMast {
    display: block !important;
    position: absolute !important;
    left: 2px !important;
    top: -58px !important;
    width: 4px !important;
    height: calc(100% + 68px) !important;
    background: linear-gradient(to right,#7b6a4c,#d8c89d,#6d5b3d) !important;
    border: 1px solid rgba(74,58,35,.8) !important;
    border-radius: 2px !important;
    box-shadow: 0 1px 4px rgba(0,0,0,.55) !important;
    z-index: 1 !important;
    pointer-events: none !important;
}

/* Raise the framed painting so the single mast visibly connects the board to
   its left edge, like a small wind sail. */
.paintingWrap:not(.immortalized) .paintingFrame {
    position: relative !important;
    z-index: 2 !important;
    transform: translateY(-42px) !important;
    margin-bottom: 0 !important;
    padding: 6px !important;
    border: 8px solid #c4a35b !important;
    border-radius: 0 !important;
    background: linear-gradient(135deg,#fff8df,#d9bf78,#fff1b8,#b88b3b,#ead28c) !important;
    box-shadow: 0 6px 14px rgba(0,0,0,.70) !important;
    filter: none !important;
}

.paintingWrap:not(.immortalized) .paintingFrame::before,
.paintingWrap:not(.immortalized) .paintingFrame::after {
    content: none !important;
    display: none !important;
}

.paintingWrap:not(.immortalized) .paintingCanvas {
    border: 0 !important;
    border-radius: 0 !important;
    filter: blur(5.5px) brightness(1.03) !important;
    -webkit-filter: blur(5.5px) brightness(1.03) !important;
}

/* ---------- SKY: frame stays crisp; artwork alone blurs ---------- */
.immortalized .paintingFrame {
    border-radius: 0 !important;
    filter: none !important;
    -webkit-filter: none !important;
    animation-name: v27SkyWind !important;
    animation-duration: var(--skyWindDuration, 10s) !important;
    animation-delay: var(--skyWindDelay, 0s) !important;
    animation-timing-function: ease-in-out !important;
    animation-iteration-count: infinite !important;
    animation-fill-mode: both !important;
}

.immortalized .paintingFrame::before,
.immortalized .paintingFrame::after {
    border-radius: 0 !important;
    filter: none !important;
    -webkit-filter: none !important;
}

.immortalized .paintingCanvas {
    filter: blur(4px) brightness(1.03) !important;
    -webkit-filter: blur(4px) brightness(1.03) !important;
    transition: filter 2.8s ease-out, -webkit-filter 2.8s ease-out !important;
}

.immortalized[data-approved="true"] .paintingCanvas,
.immortalized.approved .paintingCanvas {
    filter: blur(0px) brightness(1) !important;
    -webkit-filter: blur(0px) brightness(1) !important;
}

/* Slow wind: sideways drift + vertical bob + receding/floating scale. */
@keyframes v27SkyWind {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    18%  { transform: translate3d(-18px, -7px, 0) scale(.82); }
    36%  { transform: translate3d(13px, 5px, 0) scale(.94); }
    52%  { transform: translate3d(24px, -6px, 0) scale(1.08); }
    70%  { transform: translate3d(8px, 7px, 0) scale(.96); }
    86%  { transform: translate3d(-20px, -4px, 0) scale(.84); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
}

/* Keep the yellow halo sharp and attached above the moving frame. */
.immortalized .halo {
    filter: none !important;
    -webkit-filter: none !important;
}
</style>

<script src="images.js"></script>

<script>

function flashOctopusClick(e) {
    const f = document.createElement("div");
    f.className = "octopus-click-flash";
    f.textContent = "WARNING — ALL LAR BUCKS LOST";
    f.style.left = ((e && e.clientX) || window.innerWidth/2) + "px";
    f.style.top = ((e && e.clientY) || window.innerHeight/2) + "px";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 750);
}





/* ============================================================
   FORCE SILENCE
   ============================================================ */

const waterfall =
    document.getElementById(
        "waterfall"
    );


function silenceEverything() {

    /*
       The Niagara video is the only media
       that is supposed to exist.
    */

    waterfall.muted = true;

    waterfall.volume = 0;

    waterfall.setAttribute(
        "muted",
        ""
    );


    /*
       Kill any accidental audio elements.
    */

    document
        .querySelectorAll(
            "audio"
        )
        .forEach(
            function(audio) {

                audio.pause();

                audio.volume = 0;

                audio.remove();

            }
        );


    /*
       Also silence every other media
       element if anything adds one later.
    */

    document
        .querySelectorAll(
            "video"
        )
        .forEach(
            function(video) {

                video.muted = true;

                video.volume = 0;

            }
        );

}


silenceEverything();


/*
   Keep it muted even if the browser or
   page attempts to change the state.
*/

waterfall.addEventListener(
    "volumechange",
    function() {

        waterfall.muted = true;

        waterfall.volume = 0;

    }
);


/* ============================================================
   VARIABLES
   ============================================================ */

let usedImages = [];

let savedPaintings = [];

let activePaintings = [];

let paintingNumber = 0;

let riverGeneration = 0;

let nextGroup =
    15 +
    Math.floor(
        Math.random() * 3
    );

let currentInspectionImage = "";

let currentSkyPainting = null;

let inspectionZoom = 1;

let inspectionDragging = false;

let inspectionDragX = 0;

let inspectionDragY = 0;

let inspectionOffsetX = 0;

let inspectionOffsetY = 0;

let titleUnlocked = [];

let deblurUnlocked = [];


/* ============================================================
   LAR BUCKS
   ============================================================ */

let larBucks = 0;


try {

    larBucks =
        parseInt(
            localStorage.getItem(
                "larBucks"
            ) || "0",
            10
        );

    if (
        isNaN(larBucks)
    ) {
        larBucks = 0;
    }

} catch (e) {

    larBucks = 0;

}


/* ============================================================
   SAVED PAINTINGS
   ============================================================ */

/*
   Immortalized paintings are SESSION-ONLY.
   Every visit starts with zero saved/rescued paintings.
   Clear the older persistent collection left by previous versions.
*/
savedPaintings = [];

try {
    localStorage.removeItem(
        "larryImmortalizedPaintings"
    );
} catch (e) {}


/* ============================================================
   UNLOCKED TITLES
   ============================================================ */

try {

    titleUnlocked =
        JSON.parse(
            localStorage.getItem(
                "larryUnlockedTitles"
            ) || "[]"
        );

    if (
        !Array.isArray(
            titleUnlocked
        )
    ) {

        titleUnlocked = [];

    }

} catch (e) {

    titleUnlocked = [];

}


/* ============================================================
   UNLOCKED DE-BLUR STATES
   ============================================================ */
try {
    deblurUnlocked = JSON.parse(localStorage.getItem("larryDeblurUnlocked") || "[]");
    if (!Array.isArray(deblurUnlocked)) deblurUnlocked = [];
} catch (e) {
    deblurUnlocked = [];
}


/* ============================================================
   COUNTER
   ============================================================ */

function updateSavedCounter() {

    document
        .getElementById(
            "savedCounter"
        )
        .textContent =
        "Immortalized: " +
        savedPaintings.length +
        " | Lar Bucks: " +
        larBucks;

}


updateSavedCounter();


/* ============================================================
   LAR BUCK REWARD
   ============================================================ */

function addLarBuck(
    x,
    y,
    amount = 1
) {

    larBucks += amount;


    try {

        localStorage.setItem(
            "larBucks",
            larBucks
        );

    } catch (e) {}


    updateSavedCounter();


    const popup =
        document.createElement(
            "div"
        );

    popup.className =
        "larBuckPopup";

    popup.textContent =
        "+" +
        amount +
        " Lar Buck" +
        (
            amount === 1
                ? ""
                : "s"
        );


    popup.style.left =
        x + "px";

    popup.style.top =
        y + "px";


    document.body.appendChild(
        popup
    );


    setTimeout(
        function() {

            popup.remove();

        },
        1700
    );

}


/* ============================================================
   GENERIC REWARD OBJECT
   ============================================================ */

function rewardObject(
    object,
    amount
) {

    const rect =
        object.getBoundingClientRect();


    addLarBuck(
        rect.left +
        rect.width / 2,

        rect.top,

        amount
    );


    object.style.pointerEvents =
        "none";


    object.style.transition =
        "transform .45s ease, opacity .45s ease";


    object.style.transform +=
        " scale(1.7)";


    object.style.opacity =
        "0";


    setTimeout(
        function() {

            object.remove();

        },
        500
    );

}


/* ============================================================
   ARTWORK CHOICE
   ============================================================ */

function chooseArtwork() {

    if (
        usedImages.length >=
        images.length
    ) {

        usedImages = [];

    }


    let available =
        images.filter(
            function(image) {

                return !usedImages.includes(
                    images.indexOf(
                        image
                    )
                );

            }
        );


    if (
        !available.length
    ) {

        usedImages = [];

        available =
            images.slice();

    }


    const chosen =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    usedImages.push(
        images.indexOf(
            chosen
        )
    );


    return chosen;

}


/* ============================================================
   SAVE PAINTING
   ============================================================ */

function savePainting(
    image
) {

    if (
        !savedPaintings.includes(
            image
        )
    ) {

        savedPaintings.push(
            image
        );


        /*
           Deliberately do not persist this collection.
           It belongs only to the current Niagara visit.
        */

    }


    updateSavedCounter();

}


/* ============================================================
   TITLE
   ============================================================ */

function getPaintingTitle(
    image
) {

    /*
       If images.js contains an optional
       imageTitles object, use it.
    */

    try {

        if (
            typeof imageTitles !==
            "undefined" &&
            imageTitles[image]
        ) {

            return imageTitles[image];

        }

    } catch (e) {}


    /*
       Otherwise use the filename as the
       painting title.
    */

    let name =
        image
            .split("/")
            .pop();


    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        decodeURIComponent(
            name
        );


    name =
        name.replace(
            /[_-]+/g,
            " "
        );


    name =
        name.replace(
            /\s+/g,
            " "
        );


    return name.trim();

}


function titleIsUnlocked(
    image
) {

    return titleUnlocked.includes(
        image
    );

}


/* ============================================================
   INSPECTION WINDOW
   ============================================================ */

function inspectPainting(
    image,
    skyPainting = null
) {

    currentInspectionImage =
        image;

    currentSkyPainting =
        skyPainting;


    inspectionZoom = 1;

    inspectionOffsetX = 0;

    inspectionOffsetY = 0;


    const inspection =
        document.getElementById(
            "inspection"
        );

    const picture =
        document.getElementById(
            "inspectionPainting"
        );


    picture.src =
        image;

    const inspectionIsUnlocked = deblurUnlocked.includes(image);

    picture.onload = function() {
        const stillUnlocked = deblurUnlocked.includes(currentInspectionImage);
        picture.style.setProperty(
            "filter",
            stillUnlocked ? "none" : "blur(30px)",
            "important"
        );
        picture.style.setProperty(
            "-webkit-filter",
            stillUnlocked ? "none" : "blur(30px)",
            "important"
        );
    };
    picture.classList.toggle("inspection-blurred", !inspectionIsUnlocked);
    picture.classList.toggle("inspection-clear", inspectionIsUnlocked);
    picture.style.setProperty(
        "filter",
        inspectionIsUnlocked ? "none" : "blur(30px)",
        "important"
    );
    picture.style.setProperty(
        "-webkit-filter",
        inspectionIsUnlocked ? "none" : "blur(30px)",
        "important"
    );
    updateDeblurButton();


    picture.style.transform =
        "scale(1)";


    const frame =
        document.getElementById(
            "inspectionFrame"
        );


    frame.style.transform =
        "translate(0px,0px)";


    updateTitleButton();

    const rejectButton =
        document.getElementById(
            "rejectPainting"
        );

    /*
       Any painting currently floating in the sky may be rejected.
       The button is therefore tied to the actual sky element, not
       to whether the painting has already been saved.
    */
    rejectButton.style.display =
        currentSkyPainting &&
        document.body.contains(
            currentSkyPainting
        )
            ? "inline-block"
            : "none";


    inspection.classList.add(
        "open"
    );

}


function updateDeblurButton() {
    const button = document.getElementById("deblurButton");
    if (!button) return;
    if (deblurUnlocked.includes(currentInspectionImage)) {
        button.textContent = "DE-BLURRED";
        button.classList.remove("locked");
        button.classList.add("unlocked");
        button.disabled = true;
    } else {
        button.textContent = "3 LAR BUCKS TO DE-BLUR";
        button.classList.add("locked");
        button.classList.remove("unlocked");
        button.disabled = false;
    }
}


document.getElementById("deblurButton").addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    const image = currentInspectionImage;
    if (!image || deblurUnlocked.includes(image)) return;
    if (larBucks < 3) {
        this.textContent = "NEED 3 LAR BUCKS";
        setTimeout(updateDeblurButton, 1200);
        return;
    }
    larBucks -= 3;
    deblurUnlocked.push(image);
    try {
        localStorage.setItem("larBucks", larBucks);
        localStorage.setItem("larryDeblurUnlocked", JSON.stringify(deblurUnlocked));
    } catch (error) {}
    updateSavedCounter();
    const picture = document.getElementById("inspectionPainting");
    /* Start from maximum blur, then let CSS reveal the painting slowly. */
    picture.classList.remove("inspection-clear");
    picture.classList.add("inspection-blurred");
    picture.style.setProperty("filter", "blur(30px)", "important");
    picture.style.setProperty("-webkit-filter", "blur(30px)", "important");
    void picture.offsetWidth;
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
            picture.style.setProperty("filter", "blur(0px)", "important");
            picture.style.setProperty("-webkit-filter", "blur(0px)", "important");
            picture.classList.remove("inspection-blurred");
            picture.classList.add("inspection-clear");
        });
    });
    updateDeblurButton();
});


function updateTitleButton() {

    const button =
        document.getElementById(
            "titleButton"
        );

    const title =
        document.getElementById(
            "paintingTitle"
        );


    if (
        titleIsUnlocked(
            currentInspectionImage
        )
    ) {

        button.textContent =
            "TITLE UNLOCKED";

        button.classList.remove(
            "locked"
        );

        button.classList.add(
            "unlocked"
        );


        title.textContent =
            getPaintingTitle(
                currentInspectionImage
            );

        title.style.display =
            "block";


        return;

    }


    button.textContent =
        "TITLE — 20 LAR BUCKS";

    button.classList.add(
        "locked"
    );

    button.classList.remove(
        "unlocked"
    );


    title.style.display =
        "none";

}



function approveCurrentPainting() {
    const image = currentInspectionImage;
    if (!image) return;

    /*
       YES! HOW GORGEOUS! reveals the ACTUAL sky painting first, then the
       matching angel icon if one exists.  The frame and halo are never
       filtered.  The image alone makes a smooth 2.8-second transition.
    */
    const reveal = function(img) {
        if (!img) return;

        img.style.setProperty(
            "filter",
            "blur(4px) brightness(1.03)",
            "important"
        );
        img.style.setProperty(
            "-webkit-filter",
            "blur(4px) brightness(1.03)",
            "important"
        );
        img.style.transition =
            "filter 2.8s ease-out, -webkit-filter 2.8s ease-out";

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                img.style.setProperty(
                    "filter",
                    "blur(0px) brightness(1)",
                    "important"
                );
                img.style.setProperty(
                    "-webkit-filter",
                    "blur(0px) brightness(1)",
                    "important"
                );
            });
        });
    };

    let revealedSky = false;

    /* Prefer the exact sky object that opened the pop-up. */
    if (
        currentSkyPainting &&
        document.body.contains(currentSkyPainting) &&
        currentSkyPainting.dataset.image === image
    ) {
        currentSkyPainting.dataset.approved = "true";
        currentSkyPainting.classList.add("approved");
        reveal(currentSkyPainting.querySelector(".paintingCanvas"));
        revealedSky = true;
    }

    /* Fallback for a sky object whose reference was lost while the pop-up
       was open.  Match by the exact image path. */
    document.querySelectorAll(".paintingWrap.immortalized").forEach(function(painting) {
        if (painting.dataset.image === image) {
            painting.dataset.approved = "true";
            painting.classList.add("approved");
            reveal(painting.querySelector(".paintingCanvas"));
            revealedSky = true;
        }
    });

    /* Also reveal the matching angel/desktop artwork. */
    document.querySelectorAll(".angel").forEach(function(angel) {
        if (angel.dataset.image === image) {
            angel.dataset.approved = "true";
            reveal(angel.querySelector("img"));
        }
    });
}



function closeInspection() {

    document
        .getElementById(
            "inspection"
        )
        .classList.remove(
            "open"
        );

    currentSkyPainting = null;

    document
        .getElementById(
            "rejectPainting"
        ).style.display =
        "none";

}


document
    .getElementById(
        "closeInspection"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            approveCurrentPainting();
            closeInspection();

        }
    );


/* ============================================================
   REJECT CURRENT SKY PAINTING
   ============================================================ */

document
    .getElementById(
        "rejectPainting"
    )
    .addEventListener(
        "click",
        function(e) {

            e.preventDefault();
            e.stopPropagation();

            const image =
                currentInspectionImage;

            const painting =
                currentSkyPainting;

            if (!image) {
                return;
            }

            savedPaintings =
                savedPaintings.filter(
                    function(savedImage) {
                        return savedImage !== image;
                    }
                );

            titleUnlocked =
                titleUnlocked.filter(
                    function(savedImage) {
                        return savedImage !== image;
                    }
                );

            try {
                localStorage.removeItem(
                    "larryImmortalizedPaintings"
                );

                localStorage.setItem(
                    "larryUnlockedTitles",
                    JSON.stringify(titleUnlocked)
                );

            } catch (error) {}

            if (painting && document.body.contains(painting)) {
                painting.remove();
            }

            updateSavedCounter();
            closeInspection();

        }
    );


/* ============================================================
   UNLOCK TITLE
   ============================================================ */

document
    .getElementById(
        "titleButton"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();


            if (
                !currentInspectionImage
            ) {

                return;

            }


            if (
                titleIsUnlocked(
                    currentInspectionImage
                )
            ) {

                return;

            }


            if (
                larBucks < 20
            ) {

                const rect =
                    this.getBoundingClientRect();


                addLarBuck(
                    rect.left +
                    rect.width / 2,
                    rect.top,
                    0
                );


                this.textContent =
                    "NEED 20 LAR BUCKS";

                setTimeout(
                    updateTitleButton,
                    1200
                );


                return;

            }


            larBucks -= 20;


            try {

                localStorage.setItem(
                    "larBucks",
                    larBucks
                );

            } catch (e) {}


            titleUnlocked.push(
                currentInspectionImage
            );


            try {

                localStorage.setItem(
                    "larryUnlockedTitles",
                    JSON.stringify(
                        titleUnlocked
                    )
                );

            } catch (e) {}


            updateSavedCounter();

            updateTitleButton();

        }
    );


/* ============================================================
   INSPECTION ZOOM
   ============================================================ */

function setInspectionZoom(
    value
) {

    inspectionZoom =
        Math.max(
            .35,
            Math.min(
                4,
                value
            )
        );


    document
        .getElementById(
            "inspectionPainting"
        )
        .style.transform =
        "scale(" +
        inspectionZoom +
        ")";

            inspectionOffsetX;

        inspectionDragY =
            e.clientY -

        inspectionFrame.classList.add(

        );


        inspectionFrame.setPointerCapture(

        );

);

}

);

);


/* ============================================================
   SKY POSITION — NEVER OVERLAP ANOTHER SKY PAINTING
   ============================================================ */
function findNonOverlappingSkyPosition(
    painting,
    startX,
    finalWidth,
    finalHeight
) {
    const gap = 18;
    const halfW = finalWidth / 2 + gap;
    const halfH = finalHeight / 2 + gap;

    const minX = halfW;
    const maxX = Math.max(minX, window.innerWidth - halfW);
    const minY = halfH + 8;
    const maxY = Math.max(
        minY,
        Math.min(window.innerHeight * 0.20, window.innerHeight - halfH - 8)
    );

    const others = Array.from(
        document.querySelectorAll(".paintingWrap.immortalized")
    ).filter(function(other) {
        return other !== painting && other.dataset.rescued === "true";
    });

    function clearOfOthers(x, y) {
        return others.every(function(other) {
            const r = other.getBoundingClientRect();
            return !(
                x - halfW < r.right + gap &&
                x + halfW > r.left - gap &&
                y - halfH < r.bottom + gap &&
                y + halfH > r.top - gap
            );
        });
    }

    /* Try random destinations first so the sky does not form a rigid grid. */
    for (let i = 0; i < 250; i++) {
        const x = Math.max(
            minX,
            Math.min(maxX, startX + (Math.random() * 240 - 120))
        );
        const y = minY + Math.random() * Math.max(1, maxY - minY);
        if (clearOfOthers(x, y)) return { x, y };
    }

    /* Fallback: scan the sky in a regular pattern. */
    const stepX = Math.max(55, finalWidth + gap * 2);
    const stepY = Math.max(55, finalHeight + gap * 2);

    for (let y = minY; y <= maxY + 1; y += stepY) {
        for (let x = minX; x <= maxX + 1; x += stepX) {
            if (clearOfOthers(x, y)) return { x, y };
        }
    }

    /* If the sky is genuinely full, place it at the least crowded point. */
    return {
        x: Math.max(minX, Math.min(maxX, startX)),
        y: minY
    };
}


/* ============================================================
   MAKE IMMORTALIZED PAINTING
   ============================================================ */

function immortalizePainting(
    painting,
    image,
    originX = null,
    originY = null
) {

    savePainting(image);

    painting.dataset.rescued = "true";
    painting.dataset.rescuing = "false";
    painting.classList.add("immortalized");
    const rescuedSurfboard = painting.querySelector(".surfboard");
    if (rescuedSurfboard) rescuedSurfboard.remove();

    /* The single sail mast belongs only to the river object. Once the rope
       has rescued the painting, the mast must disappear completely. */
    const rescuedMast = painting.querySelector(".surfMast");
    if (rescuedMast) rescuedMast.remove();

    painting.style.pointerEvents = "auto";

    /* The painting begins exactly where the rope caught it. */
    const rect = painting.getBoundingClientRect();
    const startX = originX !== null ? originX : rect.left + rect.width / 2;
    const startY = originY !== null ? originY : rect.top + rect.height / 2;

    /* Final sky position: top strip, safely inside the screen.
       The path is a slight diagonal from the rope catch point. */
    const finalWidth = Math.min(67, Math.max(42, window.innerWidth * 0.0315));
    const finalHeight = finalWidth * 1.25;
    const halfW = finalWidth / 2 + 10;
    const halfH = finalHeight / 2 + 10;

    const skyTarget = findNonOverlappingSkyPosition(
        painting,
        startX,
        finalWidth,
        finalHeight
    );

    const targetX = skyTarget.x;
    const targetY = skyTarget.y;

    /* Each rescued painting gets its own slow wind/depth rhythm.  The
       movement is applied to the frame, leaving the wrapper free for
       dragging and keeping the frame/halo together. */
    painting.style.setProperty(
        "--skyWindDuration",
        (7.5 + Math.random() * 6.5).toFixed(2) + "s"
    );
    painting.style.setProperty(
        "--skyWindDelay",
        (-Math.random() * 8).toFixed(2) + "s"
    );

    painting.style.transition = "none";
    painting.style.left = startX + "px";
    painting.style.top = startY + "px";
    painting.style.transform = "translate(-50%,-50%)";
    painting.style.opacity = "1";
    painting.style.filter = "none";

    if (!painting.querySelector(".halo")) {
        const halo = document.createElement("div");
        halo.className = "halo";
        painting.querySelector(".paintingFrame").appendChild(halo);
    }

    /* Let the exact rope/click position render before the upward drift. */
    requestAnimationFrame(function() {
        if (!document.body.contains(painting)) return;

        painting.style.transition =
            "left 3s cubic-bezier(.2,.72,.25,1), " +
            "top 3s cubic-bezier(.2,.72,.25,1), " +
            "transform 3s cubic-bezier(.2,.72,.25,1)";

        painting.style.left = targetX + "px";
        painting.style.top = targetY + "px";
        painting.style.transform = "translate(-50%,-50%)";
    });

    /* Desktop-icon behaviour: draggable like an icon, bounded to the upper 1/5. */
    if (!painting.dataset.skyDragReady) {
        painting.dataset.skyDragReady = "true";
        painting.dataset.skyDragging = "false";
        painting.dataset.skySuppressClick = "false";

        let dragStartX = 0;
        let dragStartY = 0;
        let dragLeft = 0;
        let dragTop = 0;
        let dragMoved = false;

        function skyPositionIsClear(proposedLeft, proposedTop) {
            const gap = 12;
            const w = painting.offsetWidth;
            const h = painting.offsetHeight;
            const left = proposedLeft;
            const top = proposedTop;
            const right = left + w;
            const bottom = top + h;

            return Array.from(document.querySelectorAll(".paintingWrap.immortalized"))
                .filter(function(other) {
                    return other !== painting && other.dataset.rescued === "true";
                })
                .every(function(other) {
                    const r = other.getBoundingClientRect();
                    return !(
                        left < r.right + gap &&
                        right > r.left - gap &&
                        top < r.bottom + gap &&
                        bottom > r.top - gap
                    );
                });
        }

        painting.addEventListener("pointerdown", function(e) {
            if (painting.dataset.rescued !== "true" || e.button !== 0) return;

            const r = painting.getBoundingClientRect();
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragLeft = r.left;
            dragTop = r.top;
            dragMoved = false;

            painting.dataset.skyDragging = "true";
            painting.dataset.skySuppressClick = "false";
            painting.style.transition = "none";

            try { painting.setPointerCapture(e.pointerId); } catch (err) {}
            e.stopPropagation();
        });

        painting.addEventListener("pointermove", function(e) {
            if (painting.dataset.skyDragging !== "true") return;

            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                dragMoved = true;
            }

            const maxX = Math.max(0, window.innerWidth - painting.offsetWidth);
            const maxY = Math.max(0, window.innerHeight * 0.20 - painting.offsetHeight);

            const proposedLeft = Math.max(0, Math.min(maxX, dragLeft + dx));
            const proposedTop = Math.max(0, Math.min(maxY, dragTop + dy));

            if (skyPositionIsClear(proposedLeft, proposedTop)) {
                painting.style.left = proposedLeft + "px";
                painting.style.top = proposedTop + "px";
                painting.style.transform = "none";
            }

            e.stopPropagation();
        });

        function finishSkyDrag(e) {
            if (painting.dataset.skyDragging !== "true") return;

            painting.dataset.skyDragging = "false";

            if (dragMoved) {
                painting.dataset.skySuppressClick = "true";
            }

            try { painting.releasePointerCapture(e.pointerId); } catch (err) {}
        }

        painting.addEventListener("pointerup", finishSkyDrag);
        painting.addEventListener("pointercancel", finishSkyDrag);

        painting.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            painting.dataset.skySuppressClick = "false";
        });

        painting.addEventListener("dblclick", function(e) {
            e.preventDefault();
            e.stopPropagation();
            inspectPainting(image, painting);
        });
    }
}

            );

            );

    );

/* ============================================================
   ROPE RESCUE
   ============================================================ */

function ropeRescue(
    painting,
    image,
    clickX = null,
    clickY = null
) {

    if (painting.dataset.rescued === "true") {
        inspectPainting(image);
        return;
    }

    /*
       Freeze FIRST.  The mouse coordinates are captured before any CSS
       changes, and the painting is pinned to its current visual centre.
       Nothing is allowed to keep carrying the painting while the rope runs.
    */
    /* Detach the surfboard BEFORE freezing the painting.  The board then
       continues downstream while the framed artwork stays with the rope. */
    const movingBoard = painting.querySelector(".surfboard");
    if (movingBoard) {
        const boardRect = movingBoard.getBoundingClientRect();
        const boardClone = movingBoard.cloneNode(true);
        boardClone.classList.add("departingSurfboard");
        boardClone.style.position = "fixed";
        boardClone.style.left = boardRect.left + "px";
        boardClone.style.top = boardRect.top + "px";
        boardClone.style.width = boardRect.width + "px";
        boardClone.style.height = boardRect.height + "px";
        boardClone.style.margin = "0";
        boardClone.style.zIndex = "8";
        boardClone.style.transform = "rotate(7deg)";
        document.body.appendChild(boardClone);
        movingBoard.remove();

        requestAnimationFrame(function() {
            boardClone.style.transition =
                "left 3.8s cubic-bezier(.18,.62,.35,1), " +
                "top 3.8s cubic-bezier(.18,.62,.35,1), " +
                "transform 3.8s ease-in, opacity 3.8s ease-in";
            boardClone.style.left =
                (boardRect.left - window.innerWidth * .16) + "px";
            boardClone.style.top =
                (window.innerHeight + 90) + "px";
            boardClone.style.transform = "rotate(28deg)";
            boardClone.style.opacity = "0";
        });

        setTimeout(function() {
            boardClone.remove();
        }, 4000);
    }

    const frozenRect = painting.getBoundingClientRect();
    const frozenCenterX = frozenRect.left + frozenRect.width / 2;
    const frozenCenterY = frozenRect.top + frozenRect.height / 2;

    const ropeX = clickX !== null ? clickX : frozenCenterX;
    const ropeY = clickY !== null ? clickY : frozenCenterY;

    /*
       Preserve the exact visual scale at the instant of the click.
       The river animation uses different scales as paintings travel
       across the screen.  Forcing scale(1) here was making a painting
       jump larger when the rope caught it.
    */
    let frozenScaleX = 1;
    let frozenScaleY = 1;
    const computedTransform = getComputedStyle(painting).transform;
    if (computedTransform && computedTransform !== "none") {
        try {
            const matrix = new DOMMatrix(computedTransform);
            frozenScaleX = Math.sqrt(matrix.a * matrix.a + matrix.b * matrix.b) || 1;
            frozenScaleY = Math.sqrt(matrix.c * matrix.c + matrix.d * matrix.d) || 1;
        } catch (error) {
            const match = computedTransform.match(/matrix(?:3d)?\(([^)]+)\)/);
            if (match) {
                const values = match[1].split(",").map(Number);
                if (values.length >= 6) {
                    frozenScaleX = Math.sqrt(values[0] * values[0] + values[1] * values[1]) || 1;
                    frozenScaleY = Math.sqrt(values[2] * values[2] + values[3] * values[3]) || 1;
                }
            }
        }
    }

    const frozenOpacity = getComputedStyle(painting).opacity;

    painting.style.transition = "none";
    painting.style.left = frozenCenterX + "px";
    painting.style.top = frozenCenterY + "px";
    painting.style.transform =
        "translate(-50%,-50%) scale(" +
        frozenScaleX + "," + frozenScaleY + ")";
    painting.style.opacity = frozenOpacity;
    painting.dataset.rescuing = "true";
    painting.dataset.ropeClickX = ropeX;
    painting.dataset.ropeClickY = ropeY;

    /* Stop the river animation from changing this object's position. */
    if (painting._riverAnimationFrame) {
        cancelAnimationFrame(painting._riverAnimationFrame);
        painting._riverAnimationFrame = null;
    }
    if (painting._riverTimeouts) {
        painting._riverTimeouts.forEach(clearTimeout);
        painting._riverTimeouts = [];
    }

    /* The rope endpoint is exactly the recorded mouse-click point. */
    const rope = document.createElement("div");
    rope.className = "rescueRope";

    const startY = window.innerHeight + 30;
    rope.style.left = (ropeX - 4) + "px";
    rope.style.top = ropeY + "px";
    rope.style.height = (startY - ropeY) + "px";

    const knot = document.createElement("div");
    knot.className = "ropeKnot";
    rope.appendChild(knot);
    document.body.appendChild(rope);

    setTimeout(function() {
        rope.style.transform = "rotate(-6deg)";
    }, 700);

    setTimeout(function() {
        rope.style.transform = "rotate(7deg)";
    }, 900);

    setTimeout(function() {
        rope.classList.add("ropeBreaking");
        createBrokenRopes(ropeX, ropeY);

        setTimeout(function() {
            immortalizePainting(
                painting,
                image,
                ropeX,
                ropeY
            );
        }, 450);
    }, 1150);

    setTimeout(function() {
        rope.remove();
    }, 1900);
}

/* ============================================================
   CREATE PAINTING
   ============================================================ */

function createPainting(
    image
) {

    const wrap =
        document.createElement(
            "div"
        );


    wrap.className =
        "paintingWrap";

    /* White long surfboard beneath each river painting. */
    const surfboard = document.createElement("div");
    surfboard.className = "surfboard";
    wrap.appendChild(surfboard);

    /* ONE real mast: a single tall sail-pole rises from the surfboard and
       meets the LEFT edge of the framed painting. */
    const mast = document.createElement("div");
    mast.className = "surfMast";
    wrap.appendChild(mast);

    const frame =
        document.createElement(
            "div"
        );

    frame.className =
        "paintingFrame";


    const canvas =
        document.createElement(
            "img"
        );

    canvas.className =
        "paintingCanvas";

    canvas.src =
        image;

    canvas.draggable =
        false;


    frame.appendChild(
        canvas
    );

    wrap.appendChild(
        frame
    );


    wrap.dataset.image =
        image;

    wrap.dataset.rescued =
        "false";

    wrap.dataset.rescuing =
        "false";


    /*
       Immortalized paintings are independent sky objects.
       Their click must never fall through to the river
       generation/rescue system.
    */
    wrap.addEventListener(
        "pointerdown",
        function(e) {
            if (
                wrap.dataset.rescued ===
                "true"
            ) {
                e.stopPropagation();
            }
        }
    );

    wrap.addEventListener(
        "click",
        function(e) {

            e.preventDefault();
            e.stopPropagation();

            if (wrap.dataset.skySuppressClick === "true") {
                wrap.dataset.skySuppressClick = "false";
                return;
            }

            const rect =
                wrap.getBoundingClientRect();

            addLarBuck(
                rect.left +
                rect.width / 2,
                rect.top,
                1
            );

            if (
                wrap.dataset.rescued ===
                "true"
            ) {

                inspectPainting(
                    image,
                    wrap
                );

                return;

            }

            ropeRescue(
                wrap,
                image,
                e.clientX,
                e.clientY
            );

        }
    );


    document.body.appendChild(
        wrap
    );


    /*
       Start completely outside
       the visible screen.
    */

    wrap.style.left =
        (
            112 +
            Math.random() * 8
        ) + "vw";


    wrap.style.top =
        (
            61 +
            Math.random() * 19
        ) + "vh";


    wrap.style.transform =
        "translate(-50%,-50%) scale(" +
        (

/* ============================================================
   CARRY PAINTING THROUGH RIVER
   ============================================================ */

function revealAndCarry(
    painting,
    image,
    delay = 0,
    generation
) {

    setTimeout(
        function() {

            if (
                generation !==
                riverGeneration
            ) {

                painting.remove();

                return;

            }


            if (
                painting.dataset.rescued ===
                "true" ||
                painting.dataset.rescuing ===
                "true"
            ) {

                return;

            }


            /*
               REVEAL.
            */

            painting.style.opacity =
                ".98";


            void painting.offsetWidth;


            /*
               FIRST CURRENT
            */

            painting.style.transition =
                "left 3.5s linear, " +
                "top 3.5s ease-in-out, " +
                "transform 3.5s ease-out";


            painting.style.left =
                (
                    80 +
                    Math.random() * 7
                ) + "vw";


            painting.style.top =
                (
                    64 +
                    Math.random() * 10
                ) + "vh";


            painting.style.transform =
                "translate(-50%,-50%) scale(" +
                (
                    .34 +
                    Math.random() * .12
                ) +
                ")";


            /*
               MIDDLE CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.3s linear, " +
                        "top 4.3s ease-in-out, " +
                        "transform 4.3s linear";


                    painting.style.left =
                        (
                            53 +
                            Math.random() * 8
                        ) + "vw";


                    painting.style.top =
                        (
                            69 +
                            Math.random() * 9
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.72)";


                },
                3500
            );


            /*
               LOWER CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.1s linear, " +
                        "top 4.1s ease-in-out, " +
                        "transform 4.1s linear";


                    painting.style.left =
                        (
                            29 +
                            Math.random() * 7
                        ) + "vw";


                    painting.style.top =
                        (
                            76 +
                            Math.random() * 8
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.53)";


                },
                7800
            );


            /*
               VERY NEAR LEFT SIDE.

               It travels horizontally to the
               near-left side while remaining SOLID.

               It does NOT become transparent yet.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 3.2s linear, " +
                        "top 3.2s ease-in-out, " +
                        "transform 3.2s linear";


                    painting.style.left =
                        (
                            7 +
                            Math.random() * 2
                        ) + "vw";


                    painting.style.top =
                        (
                            79 +
                            Math.random() * 4
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.25)";


                    /*
                       IMPORTANT:
                       opacity stays at .98 here.
                    */

                    painting.style.opacity =
                        ".98";


                },
                11900
            );

            /*
               LOWER-LEFT EXIT: one continuous diagonal.
               No sudden vertical drop. Fade only as it reaches
               the lower-left edge.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {
                        return;
                    }

                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {
                        return;
                    }

                    painting.style.transition =
                        "left 2.8s ease-in-out, " +
                        "top 2.8s ease-in-out, " +
                        "opacity 2.8s linear, " +
                        "transform 2.8s ease-in-out";

                    painting.style.left = "-10vw";
                    painting.style.top = "104vh";
                    painting.style.opacity = "0";
                    painting.style.transform =
                        "translate(-50%,-50%) scale(.08)";

                },
                15100
            );


            /*
               FINAL EXIT.
            */

            setTimeout(
                function() {

                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.remove();

                },
                16800
            );


        },
        delay
    );

}

   ============================================================ */

function startPaintingSequence(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    paintingNumber++;


    const image =
        chooseArtwork();


    const painting =
        createPainting(
            image
        );


    activePaintings.push(
        painting
    );


    revealAndCarry(
        painting,
        image,
