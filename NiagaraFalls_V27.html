        generation
    );


    setTimeout(
        function() {

            startPaintingSequence(
                generation
            );

        },
        4800 +
        Math.random() * 1100
    );


    if (
        paintingNumber >=
        nextGroup
    ) {

        nextGroup =
            paintingNumber +
            14 +
            Math.floor(

            );


        setTimeout(
            function() {

                sendPaintingGroup(
                    generation
                );

            },
            1200
        );

    }

}


/* ============================================================
   PAINTING GROUP
   ============================================================ */

function sendPaintingGroup(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    const amount =
        3 +
        Math.floor(
            Math.random() * 2
        );


    const group = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const image =
            chooseArtwork();


        const painting =
            createPainting(
                image
            );


        painting.style.top =
            (
                58 +
                Math.random() * 23
            ) + "vh";


        painting.style.left =
            (
                112 +
                Math.random() * 8
            ) + "vw";


        painting.style.zIndex =
            25 + i;


        void painting.offsetWidth;


        group.push({

            painting:
                painting,

            image:
                image

        });

    }


    group.forEach(
        function(
            item,
            index
        ) {

            revealAndCarry(
                item.painting,
                item.image,
                300 +
                index * 330,
                generation
            );

        }
    );


    setTimeout(
        function() {

            if (
                generation ===
                riverGeneration
            ) {

                sendTurtle();

            }

        },
        2500
    );

}

const initialDevicePixelRatio =
    window.devicePixelRatio || 1;

function updateFixedUiScale() {

    const currentDpr =
        window.devicePixelRatio || 1;

    const scale =
        Math.max(0.5, Math.min(2,
            initialDevicePixelRatio / currentDpr
        ));

    document.documentElement.style.setProperty(
        "--ui-scale",
        scale
    );

}

updateFixedUiScale();
window.addEventListener("resize", updateFixedUiScale);


/* ============================================================
   LARRY BUTTON
   ============================================================ */

const larryButton =
    document.getElementById(
        "larryButton"
    );

larryButton.addEventListener(
    "click",
    function(e) {

        e.preventDefault();
        e.stopPropagation();

        window.location.assign(

        );

    }
);

larryButton.addEventListener(
    "pointerdown",
    function(e) {
        e.stopPropagation();
    }
);


/* ============================================================
   START / SESSION RESTORE
   ============================================================ */

clearSessionSkyPaintings();

window.addEventListener(
    "pageshow",
    function() {
        clearSessionSkyPaintings();

        /*
           bfcache restoration can retain the old DOM. Clear it again
           immediately after the page is restored.
        */
        setTimeout(
            clearSessionSkyPaintings,
            0
        );
    }
);

/*
   Start a fresh Niagara visit. No saved paintings or angel copies
   are rebuilt. Only new paintings generated by the river can be
   rescued into the upper sky during this visit.
*/
clearSessionSkyPaintings();

setTimeout(
    function() {
        clearSessionSkyPaintings();
        startPaintingSequence(
            riverGeneration
        );
    },
    1800
);

scheduleSeagulls();

</script>
