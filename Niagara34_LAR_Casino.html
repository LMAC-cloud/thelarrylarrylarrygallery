<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Niagara Falls — Larry's Art</title>

<style>

/* ============================================================
   BASIC PAGE
   ============================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Georgia, serif;
}


/* ============================================================
   NIAGARA VIDEO
   ============================================================ */

#waterfall {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    pointer-events: none;

    /*
       FORCE SILENCE.
    */
    volume: 0;
}


/* ============================================================
   PAINTINGS
   ============================================================ */

.paintingWrap {
    position: fixed;

    z-index: 20;

    cursor: pointer;

    perspective: 900px;

    transform-style: preserve-3d;

    will-change:
        left,
        top,
        transform,
        opacity;

    opacity: 0;
}

.paintingFrame {
    position: relative;

    padding: 9px;

    background:
        linear-gradient(
            135deg,
            #fff8df 0%,
            #d8c58e 18%,
            #fff3c7 35%,
            #b99a4d 55%,
            #f8e9b5 75%,
            #9d7935 100%
        );

    border: 4px solid #8c6b2f;

    box-shadow:
        0 8px 18px rgba(0,0,0,.8),
        inset 0 0 5px rgba(255,255,255,.9),
        inset 0 0 0 3px rgba(91,60,15,.7);

    transform-style: preserve-3d;
}

.paintingFrame::before {
    content: "";

    position: absolute;

    inset: -5px;

    border: 2px solid rgba(255,245,190,.85);

    pointer-events: none;
}

.paintingFrame::after {
    content: "";

    position: absolute;

    inset: 3px;

    border: 2px solid rgba(102,70,20,.7);

    pointer-events: none;
}

.paintingCanvas {
    display: block;

    width: 18vw;

    max-width: 320px;

    height: auto;

    background: white;

    border: 7px solid #f8f8f4;

    box-shadow:
        inset 0 0 5px rgba(0,0,0,.3);

    transform: translateZ(4px);

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;
}


/* physical canvas thickness */

.paintingWrap::before {
    content: "";

    position: absolute;

    left: 5px;
    bottom: -13px;

    width: calc(100% - 10px);
    height: 13px;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #d7d7d2,
            #999
        );

    transform: skewX(-35deg);

    transform-origin: top left;

    z-index: -2;
}

.paintingWrap::after {
    content: "";

    position: absolute;

    right: -13px;
    top: 7px;

    width: 13px;
    height: calc(100% - 14px);

    background:
        linear-gradient(
            to right,
            #f8f8f4,
            #d1d1cc,
            #969691
        );

    transform: skewY(-35deg);

    transform-origin: top left;

    z-index: -2;
}



/* ============================================================
   IMMORTALIZED / SELECTED PAINTINGS
   ============================================================ */

.immortalized {
    z-index: 80;
    cursor: grab;
    opacity: 1 !important;
    user-select: none;
    touch-action: none;
}

.immortalized:active {
    cursor: grabbing;
}

/* Large, museum-style sky paintings. */
.immortalized .paintingCanvas {
    width: 4vw;
    min-width: 45px;
    max-width: 80px;
    border: 3px solid #f8f8f4;
}

.immortalized .paintingFrame {
    padding: 4px;
    border: 4px solid #6f4a18;
    border-radius: 5px;
    background:
        linear-gradient(135deg,
            #6b4312 0%,
            #c99732 12%,
            #f1d47b 22%,
            #8a5b17 34%,
            #d9ad4d 48%,
            #704710 62%,
            #e1b95a 76%,
            #7a4d13 90%,
            #4e300d 100%);
    box-shadow: none !important;
}

/* Ornate Louvre-style moulding. */
.immortalized .paintingFrame::before {
    inset: -4px;
    border: 2px double #e8c567;
    border-radius: 7px;
    box-shadow:
        0 0 0 3px #5a370e,
        0 0 0 6px #c28b27;
}

.immortalized .paintingFrame::after {
    inset: -1px;
    border: 1px solid rgba(255,230,145,.85);
    box-shadow: inset 0 0 0 2px rgba(65,38,8,.75);
}

.immortalized::before,
.immortalized::after {
    opacity: .85;
}

.immortalized .halo {
    width: 38px;
    height: 13px;
    top: -18px;
    border-width: 2px;
    box-shadow: 0 0 22px gold, 0 0 42px rgba(255,210,40,.65);
}


/* ============================================================
   ANGEL / DESKTOP ICON STRIP
   ============================================================ */

#angels {
    position: fixed;

    z-index: 70;

    left: 0;
    top: 0;

    width: 100%;
    height: 20%;

    pointer-events: none;
}

.angel {
    position: absolute;

    width: 3.2vw;

    min-width: 24px;

    max-width: 48px;

    cursor: grab;

    pointer-events: auto;

    user-select: none;

    touch-action: none;
}

.angel:active {
    cursor: grabbing;
}

.angelFrame {
    position: relative;

    padding: 2px;

    background:
        linear-gradient(
            135deg,
            #fff8df,
            #c4a35b,
            #fff1b8,
            #9a702c,
            #ead28c
        );

    border: 2px solid #8c6b2f;

    box-shadow:
        0 3px 8px rgba(0,0,0,.85);
}

.angelFrame img {
    display: block;

    width: 100%;

    background: white;

    border: 2px solid white;

    filter: none !important;

    opacity: 1 !important;

    pointer-events: none;
}

.halo {
    position: absolute;

    width: 16px;
    height: 6px;

    left: 50%;
    top: -11px;

    transform: translateX(-50%);

    border: 2px solid gold;

    border-radius: 50%;

    box-shadow:
        0 0 7px gold;

    z-index: 5;
}


/* ============================================================
   ROPE
   ============================================================ */

.rescueRope {
    position: fixed;

    z-index: 500;

    width: 8px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;

    transform-origin: bottom center;
}

.ropeKnot {
    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    bottom: -8px;

    transform: translateX(-50%);

    border: 4px solid #a78a5b;

    border-radius: 50%;
}

.ropeBreaking {
    animation:
        ropeSnap .5s ease-out forwards;
}

@keyframes ropeSnap {

    0% {
        transform: rotate(0deg);
        opacity: 1;
    }

    35% {
        transform:
            rotate(9deg)
            scaleY(1.05);

        opacity: 1;
    }

    60% {
        transform:
            rotate(-20deg)
            scaleY(.7);

        opacity: 1;
    }

    100% {
        transform:
            rotate(28deg)
            translateY(40px)
            scaleY(.2);

        opacity: 0;
    }
}

.ropePiece {
    position: fixed;

    z-index: 499;

    width: 7px;
    height: 70px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;
}

.ropePiece.left {
    transform-origin: top center;

    animation:
        ropeLeftFall 1s ease-out forwards;
}

.ropePiece.right {
    transform-origin: top center;

    animation:
        ropeRightFall 1s ease-out forwards;
}

@keyframes ropeLeftFall {

    to {
        transform:
            translate(-45px,80px)
            rotate(-35deg);

        opacity: 0;
    }
}

@keyframes ropeRightFall {

    to {
        transform:
            translate(45px,80px)
            rotate(35deg);

        opacity: 0;
    }
}


/* ============================================================
   FISH
   ============================================================ */

.fish {
    position: fixed;

    z-index: 12;

    width: 62px;
    height: 32px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;

    filter:
        brightness(.5)
        contrast(1.35)
        drop-shadow(
            0 3px 3px rgba(0,0,0,.75)
        );
}

.fishBody {
    position: absolute;

    width: 42px;
    height: 23px;

    left: 10px;
    top: 4px;

    background: #292929;

    border-radius:
        55% 45% 45% 55%;
}

.fishTail {
    position: absolute;

    left: 0;
    top: 2px;

    width: 0;
    height: 0;

    border-top:
        14px solid transparent;

    border-bottom:
        14px solid transparent;

    border-right:
        19px solid #181818;
}

.fishEye {
    position: absolute;

    right: 12px;
    top: 9px;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;
}


/* GOLD FISH */

.goldFish {
    filter:
        drop-shadow(
            0 0 9px rgba(255,210,30,.9)
        )
        drop-shadow(
            0 4px 4px rgba(0,0,0,.7)
        );

    z-index: 14;
}

.goldFish .fishBody {
    background:
        linear-gradient(
            135deg,
            #fff3a0,
            #ffd21f,
            #d89400,
            #ffed62
        );
}

.goldFish .fishTail {
    border-right-color:
        #d89400;
}

.goldFish .fishEye {
    background: black;
}


/* ============================================================
   SHARK
   ============================================================ */

.shark {
    position: fixed;

    width: 125px;
    height: 55px;

    z-index: 11;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.8)
        );
}

.sharkBody {
    position: absolute;

    left: 20px;
    top: 14px;

    width: 82px;
    height: 35px;

    background:
        linear-gradient(
            to bottom,
            #686868,
            #292929
        );

    border-radius:
        70% 55% 55% 65%;
}

.sharkTail {
    position: absolute;

    left: 0;
    top: 10px;

    width: 0;
    height: 0;

    border-top: 18px solid transparent;

    border-bottom: 18px solid transparent;

    border-right: 28px solid #353535;
}

.sharkFin {
    position: absolute;

    left: 55px;
    top: 0;

    width: 0;
    height: 0;

    border-left: 10px solid transparent;

    border-right: 10px solid transparent;

    border-bottom: 22px solid #303030;
}

.sharkEye {
    position: absolute;

    right: 30px;
    top: 24px;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;
}


@keyframes larBob {
    0%, 100% {
        margin-top: 0;
    }
    50% {
        margin-top: -12px;
    }
}


/* ============================================================
   BROWN OCTOPUS — click to lose all Lar Bucks
   ============================================================ */

.octopus {
    position: fixed;
    z-index: 17;
    width: 82px;
    height: 68px;
    pointer-events: auto;
    cursor: pointer;
    opacity: 0;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.75));
}

.octopusBody {
    position: absolute;
    left: 16px;
    top: 4px;
    width: 50px;
    height: 42px;
    border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 35% 25%, #9a6940, #5b321d 65%, #3d2113);
    border: 3px solid #321a0e;
}

.octopusEye {
    position: absolute;
    width: 7px;
    height: 7px;
    top: 17px;
    background: #fff4d0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px #201109;
}

.octopusEye.left { left: 30px; }
.octopusEye.right { right: 30px; }

.octopusTentacle {
    position: absolute;
    bottom: 4px;
    width: 15px;
    height: 30px;
    border-radius: 0 0 12px 12px;
    background: linear-gradient(90deg, #3d2113, #754424, #3d2113);
    transform-origin: top center;
}

.octopusTentacle.t1 { left: 4px; transform: rotate(30deg); }
.octopusTentacle.t2 { left: 14px; transform: rotate(15deg); }
.octopusTentacle.t3 { left: 24px; transform: rotate(5deg); }
.octopusTentacle.t4 { left: 34px; transform: rotate(-5deg); }
.octopusTentacle.t5 { left: 44px; transform: rotate(-15deg); }
.octopusTentacle.t6 { left: 54px; transform: rotate(-30deg); }
.octopusTentacle.t7 { left: 62px; transform: rotate(-42deg); }


/* ============================================================
   BROWN PAPER BAG
   ============================================================ */

.paperBag {
    position: fixed;

    width: 48px;
    height: 58px;

    z-index: 10;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            #6d401f,
            #9a6031,
            #71411f
        );

    border:
        2px solid #4c2b16;

    box-shadow:
        0 4px 8px rgba(0,0,0,.7);

    transform-origin: center;
}

.paperBag::before {
    content: "";

    position: absolute;

    left: 8px;
    right: 8px;
    top: -9px;

    height: 15px;

    border:
        3px solid #70451f;

    border-bottom: none;

    border-radius:
        50% 50% 0 0;
}

.paperBag::after {
    content: "LAR";

    position: absolute;

    left: 0;
    right: 0;
    top: 19px;

    text-align: center;

    color:
        rgba(255,235,190,.75);

    font-weight: bold;

    font-size: 11px;
}


/* ============================================================
   BROWN LAR BUCK TOKEN
   ============================================================ */

.brownBuck {
    position: fixed;

    z-index: 16;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #c49a62,
            #79502d 70%,
            #4a2d17
        );

    border:
        3px solid #d4ae79;

    color:
        #f5dfb8;

    font-weight: bold;

    font-size: 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    box-shadow:
        0 4px 8px rgba(0,0,0,.8);

    text-shadow:
        0 1px 2px #000;
}


/* ============================================================
   LAR BUCK POPUP
   ============================================================ */

.larBuckPopup {
    position: fixed;

    z-index: 3000;

    color: #ffd83d;

    font-family: Georgia, serif;

    font-weight: bold;

    font-size: 20px;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;

    animation:
        buckRise 1.6s ease-out forwards;
}

@keyframes buckRise {

    0% {
        transform:
            translate(-50%,0)
            scale(.6);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%,-80px)
            scale(1.2);

        opacity: 0;
    }
}


/* ============================================================
   PIKE FINS
   ============================================================ */

.pikeFin {
    position: fixed;

    z-index: 6;

    width: 0;
    height: 0;

    border-left:
        16px solid transparent;

    border-right:
        16px solid transparent;

    border-bottom:
        75px solid rgba(25,25,25,.82);

    opacity: 0;

    pointer-events: none;
}

.pikeFin.rising {
    animation:
        pikeRise 1.8s ease-out forwards;
}

@keyframes pikeRise {

    0% {
        opacity: 0;

        transform:
            translateY(35px)
            scale(.5);
    }

    25% {
        opacity: .9;
    }

    65% {
        opacity: .9;

        transform:
            translateY(0)
            rotate(5deg)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(35px)
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   TURTLE
   ============================================================ */

#turtle {
    position: fixed;

    z-index: 13;

    width: 180px;
    height: 90px;

    left: 110vw;
    top: 79vh;

    display: none;

    pointer-events: none;

    filter:
        brightness(.3)
        contrast(1.55)
        drop-shadow(
            0 6px 6px rgba(0,0,0,.9)
        );
}

.turtleShell {
    position: absolute;

    width: 120px;
    height: 60px;

    left: 20px;
    top: 8px;

    background:
        radial-gradient(
            ellipse,
            #333 0%,
            #171717 70%,
            #080808 100%
        );

    border-radius:
        55% 50% 45% 50%;

    border: 4px solid #111;
}

.turtleHead {
    position: absolute;

    width: 42px;
    height: 36px;

    right: 0;
    top: 21px;

    background: #141414;

    border-radius:
        60% 50% 50% 60%;
}

.turtleEye {
    position: absolute;

    right: 8px;
    top: 9px;

    width: 5px;
    height: 5px;

    background: #ddd;

    border-radius: 50%;
}

.turtleLeg {
    position: absolute;

    width: 43px;
    height: 18px;

    background: #121212;

    border-radius: 60%;
}

.turtleLeg.one {
    left: 24px;
    bottom: 2px;

    transform: rotate(25deg);
}

.turtleLeg.two {
    left: 93px;
    bottom: 2px;

    transform: rotate(-25deg);
}

#turtle.walking {
    display: block;

    animation:
        turtleCurrent 15s linear forwards,
        turtleBob .9s ease-in-out infinite;
}

@keyframes turtleCurrent {

    0% {
        left: 110vw;
        top: 78vh;
        transform: scale(1);
    }

    62% {
        left: 35vw;
        top: 82vh;
        transform: scale(.9);
    }

    84% {
        left: 10vw;
        top: 88vh;
        transform: scale(.58);
    }

    100% {
        left: -18vw;
        top: 98vh;
        transform: scale(.12);
    }
}

@keyframes turtleBob {

    0% {
        margin-top: -3px;
    }

    50% {
        margin-top: 8px;
    }

    100% {
        margin-top: -3px;
    }
}


/* ============================================================
   SEAGULLS
   ============================================================ */

.seagull {
    position: fixed;

    z-index: 15;

    left: 110vw;
    top: 45vh;

    width: 100px;
    height: 50px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;
}

.seagullWing {
    position: absolute;

    width: 55px;
    height: 18px;

    border-top:
        6px solid rgba(250,250,250,.9);

    border-radius:
        70% 70% 0 0;
}

.seagullWing.left {
    left: 0;
    top: 16px;

    transform: rotate(18deg);
}

.seagullWing.right {
    right: 0;
    top: 16px;

    transform: rotate(-18deg);
}

.seagull.swooping {
    opacity: 1;

    animation:
        gullSwoop 5s ease-in-out forwards;
}

@keyframes gullSwoop {

    0% {
        left: 110vw;
        top: 45vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }

    25% {
        left: 76vw;
        top: 60vh;

        transform:
            rotate(18deg)
            scale(.9);
    }

    50% {
        left: 54vw;
        top: 70vh;

        transform:
            rotate(30deg)
            scale(1.05);
    }

    70% {
        left: 32vw;
        top: 61vh;

        transform:
            rotate(-20deg)
            scale(1);
    }

    100% {
        left: -15vw;
        top: 80vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   INSPECTION WINDOW
   ============================================================ */

#inspection {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    overflow: hidden;

    background: #111;
}

#inspection.open {
    display: flex;
}


/* hypnotic rotating background */

#inspection::before {
    content: "";

    position: absolute;

    inset: -50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            #050505 0deg 9deg,
            #f0f0e5 9deg 18deg
        );

    animation:
        hypnosisSpin 18s linear infinite;

    opacity: .20;

    pointer-events: none;
}

@keyframes hypnosisSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* dark veil */

#inspection::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.25),
            rgba(0,0,0,.82)
        );

    pointer-events: none;
}


/* framed inspection artwork */

#inspectionFrame {
    position: relative;

    z-index: 1002;

    padding: 14px;

    background:
        linear-gradient(
            135deg,
            #fff8df,
            #c4a35b,
            #fff1b8,
            #9a702c,
            #ead28c
        );

    border: 5px solid #8c6b2f;

    box-shadow:
        0 15px 50px rgba(0,0,0,.9);

    max-width: 78vw;
    max-height: 76vh;

    cursor: grab;

    touch-action: none;

    user-select: none;
}

#inspectionFrame.dragging {
    cursor: grabbing;
}

#inspectionPainting {
    position: relative;

    z-index: 1003;

    max-width: 72vw;
    max-height: 66vh;

    width: auto;
    height: auto;

    display: block;

    object-fit: contain;

    background: white;

    border:
        9px solid white;

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;

    pointer-events: none;

    transform-origin: center center;
}


/* title */

#paintingTitle {
    position: absolute;

    left: 50%;

    bottom: -48px;

    transform: translateX(-50%);

    z-index: 1015;

    color: white;

    background:
        rgba(0,0,0,.85);

    border:
        1px solid rgba(255,255,255,.4);

    padding: 8px 14px;

    white-space: nowrap;

    font-size: 16px;

    display: none;
}


/* ============================================================
   INSPECTION CONTROLS
   ============================================================ */

#inspectionTools {
    position: relative;

    z-index: 1010;

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 18px;
}

/* ============================================================
   TITLE
   ============================================================ */

function getPaintingTitle(
    image
) {

    /*
       If images.js contains an optional
       imageTitles object, use it.
    */

    try {

        if (
            typeof imageTitles !==
            "undefined" &&
            imageTitles[image]
        ) {

            return imageTitles[image];

        }

    } catch (e) {}


    /*
       Otherwise use the filename as the
       painting title.
    */

    let name =
        image
            .split("/")
            .pop();


    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        decodeURIComponent(
            name
        );


    name =
        name.replace(
            /[_-]+/g,
            " "
        );


    name =
        name.replace(
            /\s+/g,
            " "
        );


    return name.trim();

}

/* ============================================================
   DRAGGABLE INSPECTION FRAME
   ============================================================ */

const inspectionFrame =
    document.getElementById(
        "inspectionFrame"
    );


inspectionFrame.addEventListener(
    "pointerdown",
    function(e) {

        if (
            e.button !== 0
        ) {

            return;

        }


        inspectionDragging =
            true;


        inspectionDragX =
            e.clientX -
            inspectionOffsetX;

        inspectionDragY =
            e.clientY -
            inspectionOffsetY;


        inspectionFrame.classList.add(
            "dragging"
        );


        inspectionFrame.setPointerCapture(
            e.pointerId
        );


        e.preventDefault();

    }
);


inspectionFrame.addEventListener(
    "pointermove",
    function(e) {

        if (
            !inspectionDragging
        ) {

            return;

        }


        inspectionOffsetX =
            e.clientX -
            inspectionDragX;

        inspectionOffsetY =
            e.clientY -
            inspectionDragY;


        inspectionFrame.style.transform =
            "translate(" +
            inspectionOffsetX +
            "px," +
            inspectionOffsetY +
            "px)";

    }
);


function endInspectionDrag(
    e
) {

    if (
        !inspectionDragging
    ) {

        return;

    }


    inspectionDragging =
        false;


    inspectionFrame.classList.remove(
        "dragging"
    );


    try {

        inspectionFrame.releasePointerCapture(
            e.pointerId
        );

    } catch (error) {}

}


inspectionFrame.addEventListener(
    "pointerup",
    endInspectionDrag
);


inspectionFrame.addEventListener(
    "pointercancel",
    endInspectionDrag
);


/* ============================================================
   MAKE IMMORTALIZED PAINTING
   ============================================================ */

function immortalizePainting(
    painting,
    image,
    originX = null,
    originY = null,
    originScale = null
) {

    savePainting(image);

    painting.dataset.approved = "false";
    painting.dataset.revealed = "false";
    painting.dataset.rescued = "true";
    painting.dataset.rescuing = "false";
    painting.classList.add("immortalized");
    painting.style.pointerEvents = "auto";

    /* The painting begins exactly where the rope caught it. */
    const rect = painting.getBoundingClientRect();
    const startX = originX !== null ? originX : rect.left + rect.width / 2;
    const startY = originY !== null ? originY : rect.top + rect.height / 2;

    let launchScale = originScale;
    if (launchScale === null) {
        try {
            const matrix = new DOMMatrix(getComputedStyle(painting).transform);
            launchScale = Math.sqrt(matrix.a * matrix.a + matrix.b * matrix.b) || 1;
        } catch (err) {
            launchScale = 1;
        }
    }

    /* Final sky position: top strip, safely inside the screen.
       The path is a slight diagonal from the rope catch point. */
    const finalWidth = Math.min(67, Math.max(42, window.innerWidth * 0.0315));
    const finalHeight = finalWidth * 1.25;
    const halfW = finalWidth / 2 + 10;
    const halfH = finalHeight / 2 + 10;

    const targetX = Math.max(
        halfW,
        Math.min(
            window.innerWidth - halfW,
            startX + (Math.random() * 180 - 90)
        )
    );

    const topStripMin = halfH + 8;
    const topStripMax = Math.max(
        topStripMin,
        Math.min(window.innerHeight * 0.20, window.innerHeight - halfH - 8)
    );

    const targetY = topStripMin +
        Math.random() * Math.max(1, topStripMax - topStripMin);

    painting.style.transition = "none";
    painting.style.left = startX + "px";
    painting.style.top = startY + "px";
    painting.style.transform = "translate(-50%,-50%) scale(" + launchScale + ")";
    painting.style.opacity = "1";

    if (!painting.querySelector(".halo")) {
        const halo = document.createElement("div");
        halo.className = "halo";
        painting.querySelector(".paintingFrame").appendChild(halo);
    }

    /* Let the exact rope/click position render before the upward drift. */
    requestAnimationFrame(function() {
        if (!document.body.contains(painting)) return;

        painting.style.transition =
            "left 3s cubic-bezier(.2,.72,.25,1), " +
            "top 3s cubic-bezier(.2,.72,.25,1), " +
            "transform 3s cubic-bezier(.2,.72,.25,1)";

        painting.style.left = targetX + "px";
        painting.style.top = targetY + "px";
        painting.style.transform = "translate(-50%,-50%) scale(.58)";
    });

    /* V33: sky paintings are true draggable objects.
       Their released position becomes the new centre of their wind path. */
    if (!painting.dataset.skyDragReady) {
        painting.dataset.skyDragReady = "true";
        painting.dataset.skyDragging = "false";
        painting.dataset.skySuppressClick = "false";

        let dragStartX = 0;
        let dragStartY = 0;
        let dragCenterX = 0;
        let dragCenterY = 0;
        let dragScale = 0.58;
        let dragMoved = false;

        painting.addEventListener("pointerdown", function(e) {
            if (painting.dataset.rescued !== "true" || e.button !== 0) return;

            const r = painting.getBoundingClientRect();
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragCenterX = r.left + r.width / 2;
            dragCenterY = r.top + r.height / 2;
            dragMoved = false;

            try {
                const matrix = new DOMMatrix(getComputedStyle(painting).transform);
                dragScale = Math.sqrt(matrix.a * matrix.a + matrix.b * matrix.b) || 0.58;
            } catch (err) {
                dragScale = 0.58;
            }

            painting.dataset.skyDragging = "true";
            painting.dataset.windPaused = "true";
            painting.dataset.skySuppressClick = "false";
            painting.style.transition = "none";

            try { painting.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
            e.stopPropagation();
        });

        painting.addEventListener("pointermove", function(e) {
            if (painting.dataset.skyDragging !== "true") return;

            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                dragMoved = true;
            }

            const halfW = painting.getBoundingClientRect().width / 2;
            const halfH = painting.getBoundingClientRect().height / 2;

            const maxX = Math.max(halfW, window.innerWidth - halfW);
            const maxY = Math.max(
                halfH,
                window.innerHeight * 0.60 - halfH
            );

            const newCenterX = Math.max(
                halfW,
                Math.min(maxX, dragCenterX + dx)
            );

            const newCenterY = Math.max(
                halfH,
                Math.min(maxY, dragCenterY + dy)
            );

            /* Keep the painting centred on its actual dragged position. */
            painting.style.left = newCenterX + "px";
            painting.style.top = newCenterY + "px";
            painting.style.transform =
                "translate(-50%,-50%) scale(" + dragScale + ")";

            e.stopPropagation();
        });

        function finishSkyDrag(e) {
            if (painting.dataset.skyDragging !== "true") return;

            painting.dataset.skyDragging = "false";

            /*
               Critical V33 fix:
               the position at mouse release becomes the centre of the
               painting's future wind motion. It therefore does NOT snap
               back to the old position.
            */
            /* Freeze the wind base at the exact released position. */
            if (typeof painting._resetSkyWindBase === "function") {
                painting._resetSkyWindBase();
            }
            painting.dataset.windPaused = "false";

            if (dragMoved) {
                /* Prevent the synthetic click generated by a drag from
                   opening the inspection popup. */
                painting.dataset.skySuppressClick = "true";
            }

            try { painting.releasePointerCapture(e.pointerId); } catch (err) {}

            /* The painting's existing click handler consumes this flag
               for the synthetic click produced by a drag. */
        }

        painting.addEventListener("pointerup", finishSkyDrag);
        painting.addEventListener("pointercancel", finishSkyDrag);
    }
}

        ) + "vw";


    angel.style.top =
        (
            4 +
            Math.random() * 12
        ) + "vh";


    const frame =
        document.createElement(
            "div"
        );

    frame.className =
        "angelFrame";


    const img =
        document.createElement(
            "img"
        );

    img.src =
        image;


    const halo =
        document.createElement(
            "div"
        );

    halo.className =
        "halo";


    frame.appendChild(
        img
    );

    frame.appendChild(
        halo
    );

    angel.appendChild(
        frame
    );

    angels.appendChild(
        angel
    );


    /*
       Desktop-icon-style dragging.
    */

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    angel.addEventListener(
        "pointerdown",
        function(e) {

            if (
                e.button !== 0
            ) {

                return;

            }


            dragging = true;


            const rect =
                angel.getBoundingClientRect();


            offsetX =
                e.clientX -
                rect.left;

            offsetY =
                e.clientY -
                rect.top;


            angel.setPointerCapture(
                e.pointerId
            );


            e.preventDefault();

        }
    );


    angel.addEventListener(
        "pointermove",
        function(e) {

            if (
                !dragging
            ) {

                return;

            }


            let x =
                e.clientX -
                offsetX;

            let y =
                e.clientY -
                offsetY;


            /*
               Keep the icon inside the
               upper 1/5 strip.
            */

            const maxX =
                window.innerWidth -
                angel.offsetWidth;


            const maxY =
                window.innerHeight *
                .20 -
                angel.offsetHeight;


            x =
                Math.max(
                    0,
                    Math.min(
                        maxX,
                        x
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        maxY,
                        y
                    )
                );


            angel.style.left =
                x + "px";

            angel.style.top =
                y + "px";

        }
    );


    angel.addEventListener(
        "pointerup",
        function(e) {

            dragging = false;

            try {

                angel.releasePointerCapture(
                    e.pointerId
                );

            } catch (error) {}

        }
    );


    angel.addEventListener(
        "pointercancel",
        function(e) {

            dragging = false;

        }
    );


    let angelDownX = 0;
    let angelDownY = 0;

    angel.addEventListener(
        "pointerdown",
        function(e) {
            if (e.button === 0) {
                angelDownX = e.clientX;
                angelDownY = e.clientY;
            }
        }
    );

    angel.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            const moved =
                Math.hypot(
                    e.clientX - angelDownX,
                    e.clientY - angelDownY
                );

            if (moved < 8) {
                addLarBuck(
                    e.clientX,
                    e.clientY,
                    1
                );

                inspectPainting(
                    image
                );
            }
        }
    );

    angel.addEventListener(
        "dblclick",
        function(e) {

            e.stopPropagation();

            addLarBuck(
                e.clientX,
                e.clientY,
                1
            );

            inspectPainting(
                image
            );

        }
    );

}


/* ============================================================
   CLEAR SESSION-ONLY SKY PAINTINGS
   ============================================================ */

function clearSessionSkyPaintings() {

    /*
       Floating paintingWrap elements are SESSION-ONLY.
       Saved artwork is represented by the angel desktop icons.

       Clear every paintingWrap on startup so a cached/reopened
       Niagara page cannot resurrect old paintings in the sky.
       New paintingWrap elements are created only by the river
       sequence after startup cleanup.
    */

    document
        .querySelectorAll(
            ".paintingWrap"
        )
        .forEach(
            function(painting) {
                painting.remove();
            }
        );

    activePaintings = [];

}


/* ============================================================
   ROPE RESCUE
   ============================================================ */

function ropeRescue(
    painting,
    image,
    clickX = null,
    clickY = null
) {
    if (painting.dataset.rescued === "true") {
        inspectPainting(image, painting);
        return;
    }

    /*
       V31: FREEZE FIRST.
       The painting keeps its exact on-screen position and scale.
       The rope is attached separately to the exact mouse click.
    */
    const rect = painting.getBoundingClientRect();

    const frozenCenterX = rect.left + rect.width / 2;
    const frozenCenterY = rect.top + rect.height / 2;

    let frozenScale = 1;
    try {
        const matrix = new DOMMatrix(getComputedStyle(painting).transform);
        frozenScale = Math.sqrt(matrix.a * matrix.a + matrix.b * matrix.b) || 1;
    } catch (err) {}

    const catchX =
        clickX !== null ? clickX : frozenCenterX;
    const catchY =
        clickY !== null ? clickY : frozenCenterY;

    painting.style.animation = "none";
    painting.style.transition = "none";
    painting.style.left = frozenCenterX + "px";
    painting.style.top = frozenCenterY + "px";
    painting.style.transform =
        "translate(-50%,-50%) scale(" + frozenScale + ")";
    painting.style.opacity = "1";

    painting.dataset.rescuing = "true";
    painting.dataset.ropeCatchX = String(catchX);
    painting.dataset.ropeCatchY = String(catchY);
    painting.dataset.frozenCenterX = String(frozenCenterX);
    painting.dataset.frozenCenterY = String(frozenCenterY);

    /* Rope is anchored ONLY to the actual mouse click. */
    const rope = document.createElement("div");
    rope.className = "rescueRope";

    const startY = window.innerHeight + 30;
    rope.style.left = (catchX - 4) + "px";
    rope.style.top = catchY + "px";
    rope.style.height = Math.max(0, startY - catchY) + "px";

    const knot = document.createElement("div");
    knot.className = "ropeKnot";
    rope.appendChild(knot);
    document.body.appendChild(rope);

    setTimeout(function() {
        rope.style.transform = "rotate(-6deg)";
    }, 700);

    setTimeout(function() {
        rope.style.transform = "rotate(7deg)";
    }, 900);

    /*
       The painting remains frozen throughout the entire rope sequence.
       Only after the rope has broken do we begin the ascent, starting
       from the painting's actual frozen centre — NOT the click point.
    */
    setTimeout(function() {
        rope.classList.add("ropeBreaking");
        createBrokenRopes(catchX, catchY);

        setTimeout(function() {
            if (!document.body.contains(painting)) return;

            immortalizePainting(
                painting,
                image,
                frozenCenterX,
                frozenCenterY,
                frozenScale
            );
        }, 700);
    }, 1150);

    setTimeout(function() {
        rope.remove();
    }, 2600);
}

function createBrokenRopes(
    x,
    y
) {

    const left =
        document.createElement(
            "div"
        );

    left.className =
        "ropePiece left";

    left.style.left =

    left.style.top =

    right.className =

    right.style.left =

    right.style.top =

    );

    document.body.appendChild(

    );


    setTimeout(
        function() {

            left.remove();

            right.remove();

        },
        1100
    );

}


/* ============================================================
   CREATE PAINTING
   ============================================================ */

function createPainting(
    image
) {

    const wrap =
        document.createElement(
            "div"
        );


    wrap.className =
        "paintingWrap";
    const frame =
        document.createElement(
            "div"
        );

    frame.className =
        "paintingFrame";


    const canvas =
        document.createElement(
            "img"
        );

    canvas.className =
        "paintingCanvas";

    canvas.src =
        image;

    canvas.draggable =
        false;


    frame.appendChild(
        canvas
    );

    wrap.appendChild(
        frame
    );


    wrap.dataset.image =
        image;

    wrap.dataset.revealed = "false";

    wrap.dataset.rescued =
        "false";

    wrap.dataset.rescuing =
        "false";


    /*
       Immortalized paintings are independent sky objects.
       Their click must never fall through to the river
       generation/rescue system.
    */
    wrap.addEventListener(
        "pointerdown",
        function(e) {
            if (
                wrap.dataset.rescued ===
                "true"
            ) {
                e.stopPropagation();
            }
        }
    );

    wrap.addEventListener(
        "click",
        function(e) {

            e.preventDefault();
            e.stopPropagation();

            if (wrap.dataset.skySuppressClick === "true") {
                wrap.dataset.skySuppressClick = "false";
                return;
            }

            const rect =
                wrap.getBoundingClientRect();

            addLarBuck(
                rect.left +
                rect.width / 2,
                rect.top,
                1
            );

            if (
                wrap.dataset.rescued ===
                "true"
            ) {

                inspectPainting(
                    image,
                    wrap
                );

                return;

            }

            ropeRescue(
                wrap,
                image,
                e.clientX,
                e.clientY
            );

        }
    );


    document.body.appendChild(
        wrap
    );


    /*
       Start completely outside
       the visible screen.
    */

    wrap.style.left =
        (
            112 +
            Math.random() * 8
        ) + "vw";


    wrap.style.top =
        (
            61 +
            Math.random() * 19
        ) + "vh";


    wrap.style.transform =
        "translate(-50%,-50%) scale(" +
        (
            .10 +
            Math.random() * .12
        ) +
        ")";


    wrap.style.opacity =
        "0";


    void wrap.offsetWidth;


    return wrap;

}


/* ============================================================
   CARRY PAINTING THROUGH RIVER
   ============================================================ */

function revealAndCarry(
    painting,
    image,
    delay = 0,
    generation
) {

    setTimeout(
        function() {

            if (
                generation !==
                riverGeneration
            ) {

                painting.remove();

                return;

            }


            if (
                painting.dataset.rescued ===
                "true" ||
                painting.dataset.rescuing ===
                "true"
            ) {

                return;

            }


            /*
               REVEAL.
            */

            painting.style.opacity =
                ".98";


            void painting.offsetWidth;


            /*
               FIRST CURRENT
            */

            painting.style.transition =
                "left 3.5s linear, " +
                "top 3.5s ease-in-out, " +
                "transform 3.5s ease-out";


            painting.style.left =
                (
                    80 +
                    Math.random() * 7
                ) + "vw";


            painting.style.top =
                (
                    64 +
                    Math.random() * 10
                ) + "vh";


            painting.style.transform =
                "translate(-50%,-50%) scale(" +
                (
                    .34 +
                    Math.random() * .12
                ) +
                ")";


            /*
               MIDDLE CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.3s linear, " +
                        "top 4.3s ease-in-out, " +
                        "transform 4.3s linear";


                    painting.style.left =
                        (
                            53 +
                            Math.random() * 8
                        ) + "vw";


                    painting.style.top =
                        (
                            69 +
                            Math.random() * 9
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.72)";


                },
                3500
            );


            /*
               LOWER CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.1s linear, " +
                        "top 4.1s ease-in-out, " +
                        "transform 4.1s linear";


                    painting.style.left =
                        (
                            29 +
                            Math.random() * 7
                        ) + "vw";


                    painting.style.top =
                        (
                            76 +
                            Math.random() * 8
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.53)";


                },
                7800
            );


            /*
               VERY NEAR LEFT SIDE.

               It travels horizontally to the
               near-left side while remaining SOLID.

               It does NOT become transparent yet.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 3.2s linear, " +
                        "top 3.2s ease-in-out, " +
                        "transform 3.2s linear";


                    painting.style.left =
                        (
                            7 +
                            Math.random() * 2
                        ) + "vw";


                    painting.style.top =
                        (
                            79 +
                            Math.random() * 4
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.25)";


                    /*
                       IMPORTANT:
                       opacity stays at .98 here.
                    */

                    painting.style.opacity =
                        ".98";


                },
                11900
            );

            /*
               LOWER-LEFT EXIT: one continuous diagonal.
               No sudden vertical drop. Fade only as it reaches
               the lower-left edge.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {
                        return;
                    }

                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {
                        return;
                    }

                    painting.style.transition =
                        "left 2.8s ease-in-out, " +
                        "top 2.8s ease-in-out, " +
                        "opacity 2.8s linear, " +
                        "transform 2.8s ease-in-out";

                    painting.style.left = "-10vw";
                    painting.style.top = "104vh";
                    painting.style.opacity = "0";
                    painting.style.transform =
                        "translate(-50%,-50%) scale(.08)";

                },
                15100
            );


            /*
               FINAL EXIT.
            */

            setTimeout(
                function() {

                    if (
                        painting.dataset.rescued ===
                        "true" ||
                        painting.dataset.rescuing ===
                        "true"
                    ) {

                        return;

                    }


                    painting.remove();

                },
                16800
            );


        },
        delay
    );

}


/* ============================================================
   START SINGLE PAINTING
   ============================================================ */

function startPaintingSequence(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    paintingNumber++;


    const image =
        chooseArtwork();


    const painting =
        createPainting(
            image
        );


    activePaintings.push(
        painting
    );


    revealAndCarry(
        painting,
        image,
        100,
        generation
    );


    setTimeout(
        function() {

            startPaintingSequence(
                generation
            );

        },
        4800 +
        Math.random() * 1100
    );


    if (
        paintingNumber >=
        nextGroup
    ) {

        nextGroup =
            paintingNumber +
            7 +
            Math.floor(
                Math.random() * 5
            );


        setTimeout(
            function() {

                sendPaintingGroup(
                    generation
                );

            },
            1200
        );

    }

}


/* ============================================================
   PAINTING GROUP
   ============================================================ */

function sendPaintingGroup(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    const amount =
        8 +
        Math.floor(
            Math.random() * 5
        );


    const group = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const image =
            chooseArtwork();


        const painting =
            createPainting(
                image
            );


        painting.style.top =
            (
                58 +
                Math.random() * 23
            ) + "vh";


        painting.style.left =
            (
                112 +
                Math.random() * 8
            ) + "vw";


        painting.style.zIndex =
            25 + i;


        void painting.offsetWidth;


        group.push({

            painting:
                painting,

            image:
                image

        });

    }


    group.forEach(
        function(
            item,
            index
        ) {

            revealAndCarry(
                item.painting,
                item.image,
                300 +
                index * 330,
                generation
            );

        }
    );


    setTimeout(
        function() {

            if (
                generation ===
                riverGeneration
            ) {

                sendTurtle();

            }

        },
        2500
    );

}

/* ============================================================
   V28 — BLUR CONTROLS + SKY WIND
   ============================================================ */

function findCurrentSkyPainting() {
    if (
        currentSkyPainting &&
        document.body.contains(currentSkyPainting)
    ) {
        return currentSkyPainting;
    }

    if (!currentInspectionImage) {
        return null;
    }

    const paintings = document.querySelectorAll(
        '.paintingWrap.immortalized'
    );

    for (const painting of paintings) {
        if (painting.dataset.image === currentInspectionImage) {
            return painting;
        }
    }

    return null;
}

function setPopupBlur(amount, transitionSeconds) {
    const picture = document.getElementById('inspectionPainting');
    if (!picture) return;

    picture.classList.remove('popup-deblurred');
    picture.classList.remove('popup-slow-clear');
    picture.style.transition =
        'filter ' + transitionSeconds + 's ease-out, -webkit-filter ' +
        transitionSeconds + 's ease-out';
    picture.style.filter = 'blur(' + amount + 'px)';
    picture.style.webkitFilter = 'blur(' + amount + 'px)';
}

function startSkyWind(painting) {
    if (!painting || painting.dataset.windReady === 'true') return;

    painting.dataset.windReady = 'true';
    painting.classList.add('sky-wind-moving');
    painting.dataset.windPaused = 'false';

    let baseLeft = parseFloat(painting.style.left) || 0;
    let baseTop = parseFloat(painting.style.top) || 0;
    const phase = Math.random() * Math.PI * 2;
    const sidePhase = Math.random() * Math.PI * 2;
    const speed = 0.00038 + Math.random() * 0.00020;
    const sideSpeed = 0.00028 + Math.random() * 0.00016;

    painting._resetSkyWindBase = function() {
        const r = painting.getBoundingClientRect();
        baseLeft = r.left + r.width / 2;
        baseTop = r.top + r.height / 2;
    };

    function windFrame(now) {
        if (!document.body.contains(painting)) return;

        if (painting.dataset.windPaused !== 'true' &&
            painting.dataset.skyDragging !== 'true') {
            const vertical = Math.sin(now * speed + phase);
            const horizontal = Math.sin(now * sideSpeed + sidePhase);
            const scaleWave = 0.91 + 0.16 * ((vertical + 1) / 2);

            painting.style.left = (baseLeft + horizontal * 34) + 'px';
            painting.style.top = (baseTop + vertical * 12) + 'px';
            painting.style.transform =
                'translate(-50%,-50%) scale(' +
                (0.58 * scaleWave) + ')';
        }

        requestAnimationFrame(windFrame);
    }

    requestAnimationFrame(windFrame);
}

/* Start wind after each rescued painting reaches the sky. */
const originalImmortalizePainting = immortalizePainting;
immortalizePainting = function(painting, image, originX = null, originY = null) {
    originalImmortalizePainting(painting, image, originX, originY);

    setTimeout(function() {
        if (document.body.contains(painting) &&
            painting.dataset.rescued === 'true') {
            const r = painting.getBoundingClientRect();
            painting.style.left = (r.left + r.width / 2) + 'px';
            painting.style.top = (r.top + r.height / 2) + 'px';
            painting.style.transform = 'translate(-50%,-50%) scale(.58)';
            startSkyWind(painting);
        }
    }, 3050);
};

/* ============================================================
   LAR STAMP CASINO + SLOW MIST REVEAL
   ============================================================ */
const originalInspectPainting = inspectPainting;
inspectPainting = function(image, skyPainting = null) {
    originalInspectPainting(image, skyPainting);

    const picture = document.getElementById('inspectionPainting');
    const deblur = document.getElementById('deblurButton');
    if (!picture || !deblur) return;

    const target = skyPainting || (typeof findCurrentSkyPainting === 'function'
        ? findCurrentSkyPainting()
        : null);
    const alreadyApproved = !!(target && target.dataset.approved === 'true');

    picture.classList.remove('popup-deblurred');
    picture.classList.remove('popup-slow-clear');
    picture.style.transition = 'none';

    if (alreadyApproved) {
        picture.style.setProperty('filter', 'blur(0px)', 'important');
        picture.style.setProperty('-webkit-filter', 'blur(0px)', 'important');
        deblur.textContent = 'REBLUR';
        deblur.disabled = false;
        deblur.classList.add('unlocked');
    } else {
        picture.style.setProperty('filter', 'blur(26px)', 'important');
        picture.style.setProperty('-webkit-filter', 'blur(26px)', 'important');
        void picture.offsetWidth;
        /* Stay hidden until the visitor actually pays; the payment itself
           performs the slower reveal below. */
        picture.style.transition = 'filter 1.8s ease-out, -webkit-filter 1.8s ease-out';
        deblur.textContent = '3 LAR BUCKS TO DE-BLUR';
        deblur.disabled = false;
        deblur.classList.remove('unlocked');
    }
};

/* Pay once to reveal the popup; afterwards the same button becomes REBLUR. */
document.getElementById('deblurButton').addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    const target = currentSkyPainting && document.body.contains(currentSkyPainting)
        ? currentSkyPainting
        : null;

    if (target && target.dataset.approved === 'true') {
        const picture = document.getElementById('inspectionPainting');
        picture.style.transition = 'filter 1.4s ease-in, -webkit-filter 1.4s ease-in';
        picture.style.setProperty('filter', 'blur(26px)', 'important');
        picture.style.setProperty('-webkit-filter', 'blur(26px)', 'important');
        target.dataset.approved = 'false';
        const skyImage = target.querySelector('.paintingCanvas');
        if (skyImage) {
            skyImage.style.transition = 'filter 1.8s ease-in, -webkit-filter 1.8s ease-in';
            skyImage.style.setProperty('filter', 'blur(3.5px)', 'important');
            skyImage.style.setProperty('-webkit-filter', 'blur(3.5px)', 'important');
        }
        this.textContent = '3 LAR BUCKS TO DE-BLUR';
        this.classList.remove('unlocked');
        return;
    }

    if (!currentInspectionImage) return;

    if (larBucks < 3) {
        this.textContent = 'NEED 3 LAR BUCKS';
        setTimeout(() => {
            const b = document.getElementById('deblurButton');
            if (b && !b.disabled) b.textContent = '3 LAR BUCKS TO DE-BLUR';
        }, 1200);
        return;
    }

    larBucks -= 3;
    try { localStorage.setItem('larBucks', larBucks); } catch (error) {}
    updateSavedCounter();

    const picture = document.getElementById('inspectionPainting');
    picture.classList.add('popup-deblurred');
    picture.style.transition = 'filter 1.8s ease-out, -webkit-filter 1.8s ease-out';
    picture.style.setProperty('filter', 'blur(0px)', 'important');
    picture.style.setProperty('-webkit-filter', 'blur(0px)', 'important');
    this.textContent = 'REBLUR';
    this.disabled = false;
    this.classList.add('unlocked');
});

/* ============================================================
   V32 OCCASIONAL SEAGULL / DISTANT BIRD FORMATIONS
   ============================================================ */
(function() {
    function makeGull() {
        const g = document.createElement('div');
        g.className = 'v32-gull';
        return g;
    }

    function upperRightCircle() {
        const flock = document.createElement('div');
        flock.className = 'v32-gull-flock';

        const count = 18 + Math.floor(Math.random() * 10);
        const cx = 50, cy = 50, rx = 43, ry = 38;

        for (let i = 0; i < count; i++) {
            const g = makeGull();
            const a = (i / count) * Math.PI * 2;
            g.style.left = (cx + Math.cos(a) * rx) + '%';
            g.style.top = (cy + Math.sin(a) * ry) + '%';
            flock.appendChild(g);
        }

        document.body.appendChild(flock);
        flock.animate(
            [
                { opacity: 0 },
                { opacity: .95, offset: .12 },
                { opacity: .95, offset: .82 },
                { opacity: 0 }
            ],
            { duration: 12000, easing: 'ease-in-out' }
        );

        let start = null;
        function orbit(t) {
            if (!start) start = t;
            const elapsed = t - start;
            const turns = elapsed / 12000 * Math.PI * 2;

            [...flock.children].forEach((g, i) => {
                const a = turns + (i / count) * Math.PI * 2;
                g.style.left = (cx + Math.cos(a) * rx) + '%';
                g.style.top = (cy + Math.sin(a) * ry) + '%';
            });

            if (elapsed < 12000) requestAnimationFrame(orbit);
            else flock.remove();
        }
        requestAnimationFrame(orbit);
    }

    function infinityFlock() {
        const flock = document.createElement('div');
        flock.className = 'v32-infinity-flock';

        const count = 24 + Math.floor(Math.random() * 14);
        for (let i = 0; i < count; i++) {
            const g = makeGull();
            g.style.transform = 'scale(.45)';
            flock.appendChild(g);
        }

        document.body.appendChild(flock);

        const start = performance.now();
        const duration = 10500;

        function fly(now) {
            const p = Math.min(1, (now - start) / duration);
            const t = p * Math.PI * 4;

            [...flock.children].forEach((g, i) => {
                const phase = i * .23;
                const u = t + phase;
                const x = 50 + 42 * Math.sin(u);
                const y = 50 + 32 * Math.sin(u) * Math.cos(u);
                g.style.left = x + '%';
                g.style.top = y + '%';
            });

            flock.style.opacity =
                p < .12 ? p / .12 :
                p > .82 ? (1 - p) / .18 : 1;

            if (p < 1) requestAnimationFrame(fly);
            else flock.remove();
        }
        requestAnimationFrame(fly);
    }

    function scheduleBirds() {
        if (Math.random() < .42) upperRightCircle();
        if (Math.random() < .25) infinityFlock();

        const next = 9000 + Math.random() * 18000;
        setTimeout(scheduleBirds, next);
    }

    setTimeout(scheduleBirds, 7000);
})();
