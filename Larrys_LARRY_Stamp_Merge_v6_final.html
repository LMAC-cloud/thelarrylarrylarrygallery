<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larry's L.A.R.R.Y. Stamp Collection — v6</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color:#fff;
    background:#111;
    user-select:none;
  }
  body::before {
    content:"";
    position:fixed; top:50%; left:50%;
    width:300vmax; height:300vmax;
    background:repeating-conic-gradient(from 0deg,#000 0deg 10deg,#fff 10deg 20deg);
    transform:translate(-50%,-50%) rotate(0deg);
    z-index:-10;
    animation:spinSpiral 5s linear infinite;
  }
  @keyframes spinSpiral {
    from { transform:translate(-50%,-50%) rotate(0deg); }
    to { transform:translate(-50%,-50%) rotate(360deg); }
  }
  #app {
    width:min(1500px, 96vw);
    height:100vh;
    margin:auto;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 260px;
    grid-template-rows:120px minmax(0,1fr);
    gap:12px;
    padding:12px;
  }
  #header {
    grid-column:1 / -1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #wasteMailbox {
    position:absolute;
    top:6px;
    width:min(560px, 60vw);
    height:88px;
    border-radius:18px 18px 28px 28px;
    background:linear-gradient(#c52222,#8f0f0f);
    border:5px solid #4c0808;
    box-shadow:0 10px 0 rgba(0,0,0,.45), inset 0 5px 0 rgba(255,255,255,.18);
    cursor:grab;
    z-index:20;
    transition:left .05s linear;
  }
  #wasteText {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:Impact, Haettenschweiler, "Arial Black", sans-serif;
    font-size:clamp(25px,3vw,44px);
    letter-spacing:.18em;
    color:#fff;
    text-shadow:3px 3px 0 #3c0505;
    pointer-events:none;
  }
  #heldStamp {
    position:absolute;
    left:50%;
    bottom:-72px;
    width:104px;
    height:104px;
    transform:translateX(-50%);
    border-radius:50%;
    border:4px solid #f4e6c5;
    box-shadow:0 5px 0 rgba(0,0,0,.45), 0 0 0 2px #5a351d;
    overflow:hidden;
    background:#f1e2bd;
    z-index:25;
    pointer-events:none;
  }
  #heldStamp img {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  #heldStamp .heldNum {
    position:absolute; left:4px; top:4px;
    background:rgba(255,255,255,.95);
    color:#2d1a0c;
    font:bold 14px Arial;
    padding:3px 5px;
    border-radius:4px;
    border:1px solid #6b3f1d;
  }
  #mailFlag {
    position:absolute; right:18px; top:-42px;
    width:9px; height:45px; background:#4b0909;
    pointer-events:none;
  }
  #mailFlag::after {
    content:""; position:absolute; top:0; left:0;
    width:35px; height:20px; background:#f2c14e;
    border:3px solid #4b0909;
  }
  #gamePanel {
    position:relative;
    min-width:0; min-height:0;
    border-radius:24px;
    background:rgba(15,15,15,.80);
    border:4px solid #ddd;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
    overflow:hidden;
  }
  #gameCanvas { width:100%; height:100%; display:block; cursor:none; }
  #side {
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .panel {
    background:rgba(15,15,15,.90);
    border:3px solid #ddd;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    padding:12px;
  }
  #title {
    font-weight:bold;
    font-size:21px;
    text-align:center;
    line-height:1.05;
  }
  #subtitle {
    text-align:center;
    font-style:italic;
    font-size:14px;
    margin-top:4px;
  }
  #stats {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
  }
  .stat {
    background:#f4ead7;
    color:#2a170e;
    border-radius:10px;
    padding:8px;
    text-align:center;
    font-weight:bold;
  }
  .stat b { display:block; font-size:20px; }
  #doubleBtn {
    width:100%;
    border:3px solid #5b350e;
    border-radius:14px;
    background:linear-gradient(#f3c85b,#b87813);
    color:#241404;
    font-weight:bold;
    padding:11px 8px;
    cursor:pointer;
    box-shadow:0 5px 0 #6e410c;
    font-size:16px;
  }
  #doubleBtn:active { transform:translateY(4px); box-shadow:0 1px 0 #6e410c; }
  #doubleBtn:disabled { opacity:.45; cursor:not-allowed; }
  #boardControls {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
  }
  .smallBtn {
    border:2px solid #5b350e;
    border-radius:10px;
    background:#efe0bd;
    color:#2a170e;
    font-weight:bold;
    padding:8px 5px;
    cursor:pointer;
  }
  .smallBtn:hover { filter:brightness(1.08); }
  .smallBtn:active { transform:translateY(2px); }
  .pageNav {
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:5px;
    align-items:center;
    margin-bottom:7px;
  }
  .pageNav button { padding:5px 4px; }
  #pageStatus { font:bold 12px Arial; text-align:center; }
  #book {
    flex:1;
    min-height:0;
    overflow:auto;
    background:#e7d5ae;
    color:#2d1a0c;
    border:8px solid #6b3f1d;
    border-radius:12px;
    padding:9px;
    box-shadow:inset 0 0 0 2px #3b210e;
  }
  #bookTitle {
    text-align:center; font-weight:bold; font-size:16px;
    margin-bottom:8px;
  }
  #slots {
    display:grid; grid-template-columns:1fr 1fr;
    gap:7px;
  }
  .slot {
    min-height:92px;
    border:2px dashed #8a6a40;
    background:#f5ead0;
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr) 32px;
    gap:5px;
    align-items:center;
    padding:5px;
    overflow:hidden;
    cursor:pointer;
  }
  .slot img { width:100%; height:78px; object-fit:cover; opacity:.18; border:2px solid #8a6a40; }
  .slot.collected { border:2px solid #b07a19; box-shadow:0 0 12px #d99a2b; }
  .slot.collected img { opacity:1; }
  .slot span {
    position:static;
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:24px;
    background:#fff;
    color:#2d1a0c;
    padding:2px 3px;
    font:bold 12px Arial;
    border-radius:4px;
    border:1px solid #6b3f1d;
  }
  .slot:hover { filter:brightness(1.06); }

  #stampModal {
    position:fixed; inset:0; background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center; z-index:200;
  }
  #stampModal.show { display:flex; }
  #stampModalCard {
    width:min(520px,86vw); max-height:88vh; overflow:auto;
    background:#e7d5ae; color:#2d1a0c;
    border:8px solid #6b3f1d; border-radius:18px; padding:18px;
    text-align:center; box-shadow:0 16px 45px rgba(0,0,0,.65);

  #stampModalCard img {
    width:min(360px,72vw); height:min(360px,55vh); object-fit:cover;
    border:5px solid #f4e6c5; box-shadow:0 0 0 3px #5a351d;
  }
  #stampModalTitle { font-size:24px; font-weight:bold; margin:12px 0 4px; }
  #stampModalNumber { font:bold 14px Arial; margin-bottom:10px; }
  #stampModalClose {
    border:2px solid #5b350e; border-radius:10px; background:#efe0bd;
    color:#2a170e; font-weight:bold; padding:9px 18px; cursor:pointer;
  }
  #postalCursor {
    position:fixed; width:26px; height:26px; pointer-events:none; z-index:100;
    transform:translate(-4px,-4px); display:none;
    filter:drop-shadow(1px 2px 1px rgba(0,0,0,.65));
  }
  #postalCursor svg { width:100%; height:100%; overflow:visible; }
  #postalCursor path { fill:none; stroke:#f4e6c5; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  #gamePanel:hover #postalCursor { display:block; }
  #message {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    padding:15px 22px;
    background:rgba(0,0,0,.82);
    border:3px solid #fff;
    border-radius:16px;
    font-size:24px; text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
    z-index:30;
  }
  #message.show { opacity:1; }
  #hint { font-size:12px; line-height:1.3; text-align:center; }
  @media (max-width:900px) {
    #app { grid-template-columns:1fr; grid-template-rows:105px minmax(0,1fr) 310px; }
    #header { grid-column:1; }
    #side { display:grid; grid-template-columns:1fr 1fr; }
    #book { grid-column:1 / -1; }
    #wasteMailbox { width:65vw; }
  }
</style>

<div id="app">

    </div>
  </div>

    </div>

  <aside id="side">

      <div id="stats">

    <section class="panel">
      <button id="doubleBtn">2 LAR-BUCKS — ×2 SPEED</button>
      <div id="boardControls">

</div>
<div id="stampModal" aria-hidden="true">

    <img id="stampModalImg" alt="Stamp artwork">

    <div id="stampModalNumber"></div>
    <button id="stampModalClose">CLOSE</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>

  "images/LMAC-SandpiperFlats.jpg",
  "images/LMAC-TheApproachingSeaDragon.jpg",
  "images/LMAC-TheBirdEmpress.jpg",
  "images/LMAC-TheCarnivalGhostsVacation.jpg",
  "images/LMAC-TheCavemansTV.jpg",
  "images/LMAC-TheDreamOfSleep.jpg",
  "images/LMAC-TheElectricFox.jpg",
  "images/LMAC-TheEmbarrasingAirportIncident.jpg",
  "images/LMAC-TheGoyaOfMay.jpg",
  "images/LMAC-TheHoneyBee.jpg",
  "images/LMAC-TheMonkey'sLunch.jpg",
  "images/LMAC-TheMustardSeedPrincipleAlien.jpg",
  "images/LMAC-TheSeaGoat.jpg",
  "images/LMAC-TheSlap.jpg",
  "images/LMAC-TheSupposedToBeUnpretentiousSage.jpg",
  "images/LMAC-TheWeepyMakeupSaleslady.jpg",
  "images/LMAC-TimeFreeScape.jpg",
  "images/LMAC-ToTheCaveOfSomethingSpecific.jpg",
  "images/LMAC-TumbleWeet.jpg",
  "images/LMAC-VantageShift.jpg",
  "images/LMAC-WatershipNow.jpg",
  "images/LMAC-WhySilenceIsGolden.jpg"
];

const {
  Engine, Render, Runner, Bodies, Body, Composite, Events, Vector, Mouse, MouseConstraint
} = Matter;

const canvas = document.getElementById('gameCanvas');
const panel = document.getElementById('gamePanel');
const mailbox = document.getElementById('wasteMailbox');
const heldStampImg = document.getElementById('heldStampImg');
const heldNum = document.getElementById('heldNum');
const clearBtn = document.getElementById('clearBtn');
const dropBtn = document.getElementById('dropBtn');
const prevPageBtn = document.getElementById('prevPage');
const nextPageBtn = document.getElementById('nextPage');
const message = document.getElementById('message');
const bucksEl = document.getElementById('bucks');
const countEl = document.getElementById('count');
const slotsEl = document.getElementById('slots');
const pageNoEl = document.getElementById('pageNo');
const doubleBtn = document.getElementById('doubleBtn');
const stampModal = document.getElementById('stampModal');
const stampModalImg = document.getElementById('stampModalImg');
const stampModalTitle = document.getElementById('stampModalTitle');
const stampModalNumber = document.getElementById('stampModalNumber');
const stampModalClose = document.getElementById('stampModalClose');

const engine = Engine.create();
engine.gravity.y = 1.05;
const world = engine.world;
const runner = Runner.create();

let W = 900, H = 700;
let wallLeft, wallRight, floor, bookShelf;
let stamps = [];
let nextId = 1;
let bucks = 10;
let collected = new Set();
let pageStart = 0;
let generatorStart = 0;
let doubleMode = false;
let dropLock = false;
let mailboxX = 0.5;
let draggingMailbox = false;
let lastDropTime = 0;
let nextDropTier = 1;
let mouseConstraint;
let cursorX = 0, cursorY = 0;
const DROP_COOLDOWN = 260;

const imgs = images.map(src => {
  const im = new Image();
  im.src = src;
  return im;
});

function resize() {
  const rect = panel.getBoundingClientRect();
  W = Math.max(500, rect.width);
  H = Math.max(450, rect.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);

  // Rebuild only the static boundaries when the browser size changes.
  // The falling stamps themselves remain in the physics world.
  if (wallLeft) {
    Composite.remove(world,[wallLeft,wallRight,floor,bookShelf]);
    makeWorld();
  }
  positionMailbox();
}

function makeWorld() {
  wallLeft = Bodies.rectangle(28,H/2,56,H,{isStatic:true,label:'wall'});
  wallRight = Bodies.rectangle(W-28,H/2,56,H,{isStatic:true,label:'wall'});
  floor = Bodies.rectangle(W/2,H-18,W,36,{isStatic:true,label:'floor'});
  // A broad "book" shelf at the bottom leaves a generous collection chamber above it.
  bookShelf = Bodies.rectangle(W/2,H-145,W-80,18,{isStatic:true,label:'bookShelf'});
  Composite.add(world,[wallLeft,wallRight,floor,bookShelf]);
}

function localTier(tier) {
  return ((tier - 1) % 7) + 1;
}

function stampRadius(tier) {
  // Each seven-stamp series resets to the size of Stamp 1.
  // Stamps 1-6 grow only a little from one level to the next;
  // Stamp 7 is the one deliberately large final stamp.
  const sizes = [54, 59, 64, 69, 74, 79, 112];
  return sizes[localTier(tier)-1];
}

function createStamp(tier, x, y) {
  const r = stampRadius(tier);
  const body = Bodies.circle(x,y,r,{
    restitution:0.18,
    friction:0.42,
    frictionStatic:0.7,
    density:0.0018,
    label:'stamp'
  });
  body.plugin = {
    tier,
    image: imgs[tier-1],
    radius:r,
    born:performance.now(),
    merged:false
  };
  stamps.push(body);
  Composite.add(world,body);

  // The final stamp in each seven-stamp series is created by
  // merging the previous two. There is no later merge of that
  // final stamp inside the series, so the old code never got an
  // opportunity to advance the generator. Treat the creation of
  // the final stamp as its collection/completion event.
  const groupEnd = Math.min(generatorStart + 7, images.length);
  if (tier === groupEnd && !collected.has(tier)) {
    setTimeout(() => collectTier(tier), 40);
  }

  return body;
}

function chooseNextTier() {
  // The L.A.R.R.Y. mailbox never jumps ahead. It repeatedly drops
  // the currently unlocked stamp until that stamp is achieved/merged;
  // then the next stamp is unlocked.
  return nextDropTier;
}


function updateHeldStamp() {
  const tier = Math.max(1, Math.min(images.length, nextDropTier));
  heldStampImg.src = images[tier-1];
  heldNum.textContent = String(tier).padStart(2,'0');
  heldStampImg.alt = `Stamp ${tier}`;
}

let audioCtx;
function sound(type) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    if (type === 'drop') {
      o.type='triangle'; o.frequency.setValueAtTime(280,now); o.frequency.exponentialRampToValueAtTime(120,now+.11);
      g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.10,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+.13);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+.14);
    } else if (type === 'merge') {
      o.type='sine'; o.frequency.setValueAtTime(330,now); o.frequency.exponentialRampToValueAtTime(660,now+.16);
      g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.16,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+.2);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+.21);
    }
  } catch(e) {}
}

function dropStamp() {
  const now = performance.now();
  if (now-lastDropTime < DROP_COOLDOWN) return;
  lastDropTime = now;

  const x = Math.max(75, Math.min(W-75, mailboxX*W));
  const tier = nextDropTier;

  createStamp(tier, x, 112);
  sound('drop');
  // Stay on the same stamp. It changes only when a merge creates
  // the next level. This prevents the mailbox from jumping ahead.
  updateHeldStamp();

  if (doubleMode) {
    setTimeout(() => {
      const x2 = Math.max(75, Math.min(W-75, x + (Math.random()<.5 ? -22 : 22)));
      createStamp(tier, x2, 112);
    }, 90);
    doubleMode = false;
    updateDoubleButton();
  }
}
function tryMerge(a,b) {
  if (!a.plugin || !b.plugin || a.plugin.merged || b.plugin.merged) return;
  if (a.plugin.tier !== b.plugin.tier) return;

  const tier = a.plugin.tier;
  a.plugin.merged = true; b.plugin.merged = true;

  const x = (a.position.x+b.position.x)/2;
  const y = (a.position.y+b.position.y)/2;
  Composite.remove(world,a); Composite.remove(world,b);
  stamps = stamps.filter(s=>s!==a && s!==b);

  // The two matching stamps have now "collected" that artwork.
  sound('merge');
  collectTier(tier);

  // Unlock exactly one level ahead. Do NOT create the next level here.
  // The mailbox must be the only source of new stamps. In particular,
  // merging the 7th stamp must not spontaneously create stamp 8.
  const groupEnd = Math.min(generatorStart + 7, images.length);
  if (tier < groupEnd) {
    nextDropTier = tier + 1;
    updateHeldStamp();
  }

  // A small pop effect at the merge location.
  flashMerge(x, y, stampRadius(tier));
}

function flashMerge(x, y, r) {
  const burst = {x, y, r:Math.max(18, r*.55), life:1};
  mergeBursts.push(burst);
}

const mergeBursts = [];

Events.on(engine,'collisionStart', event => {
  for (const pair of event.pairs) {
    const a=pair.bodyA, b=pair.bodyB;
    if (a.label==='stamp' && b.label==='stamp') tryMerge(a,b);
  }
});

function collectTier(tier) {
  if (tier < 1 || tier > images.length || collected.has(tier)) return;

  // Only the currently active seven-stamp series can trigger
  // generator advancement. Older collection-book pages remain
  // browsable but cannot move the generator backwards.
  const activeStart = generatorStart + 1;
  const activeEnd = Math.min(generatorStart + 7, images.length);
  const isActiveTier = tier >= activeStart && tier <= activeEnd;

  collected.add(tier);
  updateBook();
  showMessage(`COLLECTED #${String(tier).padStart(2,'0')}`, 650);

  const currentGeneratorTiers = [];
  for (let i=generatorStart; i<Math.min(generatorStart+7,images.length); i++) {
    currentGeneratorTiers.push(i+1);
  }
  const wasLastOnGeneratorSet =
    isActiveTier && currentGeneratorTiers.every(t => collected.has(t));

  if (wasLastOnGeneratorSet) {
    setTimeout(()=> {
      if (generatorStart + 7 < images.length) {
        generatorStart += 7;
        nextDropTier = generatorStart + 1;
        updateHeldStamp();
        showMessage('NEXT 7 LAR STAMPS!', 1000);
      } else {
        showMessage("ALL 72 COLLECTED!", 1600);
      }
    }, 720);
  }
  countEl.textContent = `${collected.size}/${images.length}`;
}

function currentPageTiers() {
  const arr=[];
  for(let i=pageStart;i<Math.min(pageStart+7,images.length);i++) arr.push(i+1);
  return arr;
}

function titleFromPath(path) {
  const file = path.split('/').pop().replace(/\.[^.]+$/, '');
  return file
    .replace(/^LMAC-/, '')
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
    .replace(/_/g,' ');
}

function openStampModal(tier) {
  stampModalImg.src = images[tier-1];
  stampModalTitle.textContent = titleFromPath(images[tier-1]);
  stampModalNumber.textContent = `LAR STAMP #${String(tier).padStart(2,'0')}`;
  stampModal.classList.add('show');
  stampModal.setAttribute('aria-hidden','false');
}

function closeStampModal() {
  stampModal.classList.remove('show');
  stampModal.setAttribute('aria-hidden','true');
}

function updateBook() {
  pageNoEl.textContent = Math.floor(pageStart/7)+1;
  slotsEl.innerHTML='';
  currentPageTiers().forEach(tier=> {
    const slot=document.createElement('button');
    slot.type='button';
    slot.className='slot'+(collected.has(tier)?' collected':'');
    const im=document.createElement('img');
    im.src=images[tier-1];
    im.alt=`Stamp ${tier}`;
    const num=document.createElement('span');
    num.textContent=String(tier).padStart(2,'0');
    slot.appendChild(im);
    slot.appendChild(num);
    slot.addEventListener('click',()=>openStampModal(tier));
    slotsEl.appendChild(slot);
  });
  countEl.textContent = `${collected.size}/${images.length}`;
  prevPageBtn.disabled = pageStart === 0;
  nextPageBtn.disabled = pageStart + 7 >= images.length;
}
function showMessage(text, ms=700) {
  message.textContent=text;
  message.classList.add('show');
  clearTimeout(showMessage.timer);
  showMessage.timer=setTimeout(()=>message.classList.remove('show'),ms);
}

function updateDoubleButton() {
  doubleBtn.disabled = bucks < 2 || doubleMode;
  doubleBtn.textContent = doubleMode ? '×2 ACTIVE — NEXT DROP' : '2 LAR-BUCKS — ×2 SPEED';
}

doubleBtn.addEventListener('click',()=> {
  if (bucks < 2 || doubleMode) return;
  bucks -= 2;
  bucksEl.textContent=bucks;
  doubleMode=true;
  updateDoubleButton();
});

function clearBoardKeepTopFour() {
  const live = stamps.filter(s => s && s.plugin);
  if (!live.length) return;
  const sorted = [...live].sort((a,b) => (b.plugin.tier||1) - (a.plugin.tier||1));
  const keep = new Set(sorted.slice(0,4));
  for (const b of live) {
    if (!keep.has(b)) Composite.remove(world,b);
  }
  stamps = stamps.filter(b => keep.has(b));
  showMessage(`POP! — KEPT TOP ${Math.min(4,live.length)}`, 900);
  sound('merge');
}

function goToPage(start) {
  const maxStart = Math.max(0, Math.floor((images.length-1)/7)*7);
  pageStart = Math.max(0, Math.min(maxStart, start));
  updateBook();
}

function positionMailbox() {
  const header=document.getElementById('header');
  const hw=header.clientWidth;
  const mw=mailbox.offsetWidth;
  const left=Math.max(0,Math.min(hw-mw, mailboxX*hw-mw/2));
  mailbox.style.left=left+'px';
}

function setMailboxFromClientX(clientX) {
  const header=document.getElementById('header');
  const rect=header.getBoundingClientRect();
  mailboxX=Math.max(.08,Math.min(.92,(clientX-rect.left)/rect.width));
  positionMailbox();
}

let mailboxMoved=false;
mailbox.addEventListener('pointerdown',e=> {
  draggingMailbox=true;
  mailboxMoved=false;
  mailbox.setPointerCapture(e.pointerId);
  setMailboxFromClientX(e.clientX);
});
mailbox.addEventListener('pointermove',e=> {
  if(draggingMailbox) {
    mailboxMoved=true;
    setMailboxFromClientX(e.clientX);
  }
});
mailbox.addEventListener('pointerup',e=> {
  if(!draggingMailbox) return;
  draggingMailbox=false;
  if(!mailboxMoved) dropStamp();
});
mailbox.addEventListener('pointercancel',e=> {
  draggingMailbox=false;
  mailboxMoved=false;
});

dropBtn.addEventListener('click', dropStamp);
clearBtn.addEventListener('click', clearBoardKeepTopFour);
prevPageBtn.addEventListener('click',()=>goToPage(pageStart-7));
nextPageBtn.addEventListener('click',()=>goToPage(pageStart+7));
stampModalClose.addEventListener('click', closeStampModal);
stampModal.addEventListener('click', e => { if (e.target === stampModal) closeStampModal(); });
window.addEventListener('keydown', e => { if (e.code === 'Escape') closeStampModal(); });

window.addEventListener('keydown',e=> {
  if(e.code==='Space' && !e.repeat) {
    e.preventDefault();
    dropStamp();
  }
  if(e.code==='ArrowLeft') {
    mailboxX=Math.max(.08,mailboxX-.035);
    positionMailbox();
  }
  if(e.code==='ArrowRight') {
    mailboxX=Math.min(.92,mailboxX+.035);
    positionMailbox();
  }
});

function setupDragging() {
  if (mouseConstraint) Composite.remove(world, mouseConstraint);
  const mouse = Mouse.create(canvas);
  mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: { stiffness: 0.18, render: { visible: false } }
  });
  Composite.add(world, mouseConstraint);
}

canvas.addEventListener('mouseenter', e => { document.getElementById('postalCursor').style.display='block'; });
canvas.addEventListener('mouseleave', e => { document.getElementById('postalCursor').style.display='none'; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  cursorX = e.clientX; cursorY = e.clientY;
  const c = document.getElementById('postalCursor');
  c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px';
});

function draw() {
  const ctx=canvas.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  // Subtle inner chamber gradient.
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,.05)');
  g.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // The bottom of the chamber is the responsive stamp-collection book.
  const bookY = H-140;
  ctx.fillStyle='rgba(231,213,174,.98)';
  ctx.fillRect(45,bookY,W-90,128);
  ctx.strokeStyle='#6b3f1d';
  ctx.lineWidth=5;
  ctx.strokeRect(45,bookY,W-90,128);
  ctx.fillStyle='#3b210e';
  ctx.font='bold 18px Georgia';
  ctx.textAlign='center';
  ctx.fillText(`YOUR NEW LAR STAMPS!!! — PAGE ${Math.floor(pageStart/7)+1}`,W/2,bookY+24);

  const pageTiers = currentPageTiers();
  const gap = 8;
  const innerX = 58;
  const innerW = W-116;
  const slotW = (innerW - gap*(pageTiers.length-1)) / Math.max(1,pageTiers.length);
  const slotY = bookY+36;
  const slotH = 78;

  pageTiers.forEach((tier,i)=>{
    const x = innerX + i*(slotW+gap);
    ctx.fillStyle = collected.has(tier) ? '#f8edcf' : '#c9b58b';
    ctx.fillRect(x,slotY,slotW,slotH);
    ctx.strokeStyle = collected.has(tier) ? '#b07a19' : '#8a6a40';
    ctx.lineWidth = collected.has(tier) ? 3 : 2;
    ctx.strokeRect(x,slotY,slotW,slotH);

    const im=imgs[tier-1];
    const numBoxW = Math.min(30, slotW*.24);
    const imageW = slotW-numBoxW-5;
    if(im && im.complete && im.naturalWidth){
      ctx.save();
      ctx.globalAlpha = collected.has(tier) ? 1 : .22;
      ctx.drawImage(im,x+3,slotY+3,imageW-6,slotH-6);
      ctx.restore();
    }
    ctx.fillStyle='#fff';
    ctx.fillRect(x+slotW-numBoxW-2,slotY+slotH/2-12,numBoxW,24);
    ctx.strokeStyle='#6b3f1d';
    ctx.lineWidth=1;
    ctx.strokeRect(x+slotW-numBoxW-2,slotY+slotH/2-12,numBoxW,24);
    ctx.fillStyle='#3b210e';
    ctx.font='bold 12px Arial';
    ctx.textAlign='center';
    ctx.fillText(String(tier).padStart(2,'0'),x+slotW-numBoxW/2-2,slotY+slotH/2+4);
  });

  for(const b of stamps) {
    if(!b.position || !b.plugin) continue;
    const r=b.plugin.radius;
    ctx.save();
    ctx.translate(b.position.x,b.position.y);
    ctx.rotate(b.angle||0);

    // stamp paper + dark outline
    ctx.beginPath();
    ctx.arc(0,0,r+4,0,Math.PI*2);
    ctx.fillStyle='#f1e2bd';
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle='#5a351d';
    ctx.stroke();

    const im=b.plugin.image;
    if(im && im.complete && im.naturalWidth) {
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,r-3,0,Math.PI*2); ctx.clip();
      ctx.drawImage(im,-r+3,-r+3,(r-3)*2,(r-3)*2);
      ctx.restore();
    } else {
      ctx.fillStyle='#d8c49a';
      ctx.beginPath(); ctx.arc(0,0,r-3,0,Math.PI*2); ctx.fill();
    }

    // Tier number sits in a separate little white box BESIDE the bubble.
    const boxW = 30, boxH = 22;
    const boxX = r - 2;
    const boxY = -boxH/2;
    ctx.fillStyle='#fff';
    ctx.fillRect(boxX,boxY,boxW,boxH);
    ctx.strokeStyle='#6b3f1d';
    ctx.lineWidth=2;
    ctx.strokeRect(boxX,boxY,boxW,boxH);
    ctx.fillStyle='#2d1a0c';
    ctx.font='bold 12px Arial';
    ctx.textAlign='center';
    ctx.fillText(String(b.plugin.tier).padStart(2,'0'),boxX+boxW/2,boxY+15);

    // perforated-looking dots
    ctx.strokeStyle='rgba(60,30,10,.5)';
    ctx.lineWidth=2;
    for(let k=0;k<12;k++) {
      const a=k*Math.PI*2/12;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*(r+1),Math.sin(a)*(r+1),1.4,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }
  for (let i = mergeBursts.length - 1; i >= 0; i--) {
    const q = mergeBursts[i];
    q.life -= 0.055;
    q.r += 3.5;
    if (q.life <= 0) { mergeBursts.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = q.life;
    ctx.strokeStyle = '#fff4b8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

function animateMailbox() {
  positionMailbox();
  requestAnimationFrame(animateMailbox);
}

makeWorld();
resize();
setupDragging();
generatorStart = 0;
nextDropTier = generatorStart + 1;
updateBook();
updateDoubleButton();
updateHeldStamp();
window.addEventListener('resize',resize);
Runner.run(runner,engine);
draw();
animateMailbox();
</script>
</body>
</html>
