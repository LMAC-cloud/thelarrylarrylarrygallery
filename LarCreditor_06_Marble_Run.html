#propertyBoard .surface.tray{height:calc(var(--size)*.23)}
#propertyBoard .candle{width:37%;height:71%;position:relative;border-radius:13% 13% 9% 9%;background:linear-gradient(90deg,#0004,transparent 35%,#fff5 68%,#0003),var(--paint);box-shadow:0 3px 6px #0008;pointer-events:none}
#propertyBoard .candle::before{content:"";position:absolute;left:5%;right:5%;top:-4%;height:10%;border-radius:50%;background:var(--paint);box-shadow:inset 0 2px 2px #fff6}
#propertyBoard .wick,#propertyBoard .match-tip{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:3px;height:8px;background:#36251e;border-radius:2px}
#propertyBoard .flame{position:absolute;left:50%;bottom:100%;width:12px;height:22px;transform-origin:50% 100%;transform:translateX(-50%);border-radius:54% 46% 55% 50% / 74% 72% 29% 27%;background:radial-gradient(ellipse at 50% 78%,white 0 16%,#ffe79b 29%,#ffa53b 60%,#f16a26 85%);box-shadow:0 0 27px 7px #ff982a77;animation:propertyFlicker .17s alternate infinite;pointer-events:none}
#propertyBoard .candle[data-lit=false] .flame,#propertyBoard .match[data-lit=false] .flame{display:none}
#propertyBoard .matchbox{width:var(--size);height:calc(var(--size)*.57);border-radius:4px;display:grid;place-items:center;position:relative;background:linear-gradient(#aa432d,#7f2b20);border:2px solid #c98d56;color:#ffe2a5;font:bold 10px Georgia;letter-spacing:.1em}
#propertyBoard .strike-strip{position:absolute;inset:auto 6% -2px;height:20%;border-radius:2px;background:repeating-linear-gradient(128deg,#4a3228 0 3px,#856351 3.5px 5px)}
#propertyBoard .match{width:clamp(4px,calc(var(--size)*.09),9px);height:calc(var(--size)*.96);background:linear-gradient(90deg,#b67943,#f4c88e);position:relative;border-radius:2px;pointer-events:none}
#propertyBoard .match-tip{background:#ad3b22;width:8px;height:10px;top:-3px}
#propertyBoard .match .flame{width:9px;height:18px}
#propertyBoard .smoke{position:absolute;z-index:9999;width:17px;height:14px;border-radius:50%;background:#d0c2b677;filter:blur(4px);pointer-events:none;animation:propertySmoke 1.25s ease-out both}


#propertyPopup{z-index:16;width:min(385px,calc(100% - 24px))}
#propertyPopup details{margin:6px 0;border:1px solid var(--line)}
#propertyPopup summary{display:list-item}
#propertyPopup .contents{padding:0 9px 9px;display:grid;gap:8px}
#propertyPopup .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#propertyPopup .catalogue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-height:130px;overflow:auto}
#propertyPopup .catalogue button,#propertyPopup .register button{text-align:left}
#propertyPopup .register{display:grid;gap:4px;max-height:110px;overflow:auto}
#propertyPopup .register span{display:block;font-size:11px;opacity:.75}
#propertyPopup .muted{font-size:11px}
#propertyBoard .piece:focus,#propertyBoard .piece:focus-visible{outline:none}
#propertyBoard .piece:focus-visible{filter:brightness(1.25)}
@keyframes propertyFlicker{to{transform:translateX(-50%) rotate(7deg) scale(.91,1.08)}}
@keyframes propertySmoke{to{transform:translate(24px,-60px) scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){#propertyBoard .flame{animation:none}}

#marbleStage{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:#080b13;min-height:0}
#marbleCanvas{width:100%;flex:1;min-height:0;display:block;cursor:crosshair;touch-action:none}
.marbleControls{display:flex;justify-content:center;gap:clamp(8px,2.8vw,26px);flex-wrap:wrap;padding:2px 8px 4px;background:#161019;border-top:1px solid #4e3545}
.viewer:fullscreen .marbleControls{display:none}
</style>
</head>

<h1>LarCreditor</h1>

</header>
<main>

    </section>
    <button class="curtain" type="button" id="curtain" aria-label="Lift curtains" hidden></button>
  </div>
  <div class="stageDeck" id="stageDeck" aria-hidden="true" hidden>
 <div class="steps"><i style="width:30%"></i><i style="width:49%"></i><i style="width:67%"></i><i style="width:84%"></i><i style="width:100%"></i></div>

</div>

<button id="workMode" aria-pressed="false">Work mode</button></nav>

  <div id="settingsContent"></div>

<div class="controls">

Your Name

Featuring

<script>
'use strict';
const byId = id => document.getElementById(id);
const screen = byId('screen'), stage = byId('stage'), credits = byId('credits'), curtain = byId('curtain');
const status = message => { byId('padStatus').textContent = message; };
const styles = [['cards','One card at a time'],['up','Roll upward'],['down','Roll downward'],['left','Roll to the left'],['right','Roll to the right']];
for (const id of ['openingStyle','closingStyle']) {
  for (const [value,label] of styles) byId(id).add(new Option(label,value));
}
byId('closingStyle').value = 'up';
const number = (id,fallback) => {
  const input = byId(id);
  return input.value === '' ? fallback : Math.min(Number(input.max), Math.max(Number(input.min), Number(input.value)));
};

let curtainClosed = false, curtainRevision = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const delay = ms => new Promise(resolve => setTimeout(resolve,ms));
async function setCurtain(closed) {
  if (closed === curtainClosed) return;
  const revision = ++curtainRevision;
  curtainClosed = closed;
  byId('curtainToggle').setAttribute('aria-pressed',String(closed));
  if (closed) {
    curtain.hidden = false;
    curtain.getBoundingClientRect();
    curtain.classList.add('closed');
    return;
  }
  curtain.classList.remove('closed');
  await delay(reducedMotion.matches ? 0 : number('curtainTime',1.35)*1000);
  if (revision === curtainRevision) curtain.hidden = true;
}
byId('curtainToggle').onclick = () => setCurtain(!curtainClosed);
curtain.onclick = () => setCurtain(false);
byId('fullscreen').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await byId('viewer').requestFullscreen();
  } catch {
    status('Fullscreen is unavailable in this browser.');
  }
};
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.repeat || event.target.closest('input,textarea,select,button,[contenteditable]')) return;
  if (event.key.toLowerCase() === 'c') setCurtain(!curtainClosed);
  if (event.code === 'Space' && activeRun) {
    event.preventDefault();
    togglePause();
  }
});

let video = null, backdropURL = '';
function applyLook() {
  screen.style.setProperty('--font',byId('font').value);
  screen.style.setProperty('--text',byId('colour').value);
  screen.style.setProperty('--type-size',byId('size').value);
  screen.style.setProperty('--media-fit',byId('fit').value);
  screen.style.setProperty('--dim',byId('dim').value);
  screen.style.setProperty('--curtain-time',number('curtainTime',1.35)+'s');
  if (video) {
    video.loop = byId('loop').checked;
    video.muted = byId('mute').checked;
  }
}
installColours();
for (const id of ['font','colour','size','fit','dim','curtainTime','loop','mute']) byId(id).addEventListener('input',applyLook);
applyLook();

function applyTheatre() {
  const theatre = byId('theatre').checked;
  const booth = byId('viewpoint').value === 'booth';
  stage.classList.toggle('theatre',theatre);
  stage.classList.toggle('booth',theatre && booth);
  byId('stageDeck').hidden = !theatre || !byId('showDeck').checked;
  byId('stageLights').hidden = !theatre || !byId('showLights').checked;
  const rows = Number(byId('rows').value);
  stage.style.setProperty('--usher-height',Math.min(24,3+rows*3.5)+'%');
  stage.style.setProperty('--screen-width',byId('width').value+'%');
  stage.style.setProperty('--screen-height',byId('height').value+'%');
  const audience = byId('audience');
  audience.replaceChildren();
  if (!theatre) return;
  const count = Number(byId('rows').value);
  for (let i = 0; i < count; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--row-width',(66 + (i+1)/count*35)+'%');
    row.style.setProperty('--row-height', (booth ? 2+i*.48 : 3+i*.72)+'dvh');
    for (let n = 0; n < (booth ? 16 : 12); n++) {
      const seat = document.createElement('span');
      seat.className = 'seat';
      row.append(seat);
    }
    audience.append(row);
  }
}
for (const id of ['theatre','width','height','rows','viewpoint','showDeck','showLights']) byId(id).addEventListener('input',applyTheatre);
applyTheatre();

let creditTarget = 'opening';
for (const [button,target] of [['loadOpening','opening'],['loadClosing','closing']]) {
  byId(button).onclick = () => {
    creditTarget = target;
    byId('creditFile').click();
  };
}
function closingVisibility() { byId('closingField').hidden = byId('useOpening').checked; }
byId('useOpening').onchange = closingVisibility;
byId('creditFile').onchange = async event => {
  const file = event.target.files[0], target = creditTarget;
  event.target.value = '';
  if (!file) return;
  try {
    byId(target).value = await file.text();
    if (target === 'closing') {
      byId('useOpening').checked = false;
      closingVisibility();
    }
    refreshPad();
    showIdle();
    status('Loaded '+file.name);
  } catch {
    status('Could not read '+file.name);
  }
};

let customFontCount = 0;
byId('loadFont').onclick = () => byId('fontFile').click();
byId('fontFile').onchange = async event => {

function readSequence(kind) {
  const opening = kind === 'Opening';
  const content = opening || byId('useOpening').checked ? byId('opening').value : byId('closing').value;
  const title = opening || byId('closingTitle').checked ? byId('filmTitle').value.trim() : '';
  const text = [content,opening ? '' : byId('extras').value].map(part => part.trim()).filter(Boolean).join('\n\n');
  return {
    kind, title, text,
    cards:creditCards(title,text),
    style:byId(opening ? 'openingStyle' : 'closingStyle').value,
    effect:byId('effect').value,
    duration:number(opening ? 'openingDuration' : 'closingDuration',opening ? 12 : 18)*1000
  };
}

function creditCards(title,text) {
  const cards = title ? [{title,text:'',gap:.14}] : [];
  if (!text) return cards;
  const pieces = text.split(/(\n(?:[\t \r]*\n)+)/);
  for (let i=0;i<pieces.length;i+=2) {
    const blankLines = (pieces[i+1]?.match(/\n/g)?.length || 1)-1;
    cards.push({title:'',text:pieces[i],gap:blankLines*.18});
  }
  return cards;
}

function makeBlock(title,text,isRoll) {
  const block = document.createElement('div');
  block.className = 'credit-block'+(isRoll ? ' roll' : '');
  if (title) {
    const heading = document.createElement('strong');
    heading.className = 'film-title';
    heading.textContent = title;
    block.append(heading);
  }
  if (text) {
    const lines = document.createElement('span');
    lines.className = 'card-lines';
    lines.textContent = text;
    block.append(lines);
  }
  credits.replaceChildren(block);
  return block;
}

let activeRun = null;
function showIdle() {

}

function renderSequence(run,sequence,elapsed) {
  const progress = Math.min(1,elapsed/sequence.duration);
  if (sequence.style === 'cards') {
    let position = progress*sequence.cards.reduce((sum,card) => sum+1+card.gap,0);
    let index = 0;
    while (index+1 < sequence.cards.length && position >= 1+sequence.cards[index].gap) {
      position -= 1+sequence.cards[index].gap;
      index++;
    }
    if (run.card !== index || !run.block) {
      run.card = index;
      const card = sequence.cards[index];
      run.block = makeBlock(card.title,card.text);
    }
    run.block.hidden = position >= 1;
    const phase = Math.min(1,position);
    const opacity = Math.min(1,phase*5,(1-phase)*5);
    run.block.style.opacity = sequence.effect === 'cut' ? '1' : String(opacity);
    if (sequence.effect === 'rise') run.block.style.transform = 'translateY('+((1-phase)*15)+'px)';
    if (sequence.effect === 'zoom') run.block.style.transform = 'scale('+(1+phase*.08)+')';
    return;
  }
  if (!run.block) run.block = makeBlock(sequence.title,sequence.text,true);
  const horizontal = sequence.style === 'left' || sequence.style === 'right';
  const reverse = sequence.style === 'down' || sequence.style === 'right';
  const containerSize = horizontal ? credits.clientWidth : credits.clientHeight;
  const blockSize = horizontal ? run.block.offsetWidth : run.block.offsetHeight;
  const distance = (containerSize+blockSize)/2;
  const offset = (reverse ? -1 : 1)*distance*(1-2*progress);
  run.block.style.transform = horizontal ? 'translateX('+offset+'px)' : 'translateY('+offset+'px)';
}

function syncTransport() {
  byId('playAll').textContent = activeRun && !activeRun.paused ? 'Pause' : 'Play';

function stopPlayback(finished = false) {
  if (activeRun) cancelAnimationFrame(activeRun.frame);
  activeRun = null;
  stage.style.setProperty('--house-level','1');
  video?.pause();
  if (byId('audioSync').checked) byId('audioPlayer').pause();
  syncTransport();
  if (finished) {
    credits.replaceChildren();
    if (byId('closeAfter').checked) setCurtain(true);
  } else {
    showIdle();
  }
}

function advance(run,now) {
  if (activeRun !== run || run.paused) return;
  run.elapsed += Math.max(0,now-run.last);
  run.last = now;
  let elapsed = run.elapsed;
  let section = null;
  for (const candidate of run.sections) {
    if (elapsed < candidate.duration) {
      section = candidate;
      break;
    }
    elapsed -= candidate.duration;
  }
  if (!section) {
    if (byId('repeat').getAttribute('aria-pressed') === 'true') startPlayback(run.kinds);
    else stopPlayback(true);
    return;
  }
  run.sectionElapsed = elapsed;
  if (run.section !== section) {
    run.section = section;
    run.block = null;
    run.card = -1;
    credits.replaceChildren();
    if (byId('audioSync').checked) {
      if (section.kind) startSectionSound(section.kind);
      else audioPlayer.pause();
    }
  }
  if (section.houseLead) stage.style.setProperty('--house-level',String(1-.75*elapsed/section.duration));
  else if (byId('dimHouse').checked) stage.style.setProperty('--house-level','.25');
  if (section.kind) {
    renderSequence(run,section,elapsed);
    if (byId('audioSync').checked && audioIndex >= 0) updateAudioVolume();
  }
  run.frame = requestAnimationFrame(time => advance(run,time));
}

function startPlayback(kinds) {
  const sections = kinds.map(readSequence).filter(sequence => sequence.title || sequence.text);
  if (!sections.length) {
    status('Add a film title or some credits first.');
    return;
  }
  const gap = number('gap',0)*1000;
  if (sections.length === 2 && gap) sections.splice(1,0,{duration:gap});
  const house = byId('dimHouse').checked;
  const lead = house ? number('houseFade',2)*1000 : 0;
  if (lead) sections.unshift({duration:lead,houseLead:true});
  stage.style.setProperty('--house-level',house && !lead ? '.25' : '1');
  if (activeRun) cancelAnimationFrame(activeRun.frame);
  document.dispatchEvent(new Event('larcreditor:play'));
  const run = {sections,kinds,elapsed:0,last:performance.now(),paused:false,frame:0};
  activeRun = run;
  setCurtain(false);
  closePad();
  syncTransport();
  if (video) {
    video.currentTime = 0;
    playVideo();
  }
  if (byId('audioSync').checked) audioPlayer.pause();
  advance(run,run.last);
}

function togglePause() {
  const run = activeRun;
  if (!run) return;
  run.paused = !run.paused;
  syncTransport();
  if (run.paused) {
    cancelAnimationFrame(run.frame);
    video?.pause();
    if (byId('audioSync').checked) byId('audioPlayer').pause();
  } else {
    run.last = performance.now();
    playVideo();
    if (byId('audioSync').checked && run.section?.kind) playSoundtrack();
    run.frame = requestAnimationFrame(time => advance(run,time));
  }
}

byId('playAll').onclick = () => {

const draftKey = 'larcreditor-credits-v1';
let bank = {drafts:[],templates:[]};
try {
  const saved = JSON.parse(localStorage.getItem(draftKey));
  if (Array.isArray(saved?.drafts) && Array.isArray(saved?.templates)) bank = saved;
} catch {}
const builtIn = [
  {name:'Cast and crew',filmTitle:'[Film title]',opening:'A film by\n[Director]\n\nStarring\n[Actor] as [Character]\n[Actor] as [Character]',closing:'Cast\n[Character] — [Actor]\n\nCrew\nDirected by [Name]\nWritten by [Name]\nProduced by [Name]\nEdited by [Name]',extras:'Special thanks\n[Names]',useOpening:false},
  {name:'Short film',filmTitle:'[Film title]',opening:'[Production company] presents\n\nA film by [Name]',closing:'',extras:'Music by [Name]\n\nThank you for watching',useOpening:true}
];

function refreshBank() {
  const drafts = byId('savedDrafts'), templates = byId('templates');
  drafts.replaceChildren(new Option('Open a draft…',''));
  templates.replaceChildren(new Option('Use a template…',''));
  bank.drafts.forEach((entry,i) => drafts.add(new Option(entry.name,String(i))));
  [...builtIn,...bank.templates].forEach((entry,i) => templates.add(new Option(entry.name,String(i))));

function saveEntry(kind) {
  const name = byId('draftName').value.trim();
  if (!name) {
    padStatus('Enter a name before saving.');
    byId('draftName').focus();
    return;
  }
  const entry = {name,useOpening:byId('useOpening').checked,sound:readSoundSettings()};
  for (const id of ['filmTitle','opening','closing','extras']) entry[id] = byId(id).value;
  const previous = bank[kind].findIndex(item => item.name === name);
  const entries = [...bank[kind]];
  if (previous < 0) entries.push(entry);
  else entries[previous] = entry;
  try {
    localStorage.setItem(draftKey,JSON.stringify({...bank,[kind]:entries}));
    bank[kind] = entries;
    refreshBank();
    padStatus('Saved '+name+'.');
  } catch {

const audioPlayer = byId('audioPlayer'), audioList = byId('audioTracks');
let audioFiles = [], audioIndex = -1, cueNames = {openingTrack:'',closingTrack:''};
const cueIds = ['openingTrack','closingTrack'];

function closeAudioOptions() {
  byId('audioOptions').hidden = true;
  byId('audioOptionsToggle').setAttribute('aria-expanded','false');
}
byId('audioOptionsToggle').onclick = () => {
  const options = byId('audioOptions');
  if (!options.hidden) { closeAudioOptions(); return; }
  options.hidden = false;
  byId('audioOptionsToggle').setAttribute('aria-expanded','true');
};
byId('closeAudioOptions').onclick = closeAudioOptions;

function readSoundSettings() {
  return {...cueNames,sync:byId('audioSync').checked,in:byId('audioFadeIn').value,out:byId('audioFadeOut').value,
    volume:byId('audioVolume').value,one:audioPlayer.loop};
}
function applySoundSettings(settings) {
  if (!settings) return;
  cueNames = {openingTrack:settings.openingTrack || '',closingTrack:settings.closingTrack || ''};
  byId('audioSync').checked = settings.sync !== false;
  byId('audioFadeIn').value = settings.in ?? 0;
  byId('audioFadeOut').value = settings.out ?? 0;
  byId('audioVolume').value = settings.volume ?? 1;
  setAudioRepeat(Boolean(settings.one));

function refreshCueMenus() {
  for (const id of cueIds) {
    const select = byId(id);
    select.replaceChildren(new Option('Current track',''));
    for (const name of new Set(audioFiles.map(file => file.name))) select.add(new Option(name,name));
    if (cueNames[id] && !audioFiles.some(file => file.name === cueNames[id])) {
      select.add(new Option(cueNames[id]+' (load file)',cueNames[id]));
    }
    select.value = cueNames[id];
  }
}
for (const id of cueIds) byId(id).onchange = () => { cueNames[id] = byId(id).value; };
refreshCueMenus();

function playSoundtrack() {
  if (audioIndex < 0) return;
  updateAudioVolume();
  audioPlayer.play().catch(() => {
    if (!audioPlayer.error) status('Press Play in Audio to start the soundtrack.');
  });
}
function selectSoundtrack(index,play) {
  if (!audioFiles[index]) return;
  audioIndex = index;
  audioList.value = String(index);
  audioPlayer.src = audioFiles[index].url;
  syncAudioDisplay();
  if (play) playSoundtrack();
}
function startSectionSound(kind) {
  if (!audioFiles.length) return;
  const name = cueNames[kind === 'Opening' ? 'openingTrack' : 'closingTrack'];
  const index = name ? audioFiles.findIndex(file => file.name === name) : audioIndex;
  if (index >= 0 && index !== audioIndex) selectSoundtrack(index,false);
  if (audioPlayer.readyState) audioPlayer.currentTime = 0;
  playSoundtrack();
}
function stepSoundtrack(direction,play = !audioPlayer.paused) {
  if (!audioFiles.length) return;
  selectSoundtrack((audioIndex+direction+audioFiles.length)%audioFiles.length,play);
}
function refreshAudioList() {
  audioList.replaceChildren();
  if (!audioFiles.length) audioList.add(new Option('No tracks',''));
  audioFiles.forEach((item,i) => audioList.add(new Option(item.name,String(i))));
  for (const id of ['audioTracks','audioPlay','removeAudio']) byId(id).disabled = !audioFiles.length;
  byId('audioPrevious').disabled = byId('audioNext').disabled = audioFiles.length < 2;
  refreshCueMenus();
}
function clearAudioSource() {
  audioPlayer.pause();
  audioPlayer.removeAttribute('src');
  audioPlayer.load();
  audioIndex = -1;
  syncAudioDisplay();
}
byId('loadAudio').onclick = () => byId('audioFile').click();
byId('removeAudio').onclick = () => {
  if (audioIndex < 0) return;
  const index = audioIndex, wasPlaying = !audioPlayer.paused;
  const [removed] = audioFiles.splice(index,1);
  clearAudioSource();
  URL.revokeObjectURL(removed.url);
  refreshAudioList();
  if (audioFiles.length) selectSoundtrack(Math.min(index,audioFiles.length-1),wasPlaying);
};
byId('audioFile').onchange = event => {
  const files = [...event.target.files];
  event.target.value = '';
  if (!files.length) return;
  const firstAdded = audioFiles.length;
  audioFiles.push(...files.map(file => ({name:file.name,url:URL.createObjectURL(file)})));
  refreshAudioList();
  if (audioIndex < 0) selectSoundtrack(firstAdded,Boolean(activeRun?.section?.kind && !activeRun.paused && byId('audioSync').checked));
  else audioList.value = String(audioIndex);
};
audioList.onchange = () => selectSoundtrack(Number(audioList.value),!audioPlayer.paused);
byId('audioPlay').onclick = () => { if (audioPlayer.paused) playSoundtrack(); else audioPlayer.pause(); };
byId('audioPrevious').onclick = () => stepSoundtrack(-1);

function setAudioRepeat(one) {

  byId('audioLoop').setAttribute('aria-pressed',String(one));
}
byId('audioLoop').onclick = () => setAudioRepeat(!audioPlayer.loop);
audioPlayer.onended = () => { if (!audioPlayer.loop) stepSoundtrack(1,true); };
audioPlayer.onerror = () => { if (audioIndex >= 0) status('This browser could not open '+audioFiles[audioIndex].name); };
function clock(seconds) {
  const value = Math.max(0,Math.floor(seconds || 0));
  return Math.floor(value/60)+':'+String(value%60).padStart(2,'0');
}
function syncAudioDisplay() {
  const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : 0;
  const progress = byId('audioProgress');
  progress.disabled = !(audioIndex >= 0 && duration > 0);
  progress.max = duration || 1;
  progress.value = audioPlayer.currentTime || 0;
  byId('audioNow').textContent = clock(audioPlayer.currentTime);
  byId('audioLength').textContent = clock(duration);
  byId('audioPlay').textContent = audioPlayer.paused ? 'Play' : 'Pause';
}
function updateAudioVolume() {
  const fadeIn = number('audioFadeIn',0), fadeOut = number('audioFadeOut',0);
  const elapsed = audioPlayer.currentTime || 0;
  const clipLeft = Number.isFinite(audioPlayer.duration) && !audioPlayer.loop ? audioPlayer.duration-elapsed : Infinity;
  const sectionLeft = byId('audioSync').checked && activeRun?.section?.kind
    ? activeRun.section.duration/1000-activeRun.sectionElapsed/1000 : Infinity;
  const level = Math.max(0,Math.min(1,fadeIn ? elapsed/fadeIn : 1,fadeOut ? Math.min(clipLeft,sectionLeft)/fadeOut : 1));
  audioPlayer.volume = Number(byId('audioVolume').value)*level;
}
for (const event of ['timeupdate','durationchange','play','pause','emptied']) {
  audioPlayer.addEventListener(event,() => { syncAudioDisplay(); updateAudioVolume(); });
}
byId('audioProgress').oninput = event => { audioPlayer.currentTime = Number(event.target.value); };
for (const id of ['audioVolume','audioFadeIn','audioFadeOut']) byId(id).oninput = updateAudioVolume;
function makeGrabbable(panel,handle,container) {
  let drag;
  handle.addEventListener('pointerdown',event => {
    if (event.button !== 0 || event.target.closest('button,input,select,textarea')) return;
    const box = panel.getBoundingClientRect();
    const bounds = container.getBoundingClientRect();
    drag = {id:event.pointerId,x:event.clientX-box.left,y:event.clientY-box.top,width:box.width,height:box.height,bounds};
    handle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  handle.addEventListener('pointermove',event => {
    if (drag?.id !== event.pointerId) return;

      if (drag.lastSign && drag.lastSign!==sign) { drag.turns++; drag.shakeTime=now; }
      drag.lastSign=sign;
      if (drag.turns>=3) { extinguish(item); drag.used=true; }
    }
    drag.lastTip=tip;
  }
  transferFlame(item);
};
function endDrag(event) {
  if (!drag || event.pointerId !== drag.pointer) return;
  const item = itemById(drag.id);
  const moved = drag.moved;
  drag = null;
  if (item && moved) {
    snap(item);
    drawPositions();
    transferFlame(item);
    persist();
  } else drawPositions();
}
board.onpointerup = board.onpointercancel = board.onlostpointercapture = endDrag;
board.ondblclick = event => extinguish(itemById(event.target.closest('.piece')?.dataset.id));
board.onkeydown = event => {
  const item = itemById(event.target.closest('.piece')?.dataset.id);
  if (!item) return;
  const direction = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[event.key];
  if (direction) {
    event.preventDefault();
    const p = point(item), step = event.shiftKey ? 18 : 5;
    moveTo(item,p.x+direction[0]*step,p.y+direction[1]*step);
    transferFlame(item);
    persist();
  } else if (event.key.toLowerCase() === 'l' && item.kind === 'match') {
    if (strikerNear(wick(item))) light(item);
  } else if (event.key.toLowerCase() === 'x') extinguish(item);
};
board.onclick = event => {
  if (event.detail === 0) select(event.target.closest('.piece')?.dataset.id || null);
};
new ResizeObserver(drawPositions).observe(board);

$('addImage').onclick = () => $('imageFile').click();
$('imageFile').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1,640/Math.max(bitmap.width,bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(bitmap.width*scale));
    canvas.height = Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
    bitmap.close();
    add('image',{name:file.name.replace(/\.[^.]+$/,''),image:canvas.toDataURL('image/webp',.87)});
  } catch { showError('Could not open that image.'); }
};
$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(rooms,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'Lost_Property_Rooms.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};
$('import').onclick = () => $('projectFile').click();
$('projectFile').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !validateRooms(data)) throw Error('Invalid rooms');
    for (const timer of flames.values()) clearTimeout(timer);
    flames.clear();
    rooms = data;
    selected = null;
    renderRoom();
    persist();
  } catch { showError('Could not open these rooms. Choose a Lost Property Rooms JSON file.'); }
};
renderRoom();
makeGrabbable(popup,popup.querySelector('.windowHead'),$('viewer'));
function setOpen(open) {
  board.hidden = popup.hidden = !open;
  toggle.setAttribute('aria-pressed',String(open));
  $('propertyError').hidden = true;
  if (open) renderRoom();
}
toggle.onclick = () => {
  if (board.hidden) {
    if (activeRun) stopPlayback();
    closePad();
    document.dispatchEvent(new Event('larcreditor:property'));
    setCurtain(false);
    setOpen(true);
  } else setOpen(false);
};
$('propertyClose').onclick = () => { setOpen(false); toggle.focus(); };
for (const name of ['larcreditor:play','larcreditor:marbles']) {
  document.addEventListener(name,() => { if (!board.hidden) setOpen(false); });
}

})();
</script>
<script>
(() => {
  const panel=byId('marbleStage'), button=byId('marbleToggle'), canvas=byId('marbleCanvas');
  const ctx=canvas.getContext('2d');
  const width=960,height=560;
  const colours=['#70dbff','#fb896c','#dea1ff','#ffc75d','#8de4ac','#eee6db'];
  const launch=[136,478,816];
  const rails=[
    [55,28,55,508],[905,28,905,508],[55,508,166,544],[166,544,794,544],[794,544,905,508],
    [66,77,308,130],[383,124,600,75],[674,92,863,136],
    [294,163,133,221],[597,144,418,198],[659,178,833,228],
    [70,246,359,300],[408,254,552,286],[890,270,631,322],
    [85,336,225,368],[556,338,325,386],[694,347,866,383],
    [233,411,436,449],[745,400,510,452],
    [88,440,197,472],[875,443,768,479]
  ];
  const pegs=[[355,139,13],[627,131,12],[283,221,13],[401,227,11],[530,220,12],[632,239,12],[782,231,11],
    [375,333,12],[590,338,12],[276,386,11],[466,415,13],[611,426,10],[480,483,16]];
  let marbles=[],nextColour=0,frame=0,last=0,carry=0;

  function collide(ball,x,y,limit,bounce) {
    const dx=ball.x-x,dy=ball.y-y;
    const distance=Math.hypot(dx,dy);
    if (distance>=limit) return;
    const nx=distance ? dx/distance : 0;
    const ny=distance ? dy/distance : -1;
    const push=limit-distance+.015;
    ball.x+=nx*push;
    ball.y+=ny*push;
    const into=ball.vx*nx+ball.vy*ny;
    if (into>=0) return;
    ball.vx-=(1+bounce)*into*nx;
    ball.vy-=(1+bounce)*into*ny;
    ball.vx*=.998;
  }

  function update(dt) {
    for (const ball of marbles) {
      ball.vy+=630*dt;
      ball.vx*=.999;
      ball.x+=ball.vx*dt;
      ball.y+=ball.vy*dt;
      for (const [x1,y1,x2,y2] of rails) {
        const dx=x2-x1,dy=y2-y1;
        const along=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/(dx*dx+dy*dy)));
        collide(ball,x1+along*dx,y1+along*dy,ball.r+3,.26);
      }
      for (const [x,y,r] of pegs) collide(ball,x,y,ball.r+r,.55);
      if (ball.y<490 && Math.hypot(ball.vx,ball.vy)<15) {
        ball.stalled+=dt;
        if (ball.stalled>.55) {
          ball.vx=(ball.x>width/2 ? -1 : 1)*(112+Math.random()*32);
          ball.vy=-117;
          ball.stalled=0;
        }
      } else ball.stalled=0;
    }
    for (let i=0;i<marbles.length;i++) {
      for (let j=i+1;j<marbles.length;j++) {
        const a=marbles[i],b=marbles[j];
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),reach=a.r+b.r;
        if (!d || d>=reach) continue;
        const nx=dx/d,ny=dy/d,push=(reach-d)/2;
        a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
        const speed=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if (speed>=0) continue;
        const impulse=-speed*.64;
        a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse;
      }
    }
    marbles=marbles.filter(ball=>ball.y<height+60);
  }

  function draw() {
    const background=ctx.createLinearGradient(0,0,0,height);
    background.addColorStop(0,'#231726');
    background.addColorStop(.58,'#171b2b');
    background.addColorStop(1,'#070c16');
    ctx.fillStyle=background;
    ctx.fillRect(0,0,width,height);
    ctx.strokeStyle='#e1af7f14';
    ctx.lineWidth=1;
    for(let y=57;y<height;y+=55) {
      ctx.beginPath();ctx.moveTo(59,y);ctx.lineTo(901,y);ctx.stroke();
    }
    for(const x of launch) {
      ctx.fillStyle='#382c3e';ctx.strokeStyle='#d49762';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(x,20,27,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#efc99e';
      ctx.beginPath();ctx.moveTo(x-4,18);ctx.lineTo(x+4,18);ctx.lineTo(x,24);ctx.fill();
    }
    ctx.lineCap='round';
    for (const [x1,y1,x2,y2] of rails) {
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle='#4f353c';ctx.lineWidth=12;ctx.stroke();
      ctx.strokeStyle='#ba805d';ctx.lineWidth=6;ctx.stroke();
      ctx.strokeStyle='#f8c793';ctx.lineWidth=1.2;ctx.stroke();
    }
    for (const [x,y,r] of pegs) {
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle='#593e58';ctx.fill();
      ctx.strokeStyle='#e4ac7b';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(x-2,y-2,2,0,Math.PI*2);ctx.fillStyle='#ffd2a7';ctx.fill();
    }
    for (const {x,y,r,colour} of marbles) {
      const shine=ctx.createRadialGradient(x-r*.37,y-r*.43,1,x,y,r);
      shine.addColorStop(0,'#fff');shine.addColorStop(.29,colour);shine.addColorStop(.75,colour);shine.addColorStop(1,'#202137');
      ctx.fillStyle=shine;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff4';ctx.lineWidth=1;ctx.stroke();
    }
  }

  function tick(now) {
    if (panel.hidden) return;
    carry+=Math.min(.04,(now-last)/1000);
    last=now;
    while(carry>=1/180) {
      update(1/180);
      carry-=1/180;
    }
    draw();
    frame=requestAnimationFrame(tick);
  }

  function drop(x) {
    if (marbles.length>=54) marbles.shift();
    const r=8+Math.random()*4;
    marbles.push({x,y:24-Math.random()*15,r,stalled:0,vx:(Math.random()-.5)*64,vy:12,colour:colours[nextColour++%colours.length]});
  }

  function setOpen(open) {
    panel.hidden=!open;
    button.setAttribute('aria-pressed',String(open));
    cancelAnimationFrame(frame);
    if (!open) return;
    last=performance.now();
    carry=0;
    draw();
    frame=requestAnimationFrame(tick);
  }

  button.onclick=() => {
    if (!panel.hidden) { setOpen(false); return; }
    if (activeRun) stopPlayback();
    closePad();
    document.dispatchEvent(new Event('larcreditor:marbles'));
    setCurtain(false);
    setOpen(true);
  };
  byId('marbleDrop').onclick=()=>drop(launch[nextColour%launch.length]);
  byId('marbleShower').onclick=()=>{
    for(const x of launch) for(let i=0;i<3;i++) drop(x+(i-1)*24);
  };
  byId('marbleClear').onclick=()=>{marbles=[];draw();};
  canvas.onpointerdown=event=>{
    if (event.button!==0) return;
    const bounds=canvas.getBoundingClientRect();
    const x=(event.clientX-bounds.left)/bounds.width*width;
    drop(Math.max(79,Math.min(881,x)));
  };
  canvas.onkeydown=event=>{
    if (event.key!=='Enter' && event.code!=='Space') return;
    event.preventDefault();
    drop(launch[nextColour%launch.length]);
  };
  for (const name of ['larcreditor:play','larcreditor:property']) {
    document.addEventListener(name,()=>{if(!panel.hidden)setOpen(false);});
  }
})();
</script>
</body>
