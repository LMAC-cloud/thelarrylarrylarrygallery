<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,serif}
body{color:#eee}
#space{position:fixed;inset:0;background:#000;cursor:default}
#stars{position:absolute;inset:0;width:100%;height:100%}
#niagaraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0;background:#000;pointer-events:none}
#space.niagaraMode #stars{display:none}
#space.niagaraMode #niagaraVideo{display:block}
#space.niagaraMode #objects{z-index:2}
#sphere.niagaraSun{
 width:112px;height:112px;left:50%!important;top:46%!important;
 background:radial-gradient(circle at 38% 34%,#fff 0%,#fff8c9 18%,#ffd34d 42%,#ff9b22 66%,#ff5b00 84%,#9d2100 100%);
 box-shadow:0 0 20px #fff,0 0 52px rgba(255,210,70,.98),0 0 110px rgba(255,120,0,.78);
 animation:sunPulse 2.4s ease-in-out infinite;z-index:2000!important;cursor:pointer!important;pointer-events:auto!important;
}
#sphere.niagaraSun:hover{box-shadow:0 0 22px #fff,0 0 58px rgba(255,225,90,1),0 0 110px rgba(255,100,0,.85)}
@keyframes sunPulse{0%,100%{transform:translate(-50%,-50%) scale(.96)}50%{transform:translate(-50%,-50%) scale(1.04)}}
#sphere.niagaraSun:active{cursor:pointer!important}
#niagaraButton{border-color:#777}
#objects{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.projectile{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform,opacity}
.projectile img{display:block;width:100%;height:100%;object-fit:contain}
.projectile.drawn{background:transparent}
.projectile canvas{display:block;width:100%;height:100%}
#typingZone{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:34vw;min-width:260px;max-width:520px;height:68vh;z-index:840;background:transparent;cursor:text;pointer-events:auto}
#typingSmoke{position:absolute;left:5%;right:5%;top:50%;height:12px;transform:translateY(-50%);border-radius:50%;pointer-events:none;opacity:.16;filter:blur(7px);background:linear-gradient(90deg,transparent 0%,currentColor 14%,currentColor 50%,currentColor 86%,transparent 100%);animation:smokeDrift 5.5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes smokeDrift{0%,100%{opacity:.09;transform:translateY(-50%) scaleX(.94)}50%{opacity:.19;transform:translateY(-50%) scaleX(1.03)}}


#controls{
 position:fixed;right:2px;left:auto;bottom:2px;transform:none;
 display:flex;align-items:center;gap:2px;padding:3px 4px;
 background:rgba(0,0,0,.55);border:0;border-radius:4px;
 z-index:1000;white-space:nowrap
}
button,.fileButton{
 color:#eee;background:rgba(12,12,12,.82);border:1px solid #3e3e3e;
 border-radius:3px;padding:3px 6px;font:600 9px Arial,sans-serif;
 cursor:pointer;user-select:none
}
button:hover,.fileButton:hover{border-color:#8b5a2b;background:#17120e}
button.active{border-color:#8b5a2b;box-shadow:0 0 5px rgba(139,90,43,.35)}
button:focus,select:focus,input:focus{outline:1px solid #8b5a2b;outline-offset:-1px}
input[type=checkbox]{accent-color:#8b5a2b}
select:focus{border-color:#8b5a2b}
#launch{width:54px;border-color:#4c4c4c;color:#fff;background:rgba(12,12,12,.9);box-shadow:none}
#launch:hover{box-shadow:0 0 8px rgba(157,124,255,.35)}
#clear{border-color:#4c4c4c}
#radio{font-size:9px;padding:3px 6px}
#typeInput{
 position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
 width:min(760px,78vw);height:40px;background:transparent;border:0;
 color:#fff;padding:0 4px;outline:none;z-index:860;text-align:center;
 font:15px Georgia,serif;line-height:18px;caret-color:#c7b4ff;resize:none;overflow:hidden
}
#typeInput:focus{border:0;outline:0}

.panel{
 position:fixed;z-index:1100;background:rgba(8,8,8,.86);backdrop-filter:blur(5px);
 border:1px solid #4a4a4a;border-radius:4px;box-shadow:0 4px 18px #000;
 padding:5px;font:9px Arial,sans-serif;color:#ddd;display:none
}
.panel.open{display:block}
.panel h4{
 margin:0 0 4px;font:600 10px Georgia,serif;color:#fff;
 cursor:grab;user-select:none
}
.panel h4:active{cursor:grabbing}
.row{display:flex;align-items:center;gap:4px;margin:3px 0}
.row label{white-space:nowrap}
.panel button{font:9px Arial,sans-serif;padding:3px 5px}
.panel input[type=number]{width:68px;height:26px;background:#111;color:#fff;border:1px solid #555;padding:2px 6px;font-size:11px}
.panel input[type=range]{width:88px}
.panel select{max-width:150px;background:#111;color:#eee;border:1px solid #555;padding:2px;font-size:9px}
.panel input[type=color]{width:28px;height:19px;padding:0;border:1px solid #555}
.panel input[type=checkbox],.panel input[type=radio]{accent-color:#9d7cff}
.small{font-size:8px;color:#999}
#effectsPanel{display:none}
#repeatPanel{bottom:38px;right:360px;left:auto;width:220px}
#textPanel{bottom:38px;right:150px;left:auto;width:300px;max-height:78vh;overflow:auto}
#radioPanel{bottom:38px;right:5px;left:auto;width:430px;max-height:88vh;overflow:auto}
#radioMeta{display:flex;align-items:center;gap:5px;height:24px;margin-bottom:3px}
#radioTime{margin-left:auto;font:600 10px monospace;color:#ddd}
#radioTitle{width:180px;overflow:hidden;white-space:nowrap;border:1px solid #333;padding:2px 4px;font:9px Georgia,serif;color:#ff8a00;animation:titleScroll 9s linear infinite}@keyframes titleScroll{0%,18%{text-indent:0}82%,100%{text-indent:-70px}}
#radioGraphic{width:100%;height:34px;border:1px solid #333;background:rgba(0,0,0,.35);display:block}
.checkDropdown{border:1px solid #333;margin:3px 0;background:rgba(0,0,0,.18)}
.checkDropdown summary{cursor:pointer;padding:3px 4px;font-weight:600;list-style:none}
.checkDropdown summary::-webkit-details-marker{display:none}
.checkDropdownBody{padding:3px;display:flex;flex-wrap:wrap;gap:3px}
.checkDropdownBody label{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.prefRow{display:flex;gap:3px;flex-wrap:wrap}
#spherePanel{position:absolute;width:330px;max-height:82vh;overflow:auto}
#spherePanel.expanded{width:min(620px,70vw);height:min(620px,70vh);max-height:none}
#spherePanel.expanded #savedText{height:calc(100% - 155px);min-height:260px;font-size:16px;resize:both}
#savedText{font-family:Chomsky,Georgia,serif}
#starfieldPanel{left:8px;top:8px;width:210px}
#drawPanel{left:auto;right:330px;bottom:78px;top:auto;width:390px;height:285px;padding:5px;background:transparent;border:0;border-bottom:1px solid rgba(180,180,180,.16);box-shadow:none}
#drawMoveHandle{position:absolute;left:0;right:0;bottom:-1px;height:10px;background:transparent;border-bottom:1px solid rgba(210,210,210,.24);cursor:grab;z-index:4}
#drawClose{width:42px;height:24px;padding:2px 5px;font-size:9px}
#drawPanel.open{display:block}
#drawCanvas{width:100%;height:100%;background:transparent;border:0;outline:0;cursor:crosshair;display:block}
#drawToolsHandle{height:12px;margin-bottom:3px;cursor:grab;border:0;background:rgba(255,255,255,.03)}
#drawToolsPanel{left:auto;right:330px;bottom:370px;top:auto;width:235px}
#drawToolsPanel .tools{display:flex;gap:3px;flex-wrap:wrap}
#drawToolsPanel .tools button{font-size:8px;padding:3px 5px}
#drawToolsPanel .colorSwatch{width:16px;height:16px;min-width:16px;max-width:16px}
#drawToolsPanel input[type=number]{width:68px;height:27px;font-size:12px;padding:2px 6px}
#drawToolsPanel select{height:23px;font-size:9px}
#drawToolsPanel .drawControlRow{display:flex;align-items:center;gap:4px;margin:4px 0}
#drawToolsPanel .drawClose{font-size:9px}
#drawToolsPanel .checkRow{display:flex;flex-wrap:wrap;gap:3px}
#drawToolsPanel .colorSwatch{margin:0}
.colorSwatch{width:17px;height:17px;min-width:17px;max-width:17px;padding:0;border:1px solid #aaa;flex:0 0 17px}
#drawPalette{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}

#drawMoveHandle:active{cursor:grabbing}
#drawPanel.drawing{background:rgba(8,8,8,.03)}
#drawPalette{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
#drawPalette .colorSwatch{cursor:pointer}
#drawTab{display:block}
#loadedList{max-height:60vh;overflow:auto;margin-top:3px}
.loadedItem .groupLabel{margin-left:2px}
.loadedItem select{height:22px}
.loadedItem input[type=checkbox]{margin:0 2px 0 0}
.loadedItem .sizeLabel{margin-left:auto}
.loadedItem{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:9px}
.loadedItem img{width:22px;height:22px;object-fit:contain;background:#222}

#spherePanel .archivePrimary{position:relative}
#spherePanel.expanded .jpgControls{display:none} #spherePanel.expanded .archivePrimary .fileButton{display:none}
#spherePanel h4{cursor:grab}
#spherePanel.expanded h4{cursor:grab}
#spherePanel.expanded{min-width:520px;min-height:430px}
#spherePanel .jpgControls{border-top:0;padding-top:2px}
#archiveTextSize{width:62px;height:27px;font-size:12px}
#jpgLaunchButton{margin-left:auto}
#loadedList{max-height:38vh}
#spherePanel.expanded #loadedList{display:none}
#savedText{width:100%;height:170px;background:#111;color:#ddd;border:1px solid #444;resize:none;padding:6px;font-size:16px;line-height:1.3;font-family:Chomsky,Georgia,serif}
#playlist{max-height:110px;overflow:auto;border:1px solid #333;padding:2px}
.song{display:flex;gap:4px;align-items:center;padding:2px;border-bottom:1px solid #222;cursor:grab}
.song.dragging{opacity:.5}
.song .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#visualShow{font-size:9px}
.hiddenInput{display:none}
#doneFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2000}
#sphere{
 position:absolute;left:72%;top:34%;width:34px;height:34px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff,#ffffff 24%,#d8d8d8 48%,#888 76%,#222 100%);
 box-shadow:0 0 12px #fff,0 0 28px rgba(255,255,255,.55);
 cursor:grab;z-index:900;animation:bob 2.7s ease-in-out infinite
}
#sphere:hover{box-shadow:0 0 16px #fff,0 0 36px rgba(255,255,255,.75)}
#sphere:active{cursor:grabbing}
@keyframes bob{0%,100%{transform:translateY(-5px) scale(.94)}50%{transform:translateY(5px) scale(1.06)}}
.starfieldTab{
 position:fixed;left:8px;top:8px;z-index:1050;padding:4px 6px;
 background:rgba(8,8,8,.38);border:1px solid rgba(150,150,150,.35);
 border-radius:3px;font:600 9px Arial,sans-serif;color:#ddd;cursor:pointer
}
.starfieldTab:hover{border-color:#9d7cff}

@font-face{font-family:"Chomsky";src:url("Font/Chomsky.otf") format("opentype");font-display:swap}
@font-face{font-family:"Dune Rise";src:url("Font/Dune_Rise.otf") format("opentype");font-display:swap}
@font-face{font-family:"Momt";src:url("Font/Mom«t___.ttf") format("truetype");font-display:swap}
@media(max-width:900px){
 #controls{gap:1px}.controlsExtra{display:none}button,.fileButton{padding:3px 5px;font-size:8px}
 #typeInput{width:75vw}.panel{font-size:8px}
}
</style>
</head>
<body>
<div id="space">
 <video id="niagaraVideo" class="niagaraVideo" muted loop playsinline preload="auto" aria-hidden="true"></video>
 <canvas id="stars"></canvas>
 <div id="objects"></div>
 <div id="paintStage"></div>
 <div id="sphere" title=""></div>
</div>

<textarea id="typeInput" autocomplete="off" spellcheck="false" aria-label="text" rows="2"></textarea>
<div id="typingZone" aria-hidden="true"><div id="typingSmoke"></div></div>

<div id="starfieldTab" class="starfieldTab">STARFIELD</div>

<div id="controls">
 <button id="clear">CLEAR</button>
 <button id="repeatBtn">REPEAT</button>
 <button id="drawBtn">DRAW</button>
 <button id="shakeBtn">SHAKE</button>
 <button id="launch">LAUNCH</button>
 <button id="radio">Radio Laurentis</button>
</div>


<div id="repeatPanel" class="panel">
 <h4>JPG REPEAT</h4>
 <div class="row"><label>COUNT</label><input id="repeatNumber" type="number" min="1" max="99" value="1"><button id="repeatNumberBtn">LAUNCH</button></div>
 <div class="row"><label>SPEED</label><input id="repeatSpeed" type="range" min="80" max="1400" value="360"></div>
</div>

<div id="textPanel" class="panel">
 <h4>SHAKE / TEXT</h4>
 <div class="row"><label>SIZE</label><input id="fontSize" type="range" min="10" max="130" value="130"><input id="fontSizeNumber" type="number" min="10" max="130" value="130"></div>
 <div class="row"><label>FONT</label><select id="fontSelect"><option value="Chomsky">Chomsky</option><option value="Dune Rise" selected>Dune Rise</option><option value="Momt">Momt</option><option value="Trebuchet MS">Trebuchet</option><option value="Courier New">Courier</option><option value="Georgia">Georgia</option></select></div>
 <div class="row"><label>STYLE</label><select id="textStyle"><option>opaque</option><option selected>translucent</option><option>outline</option></select><label>SPEED</label><select id="textSpeed"><option value="slow">Slow</option><option value="medium">Medium</option><option value="fast" selected>Fast</option></select></div>
 <div class="row"><label>ALIGN</label><select id="textAlign"><option value="left">Left</option><option value="center" selected>Centre</option><option value="right">Right</option></select></div>
 <div class="row"><label>EFFECT</label><select id="effectSelect2"></select></div>
 <div class="row"><label><input id="wordCloudToggle" type="checkbox"> LAST WORD CLOUD</label><label>SIZE</label><select id="wordCloudSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option><option value="huge" selected>Huge</option></select></div>
 <div class="row"><label>COLOUR</label><select id="textColour"><option value="#ff3030">Red</option><option value="#ff8a00">Orange</option><option value="#ffe600">Yellow</option><option value="#44ff66">Green</option><option value="#4888ff">Blue</option><option value="#7b4dff">Purple</option><option value="rainbow">Rainbow</option><option value="#ff8a00">Fire</option><option value="random">Random</option><option value="#8b5a2b">Brown</option><option value="#000000">Black</option></select></div>
 <div class="row"><label>BACKWARDS</label><input id="backwardsToggle" type="checkbox"></div>
 <div class="row"><label>GLOW</label><select id="textGlowEffect"><option value="none">None</option><option value="soft">Soft</option><option value="strong">Strong</option><option value="fire">Fire — orange glow</option><option value="halo">Halo</option><option value="rainbow">Rainbow</option></select></div>
 <div class="row"><label>LINGER</label><input id="linger" type="range" min="500" max="10000" value="5800"></div>
 <div class="row"><label>REPEAT</label><input id="typeRepeatDirect" type="number" min="1" max="99" value="8"></div>
 <div class="row"><label><input id="repeatFade" type="checkbox"> FADE</label><label><input id="repeatLouder" type="checkbox"> WOT?</label></div>
 <div class="row"><label>REPEAT STYLE</label><select id="repeatStyle"><option value="same">Same</option><option value="rainbow">Rainbow sequence</option><option value="random">Random</option><option value="fade">Fade only</option><option value="grow">Grow only</option></select></div>
 <div class="row"><label><input id="subtitleToggle" type="checkbox" checked> SUBTITLE</label><label>SIZE</label><input id="subtitleSize" type="number" min="8" max="160" value="28"></div>
 <div class="row"><label>SUB FONT</label><select id="subtitleFont"><option>Dune Rise</option><option selected>Dune Rise</option><option>Georgia</option><option>Trebuchet MS</option><option>Courier New</option><option>Chomsky</option><option>Momt</option></select><label>COLOUR</label><select id="subtitleColour"><option value="#ffffff">White</option><option value="#8b5a2b">Brown</option><option value="#ff3030">Red</option><option value="#ff8a00">Orange</option><option value="#ffe600">Yellow</option><option value="#44ff66">Green</option><option value="#4888ff">Blue</option><option value="#7b4dff">Purple</option></select></div>
 <div class="row"><label class="fileButton" for="fontInput">LOAD FONT</label><input id="fontInput" class="hiddenInput" type="file" accept=".ttf,.otf,.woff,.woff2"></div>
 <div class="row"><label><input id="voiceToggle" type="checkbox"> VOICE</label><label><input id="complimentToggle" type="checkbox"> COMPLIMENT</label></div>
 <div class="row"><label><input id="pirateToggle" type="checkbox"> THOU ROYAL PIRATES</label><label><input id="ladyToggle" type="checkbox" checked> THY FANCY LADY</label></div>
 <div class="row"><label>VOICE REPEAT</label><input id="voiceRepeat" type="number" min="1" max="45" value="1"></div>
 <div class="row"><label><input id="voiceFade" type="checkbox" checked> SHH NOW</label><label><input id="voiceLouder" type="checkbox"> WOT?</label></div>
</div>

<div id="drawPanel" class="panel">
 <div id="drawMoveHandle" aria-hidden="true"></div>
 <canvas id="drawCanvas" width="560" height="400"></canvas>
</div>
<div id="drawToolsPanel" class="panel">
 <div id="drawToolsHandle" aria-hidden="true"></div>
 <div class="tools"><button data-width="1">1</button><button data-width="2">2</button><button data-width="4">4</button><button data-width="8">8</button><button data-width="14">14</button><button data-width="24">24</button></div>
 <div id="drawPalette"></div>
 <div class="drawControlRow"><button id="eraseDraw">CLEAR</button><button id="drawUndo">UNDO</button><button id="drawRedo">REDO</button><label>MODE</label><select id="drawMode"><option>drop</option><option>delayed</option><option>immediate</option><option>launch</option></select></div>
 <div class="drawControlRow"><label>REPEAT</label><input id="drawRepeat" type="number" min="1" max="99" value="1"><label>GLOW</label><input id="drawGlow" type="range" min="0" max="35" value="18"></div>
 <div class="drawControlRow"><label>EFFECT</label><select id="drawEffect"><option selected>Orbit</option><option>Rise &amp; Fade</option><option>Drift Away</option><option>Fly Left</option><option>Fly Right</option><option>Drop</option><option>Spiral Away</option><option>Wave</option><option>Orbit</option><option>Burst</option><option>Float Up</option></select><button id="launchDrawing">LAUNCH</button><button id="drawClose">CLOSE</button></div>
</div>

<div id="radioPanel" class="panel">
 <h4>RADIO LAURENTIS</h4>
 <div id="radioMeta"><span id="radioTitle">NO TRACK</span><span id="radioTime">00:00 / 00:00</span></div>
 <canvas id="radioGraphic" width="400" height="34"></canvas>
 <div class="row"><label class="fileButton" for="audioInput">ADD MP3</label><input id="audioInput" class="hiddenInput" type="file" accept="audio/*" multiple></div>
 <div id="playlist"></div>
 <div class="row"><button id="prevSong">◀</button><button id="playSong">PLAY</button><button id="pauseSong">PAUSE</button><button id="nextSong">▶</button><label><input id="repeatSong" type="checkbox"> SONG</label><label><input id="repeatAll" type="checkbox"> ALL</label><label>FADE</label><input id="fadeSeconds" type="number" min="0" max="30" value="3" style="width:38px"></div>
 <div class="row"><label><input id="musicShow" type="checkbox"> RANDOM EFFECT SHOW</label><label><input id="originalShow" type="checkbox"> SPRITE SHOW</label></div>
 <div class="prefRow"><button data-pref="1" id="prefSave1">SAVE 1</button><button data-pref="2" id="prefSave2">SAVE 2</button><button data-pref="3" id="prefSave3">SAVE 3</button><button data-load="1" id="prefLoad1">LOAD 1</button><button data-load="2" id="prefLoad2">LOAD 2</button><button data-load="3" id="prefLoad3">LOAD 3</button></div>
 <details class="checkDropdown"><summary>SHOW STYLE</summary><div class="checkDropdownBody" id="showStyleChecks"><label><input type="checkbox" value="same" checked>One shape repeated</label><label><input type="checkbox" value="different">Different shapes</label><label><input type="checkbox" value="movement">Movement changes</label><label><input type="checkbox" value="thickness">Thickness changes</label><label><input type="checkbox" value="chaos">Maximum variation</label></div></details>
 <details class="checkDropdown"><summary>MOVEMENT</summary><div class="checkDropdownBody" id="movementChecks"><label><input type="checkbox" value="Rise" checked>Rise</label><label><input type="checkbox" value="Drift">Drift</label><label><input type="checkbox" value="Spiral">Spiral</label><label><input type="checkbox" value="Orbit">Orbit</label><label><input type="checkbox" value="Swoop">Swoop</label><label><input type="checkbox" value="Random">Random</label></div></details>
 <details class="checkDropdown"><summary>SHAPES</summary><div class="checkDropdownBody" id="shapeChecks"><label><input type="checkbox" value="line" checked>Simple line</label><label><input type="checkbox" value="curve">Curved line</label><label><input type="checkbox" value="scribble">Scribble</label><label><input type="checkbox" value="wave">Wave</label><label><input type="checkbox" value="arc">Arc</label><label><input type="checkbox" value="coil">Loose coil</label><label><input type="checkbox" value="rings">Rings</label><label><input type="checkbox" value="starburst">Starburst</label><label><input type="checkbox" value="northern">Northern lights</label><label><input type="checkbox" value="abstract">Abstract</label><label><input type="checkbox" value="wide">Wide horizontal</label><label><input type="checkbox" value="random" checked>Random shape</label></div></details>
 <details class="checkDropdown"><summary>RANDOM MODE</summary><div class="checkDropdownBody" id="randomModeChecks"><label><input type="checkbox" value="off" checked>Off</label><label><input type="checkbox" value="everything">Everything</label><label><input type="checkbox" value="shape">Shape</label><label><input type="checkbox" value="placement">Placement</label><label><input type="checkbox" value="thickness">Thickness</label><label><input type="checkbox" value="movement">Movement</label><label><input type="checkbox" value="northern">Northern lights</label><label><input type="checkbox" value="starburst">Starburst storm</label><label><input type="checkbox" value="comet">Comet field</label></div></details>
 <details class="checkDropdown"><summary>LAYERS / TRACERS / COLOUR</summary><div class="checkDropdownBody">
  <label>LAYERS <input id="randomLayerCount" type="number" min="1" max="80" value="1"></label>
  <label>THICKNESS <input id="randomThickness" type="number" min="1" max="40" value="6"></label>
  <label>TRACERS <select id="randomTracers"><option value="off">Off</option><option value="weak">Weak</option><option value="medium">Medium</option><option value="strong">Strong</option><option value="on">Very strong</option></select></label>
  <label>COLOUR <select id="randomColourMode"><option value="rainbow">Rainbow</option><option value="random">Random</option><option value="rainbowRandom">Rainbow + Random</option><option value="white">White</option></select></label>
 </div></details>
 <div class="row"><label>SHAPE COUNT</label><input id="randomShapeCount" type="number" min="1" max="99" value="1"><label><input id="sameShapeToggle" type="checkbox" checked> SAME</label></div>
 <div class="row"><label><input id="radioLaunchToggle" type="checkbox"> RADIO LAUNCH</label><button id="radioLaunch">LAUNCH</button></div>
 <audio id="audio" style="width:100%;height:25px"></audio>
</div>

<div id="spherePanel" class="panel">
 <h4>ARCHIVE</h4>

<script>
'use strict';

/* =========================================================
   STARFIELD — fluid realistic dots; ORIGINAL HYPHOSPEED remains isolated
   ========================================================= */
const starCanvas=document.getElementById('stars'),starCtx=starCanvas.getContext('2d');
let W=innerWidth,H=innerHeight,stars=[],hypnoStars=[];
function resize(){W=innerWidth;H=innerHeight;starCanvas.width=W*devicePixelRatio;starCanvas.height=H*devicePixelRatio;starCanvas.style.width=W+'px';starCanvas.style.height=H+'px';starCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);resetNormalStars();}
addEventListener('resize',resize);
function makeNormalStar(){return{x:(Math.random()-.5)*W*2.4,y:(Math.random()-.5)*H*2.4,z:.42+Math.random()*.9,pz:1,size:.62+Math.random()*.62,randomDirection:['forward','backward','up','down','left','right','spiral'][Math.floor(Math.random()*7)],angle:Math.random()*Math.PI*2};}
for(let i=0;i<1100;i++)stars.push(makeNormalStar());
function resetNormalStars(){for(const s of stars){s.x=(Math.random()-.5)*W*2.4;s.y=(Math.random()-.5)*H*2.4;s.z=.42+Math.random()*.9;s.pz=s.z;s.size=.62+Math.random()*.62;s.angle=Math.random()*Math.PI*2;s.randomDirection=['forward','backward','up','down','left','right','spiral'][Math.floor(Math.random()*7)];}}
function makeHypnoStar(reset=false){return{x:(Math.random()-.5)*W*.95,y:(Math.random()-.5)*H*.95,z:reset?Math.random():1,pz:1,size:.25+Math.random()*1.35};}
for(let i=0;i<650;i++)hypnoStars.push(makeHypnoStar());
const starCfg={direction:'forward',speed:'medium',hypno:false,size:'small',density:'normal'};
const starSpeeds={frozen:0,slow:.45,medium:1,fast:2.2,hyperspeed:4.2};
const starDensityCounts={sparse:600,normal:820,dense:1050};
const starSizeScale={tiny:.62,small:.9,medium:1.25,large:1.65,extra:2.05};
function resetNormalStar(s){Object.assign(s,makeNormalStar());}
function normalStarStep(s){const speed=starSpeeds[starCfg.speed],d=starCfg.direction==='random'?s.randomDirection:starCfg.direction;if(!speed)return;const step=.20*speed;if(d==='forward'||d==='backward'){s.z+=(d==='forward'?-1:1)*.0045*speed;if(s.z<.34||s.z>1.42)resetNormalStar(s);}else if(d==='up')s.y-=step;else if(d==='down')s.y+=step;else if(d==='left')s.x-=step;else if(d==='right')s.x+=step;else if(d==='spiral'){s.angle+=.0015*speed;const r=Math.hypot(s.x,s.y);s.x=Math.cos(s.angle)*r;s.y=Math.sin(s.angle)*r;}const bx=W*1.35,by=H*1.35;if(s.x<-bx)s.x=bx;if(s.x>bx)s.x=-bx;if(s.y<-by)s.y=by;if(s.y>by)s.y=-by;}
function drawStars(){starCtx.fillStyle='#000';starCtx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;if(starCfg.hypno){for(const s of hypnoStars){s.pz=s.z;s.z-=.010+(1-s.z)*.012;if(s.z<.001){Object.assign(s,makeHypnoStar(true));continue}const sx=cx+s.x/s.z,sy=cy+s.y/s.z,px=cx+s.x/s.pz,py=cy+s.y/s.pz;if(sx<-20||sx>W+20||sy<-20||sy>H+20)Object.assign(s,makeHypnoStar(true));const r=Math.max(.35,s.size/(s.z*2));starCtx.beginPath();starCtx.moveTo(px,py);starCtx.lineTo(sx,sy);starCtx.lineWidth=Math.min(3,r);starCtx.strokeStyle='rgba(255,255,255,'+Math.min(1,.25+1-s.z)+')';starCtx.stroke();starCtx.beginPath();starCtx.arc(sx,sy,r,0,Math.PI*2);starCtx.fillStyle='#fff';starCtx.fill();}}else{const count=starDensityCounts[starCfg.density];for(let i=0;i<count;i++){const s=stars[i];normalStarStep(s);const sx=cx+s.x/s.z,sy=cy+s.y/s.z;if(sx<-2||sx>W+2||sy<-2||sy>H+2)continue;const depth=Math.max(0,Math.min(1,1-s.z));const r=Math.max(.42,s.size*starSizeScale[starCfg.size]*(.72+depth*.55));starCtx.beginPath();starCtx.arc(sx,sy,r,0,Math.PI*2);starCtx.fillStyle='rgba(255,255,255,'+(0.42+depth*.58)+')';starCtx.fill();}}requestAnimationFrame(drawStars);}
resize();drawStars();

/* =========================================================
   STATE
   ========================================================= */
const state={
 sprites:[],effect:'Rise & Fade',repeatMode:'single',repeatCount:3,repeatSpeed:360,
 colour:'#8b5a2b',randomColour:false,glow:false,glowWidth:4,light:55,holding:false,
 holdTimer:null,textRepeat:1,paintSize:1,musicShow:false,spriteGlow:false
};
let visualGeneration=0;
const activeTimers=new Set();
function scheduleVisual(fn,delay){const gen=visualGeneration;const id=setTimeout(()=>{activeTimers.delete(id);if(visualGeneration===gen)fn();},delay);activeTimers.add(id);return id;}
function invalidateVisuals(){visualGeneration++;activeTimers.forEach(clearTimeout);activeTimers.clear();if(state.holdTimer){clearInterval(state.holdTimer);state.holdTimer=null;}state.holding=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null;}speechSynthesis.cancel();}
const effects=[
 'Rise & Fade','Drift Away','Fly Left','Fly Right','Scatter / Dissipate',
 'Dissolve','Pulse Away','Spiral Away','Wave','Orbit','Type On & Rise',
 'Mirror','Mirror Spiral','Spin Out','Burst','Float Up'
];
const effectSelect2=document.getElementById('effectSelect2');
effects.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;effectSelect2.appendChild(o)});
effectSelect2.value=state.effect;effectSelect2.onchange=e=>state.effect=e.target.value;const fontSize=document.getElementById('fontSize'),fontSizeNumber=document.getElementById('fontSizeNumber');fontSize.oninput=e=>fontSizeNumber.value=e.target.value;fontSizeNumber.oninput=e=>{const v=Math.max(10,Math.min(130,+e.target.value||42));fontSize.value=v;fontSizeNumber.value=v};document.getElementById('textSpeed').onchange=()=>{};

/* =========================================================
   EXCLUSIVE, DRAGGABLE COMPACT PANELS
   ========================================================= */
const panelIds=['repeatPanel','textPanel','radioPanel','spherePanel','starfieldPanel','drawPanel','drawToolsPanel'];
let panelZ=1100;
function closePanels(except=null){
 document.querySelectorAll('.panel').forEach(p=>{if(p!==except)p.classList.remove('open')});
}
function openPanel(p){
 closePanels(p);p.classList.add('open');p.style.zIndex=++panelZ;
}
const buttonPanelPairs=[['repeatBtn','repeatPanel'],['shakeBtn','textPanel'],['radio','radioPanel']];
buttonPanelPairs.forEach(([bId,pId])=>{
 const b=document.getElementById(bId),p=document.getElementById(pId);
 b.onclick=()=>{if(p.classList.contains('open'))p.classList.remove('open');else openPanel(p)};
 p.addEventListener('pointerdown',()=>p.style.zIndex=++panelZ);
});
document.getElementById('starfieldTab').onclick=()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));const p=document.getElementById('starfieldPanel');openPanel(p)};
document.getElementById('drawBtn').onclick=()=>{const p=document.getElementById('drawPanel'),t=document.getElementById('drawToolsPanel');const isOpen=p.classList.contains('open');if(isOpen){p.classList.remove('open');t.classList.remove('open')}else{openPanel(p);t.classList.add('open');t.style.zIndex=++panelZ}};
document.getElementById('drawClose').onclick=()=>{document.getElementById('drawPanel').classList.remove('open');document.getElementById('drawToolsPanel').classList.remove('open')};
document.getElementById('drawPanel').addEventListener('pointerdown',e=>{e.stopPropagation();document.getElementById('drawPanel').style.zIndex=++panelZ});
document.getElementById('drawToolsPanel').addEventListener('pointerdown',e=>{e.stopPropagation();document.getElementById('drawToolsPanel').style.zIndex=++panelZ});

function makeDraggable(panel,handle){
 let drag=false,dx=0,dy=0;
 handle.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,select,textarea'))return;
  drag=true;const r=panel.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
  panel.style.left=r.left+'px';panel.style.top=r.top+'px';panel.style.transform='none';panel.style.zIndex=++panelZ;
  handle.setPointerCapture(e.pointerId);e.preventDefault();
 });
 handle.addEventListener('pointermove',e=>{
  if(!drag)return;
  panel.style.left=Math.max(4,Math.min(W-panel.offsetWidth-4,e.clientX-dx))+'px';
  panel.style.top=Math.max(4,Math.min(H-panel.offsetHeight-4,e.clientY-dy))+'px';
 });
 handle.addEventListener('pointerup',()=>drag=false);
 handle.addEventListener('pointercancel',()=>drag=false);
}
document.querySelectorAll('.panel').forEach(p=>{const h=p.querySelector('h4');if(h)makeDraggable(p,h)});
makeDraggable(document.getElementById('drawPanel'),document.getElementById('drawMoveHandle'));
makeDraggable(document.getElementById('drawToolsPanel'),document.getElementById('drawToolsHandle'));

/* =========================================================
   STARFIELD OPTIONS
   ========================================================= */
document.getElementById('starDirection').onchange=e=>starCfg.direction=e.target.value;
document.getElementById('starSpeed').onchange=e=>starCfg.speed=e.target.value;
document.getElementById('starSize').onchange=e=>starCfg.size=e.target.value;
document.getElementById('starDensity').onchange=e=>starCfg.density=e.target.value;
document.getElementById('hypnoSpeed').onchange=e=>{
 starCfg.hypno=e.target.checked;
 if(starCfg.hypno){
  document.getElementById('starDirection').disabled=true;
  document.getElementById('starSpeed').disabled=true;
 }else{
  document.getElementById('starDirection').disabled=false;
  document.getElementById('starSpeed').disabled=false;
 }
};

/* =========================================================
   DRAW — floating, movable, transparent tab
   ========================================================= */
document.getElementById('drawPanel').addEventListener('click',e=>{if(e.target.closest('select,button,input,canvas'))e.stopPropagation()});
/* =========================================================
   LOAD — retained from the supplied script
   ========================================================= */
const fileInput=document.getElementById('fileInput'),loadedList=document.getElementById('loadedList');
document.getElementById('uncheckAll').onclick=()=>{state.sprites.forEach(s=>s.checked=false);renderLoadedList();};document.getElementById('checkAll').onclick=()=>{state.sprites.forEach(s=>s.checked=true);renderLoadedList();};document.querySelectorAll('.binToggle').forEach(cb=>cb.onchange=()=>{});document.getElementById('allBinsToggle').onchange=()=>{};document.querySelectorAll('.sendBin').forEach(btn=>btn.onclick=()=>{const b=+btn.dataset.bin;state.sprites.filter(x=>x.isImage&&x.checked!==false).forEach(x=>x.bin=b);renderLoadedList();document.querySelector('.binToggle[value=\"'+b+'\"]')?.click();});
document.getElementById('jpgGlow').onchange=e=>state.spriteGlow=e.target.value==='on';document.getElementById('spriteSize').onchange=e=>state.sprites.forEach(x=>{if(x.isImage)x.size=e.target.value;});
function renderLoadedList(){loadedList.innerHTML='';state.sprites.forEach((item,i)=>{if(!item.isImage)return;const row=document.createElement('div');row.className='loadedItem';row.dataset.index=i;const cb=document.createElement('input');cb.type='checkbox';cb.checked=item.checked!==false;cb.onchange=()=>item.checked=cb.checked;row.appendChild(cb);const span=document.createElement('span');span.textContent=item.name;row.appendChild(span);const size=document.createElement('select');size.className='sizeLabel';[['small','S'],['medium','M'],['large','L'],['huge','XL']].forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;size.appendChild(o)});size.value=item.size||'small';size.onchange=()=>item.size=size.value;row.appendChild(size);const bin=document.createElement('select');bin.className='groupLabel';[1,2,3,4].forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent='B'+n;bin.appendChild(o)});bin.value=item.bin||1;bin.onchange=()=>item.bin=+bin.value;row.appendChild(bin);loadedList.appendChild(row)})}
function spriteScale(item){const v=item.size||document.getElementById('spriteSize').value;return v==='small'?.55:v==='large'?1.45:v==='huge'?2.0:1}
/* =========================================================
   LAUNCH ENGINE
   ========================================================= */
function currentColour(){return state.randomColour?`hsl(${Math.random()*360},100%,70%)`:state.colour}

function launchSprite(sprite){
 if(!sprite||!sprite.isImage)return;
 const wrap=document.createElement('div');wrap.className='projectile';
 const img=document.createElement('img');img.src=sprite.url;
 wrap.appendChild(img);document.getElementById('objects').appendChild(wrap);
 const spriteScaleValue=spriteScale(sprite);

 const startX=(Math.random()-.5)*120;
 const startY=H*.58;
 const drift=(Math.random()-.5)*W*.75;
 const scale0=(.08+Math.random()*.08)*spriteScaleValue, scale1=(.7+Math.random()*1.7)*spriteScaleValue;
 const duration=2600+Math.random()*2300;
 const col=currentColour();
 img.style.filter=state.spriteGlow?`drop-shadow(0 0 ${Math.max(4,state.glowWidth)}px #fff) brightness(${1+state.light/180})`:'none';

 let t0=performance.now();
 function frame(now){
  const t=Math.min(1,(now-t0)/duration);
  let x=startX+(drift-startX)*t, y=startY-(H*.72)*t;
  let scale=scale0+(scale1-scale0)*t,rot=0,opacity=1;
  switch(state.effect){
   case 'Drift Away':x+=Math.sin(t*8)*90;break;
   case 'Fly Left':x-=W*.35*t;break;
   case 'Fly Right':x+=W*.35*t;break;
   case 'Scatter / Dissipate':x+=(Math.random()-.5)*t*250; y+=(Math.random()-.5)*t*180;break;
   case 'Dissolve':opacity=1-t*.95;break;
   case 'Pulse Away':scale*=1+.22*Math.sin(t*22);opacity=1-t;break;
   case 'Spiral Away':{const a=t*16; x+=Math.cos(a)*120*t;y+=Math.sin(a)*120*t;rot=a*30}break;
   case 'Wave':x+=Math.sin(t*18)*100;break;
   case 'Orbit':{const a=t*10;x+=Math.cos(a)*150*t;y+=Math.sin(a)*150*t;rot=a*40}break;
   case 'Mirror':x=Math.abs(x);break;
   case 'Mirror Spiral':{const a=t*18;x+=Math.cos(a)*130*t;y+=Math.sin(a)*130*t;x=Math.abs(x);rot=-a*25}break;
   case 'Spin Out':rot=t*720;break;
   case 'Burst':x*=1+2*t;y-=H*.2*t;scale*=1+t;break;
   case 'Float Up':y-=Math.sin(t*Math.PI)*100;break;
   case 'Type On & Rise':opacity=t<.15?t/.15:(1-t);break;
   default:opacity=t>.72?1-(t-.72)/.28:1;
  }
  let jpgExtra='';
  if(sprite.isImage){
   if(state.jpgEffect==='flat') jpgExtra=` rotateY(${t*180}deg)`;
   else if(state.jpgEffect==='both') jpgExtra=` rotateY(${Math.sin(t*Math.PI*2)*180}deg)`;
   else if(state.jpgEffect==='flip') jpgExtra=` rotateY(${t*360}deg)`;
   else if(state.jpgEffect==='mirror') jpgExtra=` scaleX(${t<.5?1:-1})`;
  }
  wrap.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y-H*.58}px)) scale(${scale}) rotate(${rot}deg)${jpgExtra}`;
  wrap.style.opacity=opacity;
  if(t<1)requestAnimationFrame(frame);else wrap.remove();
 }
 requestAnimationFrame(frame);
}

function launchCurrent(){
 const activeBins=[...document.querySelectorAll('.binToggle:checked')].map(x=>+x.value);const allBins=document.getElementById('allBinsToggle').checked||activeBins.length===0;
 const usable=state.sprites.filter(s=>s.isImage&&s.checked!==false&&(allBins||activeBins.includes(+s.bin||1)));
 if(usable.length===0)return;
 const seq=Math.max(1,Math.min(99,+document.getElementById('jpgRepeat').value||1));
 for(let r=0;r<seq;r++)for(const s of usable)launchSprite(s);
}

function startHolding(){
 if(state.holding)return;
 state.holding=true;launchCurrent();
 state.holdTimer=setInterval(launchCurrent,Math.max(80,state.repeatSpeed));
}
function stopHolding(){state.holding=false;clearInterval(state.holdTimer);state.holdTimer=null}
const launch=document.getElementById('launch');
launch.addEventListener('mousedown',startHolding);
launch.addEventListener('touchstart',e=>{e.preventDefault();startHolding()},{passive:false});
addEventListener('mouseup',stopHolding);addEventListener('touchend',stopHolding);

document.getElementById('repeatNumberBtn').onclick=()=>{
 state.repeatMode='count';state.repeatCount=Math.max(1,+document.getElementById('repeatNumber').value||1);
 for(let i=0;i<state.repeatCount;i++)scheduleVisual(launchCurrent,i*state.repeatSpeed)
};
document.getElementById('repeatSpeed').oninput=e=>state.repeatSpeed=+e.target.value;

/* =========================================================
   COLOUR CONTEXTS — planet, text and draw have their own controls
   ========================================================= */
function setPlanetColour(c){state.colour=c;const sphere=document.getElementById('sphere');sphere.style.background=`radial-gradient(circle at 35% 30%,#fff,${c} 18%,${c}99 42%,#111 78%,#000 100%)`;sphere.style.boxShadow=`0 0 10px ${c},0 0 24px ${c}66`;document.getElementById('typingSmoke').style.color=c;}
document.getElementById('planetColour').onchange=e=>setPlanetColour(e.target.value);

/* =========================================================
   DRAWING — real pointer drawing, drop-on-release, persistent launch memory, undo/redo
   ========================================================= */
const dc=document.getElementById('drawCanvas'),dctx=dc.getContext('2d');
let drawing=false,last=null,drawWidth=4,drawColour='#ffffff',lastDrawSource=null,drawUndoStack=[],drawRedoStack=[];
dctx.lineCap='round';dctx.lineJoin='round';
function drawCtxColour(c){drawColour=c;dctx.strokeStyle=c;dctx.shadowColor=c;dctx.shadowBlur=+document.getElementById('drawGlow').value||0;}
function pos(e){const r=dc.getBoundingClientRect();return{x:(e.clientX-r.left)*dc.width/r.width,y:(e.clientY-r.top)*dc.height/r.height};}
function saveDrawState(){drawUndoStack.push(dc.toDataURL());if(drawUndoStack.length>30)drawUndoStack.shift();drawRedoStack=[];}
function restoreDrawData(url){const im=new Image();im.onload=()=>{dctx.clearRect(0,0,dc.width,dc.height);dctx.drawImage(im,0,0);};im.src=url;}
function snapshotDraw(){const c=document.createElement('canvas');c.width=dc.width;c.height=dc.height;c.getContext('2d').drawImage(dc,0,0);return c;}
function drawLaunchCount(){return Math.max(1,Math.min(99,+document.getElementById('drawRepeat').value||1));}
function launchDrawingFromCanvas(source,mode='launch',delay=0){
 const gen=visualGeneration,c=document.createElement('canvas');c.width=source.width;c.height=source.height;c.getContext('2d').drawImage(source,0,0);

(function(){

   niagaraMode=true;

 }
 function exitNiagara(){
   niagaraMode=false;
   video.pause();
   space.classList.remove('niagaraMode');
   sphere.classList.remove('niagaraSun');
   sphere.title='';
   sphere.setAttribute('aria-label','Silver Moon');
