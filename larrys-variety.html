<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larry’s Variety</title>
<style>
body { margin:0; isolation:isolate; background:#101010; color:white; text-align:center; font-family:Arial,sans-serif; overflow-x:hidden; }
body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 300vmax;
    height: 300vmax;
    background: repeating-conic-gradient(
        from 0deg,
        #000 0deg 10deg,
        #aaa 10deg 20deg
    );
    transform: translate(-50%, -50%) rotate(0deg);
    z-index: -10;
    animation: spinSpiral 24s linear infinite;
}

@keyframes spinSpiral {
    0% {
        transform: translate(-50%, -50%) rotate(0deg);
    }

    100% {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}


header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:16px 24px; background:#151515; }
h1 { margin:0; font-size:clamp(24px,4vw,38px); }
a { color:white; }
#artworkGallery { margin:0; padding:0; list-style:none; }
.excerpt-figure { display:inline-block; margin:15px; max-width:calc(100% - 30px); }
figure { margin:20px; }
figure button { display:block; padding:0; margin:auto; border:clamp(6px,1vw,15px) solid black; border-radius:3px; background:#111; box-shadow:0 8px 20px #0009; cursor:pointer; max-width:100%; }
figure img { display:block; height:clamp(95px,18vw,300px); width:auto; max-width:100%; object-fit:contain; }
figcaption { display:inline-block; margin-top:8px; padding:4px 9px; background:#151515; font-size:15px; }
#viewer {
    position:fixed;
    inset:0;
    z-index:10;
    display:grid;
    place-items:center;
    padding:24px;
}
#viewer[hidden], #tray[hidden], #celebration[hidden], #puzzleStatus[hidden] { display:none; }
#puzzleStatus {
    position:absolute;
    top:8px;
    margin:0;
    padding:6px 12px;
    background:#151515;
}
#celebration {
    position:absolute;
    z-index:4;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    width:min(94%, 820px);
    margin:0;
    font-size:clamp(20px,4vw,42px);
    text-shadow:0 2px 5px black, 0 0 12px black;
    pointer-events:none;
    box-sizing:border-box;
    padding:22px clamp(16px,5vw,65px);
    background:#151515;
    border:3px solid #d7bd70;
    box-shadow:0 10px 36px #000b;
}
.celebration-gull {
    position:absolute;
    font-size:32px;
    color:#fff;
    text-shadow:0 2px 4px #000;
    animation:prize-gull 1.7s ease-in-out infinite alternate;
}
.celebration-gull:nth-of-type(1) { top:-30px; left:7%; }
.celebration-gull:nth-of-type(2) { bottom:-29px; right:8%; animation-delay:-.65s; }
.celebration-gull:nth-of-type(3) { top:-23px; right:16%; animation-delay:-1s; }
@keyframes prize-gull {
    from { transform:translate(-24px,1px) rotate(-12deg) scaleY(.75); }
    to { transform:translate(24px,-12px) rotate(8deg) scaleY(1.15); }
}
#puzzleLayout {
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--board-width, 0px) minmax(0,1fr);
    align-items:center;
    width:100%;
    pointer-events:none;
}
#board {
    display:block;
    grid-column:2;
    grid-row:1;
    width:100%;
    height:auto;
    pointer-events:auto;
}
#board:empty, #tray:empty { display:none; }
#board, #tray {
    background:#181818;
    outline:6px solid #282828;
    box-shadow:0 0 0 7px #888, 0 10px 25px 7px #0009;
}
#tray { border-radius:2px; }
#board { position:relative; }
.puzzle-slot { fill:#292929; stroke:#777; stroke-width:1; vector-effect:non-scaling-stroke; cursor:pointer; }
.puzzle-slot:hover, .puzzle-slot:focus-visible { fill:#4d4d4d; }
#tray {
    display:grid;
    grid-column:3;
    grid-row:1;
    justify-self:center;
    width:var(--tray-width);
    aspect-ratio:var(--tray-aspect);
    grid-template-rows:repeat(3,minmax(0,1fr));
    pointer-events:auto;
}
#tray button[hidden] { display:none; }
#tray button {
    display:block;
    width:100%;
    min-width:0;
    background:transparent;
    border:0;
    padding:0;
    pointer-events:none;
}
#tray svg { display:block; width:100%; height:auto; overflow:visible; }
.piece-grip { fill:transparent; pointer-events:fill; cursor:grab; touch-action:none; }
.piece-grip:active { cursor:grabbing; }
#tray button:focus-visible,
#tray button[aria-pressed="true"] { outline:none; }
#tray button:focus-visible svg,
#tray button[aria-pressed="true"] svg { filter:drop-shadow(0 0 3px #f5cf84); }
#tray button.carrying svg {
    position:fixed;
    z-index:2;
    filter:none;
    pointer-events:none;
}
#tray button.carrying .piece-grip { pointer-events:none; }
@media(max-width:620px) {
    #puzzleLayout { grid-template-columns:var(--board-width, 0px) 1fr; }
    #board { grid-column:1; }
    #tray { grid-column:2; }
}
#busSelectionOverlay {
    position: fixed;
    inset: 0;
    z-index: 12000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background:
        radial-gradient(circle at center,
            rgba(255,255,255,.12),
            rgba(0,0,0,.94) 65%);
}

#busSelectionBox {
    width: min(1180px, 96vw);
    max-height: 94vh;
    overflow: auto;
    box-sizing: border-box;
    background: #111;
    border: 10px solid #d7bd70;
    box-shadow:
        0 0 0 5px #fff,
        0 0 45px #ffd700,
        0 25px 80px black;
    padding: 22px;
    text-align: center;
}

#busSelectionTitle {
    color: #ffeaa0;
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 1000;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #ffcf00,
        3px 3px 0 black;
    margin-bottom: 8px;
}

#busSelectionInstruction {
    color: white;
    font-size: clamp(14px, 2vw, 21px);
    margin-bottom: 18px;
}

#busChoices {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
}

.busChoice {
    min-width: 0;
    background: #050505;
    border: 4px solid #333;
    padding: 10px;
    cursor: pointer;
    color: white;
    box-shadow:
        inset 0 0 20px black,
        0 8px 18px rgba(0,0,0,.8);
    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.busChoice:hover {
    transform: translateY(-7px) scale(1.02);
    border-color: #ffe27a;
    box-shadow:
        inset 0 0 20px black,
        0 0 22px #ffe27a,
        0 12px 28px black;
}

.busChoice.wrong {
    animation: busWrong .45s ease-in-out 2;
    border-color: #ff2222;
}

.busChoice.right {
    border-color: #fff2a8;
    box-shadow:
        inset 0 0 20px black,
        0 0 35px #ffd400,
        0 0 80px rgba(255,220,0,.65);
}

@keyframes busWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-12px) rotate(-1deg); }
    75% { transform: translateX(12px) rotate(1deg); }
}

.busPictureWindow {
    height: 180px;
    background:
        radial-gradient(circle at 50% 35%, #28303a, #050505 68%);
    border: 5px solid #222;
    box-shadow:
        inset 0 0 25px black,
        0 0 12px black;
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
}

.busPictureWindow::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            125deg,
            transparent 0 43%,
            rgba(255,255,255,.13) 44%,
            transparent 48% 100%
        );
    pointer-events: none;
}

.busGraphic {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 30px;
    height: 88px;
}

.busBody {
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: 20px;
    height: 54px;
    border-radius: 16px 20px 9px 9px;
    background: linear-gradient(#f8df72, #8d5d12);
    border: 4px solid #151515;
    box-shadow: 0 8px 8px rgba(0,0,0,.7);
}

.busBody.second {
    background: linear-gradient(#bcbcbc, #5a5a5a);
}

.busBody.third {
    background: linear-gradient(#b56f39, #4a2415);
}

.busBody.fourth {
    background: linear-gradient(#6f4b2e, #23150d);
    border-radius: 8px 8px 4px 4px;
}

.busRoof {
    position: absolute;
    left: 15%;
    right: 18%;
    top: -14px;
    height: 22px;
    border-radius: 14px 14px 0 0;
    background: #d9bd5a;
    border: 4px solid #151515;
}

.busWindow {
    position: absolute;
    top: 8px;
    width: 17%;
    height: 22px;
    background: #07121c;
    border: 2px solid #ddd;
}

.busWindow.w1 { left: 13%; }
.busWindow.w2 { left: 35%; }
.busWindow.w3 { left: 57%; }

.busWheel {
    position: absolute;
    width: 27px;
    height: 27px;
    bottom: 2px;
    border-radius: 50%;
    background: #050505;
    border: 5px solid #777;
    box-shadow: 0 0 0 2px black;
}

.busWheel.left { left: 16%; }
.busWheel.right { right: 16%; }

.busLuggage {
    position: absolute;
    right: 1%;
    bottom: 44px;
    width: 28px;
    height: 22px;
    background: #aa1717;
    border: 3px solid #111;
    transform: rotate(-8deg);
}

.busBadge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 11px;
    font-weight: 1000;
    letter-spacing: 1px;
    text-shadow: 0 2px 3px black;
    pointer-events: none;
}

.trikeGraphic .trikeBody {
    position: absolute;
    left: 18%;
    right: 16%;
    bottom: 28px;
    height: 32px;
    background: #76502f;
    border: 4px solid #111;
    border-radius: 6px 15px 8px 8px;
}

.trikeGraphic .oldMan {
    position: absolute;
    left: 43%;
    bottom: 57px;
    width: 28px;
    height: 35px;
    border-radius: 45% 45% 30% 30%;
    background: #aaa;
    border: 3px solid #111;
}

.trikeGraphic .oldMan::after {
    content: "";
    position: absolute;
    left: 2px;
    top: -11px;
    width: 20px;
    height: 12px;
    border-radius: 50%;
    background: #ddd;
    border: 2px solid #111;
}

.trikeWheel {
    position: absolute;
    width: 31px;
    height: 31px;
    bottom: 1px;
    border-radius: 50%;
    background: #111;
    border: 5px solid #777;
}

.trikeWheel.one { left: 12%; }
.trikeWheel.two { right: 12%; }
.trikeWheel.three {
    left: 48%;
    width: 23px;
    height: 23px;
}

.busName {
    color: #ffe98a;
    font-size: 17px;
    font-weight: 1000;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.busDescription {
    color: #ddd;
    font-size: 12px;
    line-height: 1.25;
    min-height: 58px;
}

.busStatus {
    margin-top: 8px;
    min-height: 20px;
    color: #ff8a8a;
    font-size: 12px;
    font-weight: 900;
}

#niagaraPortal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 13000;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle,
            rgba(255,255,255,.28),
            rgba(0,0,0,.92) 60%);
}

#niagaraPortalBox {
    width: min(720px, 92vw);
    background: #111;
    color: white;
    border: 12px solid #d9bd67;
    outline: 5px solid white;
    padding: 28px;
    text-align: center;
    box-shadow:
        0 0 40px #ffd000,
        0 0 100px rgba(255,210,0,.6),
        0 25px 80px black;
}

#niagaraPortalBox h2 {
    color: #fff1a3;
    font-size: clamp(28px, 5vw, 54px);
    margin: 0 0 10px;
    text-shadow:
        0 0 10px white,
        0 0 25px #ffd000;
}

#niagaraPortalBox p {
    font-size: 18px;
    line-height: 1.4;
}

#niagaraPortalButton {
    background: #ffe16b;
    color: #111;
    font-size: 20px;
}

.prize-gallery-card {
    height: min(18vw, 300px);
    min-height: 150px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background:
        repeating-conic-gradient(
            from 0deg,
            #fff200 0deg 12deg,
            #ff2b00 12deg 24deg
        );
    border: 15px solid #111;
    box-shadow:
        0 0 20px black,
        0 0 45px #ffe600,
        0 20px 30px rgba(0,0,0,0.9);
    color: #111;
    font-size: clamp(18px, 2.2vw, 32px);
    font-weight: 1000;
    line-height: 1.05;
    text-shadow: 2px 2px 0 white;
    animation: prizeFlash 0.65s infinite alternate;
}


#artworkGallery figure { position:relative; }
#artworkGallery .prize-gallery-card {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    min-height:0;
    margin:0;
    font-size:clamp(15px,2vw,23px);
}
#busCloseButton, #niagaraPortalButton, #portalClose {
    padding:10px 16px;
    margin:12px 4px 0;
    cursor:pointer;
}
@media(max-width:680px) { #busChoices { grid-template-columns:repeat(2,minmax(0,1fr)); } }

@media (prefers-reduced-motion:reduce) { body::before, .celebration-gull { animation:none; } }
#busDeparture {
    position:fixed;
    inset:0;
    z-index:14000;
    background:#000;
    opacity:0;
    pointer-events:none;
}
.busChoice:disabled { cursor:default; }
.busChoice:disabled:hover { transform:none; }
.busGraphic.coach .busBody { height:51%; border-radius:36px 28px 8px 8px; }
.busGraphic.coach .busRoof { height:23%; border-radius:45px 35px 3px 3px; }
.busGraphic.coach .busWindow { border-radius:50% 50% 4px 4px; }
.busGraphic.shuttle .busBody { left:17%; width:67%; height:46%; border-radius:12px; }
.busGraphic.shuttle .busRoof { display:none; }
.busGraphic.shuttle .busLuggage { display:none; }
.busGraphic.minibus .busBody { left:20%; width:60%; height:37%; border-radius:14px 30px 6px 8px; }
.busGraphic.minibus .busWindow.w3 { display:none; }
.busGraphic.minibus .busRoof { left:27%; width:39%; height:19%; }
#larSeagulls{display:block;position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.larSeagull{position:absolute;color:#fff;font-size:38px;font-weight:1000;text-shadow:0 2px 5px #000,0 0 10px #fff;animation:larGullFly linear infinite;letter-spacing:-10px}
@keyframes larGullFly{from{transform:translateX(-14vw) translateY(0) scale(.7)}25%{transform:translateX(28vw) translateY(-38px) scale(1.15)}50%{transform:translateX(55vw) translateY(25px) scale(.9)}75%{transform:translateX(82vw) translateY(-45px) scale(1.25)}to{transform:translateX(118vw) translateY(10px) scale(.72)}}
#larOpeningIntro{
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:1;
  transition:opacity 2.4s ease;
  pointer-events:auto;
}
#larOpeningIntro.intro-fade{
  opacity:0;
  pointer-events:none;
}
#larOpeningSmoke{
  position:absolute;
  inset:-15%;
  z-index:7;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(ellipse at 22% 70%, rgba(255,255,255,.96) 0 7%, rgba(255,255,255,.62) 15%, transparent 34%),
    radial-gradient(ellipse at 45% 62%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.58) 21%, transparent 42%),
    radial-gradient(ellipse at 70% 54%, rgba(255,255,255,.92) 0 11%, rgba(255,255,255,.52) 23%, transparent 45%),
    radial-gradient(ellipse at 82% 72%, rgba(255,255,255,.9) 0 8%, rgba(255,255,255,.5) 20%, transparent 40%);
  filter:blur(18px);
  transform:scale(.8);
}
#larOpeningIntro.smoke-build #larOpeningSmoke{
  animation:larSmokeBuild 5.2s ease-in forwards;
}
#larOpeningIntro.smoke-whiteout #larOpeningSmoke{
  animation:larSmokeWhiteout 2.4s ease-in-out forwards;
}
@keyframes larSmokeBuild{
  0%{opacity:0;transform:scale(.72)}
  55%{opacity:.5;transform:scale(1.05)}
  100%{opacity:.82;transform:scale(1.22)}
}
@keyframes larSmokeWhiteout{
  0%{opacity:.82;transform:scale(1.22)}
  55%{opacity:1;transform:scale(1.55)}
  100%{opacity:.03;transform:scale(2.2)}
}
#larOpeningCar{
  position:absolute;
  left:-28vw;
  bottom:18vh;
  width:clamp(230px,30vw,520px);
  height:clamp(90px,11vw,190px);
  z-index:6;
  opacity:0;
  filter:drop-shadow(0 18px 12px rgba(0,0,0,.75));
}
#larOpeningIntro.car-arrive #larOpeningCar{
  animation:larCarDrive 6.8s cubic-bezier(.2,.72,.25,1) forwards;
}
.larCarBody{position:absolute;left:4%;bottom:10%;width:84%;height:52%;background:linear-gradient(#6b3d20,#4a2814 55%,#321b0d);border:5px solid #201008;border-radius:12px 22px 10px 10px;box-shadow:inset 0 -12px 0 rgba(0,0,0,.25),0 0 0 2px #8b5a32;}
.larCarRoof{position:absolute;left:29%;top:10%;width:39%;height:42%;background:#5a321a;border:5px solid #201008;border-bottom:0;border-radius:35px 45px 0 0;transform:skewX(-10deg);}
.larCarWindow{position:absolute;left:36%;top:18%;width:28%;height:25%;background:#070707;border:3px solid #1d1008;transform:skewX(-10deg);}
.larCarHood{position:absolute;left:0;bottom:28%;width:34%;height:24%;background:#5b3219;border:5px solid #201008;border-right:0;border-radius:16px 0 0 7px;}
.larCarTrunk{position:absolute;right:0;bottom:29%;width:18%;height:24%;background:#4b2915;border:5px solid #201008;border-left:0;border-radius:0 18px 8px 0;}
.larCarWheel{position:absolute;bottom:0;width:18%;aspect-ratio:1;border-radius:50%;background:#090909;border:5px solid #2a160b;box-shadow:inset 0 0 0 9px #6b3d20;}
.larCarWheel.one{left:15%}.larCarWheel.two{right:12%}
.larCarTailpipe{position:absolute;right:-3%;bottom:31%;width:12%;height:7%;background:#151515;border:3px solid #050505;border-radius:0 8px 8px 0;box-shadow:0 0 5px #000;}
.larCarSmoke{position:absolute;right:-28%;bottom:18%;width:58%;height:78%;opacity:.96;filter:blur(7px);}
.larCarSmoke i{position:absolute;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 25px rgba(255,255,255,.55);animation:larExhaust 2.8s ease-out infinite;}
.larCarSmoke i:nth-child(1){width:44px;height:44px;right:1%;bottom:8%}.larCarSmoke i:nth-child(2){width:62px;height:62px;right:13%;bottom:20%;animation-delay:.25s}.larCarSmoke i:nth-child(3){width:82px;height:82px;right:27%;bottom:4%;animation-delay:.55s}.larCarSmoke i:nth-child(4){width:106px;height:106px;right:39%;bottom:24%;animation-delay:.85s}.larCarSmoke i:nth-child(5){width:132px;height:132px;right:50%;bottom:2%;animation-delay:1.15s}.larCarSmoke i:nth-child(6){width:165px;height:165px;right:61%;bottom:22%;animation-delay:1.45s}.larCarSmoke i:nth-child(7){width:205px;height:205px;right:70%;bottom:-4%;animation-delay:1.75s}.larCarSmoke i:nth-child(8){width:240px;height:240px;right:77%;bottom:20%;animation-delay:2.05s}
@keyframes larCarDrive{0%{left:-32vw;opacity:0;transform:scale(.8)}8%{opacity:1}55%{left:38vw;opacity:1;transform:scale(1)}100%{left:112vw;opacity:0;transform:scale(1.06)}}
@keyframes larExhaust{0%{transform:translate(0,0) scale(.55);opacity:.08}20%{opacity:.82}100%{transform:translate(-150px,-80px) scale(1.9);opacity:0}}
#larOpeningGulls{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;}
#larOpeningIntro.gulls-arrive #larOpeningGulls{animation:larGullsAppear 1.8s ease-out forwards}
.larOpeningGull{position:absolute;width:clamp(70px,8vw,150px);height:34px;opacity:.9;filter:drop-shadow(0 4px 5px rgba(0,0,0,.8));animation:larGullSwoop var(--gd) ease-in-out infinite;animation-delay:var(--delay);}
.larOpeningGull:before,.larOpeningGull:after{content:"";position:absolute;top:14px;width:50%;height:14px;border-top:7px solid #fff;border-radius:50%;}
.larOpeningGull:before{left:0;transform-origin:right center;transform:rotate(18deg)}.larOpeningGull:after{right:0;transform-origin:left center;transform:rotate(-18deg)}
@keyframes larGullsAppear{to{opacity:1}}
@keyframes larGullSwoop{0%,100%{transform:translate3d(0,0,0) rotate(-5deg) scale(.9)}35%{transform:translate3d(var(--gx),var(--gy),0) rotate(12deg) scale(1.15)}70%{transform:translate3d(calc(var(--gx)*-.7),calc(var(--gy)*.8),0) rotate(-14deg) scale(1)}}
#larOpeningVortex{
  position:absolute;
  inset:-24%;
  background:
    repeating-conic-gradient(from 0deg,
      #000 0deg 8deg,
      #f4f4f4 8deg 16deg,
      #000 16deg 24deg,
      #ffffff 24deg 32deg);
  filter:contrast(1.5);
  animation:larVortexSpin 10.5s linear infinite;
  transform-origin:center;
}
#larOpeningVortex:after{
  content:"";

    const version = puzzleVersion;

    const centered = `translate(${x}px, ${y}px) scale(${scale})`;
    const painting = board.animate([
        {transform:reduced ? centered : "none", opacity:1},
        {transform:centered, opacity:1, offset:.24},

const svgNS = "http://www.w3.org/2000/svg";
let puzzleVersion = 0;

function svgNode(tag, attributes) {
    const node = document.createElementNS(svgNS, tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    return node;

// Every shared edge is drawn in reverse on its neighbour.
function edge(x, y, dx, dy, depth, direction) {
    const point = (along, across) => {
        const normalX = -Math.sign(dy) * depth * direction;
        const normalY = Math.sign(dx) * depth * direction;
        return `${x + dx * along + normalX * across} ${y + dy * along + normalY * across}`;
    };
    if (!direction) return `L ${point(1, 0)}`;
    return `L ${point(.42, 0)}
        C ${point(.47, 0)} ${point(.36, .33)} ${point(.36, .64)}
        C ${point(.36, 1.12)} ${point(.64, 1.12)} ${point(.64, .64)}
        C ${point(.64, .33)} ${point(.53, 0)} ${point(.58, 0)}
        L ${point(1, 0)}`;

function pieceShape(row, col, w, h, depth) {
    const x = col * w;
    const y = row * h;
    const horizontal = (r, c) => (r + c) % 2 ? 1 : -1;
    const vertical = (r, c) => (r + c) % 2 ? -1 : 1;
    return `M ${x} ${y}
        ${edge(x, y, w, 0, depth, row ? horizontal(row, col) : 0)}
        ${edge(x+w, y, 0, h, depth, col < 2 ? vertical(row, col+1) : 0)}
        ${edge(x+w, y+h, -w, 0, depth, row < 2 ? -horizontal(row+1, col) : 0)}
        ${edge(x, y+h, 0, -h, depth, col ? -vertical(row, col) : 0)} Z`;
}

function startJigsaw(source, width, height, ticket) {
    board.replaceChildren();
    tray.replaceChildren();
    board.setAttribute("viewBox", `0 0 ${width} ${height}`);
    board.style.aspectRatio = `${width} / ${height}`;
    puzzleStatus.textContent = "Drag a piece onto the board, or select a piece and then select its place.";

    const w = width / 3;
    const h = height / 3;
    const depth = Math.min(w, h) * .23;
    const layout = board.parentElement;
    const trayRatio = (w + 2 * depth) / width;
    const fullTrayHeight = height + 6 * depth;
    layout.style.setProperty("--board-width", `min(56vw, 580px, calc((100vw - 72px) / ${1 + 2 * trayRatio}), ${70 * width / fullTrayHeight}dvh)`);
    layout.style.setProperty("--tray-width", `calc(var(--board-width) * ${trayRatio})`);
    layout.style.setProperty("--tray-aspect", `${w + 2 * depth} / ${fullTrayHeight}`);

    let selected = null;
    let remaining = 9;

        let visible = 0;
        for (const piece of pieces) {
            if (piece.placed) continue;
            piece.button.hidden = visible >= 3;
            visible++;
        }

        selected?.button.setAttribute("aria-pressed", "false");
        selected = piece;
        piece.button.setAttribute("aria-pressed", "true");
    }

        if (!selected || piece.placed) return;

            puzzleStatus.textContent = "That piece fits somewhere else. Try another spot.";
            return;
        }
        piece.placed = true;
        selected = null;
        piece.button.remove();
        piece.slot.remove();
        piece.picture.removeAttribute("visibility");
        remaining--;
        puzzleStatus.textContent = remaining ? `${9 - remaining} of 9 pieces fitted.` : "Puzzle complete!";
        if (remaining) {
            refreshTray();
            tray.querySelector("button:not([hidden])")?.focus();

            puzzleStatus.textContent = "Your prize is revealed!";

            next.textContent = "Continue";

            const index = pieces.length;
            const path = pieceShape(row, col, w, h, depth);
            const button = document.createElement("button");

                viewBox:`${col*w-depth} ${row*h-depth} ${w+2*depth} ${h+2*depth}`,

                const clip = svgNode("clipPath", {id});

            function finishDrag(event) {
                if (drag?.id !== event.pointerId) return;
                const moving = drag.moving;
                drag = null;
                button.classList.remove("carrying");
                thumbnail.removeAttribute("style");
                if (!moving || event.type !== "pointerup") return;
                const target = document.elementFromPoint(event.clientX, event.clientY);
                const destination = pieces.find(candidate => candidate.slot === target);
                if (destination) {
                    select(piece);
                    place(destination);
                }
            }
            grip.onpointerup = finishDrag;
            grip.onpointercancel = finishDrag;
            grip.onlostpointercapture = finishDrag;
            slot.onclick = () => place(piece);
            slot.onkeydown = event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    place(piece);
                }
            };

        }
    }
    for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }
    for (const piece of pieces) tray.append(piece.button);
    refreshTray();
}

function openJigsaw(source, trigger, ticket = false) {
    const version = ++puzzleVersion;
    board.replaceChildren();
    tray.replaceChildren();
    activePainting = trigger;
    tray.hidden = false;
    celebration.hidden = true;
    puzzleStatus.hidden = false;
    puzzleStatus.textContent = "Loading painting…";
    viewer.hidden = false;
    document.getElementById("closePuzzle").focus({preventScroll:true});

    const reference = new Image();
    reference.onload = () => {
        if (!viewer.hidden && version === puzzleVersion) {
            const width = 600;
            startJigsaw(source, width, width * reference.naturalHeight / reference.naturalWidth, ticket);
        }
    };
    reference.onerror = () => {
        if (!viewer.hidden && version === puzzleVersion) puzzleStatus.textContent = "The painting couldn’t load. Close the puzzle and try again.";
    };
    reference.src = source;
}

        card.innerHTML = `<div class="busPictureWindow" aria-hidden="true">${makeBusGraphic(bus)}</div>
            <div class="busName">${bus.name}</div><div class="busDescription">${bus.description}</div><div class="busStatus" role="status"></div>`;
        card.onclick = () => {
            if (card.disabled) return;
            attempts++;
            if (attempts === 4) {
                busRoom.style.display = "none";
                portal.style.display = "flex";
                document.getElementById("niagaraPortalButton").focus();

            card.classList.add("wrong");

            card.querySelector(".busStatus").textContent = "This vehicle is headed somewhere else.";
            room.querySelector("button:not(:disabled)")?.focus();
        };
        room.append(card);
    });

  function shuffle(a){
    const x=a.slice();
    for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}

  function makeAudio(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    ctx=new AC();

    organGain=ctx.createGain(); organGain.gain.value=0; organGain.connect(master);
  }
  function organChord(when,freqs,duration){
    if(!ctx||!organGain)return;
    freqs.forEach((freq,idx)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      g.gain.setValueAtTime(.0001,when);
      g.gain.linearRampToValueAtTime(.015/(idx+1),when+.55);
      g.gain.setValueAtTime(.015/(idx+1),when+Math.max(.6,duration-.9));
      g.gain.linearRampToValueAtTime(.0001,when+duration);
      osc.connect(g);g.connect(organGain);osc.start(when);osc.stop(when+duration+.05);
    });
  }

    return voices.find(v=>/en[-_](GB|CA|US)/i.test(v.lang)&&/David|George|Daniel|Mark|Google UK|Microsoft/i.test(v.name))
      || voices.find(v=>/en[-_](GB|CA|US)/i.test(v.lang))
