// The native sliders retain their entire draggable/clickable tracks.
// Markers are painted into the track, never positioned over its hit area.
for(const id of ['size','angle','opacity','detailSize']){

const floatingPanels=['paintPanel','galleryPanel','palettePopup','colourPopup'];
const panelOrder=floatingPanels.slice();
function raisePanel(id){
 if(!floatingPanels.includes(id))return;
 if(id==='galleryPanel'&&!$(id).classList.contains('floating-gallery'))return;
 panelOrder.splice(panelOrder.indexOf(id),1);
 panelOrder.push(id);
 panelOrder.forEach((name,index)=>{
  if(name==='galleryPanel'&&!$(name).classList.contains('floating-gallery'))return;
  $(name).style.zIndex=String(160+index);
 });
}

// Version 29: workshop toggle and optional brayers; no paint-tube mode.
(function(){
 const layout=$('workshopLayout'),toggle=$('togglePaintPanel');
 const plateSurface=document.querySelector('.plate-depth');
 const actions=$('printActions');
 const slot=document.createElement('div');
 slot.className='print-actions-slot';
 slot.setAttribute('aria-hidden','true');
 actions.replaceWith(slot);
 document.body.append(actions);
 function alignPrintActions(){
  const plateRect=plateSurface.getBoundingClientRect();
  const slotRect=slot.getBoundingClientRect();
  actions.style.left=plateRect.left+'px';
  actions.style.top=slotRect.top+'px';
  actions.style.width=plateRect.width+'px';
 }
 const printLayoutObserver=new ResizeObserver(alignPrintActions);
 printLayoutObserver.observe(plateSurface);
 printLayoutObserver.observe(slot);
 window.addEventListener('resize',alignPrintActions);
 alignPrintActions();
 function updateToggle(){const closed=layout.classList.contains('workshop-closed');$('paintPanel').hidden=closed;toggle.setAttribute('aria-expanded',String(!closed));if(!closed)raisePanel('paintPanel')}
 toggle.addEventListener('click',()=>{if(ghostController)return;if(!$('paintPanel').hidden&&panelOrder.at(-1)!=='paintPanel'){raisePanel('paintPanel');return}layout.classList.toggle('workshop-closed');updateToggle()});updateToggle();
 $('closeStyle').onclick=()=>{if(!ghostController){layout.classList.add('workshop-closed');updateToggle()}};
 function updateDock(){const blending=tool==='blend';$('blendDock').classList.toggle('active',blending);$('brayerDock').classList.toggle('active',tool==='brayer');$('brayerDock').classList.toggle('cream-active',blending)}
 $('blendDock').addEventListener('click',()=>{pickRoller('blend');updateDock()});
 $('brayerDock').addEventListener('click',()=>{pickRoller('brayer');updateDock()});
 $('openCustomColour').onclick=()=>{if($('colourPopup').hidden)openColourPopup();else $('colourPopup').hidden=true};
 $('openPalette').onclick=()=>{
  const popup=$('palettePopup');
  popup.hidden=!popup.hidden;
  if(popup.hidden)return;
  raisePanel('palettePopup');
  if(popup.dataset.positioned)return;
  const plate=document.querySelector('.plate').getBoundingClientRect();
  popup.style.left=clamp(plate.right+10,8,Math.max(8,innerWidth-popup.offsetWidth-8))+'px';
  popup.style.top=clamp(plate.bottom-popup.offsetHeight,8,Math.max(8,innerHeight-popup.offsetHeight-8))+'px';
  popup.style.right='auto';
  popup.dataset.positioned='yes';
 };
 $('closePalette').onclick=()=>{$('palettePopup').hidden=true};

 $('blendPick').addEventListener('click',()=>setTimeout(updateDock,0));$('brayerPick').addEventListener('click',()=>setTimeout(updateDock,0));
 paint.addEventListener('pointerdown',updateDock);updateDock();

// Version 32 controls. Hidden original inputs remain the single source of truth.
const v32Values={size:[12,209,406,603,800],pattern:[10,25,45,70,100],opacity:[5,25,50,75,100],angle:[0,90,-45,45]};
function v32Set(kind,index){
 const id=kind==='paint'?'opacity':kind==='pattern'?'detailSize':kind;
 const el=$(id);if(!el)return;
 if(kind==='angle'&&index===4){el.value=[0,90,-45,45][Math.floor(Math.random()*4)];}
 else if(kind==='size'){const pattern=tool==='texture'||tool==='stencil';el.max=pattern?1700:800;el.value=pattern?Math.round([.16,.36,.58,.80,1.06][index]*Math.max(W,H)):Math.round(12+(800-12)*index/4)}else el.value=(v32Values[kind]||v32Values[id])?.[index]??el.value;
 el.dispatchEvent(new Event('input',{bubbles:true}));
 document.querySelectorAll('[data-setting="'+kind+'"]').forEach(b=>b.classList.toggle('active',+(b.dataset.step??b.dataset.index)===index));
}
document.querySelectorAll('[data-setting]').forEach(b=>b.addEventListener('click',()=>v32Set(b.dataset.setting,+b.dataset.step)));

// Dragging a dock brayer selects it; the actual paint canvas retains pointer ownership.
for(const [id,t] of [['blendDock','blend'],['brayerDock','brayer']]){
 const el=$(id);el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t);pickRoller(t)});
}
paint.addEventListener('dragover',e=>e.preventDefault());paint.addEventListener('drop',e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(t==='blend'||t==='brayer'){setTool(t);renderToolButtons()}});

function dragPanel(id){
 const panel=$(id);
 let drag;
 panel.addEventListener('pointerdown',()=>raisePanel(id),{capture:true});
 panel.addEventListener('pointerdown',event=>{
  if(event.button!==0||event.target.closest('button,input,select,option,label,textarea,a,canvas,img,.gallery-item,[contenteditable]'))return;
  if(panel.classList.contains('full-gallery'))return;
  const rect=panel.getBoundingClientRect();
  drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:rect.left,top:rect.top};
  panel.setPointerCapture(event.pointerId);
 });
 panel.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.id)return;
  const left=clamp(drag.left+event.clientX-drag.x,0,Math.max(0,innerWidth-panel.offsetWidth));
  const top=clamp(drag.top+event.clientY-drag.y,0,Math.max(0,innerHeight-panel.offsetHeight));
  if(id==='colourPopup'){
   panel.style.setProperty('--picker-left',left+'px');panel.style.setProperty('--picker-top',top+'px');
  }else{
   const rect=panel.getBoundingClientRect();
   const x=(+panel.dataset.dragX||0)+left-rect.left;
   const y=(+panel.dataset.dragY||0)+top-rect.top;
   panel.style.translate=x+'px '+y+'px';
   panel.dataset.dragX=x;panel.dataset.dragY=y;
   if(!floatingPanels.includes(id))panel.style.zIndex='8';
  }
 });
 for(const name of ['pointerup','pointercancel','lostpointercapture'])panel.addEventListener(name,()=>drag=null);
}
for(const id of ['paintPanel','galleryPanel','colourPopup','palettePopup','galleryTitlePanel'])dragPanel(id);
for(const id of ['paintNeutrals','pickerNeutrals']){
 const strip=$(id);
 for(let index=0;index<15;index++){
  const button=document.createElement('button');
  const black=index%2===1;
  button.type='button';button.className=black?'black':'white';
  button.setAttribute('aria-label',black?'Black':'White');
  button.onclick=()=>{
   customSat=0;customValue=black?0:1;
   updateChosenColour();
  };
  strip.append(button);
 }
}
$('fullGallery').onclick=()=>{if(!ghostController)sideView(document.body.classList.contains('gallery-expanded')?'side':'full')};
$('closeSideGallery').onclick=()=>sideView('closed');
$('showPaperBlock').onclick=()=>{paperPreferred=$('paperBlock').hidden;sideView(paperPreferred?'paper':'closed')};
$('showGallery').onclick=()=>{if($('preview').classList.contains('show'))closePrintPreview();sideView($('galleryBody').hidden?'side':'closed')};
sideView('paper');
 document.querySelector('[data-setting=size][data-step="0"]')?.click();
resetPressButtons();

// The demonstration owns the plate until its current animation has unwound.

const ghostWords=['AFTERLIGHT','WILD COLOUR','DAYBREAK','PAPER GHOST','EVENING TIDE','STILL HERE','BRIGHT WATER','STRANGE WEATHER'];
let ghostQueue=[];
function setGhostControls(running){
 document.body.classList.toggle('ghost-running',running);
 for(const node of document.querySelectorAll('header,#galleryPanel,#palettePopup,#colourPopup,#paintPanel button,#paintPanel input,#paintPanel select')){
  if(node.id==='ghostStart'||node.id==='ghostPace')continue;
  node.inert=running;
 }
 if(running){
  for(const id of ['colourPopup','palettePopup','toolChooser','drawSizePanel','imageControls'])$(id).hidden=true;
  $('imagesToggle').setAttribute('aria-expanded','false');
 }
}
function ghostDelay(ms,signal){
 return new Promise((resolve,reject)=>{
  signal.throwIfAborted();
  const abort=()=>{clearTimeout(timer);reject(signal.reason)};
  const timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve()},ms*(ghostFast?1.65:3.15));
  signal.addEventListener('abort',abort,{once:true});
 });
}
let litGhostButton=null;
function clearGhostGuide(){
 litGhostButton?.classList.remove('ghost-target');
 litGhostButton=null;
 $('ghostPointer').hidden=true;
}
async function ghostPoint(target,pause){
 const rect=target.getBoundingClientRect(),pointer=$('ghostPointer');
 litGhostButton?.classList.remove('ghost-target');
 litGhostButton=null;
 if(pointer.hidden){
  const plate=paint.getBoundingClientRect();
  pointer.style.left=plate.left+plate.width/2+'px';
  pointer.style.top=plate.top+plate.height/2+'px';
  pointer.hidden=false;
  void pointer.offsetWidth;
 }
 const travel=ghostFast?1300:2400;
 pointer.style.setProperty('--ghost-travel',travel+'ms');
 pointer.style.left=rect.left+rect.width/2+'px';
 pointer.style.top=rect.top+rect.height/2+'px';
 await pause(780);
 target.classList.add('ghost-target');
 litGhostButton=target;
 await pause(330);
}
function releaseGhostPaper(){
 $('paperStage').classList.remove('show');
 document.body.classList.remove('ghost-pressing','paper-pressing');
 $('paper').className='paper';
 $('roller').style.opacity='0';
 pressed=false;processing=false;
 $('press').disabled=false;$('pull').disabled=true;
 updateGhostPrint();
}
function paintGhostArtwork(word){
 const art=makeCanvas(),context=art.getContext('2d');
 const palette=[
  [rnd(41,65),rnd(47,78),rnd(31,58)],
  [rnd(329,382)%360,rnd(300,354),rnd(355,385)%360],
  [rnd(186,239),rnd(217,271),rnd(166,209)]
 ].map(group=>group.map(hue=>`hsl(${hue} ${rnd(59,94)}% ${rnd(37,69)}%)`));
 const pick=items=>items[Math.floor(Math.random()*items.length)];
 // Stamp first so the lettering remains nearest the paper.
 context.save();
 context.translate(rnd(W*.24,W*.74),rnd(H*.23,H*.76));
 context.rotate((Math.random()<.5?-1:1)*rnd(.08,.32));
 context.scale(-1,1);
 context.font=`700 ${Math.round(rnd(35,58))}px Georgia`;
 context.textAlign='center';context.textBaseline='middle';
 context.fillStyle=ghostSerial%2?'#17151a':'#fffdf5';
 context.fillText(word,0,0,W*.66);
 context.restore();
 context.globalCompositeOperation='destination-over';
 for(const shade of ['#16141a','#fffdf4']){
  for(let index=0;index<13;index++){
   context.fillStyle=shade;
   context.globalAlpha=rnd(.35,.8);
   context.beginPath();
   context.ellipse(rnd(0,W),rnd(0,H),rnd(18,58),rnd(9,28),rnd(0,Math.PI),0,2*Math.PI);
   context.fill();
  }
 }
 for(let index=0;index<82;index++){
  const x=rnd(0,W),y=rnd(0,H),rx=rnd(16,W*.22),ry=rnd(12,H*.23);
  context.save();
  context.translate(x,y);context.rotate(rnd(-Math.PI,Math.PI));
  context.globalAlpha=rnd(.24,.74);
  context.fillStyle=pick(palette[index%3]);
  context.strokeStyle=context.fillStyle;
  context.lineWidth=rnd(2,14);
  context.beginPath();
  context.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  if(index%5===0){
   context.clip();
   context.fillStyle=pick(['#ba9876','#c5a786','#dbba99']);
   for(let row=-ry;row<=ry;row+=5){
    for(let col=-rx;col<=rx;col+=7){
     context.fillRect(col+(Math.round(row/5)%2)*3,row,rnd(3,6),rnd(1,3));
    }
   }
  }else if(index%3===0){
   context.stroke();
   context.beginPath();
   context.ellipse(rx*.18,ry*.12,rx*.62,ry*.66,.17,0,Math.PI*2);
   context.stroke();
  }else context.fill();
  context.restore();
 }
 context.globalAlpha=1;
 const angle=rnd(0,2*Math.PI);
 const dx=Math.cos(angle)*W/2,dy=Math.sin(angle)*H/2;
 const ground=context.createLinearGradient(W/2-dx,H/2-dy,W/2+dx,H/2+dy);
 [0,1,2].map(index=>pick(palette[(index+ghostSerial)%3])).forEach((shade,index)=>ground.addColorStop(index/2,shade));
 context.fillStyle=ground;context.fillRect(0,0,W,H);
 wc.drawImage(art,0,0);pwc.drawImage(art,0,0);renderPlate();
}
async function ghostLoop(controller){
 const pause=ms=>ghostDelay(ms,controller.signal);
 const toolBefore=tool,colourBefore=color,brushBefore=$('brush').value;
 try{
  while(ghostQueue.length&&!controller.signal.aborted){
   const word=ghostQueue[0];
   snapshot();
   transferPaint(true);
   processing=true;
   $('press').disabled=true;
   $('pull').disabled=true;
   await ghostPoint($('random'),pause);
   paintGhostArtwork(word);
   await pause(750);
   await ghostPoint($('press'),pause);
   processing=false;
   await press(false,pause);
   await ghostPoint($('pull'),pause);
   processing=true;$('pull').disabled=true;
   const data=composePrint(true).toDataURL('image/png');
   transferPaint(true);
   $('paper').className='paper peel';
   await pause(1250);
   releaseGhostPaper();processing=true;$('press').disabled=true;
   clearGhostGuide();
   ghostQueue.shift();
   const name=word+' · '+String(++ghostSerial).padStart(3,'0');
   gallery.unshift({id:'ghost'+Date.now(),name,data,ghost:true,date:new Date().toISOString()});
   if(gallery.length>35)gallery.length=35;
   persist();renderGallery();
   await pause(1300);
  }
 }catch(error){
  if(!controller.signal.aborted)console.error(error);
 }finally{
  clearGhostGuide();$('cleanWipe').classList.remove('show');
  ghostController=null;
  setGhostControls(false);
  releaseGhostPaper();renderPlate();
  $('brush').value=brushBefore;setTool(toolBefore);setColor(colourBefore);renderToolButtons();
  $('ghostStart').textContent='Ghost Print';$('ghostStart').setAttribute('aria-pressed','false');
 }
}
function startGhost(){
 if(ghostController||processing||pressed||$('preview').classList.contains('show'))return;
 if(!ghostQueue.length){
  ghostQueue=ghostWords.slice();
  for(let index=ghostQueue.length-1;index>0;index--){
   const other=Math.floor(Math.random()*(index+1));
   [ghostQueue[index],ghostQueue[other]]=[ghostQueue[other],ghostQueue[index]];
  }
 }
 ghostController=new AbortController();
 setGhostControls(true);
 $('ghostStart').textContent='Stop';$('ghostStart').setAttribute('aria-pressed','true');
 ghostLoop(ghostController);
}
$('ghostStart').onclick=()=>{if(ghostController)ghostController.abort();else startGhost()};
$('ghostPace').onclick=()=>{
 ghostFast=!ghostFast;
 $('ghostPace').textContent=ghostFast?'Slowly':'Hurry';
 startGhost();
};

})();
})();
