async function imageDataForStorage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=()=>{
   const img=new Image();
   img.onerror=reject;
   img.onload=()=>{
    const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    let data=canvas.toDataURL('image/webp',0.66);
    if(data.length>600000)data=canvas.toDataURL('image/jpeg',0.52);
    if(data.length>450000)data=canvas.toDataURL('image/jpeg',0.42);
    resolve(data);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

 function closeFolderBrowser(){
  const panel=$('fortuneFolderBrowser');
  if(!panel)return;
  panel.releasePreview();
  panel.remove();
 }
 function browseFolder(useImage=null,onSelectionChange=null){
  closeFolderBrowser();
  const panel=document.createElement('section');
  panel.id='fortuneFolderBrowser';
  panel.setAttribute('aria-labelledby','fortuneFolderTitle');
  panel.style.zIndex=String(++menuZ);
  panel.innerHTML=`<header><h2 id="fortuneFolderTitle">loaded images</h2><button type="button" data-close>close</button></header>
   <label>file name <select size="6" data-files></select></label>
   <img data-preview alt=""><div data-position role="status"></div>
   <div class="folder-browser-actions"><button type="button" data-prev>previous</button><button type="button" data-next>next</button>
   <button type="button" data-select></button></div>`;
  const find=selector=>panel.querySelector(selector);
  const list=find('[data-files]'),preview=find('[data-preview]'),select=find('[data-select]');
  const entries=fortuneFolder.files.slice();
  let imageUrl='';
  panel.releasePreview=()=>{if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl='';};
  entries.forEach((entry,i)=>list.add(new Option(entry.path,i)));
  list.selectedIndex=Math.max(0,entries.findIndex(entry=>entry.selected));
  const refresh=()=>{
   const i=list.selectedIndex,entry=entries[i];
   if(!entry)return;
   panel.releasePreview();
   imageUrl=URL.createObjectURL(entry.file);
   preview.src=imageUrl;
   preview.alt=entry.file.name;
   const selected=entries.filter(item=>item.selected).length;
   find('[data-position]').textContent=`${i+1} of ${entries.length} · ${selected} selected${entry.used?' · already assigned':''}`;
   find('[data-prev]').disabled=i<=0;
   find('[data-next]').disabled=i>=entries.length-1;
   select.textContent=useImage?'use this image':entry.selected?'deselect image':'select image';
   if(!useImage)select.setAttribute('aria-pressed',String(Boolean(entry.selected)));
  };
  list.onchange=refresh;
  find('[data-prev]').onclick=()=>{list.selectedIndex--;refresh();};
  find('[data-next]').onclick=()=>{list.selectedIndex++;refresh();};
  find('[data-close]').onclick=closeFolderBrowser;
  select.onclick=async()=>{
   const entry=entries[list.selectedIndex];
   if(useImage){
    select.disabled=true;
    try{await useImage(entry);if(panel.isConnected)closeFolderBrowser();}
    catch{find('[data-position]').textContent='This image could not be loaded.';}
    finally{select.disabled=false;}
   }else{
    entry.selected=!entry.selected;
    refresh();
    onSelectionChange?.();
   }
  };
  document.body.append(panel);
  refresh();
 }
 function randomFortuneImages(pool){
  const shuffle=entries=>{
   const shuffled=[...entries];
   for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
   }
   return shuffled;
  };
  if(!pool.length)return [];
  const unused=shuffle([...new Set(pool)]),chosen=[];
  for(const slots of [4,8,8]){
   const section=[];
   for(let i=0;i<slots;i++){
    const fresh=unused.shift();
    const options=fresh?[]:shuffle(pool);
    const image=fresh||options.find(item=>!section.includes(item))||
      options.find(item=>item!==chosen.at(-1))||options[0];
    section.push(image);chosen.push(image);
   }
  }
  return chosen;
 }
 function renderFolder(selected='',notice='',assignedBefore=false,randomized=false){

   <div id="builderActions"><button id="assignFolder">assign</button><button id="browseFortuneFolder">browse images</button><label class="file-load-button">add another folder<input id="fortuneFolderUpload" type="file" webkitdirectory multiple></label><button id="folderHome">back</button></div>

  let selection=selected;
  const update=()=>{
   const selectedCount=fortuneFolder.files.filter(entry=>entry.selected).length;
   assign.textContent=selectedCount?`assign selected (${selectedCount})`:randomized?'assign random images':assignedBefore?'assign next images':'assign images';
   assign.disabled=selection===''||!fortuneFolder.files.some(entry=>randomized||entry.selected||!entry.used);
  };
  for(const choice of choices)choice.onclick=()=>{
   selection=choice.dataset.fortuneIndex;
   for(const button of choices)button.setAttribute('aria-pressed',String(button===choice));
   update();
  };

  $('fortuneFolderUpload').onchange=event=>loadFortuneFolder(event,randomized);
  assign.onclick=async()=>{
   const set=sets[Number(selection)];
   if(!set||selection==='')return;
   closeFolderBrowser();
   assign.disabled=true;
   for(const choice of choices)choice.disabled=true;
   $('fortuneFolderUpload').disabled=true;$('folderHome').disabled=true;$('browseFortuneFolder').disabled=true;
   status.hidden=false;
   status.textContent='Assigning images…';
   const chosenFiles=fortuneFolder.files.filter(entry=>entry.selected);
   const queue=chosenFiles.length?chosenFiles:fortuneFolder.files.filter(entry=>randomized||!entry.used);
   const images=[];const consumed=[];let skipped=0;
   for(const entry of queue){
    if((!randomized&&images.length===20)||!status.isConnected)break;
    consumed.push(entry);
    try{images.push(await imageDataForStorage(entry.file));}
    catch{skipped++;}
   }
   if(modalMode!=='builder'||$('folderStatus')!==status)return;
   ensureInnerChoices(set);
   const assignments=randomized?randomFortuneImages(images):images;
   assignments.forEach((data,i)=>{
    if(i<4)set.choiceImages[i]=data;
    else if(i<12)set.innerChoiceImages[i-4]=data;
    else set.fortunes[i-12].finalImage=data;
   });
   for(const entry of consumed){if(!randomized)entry.used=true;entry.selected=false;}
   buildTicker();
   const result=assignments.length?`Filled ${assignments.length} image slots in ${set.name||'untitled fortune'}.`:'No images could be assigned.';
   renderFolder(selection,result+(skipped?' Skipped '+skipped+' unreadable images.':''),true,randomized);
  };
 }
 function addFortuneFiles(files){
  for(const file of files){
   const path=file.webkitRelativePath||file.name;
   const key=JSON.stringify([path,file.size,file.lastModified]);
   if(fortuneFolder.keys.has(key))continue;
   fortuneFolder.keys.add(key);
   fortuneFolder.files.push({file,path,selected:false,used:false});
  }
 }
 function loadFortuneFolder(event,randomized=false){
  const files=[...event.target.files].filter(file=>/^image\//.test(file.type)||/\.(png|jpe?g|webp|gif|avif|bmp|svg)$/i.test(file.name));
  if(!files.length){alert('Choose a folder containing images.');return;}
  files.sort((a,b)=>(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,undefined,{numeric:true}));
  addFortuneFiles(files);
  closeFolderBrowser();renderFolder('','',false,randomized);
 }
 async function fetchSharedFortuneImage(path){
  const entry=mediaItems.find(item=>item.sharedPath===path);
  if(entry?.file)return entry.file;
  const response=await fetch(new URL(path,window.LarryBackgroundMedia.base));
  if(!response.ok)throw new Error('Image unavailable');
  const blob=await response.blob();
  if(!blob.type.startsWith('image/'))throw new Error('Invalid image');
  const file=new File([blob],path.split('/').pop(),{type:blob.type,lastModified:0});
  if(entry)entry.file=file;
  return file;
 }
 async function loadFortuneImageSources(button,files,paths){
  const status=$('builderMessage');
  button.disabled=true;
  status.textContent='Loading images…';
  try{
   const results=await Promise.allSettled(paths.map(fetchSharedFortuneImage));
   if(!button.isConnected)return;
   const loaded=results.filter(result=>result.status==='fulfilled').map(result=>result.value);
   const missing=results.length-loaded.length;
   if(!files.length&&!loaded.length){
    status.textContent='Images unavailable. Open this page on GitHub Pages, or load an image folder.';
    return;
   }
   addFortuneFiles([...files,...loaded]);
   renderFolder('',missing?missing+' shared images could not be loaded.':'',false,true);
  }finally{button.disabled=false;}
 }

<script id="v29-menu-layout-fixes-script">
(()=>{
 const $=id=>document.getElementById(id);
 const arrange=()=>{
  const modal=$('modal'); if(!modal)return;
  const top=modal.querySelector('.slideshow-top');
  let ret=$('returnStarfieldBtn');
  // Return to Starfield belongs exclusively to Backgrounds, and only once.
  if(!modal.classList.contains('modal-slideshow')){
   if(ret && ret.parentElement===modal) ret.remove();
   return;
  }
  if(top){
   if(!ret){ret=document.createElement('button');ret.id='returnStarfieldBtn';ret.className='compact-load';ret.type='button';ret.textContent='return to starfield';ret.onclick=()=>{if(typeof stopMediaShow==='function')stopMediaShow();};}
   if(ret.parentElement!==modal)modal.appendChild(ret);
   ret.style.display='';
   // Ensure the button is a direct child of the modal, immediately before Close.
   const close=$('modalClose');if(close&&ret.nextElementSibling!==close)modal.insertBefore(ret,close);
   const imageOpts=$('imageOptions'),videoOpts=$('videoOptions');
   const play=$('mediaPlayPauseBtn');if(play&&play.textContent.trim().toLowerCase()==='play / pause')play.textContent='play';

   // Place Select All between the title and Delete All in the image header.
   const ih=imageOpts?.querySelector('.slide-list-head'),isel=$('imageSelectAllBtn'),idel=$('deleteAllImagesBtn');
   if(ih&&isel&&isel.parentElement!==ih)ih.insertBefore(isel,idel||null);
  }
 };
 // Replace the earlier observer's final placement effects after it has had a chance to run.
 const run=()=>requestAnimationFrame(()=>requestAnimationFrame(arrange));
 const obs=new MutationObserver(run);obs.observe($('modalBody')||document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
 const oldOpen=window.openModal;
 if(typeof oldOpen==='function'&&!window.__v29OpenWrap){window.openModal=function(kind){const r=oldOpen.apply(this,arguments);run();return r;};window.__v29OpenWrap=true;}
 document.addEventListener('click',e=>{if(e.target.closest('#slideshowBtn'))run();});
 // Correct title action labels/placement after dynamic content is rendered.
 const fixTitle=()=>{
  const title=$('modalTitle');if(!title)return;
  const log=$('openFortuneLogFromEdit');if(log)log.textContent='open fortune log';
  const date=$('logDateBtn'),download=$('downloadLogBtn');
  if(date&&download){const span=date.parentElement;if(span&&span.contains(download)){span.style.position='absolute';span.style.right='58px';span.style.top='7px';span.style.display='flex';span.style.gap='4px';}}
 };
 const titleObs=new MutationObserver(()=>requestAnimationFrame(fixTitle));titleObs.observe($('modalBody')||document.body,{childList:true,subtree:true});
 // Dragging is handled by the single shared installDragging() routine above.
 run();
})();
</script>

<script>
(() => {
 const menuText='button,h2,h3,h4,p,label,small,summary,legend';
 const targets = '#controls button,#fortuneBankBtnMain,#wisdomBankBtnMain,'+
  ['#voicePanel','#voiceManagePanel','#modal','#fortuneFolderBrowser','#rainbowOpPanel','#rainbowThemePanel'].map(menu=>`${menu} :is(${menuText})`).join(',');
 const excluded = '#orchardGrid,.orchard-grid,.orchard-item,#wisdomControls,#wisdomQuote,#quoteActions,.modal-reading';
 function backCaption(control) {
  if (!control.matches(targets) || control.closest(excluded)) return;
  const label = control.matches('#fortuneBankBtnMain,#wisdomBankBtnMain') ? control.firstElementChild : control;
  for (const node of [...label.childNodes]) {
   if (node.nodeType !== Node.TEXT_NODE || !node.textContent.trim()) continue;
   const caption = document.createElement('span');
   caption.className = 'fortune-button-caption';
   node.replaceWith(caption);
   caption.append(node);
  }
 }
 document.querySelectorAll(targets).forEach(backCaption);
 const observer = new MutationObserver(records => {
  for (const record of records) {
   const parent = record.target.nodeType === Node.ELEMENT_NODE ? record.target : record.target.parentElement;
   const control = parent?.closest(targets);
   if (control && !parent.closest('.fortune-button-caption')) backCaption(control);
   for (const added of record.addedNodes) {
    if (added.nodeType !== Node.ELEMENT_NODE) continue;
    backCaption(added);
    added.querySelectorAll(targets).forEach(backCaption);
   }
  }
 });
 observer.observe(document.body,{childList:true,characterData:true,subtree:true});
})();
</script>

<script id="v28-final-reliability-fixes-script">
(()=>{
 const $=id=>document.getElementById(id);
 // Dragging is handled by the single shared installDragging() routine above.
 // Open positions are set after the modal has its final class and dimensions.
 const positionPanel=kind=>{
  const m=$('modal');if(!m)return;
  if(kind==='music'){m.style.position='fixed';m.style.left='auto';m.style.right='16px';m.style.top='14px';m.style.transform='none';}
  if(kind==='slideshow'){m.style.position='fixed';m.style.left='auto';m.style.right='16px';m.style.top='20px';m.style.transform='none';}
 };
 if(typeof window.openModal==='function'&&!window.__v28PositionWrap){
  const prev=window.openModal;window.openModal=function(kind='clear'){const result=prev.apply(this,arguments);if(kind==='music'||kind==='slideshow')requestAnimationFrame(()=>positionPanel(kind));return result;};window.__v28PositionWrap=true;
 }
 // Combined repeat mode: the voice queue and the music queue can run together, even with both menus closed.
 const combo=$('combinedRepeatBtn');
 const updateCombo=on=>{if(!combo)return;combo.setAttribute('aria-pressed',String(on));combo.textContent=on?'loop music + quotes: on':'loop music + quotes: off';};
 if(combo){
  const isOn=localStorage.getItem('starfield-combined-repeat')==='true';updateCombo(isOn);
  combo.addEventListener('click',()=>{
   const turnOn=combo.getAttribute('aria-pressed')!=='true';localStorage.setItem('starfield-combined-repeat',String(turnOn));updateCombo(turnOn);
   if(turnOn){
    if(typeof musicRepeatMode!=='undefined'){musicRepeatMode='repeat-all';localStorage.setItem('starfield-music-repeat','repeat-all');}
    const vm=$('voiceMode');if(vm)vm.value='all';
    if(typeof wisdomPlaybackMode!=='undefined')wisdomPlaybackMode='all';
    if(typeof selectedWisdom==='function'&&typeof speakBankItems==='function')speakBankItems(selectedWisdom(),true);
    if(typeof musicItems!=='undefined'&&typeof musicAudio!=='undefined'&&musicAudio){
     const queue=musicItems.map((x,i)=>({...x,index:i})).filter(x=>x.selected);
     if(queue.length&&musicAudio.paused){const current=queue.find(x=>x.index===musicCurrent);const first=(current||queue[0]).index;const playButton=$('radioPlayPause');if(playButton)playButton.click();else{
       const item=musicItems[first];musicCurrent=first;musicAudio.src=item.url;musicAudio.play().catch(()=>{});
      }}
    }
   }else{
    if(typeof stopWisdomQueue==='function')stopWisdomQueue();
    if('speechSynthesis'in window)speechSynthesis.cancel();
    if(typeof musicRepeatMode!=='undefined'){musicRepeatMode='repeat1';localStorage.setItem('starfield-music-repeat','repeat1');}
   }
  });
 }
 // Keep the music player's onended path independent of the menu DOM. Menu closure must not stop queue advancement.
 if(typeof musicAudio!=='undefined'&&musicAudio){
  const safeAdvance=()=>{
   if(typeof musicItems==='undefined'||!musicItems.length)return;
   const q=musicItems.map((x,i)=>({...x,index:i})).filter(x=>x.selected);if(!q.length)return;
   let next;
   if(musicRepeatMode==='repeat1'&&musicItems[musicCurrent]?.selected)next=q.find(x=>x.index===musicCurrent)||q[0];
   else if(musicRepeatMode==='shuffle'){const pool=q.filter(x=>x.index!==musicCurrent);const arr=pool.length?pool:q;next=arr[Math.floor(Math.random()*arr.length)];}
   else{const pos=q.findIndex(x=>x.index===musicCurrent);next=q[(pos+1+q.length)%q.length];}
   if(!next)return;musicCurrent=next.index;musicAudio.src=next.url;
   const vol=$('musicVolume');if(vol)musicAudio.volume=+vol.value;
   musicAudio.play().catch(()=>{});
   const track=$('musicTickerTrack');if(track){const txt=String(next.name||'');track.innerHTML=`<span>${txt.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span><span aria-hidden="true">${txt.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`;}
   if($('radioPlayPause'))$('radioPlayPause').textContent=$('radioPlayPause').closest('.v29-test-panel')?'pause':'Ⅱ';
  };
  window.__v28SafeMusicAdvance=safeAdvance;musicAudio.onended=safeAdvance;
 }
})();

<script id="v31-backgrounds-final-layout-script">
(()=>{

 function arrange(){
  const p=getPanel();if(!p)return;
  const imgs=p.querySelector('#imageOptions'),vids=p.querySelector('#videoOptions');
  if(vids){
   const row=vids.querySelector('.v52-video-unified');
   if(row&&!row.querySelector('.sf-video-left')){const fade=vids.querySelector('#videoFadeEnd')?.closest('label'),sec=vids.querySelector('#videoFadeEndSec')?.closest('label'),speed=vids.querySelector('.video-speed-control'),reset=vids.querySelector('#videoResetBtn'),mute=vids.querySelector('#videoMuteBtn'),vol=vids.querySelector('.video-volume-popup-wrap');if([fade,sec,speed,reset,mute,vol].every(Boolean)){const left=document.createElement('span'),right=document.createElement('span');left.className='sf-video-left';right.className='sf-video-right';left.append(fade,sec,speed,reset);right.append(mute,vol);const arrowDown=speed.querySelector('#videoSpeedDownBtn'),arrowUp=speed.querySelector('#videoSpeedUpBtn');if(arrowDown&&arrowUp&&!speed.querySelector('.sf-speed-spinner')){const spinner=document.createElement('span');spinner.className='sf-speed-spinner';spinner.append(arrowUp,arrowDown);speed.append(spinner);}row.replaceChildren(left,right);}}
   // The existing +/- buttons remain the only speed-changing handlers; a native spinner delegates to them.
   const speedGroup=vids.querySelector('.video-speed-control');
   if(speedGroup&&!speedGroup.querySelector('.sf-video-speed-number')){
     const spinner=document.createElement('input');spinner.type='number';spinner.className='sf-video-speed-number';
     spinner.min='-5';spinner.max='10';spinner.step='1';spinner.value=vids.querySelector('#videoSpeed')?.value||'0';
     spinner.setAttribute('aria-label','Video speed');spinner.title='Video speed; use the up and down arrows';
     spinner.addEventListener('change',()=>{
       const speed=vids.querySelector('#videoSpeed');if(!speed)return;
       const target=Math.max(-5,Math.min(10,Math.round(Number(spinner.value)||0)));
       speed.value=String(target);
       // Existing speed-application handler is preserved and invoked by its original control.
       vids.querySelector('#videoSpeedUpBtn')?.click();
       if(Number(speed.value)>target)vids.querySelector('#videoSpeedDownBtn')?.click();
       spinner.value=speed.value;
     });
     speedGroup.append(spinner);
     speedGroup.querySelector('.sf-speed-spinner')?.setAttribute('aria-hidden','true');
     // Reflect speed changes from Reset and other controls without touching playback logic.
     const sync=()=>{const speed=vids.querySelector('#videoSpeed');if(speed&&document.activeElement!==spinner)spinner.value=speed.value;};
     speedGroup.addEventListener('click',()=>setTimeout(sync,0));
     vids.querySelector('#videoResetBtn')?.addEventListener('click',()=>setTimeout(sync,0));
   }
   const videoSec=vids.querySelector('#videoFadeEndSec');if(videoSec){const label=videoSec.closest('label');if(label)for(const node of [...label.childNodes])if(node.nodeType===3)node.textContent='';}

  }

<script id="stage23-window-stacking-script">
/* One foreground authority for the three independent floating windows.
   Legacy click handlers must not overwrite this ordering. */
(()=>{
 'use strict';
 const voice=document.getElementById('voicePanel');
 const overlay=document.getElementById('overlay');
 const music=()=>document.querySelector('.v29-test-panel[data-kind="music2"]');
 const backgrounds=()=>document.querySelector('.v29-test-panel[data-kind="slideshow2"]');
 const ordinary=()=>[voice,music(),backgrounds()].filter(Boolean);
 let counter=300000;
 function front(el){
   if(!el||!el.isConnected||el.classList.contains('hidden'))return;
   // Raise only the selected panel; do not lower other windows on each click.
   // This preserves a deterministic ordering even when legacy code touches z-index.
   el.style.setProperty('z-index',String(++counter),'important');
 }
 document.addEventListener('pointerdown',e=>{
   if(!(e.target instanceof Element))return;
   const panel=e.target.closest('#voicePanel,.v29-test-panel');
   if(panel)front(panel);
 },true);
 const observer=new MutationObserver(records=>{
   for(const record of records){
     if(record.type==='attributes'&&record.attributeName==='class'&&record.target===voice&&!voice.classList.contains('hidden'))front(voice);
     if(record.type==='childList')for(const node of record.addedNodes){
       if(node.nodeType===1&&node.matches?.('.v29-test-panel'))front(node);
     }
   }
 });
 observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
 // The full-screen overlay contains dismissible dialogs, not the Backgrounds
 // panel. It must not sit over the ordinary independent floating windows.
 // Dialogs such as Build Fortune, Edit Fortunes and the banks must sit
 // above the independent floating windows, but still dismiss normally.
 function syncDialogLayer(){
   if(!overlay)return;
   const open=!overlay.classList.contains('hidden');
   overlay.style.setProperty('z-index',open?'900000':'99990','important');
 }
 syncDialogLayer();
 if(overlay)new MutationObserver(syncDialogLayer).observe(overlay,{attributes:true,attributeFilter:['class']});
})();
</script>

function squareTunnel(){
 const sides=[[-7,-5,1,0,14],[7,-5,0,1,10],[7,5,-1,0,14],[-7,5,0,-1,10]];
 const point=(x,y,depth)=>[600+x*650/depth,400+y*650/depth].join(',');
 const tiles=[];
 for(let row=0;row<39;row++){
  const near=6+row,far=near+1;
  for(const [x,y,dx,dy,count] of sides){
   for(let column=0;column<count;column++){
    const x1=x+column*dx,y1=y+column*dy,x2=x1+dx,y2=y1+dy;
    const fill=(column+row)%2?'#101010':'#f5f5f5';
    const points=[point(x1,y1,near),point(x2,y2,near),point(x2,y2,far),point(x1,y1,far)].join(' ');
    tiles.push(`<polygon points="${points}" fill="${fill}" stroke="${fill}" stroke-width=".22"/>`);
   }
  }
 }
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><rect width="1200" height="800" fill="#111"/>${tiles.join('')}</svg>`;
 return svg;
}
styles['Square 3D tunnel']='square-tunnel';
const opCycle=document.getElementById('opArtCycle');
const opEntries=Object.entries(styles).filter(([,style])=>style);
let opRunning=false,opTimer,opAnimation,opLayer,opCurrent=null,opQueue=[];
const squareBackground=()=>`center / cover no-repeat url("data:image/svg+xml,${encodeURIComponent(squareTunnel())}")`;
function endOpTransition(){
 if(opLayer){bg.style.background=opLayer.style.background;opLayer.remove();opLayer=null;}
 opAnimation?.cancel();opAnimation=null;
}
function stopOpCycle(){
 clearTimeout(opTimer);opRunning=false;opQueue=[];
 opCycle.setAttribute('aria-pressed','false');opCycle.textContent='play Op Art';
 endOpTransition();
}
function showOpStyle(name,transition='cut',seconds=0){
 const style=styles[name];
 endOpTransition();
 if(!style){clearOpArt();return;}
 if(!document.body.classList.contains('op-art-active'))document.dispatchEvent(new CustomEvent('fortune-op-art-selected',{detail:{active:true}}));
 bg.style.display='block';document.body.classList.add('op-art-active');
 const background=style==='square-tunnel'?squareBackground():style;
 opCurrent=name;
 if(transition==='cut'||!bg.style.background){bg.style.background=background;return;}
 opLayer=document.createElement('div');
 Object.assign(opLayer.style,{position:'absolute',inset:'0',background});bg.append(opLayer);
 const clips={circle:['circle(0% at 50% 50%)','circle(76% at 50% 50%)'],right:['inset(0 100% 0 0)','inset(0)'],left:['inset(0 0 0 100%)','inset(0)'],down:['inset(0 0 100% 0)','inset(0)']};
 const frames=transition==='fade'?[{opacity:0},{opacity:1}]:clips[transition].map(clipPath=>({clipPath}));
 opAnimation=opLayer.animate(frames,{duration:seconds*1000,fill:'forwards',easing:'linear'});
 opAnimation.onfinish=endOpTransition;
}
function nextOpStyle(){
 if(!opRunning)return;
 const names=opEntries.map(([name])=>name);
 let next;
 if(document.getElementById('opArtShuffle').checked){
  if(!opQueue.length){
   opQueue=names.filter(name=>name!==opCurrent);
   for(let i=opQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opQueue[i],opQueue[j]]=[opQueue[j],opQueue[i]];}
  }
  next=opQueue.pop();
 }else next=names[(names.indexOf(opCurrent)+1)%names.length];
 const transition=document.getElementById('opArtTransition').value;
 const seconds=transition==='cut'?0:Math.max(.1,Math.min(20,Number(document.getElementById('opArtTransitionTime').value)||1));
 const hold=Math.max(1,Math.min(120,Number(document.getElementById('opArtHold').value)||8));
 showOpStyle(next,transition,seconds);
 opTimer=setTimeout(nextOpStyle,(seconds+hold)*1000);
}
opCycle.onclick=()=>{
 if(opRunning){stopOpCycle();return;}
 opRunning=true;opCycle.setAttribute('aria-pressed','true');opCycle.textContent='stop Op Art';
 nextOpStyle();
};
document.getElementById('opArtShuffle').onchange=()=>{opQueue=[];};
for(const name of Object.keys(styles)){
 const button=document.createElement('button');
 button.textContent=name[0].toLowerCase()+name.slice(1);
 if(name.includes('3D'))button.classList.add('preserve-3d');
 button.onclick=()=>{stopOpCycle();showOpStyle(name);};
 document.getElementById('rainbowOpChoices').append(button);
}
document.getElementById('rainbowOpClose').onclick=()=>op.style.display='none';
let oldX=0,oldY=0;const head=op.querySelector('.op-head');head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;oldX=e.clientX-op.offsetLeft;oldY=e.clientY-op.offsetTop;head.setPointerCapture(e.pointerId)});head.addEventListener('pointermove',e=>{if(!head.hasPointerCapture(e.pointerId))return;op.style.left=Math.max(0,e.clientX-oldX)+'px';op.style.top=Math.max(0,e.clientY-oldY)+'px';op.style.right='auto'});
const opButton=document.createElement('button');
opButton.textContent='OP ART';opButton.type='button';opButton.className='compact-load';
opButton.onclick=()=>{
 const opening=op.style.display!=='block';
 op.style.display=opening?'block':'none';
 if(opening){

  const backgrounds=opButton.closest('.v29-test-panel');
  if(backgrounds)backgrounds.style.display='none';
 }
};
const appearanceButton=document.createElement('button');
appearanceButton.type='button';appearanceButton.id='rainbowAppearanceBtn';appearanceButton.textContent='appearance menu';
function placeOpButton(){
 const star=document.querySelector('.v29-test-panel[data-kind="slideshow2"] #backgroundStarfieldBtn');
 if(!star)return;
 const host=star.closest('.sf-header-actions');
 if(!host)return;
 const backgrounds=star.closest('.v29-test-panel');
 const prev=backgrounds.querySelector('#slidePrevBtn'),next=backgrounds.querySelector('#slideNextBtn');
 if(prev&&next){
  let group=backgrounds.querySelector('.background-arrow-group');
  if(!group){group=document.createElement('span');group.className='background-arrow-group';prev.before(group);}
  if(prev.parentElement!==group||next.parentElement!==group)group.append(prev,next);
 }
 const title=backgrounds.querySelector('#modalTitle');
 if(title&&title.nextElementSibling!==appearanceButton)title.after(appearanceButton);
 const grip=backgrounds.querySelector('.background-drag-grip');
 if(grip&&grip.parentElement!==host)host.prepend(grip);
 if(opButton.nextElementSibling!==star)star.before(opButton);
}
new MutationObserver(placeOpButton).observe(document.body,{childList:true,subtree:true});
function clearOpArt(){
 stopOpCycle();
 if(bg.style.display!=='block')return;
 bg.style.display='none';
 document.body.classList.remove('op-art-active');
 document.dispatchEvent(new CustomEvent('fortune-op-art-selected',{detail:{active:false,clearing:true}}));
}
document.addEventListener('fortune-media-started',stopOpCycle);
document.addEventListener('fortune-media-covered-op-art',clearOpArt);
document.addEventListener('click',event=>{
 if(event.target.closest('#backgroundStarfieldBtn,#mediaReturnStarfield'))clearOpArt();
},true);

// Raise Draw while its menus are open and pass pointer input elsewhere through to Fortune Starfield.
const menuIds=['panel2','custom','builder','design'];
function overDrawPanel(x,y){try{const doc=frame.contentDocument;if(!doc)return false;return menuIds.some(id=>{const el=doc.getElementById(id);if(!el||el.classList.contains('hidden'))return false;const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}catch(_){return false}}
let drawingPointer=null;
function fortuneUI(target){
 return !!target.closest('button,input,textarea,select,a,label,#controls,#wisdomRail,#tickerWrap,#overlay,#voicePanel,#voiceManagePanel,#fortuneFolderBrowser,#rainbowOpPanel,#rainbowThemePanel,.v29-test-panel,#introScreen,#welcomeBridge,#board,#wisdomControls,#phraseBar,#status');
}
function wisdomActive(){return document.body.matches('.wisdom-grid,.wisdom-quote');}
function sendGesture(phase,e){
 frame.contentWindow?.postMessage({kind:'rainbow-gesture',phase,x:e?.clientX,y:e?.clientY},'*');
}
function finish(phase,e){
 if(drawingPointer===null||(e&&e.pointerId!==drawingPointer))return;
 drawingPointer=null;
 sendGesture(phase,e);
}
document.addEventListener('pointermove',e=>{
 if(drawingPointer!==null){
  if(e.pointerId===drawingPointer)sendGesture('move',e);
  return;
 }
 const pointerEvents=!wisdomActive()&&overDrawPanel(e.clientX,e.clientY)?'auto':'none';
 if(frame.style.pointerEvents!==pointerEvents)frame.style.pointerEvents=pointerEvents;
},true);
document.addEventListener('pointerdown',e=>{
 if(drawingPointer!==null||wisdomActive()||e.button!==0||fortuneUI(e.target))return;
 if(overDrawPanel(e.clientX,e.clientY)){frame.style.pointerEvents='auto';return;}
 drawingPointer=e.pointerId;
 frame.style.pointerEvents='none';
 sendGesture('down',e);
},true);
window.addEventListener('pointerup',e=>finish('up',e),true);
window.addEventListener('pointercancel',e=>finish('cancel',e),true);
window.addEventListener('blur',()=>finish('cancel'));
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 if(!doc)return;
 const menus=menuIds.map(id=>doc.getElementById(id)).filter(Boolean);
 const syncDrawLayer=()=>{
  const open=menus.some(menu=>!menu.classList.contains('hidden'));
  frame.classList.toggle('draw-menu-front',open);
  if(!open)frame.style.pointerEvents='none';
 };
 const observer=new MutationObserver(syncDrawLayer);
 menus.forEach(menu=>observer.observe(menu,{attributes:true,attributeFilter:['class']}));
 syncDrawLayer();
 doc.addEventListener('pointerdown',()=>{if(frame.classList.contains('draw-menu-front'))frame.dispatchEvent(new Event('raise-floating-menu'));},true);
 doc.addEventListener('pointermove',e=>{
  if(!overDrawPanel(e.clientX,e.clientY))frame.style.pointerEvents='none';
 },true);
});

})();

<script id="rainbow-theme-script">
(()=>{
 const $=id=>document.getElementById(id);
 const panel=$('rainbowThemePanel'),op=$('rainbowOpPanel');
 document.addEventListener('click',event=>{
  if(!event.target.closest('#rainbowAppearanceBtn'))return;
  const opening=panel.style.display!=='block';
  panel.style.display=opening?'block':'none';

 });
 const handle=panel.querySelector('.appearance-head');
 handle.addEventListener('pointerdown',event=>{
  if(event.button!==0||event.target.closest('button'))return;
  const box=panel.getBoundingClientRect(),x=event.clientX-box.left,y=event.clientY-box.top;
  handle.setPointerCapture(event.pointerId);
  handle.onpointermove=move=>{
   if(!handle.hasPointerCapture(move.pointerId))return;
   panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,move.clientX-x))+'px';
   panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,move.clientY-y))+'px';
   panel.style.right='auto';
  };
 });
 $('rainbowThemeClose').onclick=()=>panel.style.display='none';
 const root=document.documentElement;
 const sliders={text:$('rainbowThemeText'),outline:$('rainbowThemeHue'),glow:$('rainbowThemeGlow'),backing:$('rainbowThemeBacking')};
 const cycling={text:$('rainbowCycleText'),outline:$('rainbowCycleOutline'),glow:$('rainbowCycleGlow')};
 const defaults={text:119,outline:119,glow:43,backing:0};
 const fonts={sans:'Arial,sans-serif',humanist:'Verdana,sans-serif',serif:'Georgia,serif'};
 const font=$('rainbowThemeFont'),opacityValue=$('rainbowThemeOpacityValue');
 const opacity=$('rainbowThemeOpacity'),backingOn=$('rainbowThemeBackingOn'),round=$('rainbowThemeRound');
 const drawDocument=()=>$('rainbowStudioFrame').contentDocument;
 let phase=172,timer,greyOutline=false;
 const hueColour=degrees=>`hsl(${degrees} 100% 50%)`;
 function colour(n){return n>=110?'#fff':n>=100?'#000':n>=91?'#774c32':hueColour(n*4);}
 const stop=n=>`${n/119*100}%`;
 const spectrum=Array.from({length:7},(_,index)=>`${colour(index*15)} ${stop(index*15)}`);
 const track=`linear-gradient(to right,${spectrum.join(',')},${colour(90)} ${stop(90.5)},#774c32 ${stop(90.5)} ${stop(99.5)},#000 ${stop(99.5)} ${stop(109.5)},#fff ${stop(109.5)} 100%)`;
 function updateColours(){
  const palette=Object.fromEntries(Object.entries(sliders).map(([key,input])=>{
   const n=Number(input.value);
   const fixed=key==='backing'?`hsl(0 0% ${n}%)`:key==='outline'&&greyOutline?'#bcbcbc':colour(n);
   const current=cycling[key]?.checked?hueColour(phase):fixed;
   input.style.setProperty('--chosen-hue',fixed);
   input.setAttribute('aria-valuetext',cycling[key]?.checked?'rainbow':key==='backing'?n+'% white':key==='outline'&&greyOutline?'light grey':n>=110?'white':n>=100?'black':n>=91?'brown':`${n*4} degrees`);
   return [key,current];
  }));
  const {text,outline,glow,backing}=palette;
  const shadow=`0 0 6px ${glow},0 0 14px color-mix(in srgb,${glow} 55%,transparent)`;
  for(const [key,value] of Object.entries({'appearance-text':text,'appearance-outline':outline,'appearance-glow':shadow,'sf-menu-border-blue':outline,'sf-hover-border':outline,'sf-hover-glow':shadow,'fortune-text-backing':backingOn.checked?`color-mix(in srgb,${backing} 90%,transparent)`:'transparent'})){
   root.style.setProperty('--'+key,value);
  }
  const drawRoot=drawDocument()?.documentElement;
  drawRoot?.style.setProperty('--draw-outline',outline);
  drawRoot?.style.setProperty('--draw-text',text);
  drawRoot?.style.setProperty('--draw-menu-glow',shadow);
  drawRoot?.style.setProperty('--draw-selection',glow);
 }
 function refreshCycle(){
  clearInterval(timer);
  updateColours();
  if((Object.values(cycling).some(box=>box.checked)))timer=setInterval(()=>{phase=(phase+4)%360;updateColours();},180);
 }
 function apply(){
  const level=Number(opacity.value);
  const fill=`rgba(34,39,46,${level/100})`;
  const blur=`blur(${level*level*.0012}px)`;
  opacityValue.value=level+'%';
  root.style.setProperty('--appearance-blur',blur);
  root.style.setProperty('--appearance-font',fonts[font.value]);
  for(const name of ['--sf-palette-menu-background','--sf-palette-floating-background','--sf-palette-dialog-background','--appearance-fill'])root.style.setProperty(name,fill);
  root.toggleAttribute('data-appearance-clear',Number(opacity.value)===0);
  root.toggleAttribute('data-appearance-backing-off',!backingOn.checked);
  root.toggleAttribute('data-appearance-rounded',round.checked);
 const doc=drawDocument();
  if(doc?.head){
   let drawStyle=doc.getElementById('rainbow-dynamic-theme');
   if(!drawStyle){drawStyle=doc.createElement('style');drawStyle.id='rainbow-dynamic-theme';doc.head.append(drawStyle);}
   drawStyle.textContent=[
    `.pop,.pop :is(button,label,input,select){font-family:${fonts[font.value]}!important;font-size:10px!important}`,
    '#panel2,#custom,#builder,#design,.pop button{border-color:var(--draw-outline,#fff)!important}',
    '#panel2,#custom,#builder,#design,.pop .head,.pop button{color:var(--draw-text,#fff)!important}',
    `#panel2,#custom,#builder,#design{background:${fill}!important;backdrop-filter:${blur}!important;border-radius:${round.checked?'9px':'0'}!important}`,
    `.pop :is(button,select,input[type=number],input[type=checkbox]){border-radius:${round.checked?'5px':'0'}!important}`,
    Number(opacity.value)===0&&'#panel2,#custom,#builder,#design,.pop .head,.pop button:not(.swatch,.special-mode){background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}',
    !backingOn.checked&&'.pop .head,.pop button:not(.swatch,.special-mode){background:transparent!important}',
    `
.pop input[type=checkbox]{appearance:none!important;box-sizing:border-box;width:14px!important;height:14px!important;min-width:14px;display:inline-grid!important;place-items:center;vertical-align:middle;flex:none;background:transparent!important;border:1px solid var(--draw-outline,#568492)!important}
.pop input[type=checkbox]:is(:checked,:indeterminate)::before{content:'';display:block;width:8px;height:8px;background:var(--draw-outline,#568492);clip-path:polygon(0 48%,15% 31%,39% 58%,84% 5%,100% 21%,40% 94%)}
.pop input[type=checkbox]:indeterminate::before{clip-path:inset(40% 0)}
.pop input[type=checkbox]:disabled{opacity:.48}
.pop input[type=checkbox]:focus-visible{outline:1px solid currentColor;outline-offset:2px}
`,
    '.pop button:is(.active,:hover,:focus-visible){box-shadow:var(--draw-menu-glow,0 0 8px white)!important}'
   ].filter(Boolean).join('\n');
  }
  updateColours();
 }
 for(const token of ['text','outline','glow'])root.setAttribute('data-appearance-'+token,'');
 for(const [key,input] of Object.entries(sliders)){
  input.style.setProperty('--hue-track',key==='backing'?'linear-gradient(to right,#000,#fff)':track);
  input.oninput=()=>{
   if(key==='outline')greyOutline=false;
   if(cycling[key])cycling[key].checked=false;
   refreshCycle();
  };
  if(cycling[key])cycling[key].onchange=refreshCycle;
 }
 $('rainbowThemeGray').onclick=()=>{greyOutline=true;cycling.outline.checked=false;refreshCycle();};
 $('rainbowThemeClear').onclick=()=>{opacity.value='0';apply();};
 function reset(){
  greyOutline=false;phase=172;backingOn.checked=false;round.checked=false;opacity.value='33';font.value='sans';
  for(const [key,input] of Object.entries(sliders)){input.value=defaults[key];if(cycling[key])cycling[key].checked=key==='glow';}
  apply();refreshCycle();
 }
 $('rainbowThemeReset').onclick=reset;
 font.onchange=apply;
 opacity.oninput=apply;
 backingOn.onchange=apply;
 round.onchange=apply;
 $('rainbowStudioFrame').addEventListener('load',apply);
 reset();
})();
</script>

<script id="floating-menu-order">
(()=>{
 const selector='#overlay,#voicePanel,#voiceManagePanel,#fortuneFolderBrowser,.v29-test-panel,#rainbowOpPanel,#rainbowThemePanel,#rainbowStudioFrame.draw-menu-front';
 const seen=new WeakMap();
 let next=100001;
 function raise(menu){
  if(menu)menu.style.setProperty('z-index',String(++next),'important');
 }
 function sync(){
  for(const menu of document.querySelectorAll(selector+',#rainbowStudioFrame')){
   const open=menu.matches(selector)&&getComputedStyle(menu).display!=='none'&&!menu.classList.contains('hidden');
   if(open&&!seen.get(menu))raise(menu);
   if(!open&&seen.get(menu)&&menu.id==='rainbowStudioFrame')menu.style.removeProperty('z-index');
   seen.set(menu,open);
  }
 }
 document.addEventListener('pointerdown',event=>raise(event.target.closest(selector)),true);
 document.getElementById('rainbowStudioFrame').addEventListener('raise-floating-menu',event=>raise(event.currentTarget));
 new MutationObserver(records=>{
  if(records.some(record=>record.type==='childList'||record.target.matches(selector+',#rainbowStudioFrame')))sync();
 }).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
 sync();
})();
</script>
