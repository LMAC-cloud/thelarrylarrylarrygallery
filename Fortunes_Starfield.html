async function imageDataForStorage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=()=>{
   const img=new Image();
   img.onerror=reject;
   img.onload=()=>{
    const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    let data=canvas.toDataURL('image/webp',0.66);
    if(data.length>600000)data=canvas.toDataURL('image/jpeg',0.52);
    if(data.length>450000)data=canvas.toDataURL('image/jpeg',0.42);
    resolve(data);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function createV29TestPanel(kind,title){
 let panel=document.querySelector('.v29-test-panel[data-kind="'+kind+'"]');
 if(panel){panel.remove();}
 panel=document.createElement('section');panel.id='modal';panel.className='v29-test-panel '+(kind==='music2'?'modal-music':'modal-slideshow');panel.dataset.kind=kind;panel.setAttribute('aria-label',title);
 panel.innerHTML='<button id="modalClose" type="button" style="float:right">✕ close</button><div id="modalBody"></div>';document.body.appendChild(panel);
 const saved=(kind==='slideshow2' && window.__backgroundsSessionPosition) || (()=>{try{return JSON.parse(localStorage.getItem('starfield-'+kind+'-position-v29')||'null')}catch(e){return null}})();
 if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){panel.dataset.left=saved.left+'px';panel.dataset.top=saved.top+'px';panel.style.setProperty('position','fixed','important');panel.style.setProperty('left',panel.dataset.left,'important');panel.style.setProperty('right','auto','important');panel.style.setProperty('top',panel.dataset.top,'important');panel.style.setProperty('transform','none','important');}
 // Stacking is handled exclusively by the Stage 23 window controller.
 panel.addEventListener('pointerdown',e=>{
  const h=e.target.closest('#modalTitle');
  if(!h||e.button!==0||e.target.closest('button,input,select,label'))return;
  // This panel shares legacy #modal CSS. Several old rules use !important for
  // left/right/top, so ordinary element.style assignments cannot move it.
  e.stopPropagation();e.preventDefault();
  const r=panel.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
  const set=(prop,value)=>panel.style.setProperty(prop,value,'important');
  set('position','fixed');set('left',r.left+'px');set('right','auto');set('top',r.top+'px');set('transform','none');set('margin','0');
  const move=ev=>{
   if(ev.pointerId!==undefined&&e.pointerId!==undefined&&ev.pointerId!==e.pointerId)return;
   set('left',Math.max(0,Math.min(innerWidth-panel.offsetWidth,ev.clientX-dx))+'px');
   set('top',Math.max(0,Math.min(innerHeight-Math.min(panel.offsetHeight,innerHeight),ev.clientY-dy))+'px');
  };
  const up=()=>{
   document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
   const lastPosition={left:parseFloat(panel.style.left),top:parseFloat(panel.style.top)};
   if(kind==='slideshow2'&&Number.isFinite(lastPosition.left)&&Number.isFinite(lastPosition.top))window.__backgroundsSessionPosition=lastPosition;
   try{localStorage.setItem('starfield-'+kind+'-position-v29',JSON.stringify(lastPosition))}catch(err){}
  };
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
 });
 return panel;
}

<script id="v29-menu-layout-fixes-script">
(()=>{

 const arrange=()=>{
  const modal=$('modal'); if(!modal)return;

  let ret=$('returnStarfieldBtn');
  // Return to Starfield belongs exclusively to Backgrounds, and only once.
  if(!modal.classList.contains('modal-slideshow')){
   if(ret && ret.parentElement===modal) ret.remove();
   return;
  }
  if(top){
   if(!ret){ret=document.createElement('button');ret.id='returnStarfieldBtn';ret.className='compact-load';ret.type='button';ret.textContent='return to starfield';ret.onclick=()=>{if(typeof stopMediaShow==='function')stopMediaShow();};}
   if(ret.parentElement!==modal)modal.appendChild(ret);
   ret.style.display='';
   // Ensure the button is a direct child of the modal, immediately before Close.
   const close=$('modalClose');if(close&&ret.nextElementSibling!==close)modal.insertBefore(ret,close);
   const imageOpts=$('imageOptions'),videoOpts=$('videoOptions');
   const play=$('mediaPlayPauseBtn');if(play&&play.textContent.trim().toLowerCase()==='play / pause')play.textContent='play';
   const sec=$('slideSeconds');if(sec){const label=sec.closest('label');if(label){label.firstChild.textContent='duration ';}}
   // Place Select All between the title and Delete All in the image header.
   const ih=imageOpts?.querySelector('.slide-list-head'),isel=$('imageSelectAllBtn'),idel=$('deleteAllImagesBtn');
   if(ih&&isel&&isel.parentElement!==ih)ih.insertBefore(isel,idel||null);
  }
 };
 // Replace the earlier observer's final placement effects after it has had a chance to run.
 const run=()=>requestAnimationFrame(()=>requestAnimationFrame(arrange));
 const obs=new MutationObserver(run);obs.observe($('modalBody')||document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
 const placeApply=type=>{
  const apply=$('applyMediaBtn'),opts=type==='video'?$ ('videoOptions'):$('imageOptions');if(!apply||!opts)return;

   if(type==='image'){const head=opts.querySelector('.slide-list-head');opts.insertBefore(slot,head||opts.firstChild);}else{const row=opts.querySelector('.slide-row');if(row){slot.style.position='absolute';slot.style.right='0';slot.style.top='0';row.style.position='relative';row.style.paddingRight='58px';row.appendChild(slot);}else opts.insertBefore(slot,opts.firstChild);}}
  slot.appendChild(apply);apply.style.display='inline-block';apply.style.margin='0';
 };
 document.addEventListener('click',e=>{if(e.target.closest('#imageShowBtnTop,#imageShowBtn'))setTimeout(()=>placeApply('image'),0);if(e.target.closest('#videoShowBtnTop,#videoShowBtn'))setTimeout(()=>placeApply('video'),0);});

 const oldOpen=window.openModal;
 if(typeof oldOpen==='function'&&!window.__v29OpenWrap){window.openModal=function(kind){const r=oldOpen.apply(this,arguments);run();return r;};window.__v29OpenWrap=true;}
 document.addEventListener('click',e=>{if(e.target.closest('#slideshowBtn'))run();});
 // Correct title action labels/placement after dynamic content is rendered.
 const fixTitle=()=>{
  const title=$('modalTitle');if(!title)return;

 };

(()=>{
 const $=id=>document.getElementById(id);
 // Dragging is handled by the single shared installDragging() routine above.
 // Open positions are set after the modal has its final class and dimensions.
 const positionPanel=kind=>{
  const m=$('modal');if(!m)return;
  if(kind==='music'){m.style.position='fixed';m.style.left='auto';m.style.right='16px';m.style.top='14px';m.style.transform='none';}
  if(kind==='slideshow'){m.style.position='fixed';m.style.left='auto';m.style.right='16px';m.style.top='20px';m.style.transform='none';}
 };
 if(typeof window.openModal==='function'&&!window.__v28PositionWrap){
  const prev=window.openModal;window.openModal=function(kind='clear'){const result=prev.apply(this,arguments);if(kind==='music'||kind==='slideshow')requestAnimationFrame(()=>positionPanel(kind));return result;};window.__v28PositionWrap=true;
 }
 // Combined repeat mode: the voice queue and the music queue can run together, even with both menus closed.
 const combo=$('combinedRepeatBtn');
 const updateCombo=on=>{if(!combo)return;combo.setAttribute('aria-pressed',String(on));combo.textContent=on?'loop music + quotes: on':'loop music + quotes: off';};
 if(combo){
  const isOn=localStorage.getItem('starfield-combined-repeat')==='true';updateCombo(isOn);
  combo.addEventListener('click',()=>{
   const turnOn=combo.getAttribute('aria-pressed')!=='true';localStorage.setItem('starfield-combined-repeat',String(turnOn));updateCombo(turnOn);
   if(turnOn){

    const vm=$('voiceMode');if(vm)vm.value='all';
    if(typeof wisdomPlaybackMode!=='undefined')wisdomPlaybackMode='all';
    if(typeof selectedWisdom==='function'&&typeof speakBankItems==='function')speakBankItems(selectedWisdom(),true);
    if(typeof musicItems!=='undefined'&&typeof musicAudio!=='undefined'&&musicAudio){
     const queue=musicItems.map((x,i)=>({...x,index:i})).filter(x=>x.selected);
     if(queue.length&&musicAudio.paused){const current=queue.find(x=>x.index===musicCurrent);const first=(current||queue[0]).index;const playButton=$('radioPlayPause');if(playButton)playButton.click();else{
       const item=musicItems[first];musicCurrent=first;musicAudio.src=item.url;musicAudio.play().catch(()=>{});
      }}

   }
  });
 }

 if(typeof musicAudio!=='undefined'&&musicAudio){
  const safeAdvance=()=>{
   if(typeof musicItems==='undefined'||!musicItems.length)return;
   const q=musicItems.map((x,i)=>({...x,index:i})).filter(x=>x.selected);if(!q.length)return;
   let next;

   else{const pos=q.findIndex(x=>x.index===musicCurrent);next=q[(pos+1+q.length)%q.length];}
   if(!next)return;musicCurrent=next.index;musicAudio.src=next.url;
   const vol=$('musicVolume');if(vol)musicAudio.volume=+vol.value;
   musicAudio.play().catch(()=>{});
   const track=$('musicTickerTrack');if(track){const txt=String(next.name||'');track.innerHTML=`<span>${txt.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span><span aria-hidden="true">${txt.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`;}
   if($('radioPlayPause'))$('radioPlayPause').textContent='Ⅱ';
  };

 }

     speedLabel.append(speedInput);wipeRow.append(wipe,direction,wipeDuration,speedLabel);

   }

   const duration=imgs.querySelector('.sf-image-duration');if(duration){for(const node of [...duration.childNodes])if(node.nodeType===3)node.textContent=node.textContent.replace(/change image|\bduration\b/gi,'image duration');[...duration.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.textContent=n.textContent.replace(/\bsec\b/g,''));}

(()=>{

  const y=Math.max(3,Math.min(window.innerHeight-height-3,r.top-height-2));

 }
 document.addEventListener('click',e=>{
  if(e.target.closest('.v29-test-panel[data-kind="music2"] #radioVolumeBtn')){
   placeRadioVolume();requestAnimationFrame(placeRadioVolume);
  }
 },true);

<script id="stage23-window-stacking-script">
/* One foreground authority for the three independent floating windows.
   Legacy click handlers must not overwrite this ordering. */
(()=>{
 'use strict';
 const voice=document.getElementById('voicePanel');
 const overlay=document.getElementById('overlay');
 const music=()=>document.querySelector('.v29-test-panel[data-kind="music2"]');
 const backgrounds=()=>document.querySelector('.v29-test-panel[data-kind="slideshow2"]');
 const ordinary=()=>[voice,music(),backgrounds()].filter(Boolean);
 let counter=300000;
 function front(el){
   if(!el||!el.isConnected||el.classList.contains('hidden'))return;
   // Raise only the selected panel; do not lower other windows on each click.
   // This preserves a deterministic ordering even when legacy code touches z-index.
   el.style.setProperty('z-index',String(++counter),'important');
 }
 document.addEventListener('pointerdown',e=>{
   if(!(e.target instanceof Element))return;
   const panel=e.target.closest('#voicePanel,.v29-test-panel');
   if(panel)front(panel);
 },true);
 const observer=new MutationObserver(records=>{
   for(const record of records){
     if(record.type==='attributes'&&record.attributeName==='class'&&record.target===voice&&!voice.classList.contains('hidden'))front(voice);
     if(record.type==='childList')for(const node of record.addedNodes){
       if(node.nodeType===1&&node.matches?.('.v29-test-panel'))front(node);
     }
   }
 });
 observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
 // The full-screen overlay contains dismissible dialogs, not the Backgrounds
 // panel. It must not sit over the ordinary independent floating windows.
 // Dialogs such as Build Fortune, Edit Fortunes and the banks must sit
 // above the independent floating windows, but still dismiss normally.
 function syncDialogLayer(){
   if(!overlay)return;
   const open=!overlay.classList.contains('hidden');
   overlay.style.setProperty('z-index',open?'900000':'99990','important');
 }
 syncDialogLayer();
 if(overlay)new MutationObserver(syncDialogLayer).observe(overlay,{attributes:true,attributeFilter:['class']});
})();
</script>

#voicePanel .vb-bottom #voicePrev{margin-left:0!important}
#voicePanel .vb-head-right{margin-left:auto!important}
/* Test 26: deliberately leave the panel width unchanged. Shift only the
   complete right-side control groups left by one spinner width (34px).
   Relative positioning preserves layout slots and leaves the requested
   empty strip on the right for visual confirmation. */
#voicePanel .vb-head-right,
#voicePanel .vb-narrate > label:nth-of-type(2),
#voicePanel .vb-narrate > #v52SoundType,
#voicePanel .vb-narrate > button.vb-icon:last-child,
#voicePanel .vb-music > .vb-volume-pair,
#voicePanel .vb-wisdom > label[for="voiceGap"],

#voicePanel .vb-persona > label[for="voiceQuoteCount"],
#voicePanel .vb-persona > #voiceQuoteCount,

  position:relative!important;
  left:-34px!important;
}
/* Test 29: adjust only the right border inward by another 4px to match the visible bottom clearance. */
/* Test 28: retain Test 26's exact control coordinates while moving only
   the Voice Bank's right border inward by the 34px unused strip.
   Original 320px border-box has 300px content width (9px padding each side,
   1px borders). Keep that inner coordinate system unchanged. */
#voicePanel{width:282px!important;min-width:282px!important;max-width:calc(100vw - 20px)!important;overflow:visible!important}
#voicePanel .voice-head,#voicePanel .vb-grid{width:300px!important;min-width:300px!important;max-width:none!important;box-sizing:border-box!important}

<script id="voice-bank-layout-test17">
(()=>{
 const $=id=>document.getElementById(id),panel=$('voicePanel');if(!panel)return;
 const head=panel.querySelector('.voice-head'),close=$('voicePanelClose'),manage=$('voiceManage');
 const right=document.createElement('span');right.className='vb-head-right';right.append(manage,close);head.append(right);
 const oldRows=[...panel.querySelectorAll(':scope > .voice-options,:scope > .voice-actions')];
 const grid=document.createElement('div');grid.className='vb-grid';head.after(grid);
 const row=(name)=>{let e=document.createElement('div');e.className='vb-row vb-'+name;grid.append(e);return e;};
 const label=(t,id)=>{const l=document.createElement('label');if(id)l.htmlFor=id;l.append(document.createTextNode(t));return l;};
 const space=()=>{const x=document.createElement('span');x.className='vb-spacer';return x;};
 const hidden=document.createElement('div');hidden.className='vb-hidden';grid.after(hidden);
 // Row one: Narrate, narrator volume; Sounds, style, sounds volume.
 const a=row('narrate');const narr=label('narrate');narr.append($('voiceNarrationCheck'));a.append(narr);
 const nIcon=document.createElement('button');nIcon.type='button';nIcon.className='vb-icon';nIcon.title='narration volume';nIcon.textContent='🔊';a.append(nIcon);
 a.append(space());const sounds=label('sounds');sounds.append($('voiceSoundCheck'));a.append(sounds);
 const style=$('v52SoundType');if(style){style.classList.add('vb-tight');a.append(style)}
 const sIcon=document.createElement('button');sIcon.type='button';sIcon.className='vb-icon';sIcon.title='sounds volume';sIcon.textContent='🔊';a.append(sIcon);
 // Row two: Loop music, voice volume, music volume.
 const b=row('music');const loop=label('loop music');const loopCheck=document.createElement('input');loopCheck.type='checkbox';loopCheck.checked=$('combinedRepeatBtn').getAttribute('aria-pressed')==='true';loopCheck.onchange=()=>{$('combinedRepeatBtn').click();loopCheck.checked=$('combinedRepeatBtn').getAttribute('aria-pressed')==='true'};loop.append(loopCheck);b.append(loop,space());
 const vb=$('voiceVolumeToggle'),mb=$('musicVolumeToggle');vb.textContent='🔊';mb.textContent='🔊';vb.setAttribute('aria-label','voice volume');mb.setAttribute('aria-label','music volume');const voiceVol=document.createElement('span');voiceVol.className='vb-volume-pair';voiceVol.append(document.createTextNode('voice '),vb);const musicVol=document.createElement('span');musicVol.className='vb-volume-pair';musicVol.append(document.createTextNode('music '),mb);b.append(voiceVol,musicVol);
 // Row three: Wisdom style, Start, Stop, Repeat interval.
 const c=row('wisdom');c.append(label('wisdom','voiceMode'));$('voiceMode').classList.add('vb-tight');c.append($('voiceMode'));$('voiceReadSelected').textContent='start';c.append($('voiceReadSelected'),$('voiceStop'),label('repeat','voiceGap'),$('voiceGap'));
 // Row four: Voice style and navigation arrows.
 const d=row('persona');d.append(label('voice','voicePersona'));$('voicePersona').classList.add('vb-tight');d.append($('voicePersona'),space(),label('wisdom','voiceQuoteCount'),$('voiceQuoteCount'));
 // Row five: Read selected, Wisdom number, Mute.
 const e=row('reading');const read=label('read selected');read.append($('readTitlesCheck'));e.append(read,space());
 const mute=label('mute');const muteCheck=document.createElement('input');muteCheck.type='checkbox';muteCheck.checked=$('voiceQuoteMute').classList.contains('active');muteCheck.onchange=()=>{$('voiceQuoteMute').click();muteCheck.checked=$('voiceQuoteMute').classList.contains('active')};mute.append(muteCheck);d.append(mute);
 // Last row: list controls stay side by side.
 const f=row('bottom');f.classList.add('vb-row-bottom');f.append($('voiceHideQuotes'),$('voiceSelectAll'),space(),$('voicePrev'),$('voiceNext'));
 // Retain functional controls referenced by existing scripts, but remove them from the visible layout.
 for(const r of oldRows)hidden.append(r);
 for(const id of ['voiceOverrideCheck','voicePitch','voiceSpeed','processReadMode','voiceQuoteRepeat','voiceQuoteMute','combinedRepeatBtn']){const el=$(id);if(el)hidden.append(el)}
 // Two existing popups, plus two sound/narrator sliders replacing their numeric controls.
 const popups=[document.querySelector('.inline-volume-popup:has(#voiceVolume)'),document.querySelector('.inline-volume-popup:has(#voiceBankMusicVolume)')];
 for(const p of popups)if(p)p.classList.add('vb-vertical-popup');
 function popup(icon,source,initial){
   const p=document.createElement('div');p.className='inline-volume-popup vb-vertical-popup';const range=document.createElement('input');range.type='range';range.min='1';range.max='10';range.step='1';range.value=source?.value||initial;p.append(range);document.body.append(p);
   range.addEventListener('input',()=>{if(source){source.value=range.value;source.dispatchEvent(new Event('input',{bubbles:true}));source.dispatchEvent(new Event('change',{bubbles:true}));}});
   icon.addEventListener('click',ev=>{ev.stopPropagation();const opening=!p.classList.contains('open');document.querySelectorAll('.inline-volume-popup.open').forEach(x=>x.classList.remove('open'));if(opening){const r=icon.getBoundingClientRect();p.style.position='fixed';p.style.left=Math.round(r.left+r.width/2)+'px';p.style.top=Math.max(4,Math.round(r.top-96))+'px';p.style.transform='translateX(-50%)';p.style.zIndex='2147483640';p.classList.add('open')}});
   return p;
 }
 popup(nIcon,$('v53NarratorVolume'),9);popup(sIcon,$('v52SoundVolume'),3);
 // The original voice/music click handlers still run; close extra popups on outside clicks.
 document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.vb-icon,.inline-volume-popup,#voiceVolumeToggle,#musicVolumeToggle'))document.querySelectorAll('.inline-volume-popup.open').forEach(x=>x.classList.remove('open'))},true);
 // Existing list stays after the controls, so the panel grows only when opened.
 grid.after($('voiceBankList'));
})();
</script>
