<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Niagara Falls — Larry's Art</title>

<style>

/* ============================================================
   BASIC PAGE
   ============================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Georgia, serif;
}


/* ============================================================
   NIAGARA VIDEO
   ============================================================ */

#waterfall {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    pointer-events: none;

    /*
       FORCE SILENCE.
    */
    volume: 0;
}


/* ============================================================
   PAINTINGS
   ============================================================ */

.paintingWrap {
    position: fixed;

    z-index: 20;

    cursor: pointer;

    perspective: 900px;

    transform-style: preserve-3d;

    will-change:
        left,
        top,
        transform,
        opacity;

    opacity: 0;
}

.paintingFrame {
    position: relative;

    padding: 9px;

    background:
        linear-gradient(
            135deg,
            #fff8df 0%,
            #d8c58e 18%,
            #fff3c7 35%,
            #b99a4d 55%,
            #f8e9b5 75%,
            #9d7935 100%
        );

    border: 4px solid #8c6b2f;

    box-shadow:
        0 8px 18px rgba(0,0,0,.8),
        inset 0 0 5px rgba(255,255,255,.9),
        inset 0 0 0 3px rgba(91,60,15,.7);

    transform-style: preserve-3d;
}

.paintingFrame::before {
    content: "";

    position: absolute;

    inset: -5px;

    border: 2px solid rgba(255,245,190,.85);

    pointer-events: none;
}

.paintingFrame::after {
    content: "";

    position: absolute;

    inset: 3px;

    border: 2px solid rgba(102,70,20,.7);

    pointer-events: none;
}

.paintingCanvas {
    display: block;

    width: 18vw;

    max-width: 320px;

    height: auto;

    background: white;

    border: 7px solid #f8f8f4;

    box-shadow:
        inset 0 0 5px rgba(0,0,0,.3);

    transform: translateZ(4px);

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;
}


/* physical canvas thickness */

.paintingWrap::before {
    content: "";

    position: absolute;

    left: 5px;
    bottom: -13px;

    width: calc(100% - 10px);
    height: 13px;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #d7d7d2,
            #999
        );

    transform: skewX(-35deg);

    transform-origin: top left;

    z-index: -2;
}

.paintingWrap::after {
    content: "";

    position: absolute;

    right: -13px;
    top: 7px;

    width: 13px;
    height: calc(100% - 14px);

    background:
        linear-gradient(
            to right,
            #f8f8f4,
            #d1d1cc,
            #969691
        );

    transform: skewY(-35deg);

    transform-origin: top left;

    z-index: -2;
}


/* ============================================================
   IMMORTALIZED / SELECTED PAINTINGS
   ============================================================ */

.immortalized {
    z-index: 80;

    cursor: grab;

    opacity: 1 !important;

    /*
       VERY SMALL:
       these are now distant objects in the sky.
    */
}

.immortalized:active {
    cursor: grabbing;
}

.immortalized .paintingCanvas {
    width: 2.8vw;

    min-width: 22px;

    max-width: 46px;

    border-width: 2px;
}

.immortalized .paintingFrame {
    padding: 2px;

    border-width: 2px;
}

.immortalized::before,
.immortalized::after {
    opacity: .65;
}


/* ============================================================
   ANGEL / DESKTOP ICON STRIP
   ============================================================ */

#angels {
    position: fixed;

    z-index: 70;

    left: 0;
    top: 0;

    width: 100%;
    height: 20%;

    pointer-events: none;
}

.angel {
    position: absolute;

    width: 3.2vw;

    min-width: 24px;

    max-width: 48px;

    cursor: grab;

    pointer-events: auto;

    user-select: none;

    touch-action: none;
}

.angel:active {
    cursor: grabbing;
}

.angelFrame {
    position: relative;

    padding: 2px;

    background:
        linear-gradient(
            135deg,
            #fff8df,
            #c4a35b,
            #fff1b8,
            #9a702c,
            #ead28c
        );

    border: 2px solid #8c6b2f;

    box-shadow:
        0 3px 8px rgba(0,0,0,.85);
}

.angelFrame img {
    display: block;

    width: 100%;

    background: white;

    border: 2px solid white;

    filter: none !important;

    opacity: 1 !important;

    pointer-events: none;
}

.halo {
    position: absolute;

    width: 16px;
    height: 6px;

    left: 50%;
    top: -11px;

    transform: translateX(-50%);

    border: 2px solid gold;

    border-radius: 50%;

    box-shadow:
        0 0 7px gold;

    z-index: 5;
}


/* ============================================================
   ROPE
   ============================================================ */

.rescueRope {
    position: fixed;

    z-index: 500;

    width: 8px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;

    transform-origin: bottom center;
}

.ropeKnot {
    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    bottom: -8px;

    transform: translateX(-50%);

    border: 4px solid #a78a5b;

    border-radius: 50%;
}

.ropeBreaking {
    animation:
        ropeSnap .5s ease-out forwards;
}

@keyframes ropeSnap {

    0% {
        transform: rotate(0deg);
        opacity: 1;
    }

    35% {
        transform:
            rotate(9deg)
            scaleY(1.05);

        opacity: 1;
    }

    60% {
        transform:
            rotate(-20deg)
            scaleY(.7);

        opacity: 1;
    }

    100% {
        transform:
            rotate(28deg)
            translateY(40px)
            scaleY(.2);

        opacity: 0;
    }
}

.ropePiece {
    position: fixed;

    z-index: 499;

    width: 7px;
    height: 70px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 4px,
            #c6ad7b 4px,
            #c6ad7b 7px
        );

    border-radius: 5px;

    pointer-events: none;
}

.ropePiece.left {
    transform-origin: top center;

    animation:
        ropeLeftFall 1s ease-out forwards;
}

.ropePiece.right {
    transform-origin: top center;

    animation:
        ropeRightFall 1s ease-out forwards;
}

@keyframes ropeLeftFall {

    to {
        transform:
            translate(-45px,80px)
            rotate(-35deg);

        opacity: 0;
    }
}

@keyframes ropeRightFall {

    to {
        transform:
            translate(45px,80px)
            rotate(35deg);

        opacity: 0;
    }
}


/* ============================================================
   FISH
   ============================================================ */

.fish {
    position: fixed;

    z-index: 12;

    width: 62px;
    height: 32px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;

    filter:
        brightness(.5)
        contrast(1.35)
        drop-shadow(
            0 3px 3px rgba(0,0,0,.75)
        );
}

.fishBody {
    position: absolute;

    width: 42px;
    height: 23px;

    left: 10px;
    top: 4px;

    background: #292929;

    border-radius:
        55% 45% 45% 55%;
}

.fishTail {
    position: absolute;

    left: 0;
    top: 2px;

    width: 0;
    height: 0;

    border-top:
        14px solid transparent;

    border-bottom:
        14px solid transparent;

    border-right:
        19px solid #181818;
}

.fishEye {
    position: absolute;

    right: 12px;
    top: 9px;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;
}


/* GOLD FISH */

.goldFish {
    filter:
        drop-shadow(
            0 0 9px rgba(255,210,30,.9)
        )
        drop-shadow(
            0 4px 4px rgba(0,0,0,.7)
        );

    z-index: 14;
}

.goldFish .fishBody {
    background:
        linear-gradient(
            135deg,
            #fff3a0,
            #ffd21f,
            #d89400,
            #ffed62
        );
}

.goldFish .fishTail {
    border-right-color:
        #d89400;
}

.goldFish .fishEye {
    background: black;
}


/* ============================================================
   SHARK
   ============================================================ */

.shark {
    position: fixed;

    width: 125px;
    height: 55px;

    z-index: 11;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.8)
        );
}

.sharkBody {
    position: absolute;

    left: 20px;
    top: 14px;

    width: 82px;
    height: 35px;

    background:
        linear-gradient(
            to bottom,
            #686868,
            #292929
        );

    border-radius:
        70% 55% 55% 65%;
}

.sharkTail {
    position: absolute;

    left: 0;
    top: 10px;

    width: 0;
    height: 0;

    border-top: 18px solid transparent;

    border-bottom: 18px solid transparent;

    border-right: 28px solid #353535;
}

.sharkFin {
    position: absolute;

    left: 55px;
    top: 0;

    width: 0;
    height: 0;

    border-left: 10px solid transparent;

    border-right: 10px solid transparent;

    border-bottom: 22px solid #303030;
}

.sharkEye {
    position: absolute;

    right: 30px;
    top: 24px;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;
}


/* ============================================================
   BROWN PAPER BAG
   ============================================================ */

.paperBag {
    position: fixed;

    width: 48px;
    height: 58px;

    z-index: 10;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            #6d401f,
            #9a6031,
            #71411f
        );

    border:
        2px solid #4c2b16;

    box-shadow:
        0 4px 8px rgba(0,0,0,.7);

    transform-origin: center;
}

.paperBag::before {
    content: "";

    position: absolute;

    left: 8px;
    right: 8px;
    top: -9px;

    height: 15px;

    border:
        3px solid #70451f;

    border-bottom: none;

    border-radius:
        50% 50% 0 0;
}

.paperBag::after {
    content: "LAR";

    position: absolute;

    left: 0;
    right: 0;
    top: 19px;

    text-align: center;

    color:
        rgba(255,235,190,.75);

    font-weight: bold;

    font-size: 11px;
}


/* ============================================================
   BROWN LAR BUCK TOKEN
   ============================================================ */

.brownBuck {
    position: fixed;

    z-index: 16;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #c49a62,
            #79502d 70%,
            #4a2d17
        );

    border:
        3px solid #d4ae79;

    color:
        #f5dfb8;

    font-weight: bold;

    font-size: 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    box-shadow:
        0 4px 8px rgba(0,0,0,.8);

    text-shadow:
        0 1px 2px #000;
}


/* ============================================================
   LAR BUCK POPUP
   ============================================================ */

.larBuckPopup {
    position: fixed;

    z-index: 3000;

    color: #ffd83d;

    font-family: Georgia, serif;

    font-weight: bold;

    font-size: 24px;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;

    animation:
        buckRise 1.6s ease-out forwards;
}

@keyframes buckRise {

    0% {
        transform:
            translate(-50%,0)
            scale(.6);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%,-80px)
            scale(1.2);

        opacity: 0;
    }
}


/* ============================================================
   PIKE FINS
   ============================================================ */

.pikeFin {
    position: fixed;

    z-index: 6;

    width: 0;
    height: 0;

    border-left:
        16px solid transparent;

    border-right:
        16px solid transparent;

    border-bottom:
        75px solid rgba(25,25,25,.82);

    opacity: 0;

    pointer-events: none;
}

.pikeFin.rising {
    animation:
        pikeRise 1.8s ease-out forwards;
}

@keyframes pikeRise {

    0% {
        opacity: 0;

        transform:
            translateY(35px)
            scale(.5);
    }

    25% {
        opacity: .9;
    }

    65% {
        opacity: .9;

        transform:
            translateY(0)
            rotate(5deg)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(35px)
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   TURTLE
   ============================================================ */

#turtle {
    position: fixed;

    z-index: 13;

    width: 180px;
    height: 90px;

    left: 110vw;
    top: 79vh;

    display: none;

    pointer-events: none;

    filter:
        brightness(.3)
        contrast(1.55)
        drop-shadow(
            0 6px 6px rgba(0,0,0,.9)
        );
}

.turtleShell {
    position: absolute;

    width: 120px;
    height: 60px;

    left: 20px;
    top: 8px;

    background:
        radial-gradient(
            ellipse,
            #333 0%,
            #171717 70%,
            #080808 100%
        );

    border-radius:
        55% 50% 45% 50%;

    border: 4px solid #111;
}

.turtleHead {
    position: absolute;

    width: 42px;
    height: 36px;

    right: 0;
    top: 21px;

    background: #141414;

    border-radius:
        60% 50% 50% 60%;
}

.turtleEye {
    position: absolute;

    right: 8px;
    top: 9px;

    width: 5px;
    height: 5px;

    background: #ddd;

    border-radius: 50%;
}

.turtleLeg {
    position: absolute;

    width: 43px;
    height: 18px;

    background: #121212;

    border-radius: 60%;
}

.turtleLeg.one {
    left: 24px;
    bottom: 2px;

    transform: rotate(25deg);
}

.turtleLeg.two {
    left: 93px;
    bottom: 2px;

    transform: rotate(-25deg);
}

#turtle.walking {
    display: block;

    animation:
        turtleCurrent 15s linear forwards,
        turtleBob .9s ease-in-out infinite;
}

@keyframes turtleCurrent {

    0% {
        left: 110vw;
        top: 78vh;
        transform: scale(1);
    }

    62% {
        left: 35vw;
        top: 82vh;
        transform: scale(.9);
    }

    84% {
        left: 10vw;
        top: 88vh;
        transform: scale(.58);
    }

    100% {
        left: -18vw;
        top: 98vh;
        transform: scale(.12);
    }
}

@keyframes turtleBob {

    0% {
        margin-top: -3px;
    }

    50% {
        margin-top: 8px;
    }

    100% {
        margin-top: -3px;
    }
}


/* ============================================================
   SEAGULLS
   ============================================================ */

.seagull {
    position: fixed;

    z-index: 15;

    left: 110vw;
    top: 45vh;

    width: 100px;
    height: 50px;

    pointer-events: auto;

    cursor: pointer;

    opacity: 0;
}

.seagullWing {
    position: absolute;

    width: 55px;
    height: 18px;

    border-top:
        6px solid rgba(250,250,250,.9);

    border-radius:
        70% 70% 0 0;
}

.seagullWing.left {
    left: 0;
    top: 16px;

    transform: rotate(18deg);
}

.seagullWing.right {
    right: 0;
    top: 16px;

    transform: rotate(-18deg);
}

.seagull.swooping {
    opacity: 1;

    animation:
        gullSwoop 5s ease-in-out forwards;
}

@keyframes gullSwoop {

    0% {
        left: 110vw;
        top: 45vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }

    25% {
        left: 76vw;
        top: 60vh;

        transform:
            rotate(18deg)
            scale(.9);
    }

    50% {
        left: 54vw;
        top: 70vh;

        transform:
            rotate(30deg)
            scale(1.05);
    }

    70% {
        left: 32vw;
        top: 61vh;

        transform:
            rotate(-20deg)
            scale(1);
    }

    100% {
        left: -15vw;
        top: 80vh;

        transform:
            rotate(-8deg)
            scale(.7);
    }
}


/* ============================================================
   INSPECTION WINDOW
   ============================================================ */

#inspection {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    overflow: hidden;

    background: #111;
}

#inspection.open {
    display: flex;
}


/* hypnotic rotating background */

#inspection::before {
    content: "";

    position: absolute;

    inset: -50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            #050505 0deg 9deg,
            #f0f0e5 9deg 18deg
        );

    animation:
        hypnosisSpin 18s linear infinite;

    opacity: .20;

    pointer-events: none;
}

@keyframes hypnosisSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* dark veil */

#inspection::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.25),
            rgba(0,0,0,.82)
        );

    pointer-events: none;
}


/* framed inspection artwork */

#inspectionFrame {
    position: relative;

    z-index: 1002;

    padding: 14px;

    background:
        linear-gradient(
            135deg,
            #fff8df,
            #c4a35b,
            #fff1b8,
            #9a702c,
            #ead28c
        );

    border: 5px solid #8c6b2f;

    box-shadow:
        0 15px 50px rgba(0,0,0,.9);

    max-width: 78vw;
    max-height: 76vh;

    cursor: grab;

    touch-action: none;

    user-select: none;
}

#inspectionFrame.dragging {
    cursor: grabbing;
}

#inspectionPainting {
    position: relative;

    z-index: 1003;

    max-width: 72vw;
    max-height: 66vh;

    width: auto;
    height: auto;

    display: block;

    object-fit: contain;

    background: white;

    border:
        9px solid white;

    filter: none !important;

    opacity: 1 !important;

    mix-blend-mode: normal !important;

    pointer-events: none;

    transform-origin: center center;
}


/* title */

#paintingTitle {
    position: absolute;

    left: 50%;

    bottom: -48px;

    transform: translateX(-50%);

    z-index: 1015;

    color: white;

    background:
        rgba(0,0,0,.85);

    border:
        1px solid rgba(255,255,255,.4);

    padding: 8px 14px;

    white-space: nowrap;

    font-size: 16px;

    display: none;
}


/* ============================================================
   INSPECTION CONTROLS
   ============================================================ */

#inspectionTools {
    position: relative;

    z-index: 1010;

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 18px;
}

.inspectButton {
    padding: 8px 13px;

    background:
        rgba(0,0,0,.82);

    color: white;

    border:
        1px solid rgba(255,255,255,.5);

    border-radius: 5px;

    cursor: pointer;

    font-family: Georgia, serif;
}

.inspectButton:hover {
    background:
        rgba(70,70,70,.9);
}

#titleButton.locked {
    color: #d6b66b;
}

#titleButton.unlocked {
    color: #ffe58a;
}


/* ============================================================
   CLOSE BUTTON
   ============================================================ */

#closeInspection {
    position: relative;

    z-index: 1010;

    margin-top: 10px;

    min-width: 130px;

    padding: 10px 25px;

    background:
        repeating-linear-gradient(
            45deg,
            #8b7651 0,
            #8b7651 5px,
            #c6ad7b 5px,
            #c6ad7b 9px
        );

    color: #20170b;

    font-family: Georgia, serif;

    font-weight: bold;

    border:
        3px solid #70582e;

    border-radius: 8px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.8);

    cursor: pointer;
}


/* ============================================================
   INSPECTION SEAGULLS
   ============================================================ */

.inspectionGull {
    position: absolute;

    z-index: 1005;

    width: 115px;
    height: 55px;

    pointer-events: none;
}

.inspectionGull .wing {
    position: absolute;

    width: 62px;
    height: 20px;

    border-top:
        7px solid white;

    border-radius:
        70% 70% 0 0;
}

.inspectionGull .wing.left {
    left: 0;
    top: 17px;

    transform: rotate(18deg);
}

.inspectionGull .wing.right {
    right: 0;
    top: 17px;

    transform: rotate(-18deg);
}

.gullOne {
    animation:
        gullHoldOne 3.2s ease-in-out infinite;
}

.gullTwo {
    animation:
        gullHoldTwo 3.7s ease-in-out infinite;
}

.gullThree {
    animation:
        gullHoldThree 4.1s ease-in-out infinite;
}

.gullFour {
    animation:
        gullHoldFour 3.5s ease-in-out infinite;
}

@keyframes gullHoldOne {

    0% {
        left: 17%;
        top: 17%;
        transform: rotate(-15deg);
    }

    50% {
        left: 27%;
        top: 25%;
        transform: rotate(12deg);
    }

    100% {
        left: 17%;
        top: 17%;
        transform: rotate(-15deg);
    }
}

@keyframes gullHoldTwo {

    0% {
        right: 16%;
        top: 22%;
        transform: rotate(12deg);
    }

    50% {
        right: 27%;
        top: 34%;
        transform: rotate(-18deg);
    }

    100% {
        right: 16%;
        top: 22%;
        transform: rotate(12deg);
    }
}

@keyframes gullHoldThree {

    0% {
        left: 28%;
        bottom: 16%;
        transform: rotate(15deg);
    }

    50% {
        left: 38%;
        bottom: 25%;
        transform: rotate(-8deg);
    }

    100% {
        left: 28%;
        bottom: 16%;
        transform: rotate(15deg);
    }
}

@keyframes gullHoldFour {

    0% {
        right: 28%;
        bottom: 15%;
        transform: rotate(-15deg);
    }

    50% {

        bottom: 25%;
        transform: rotate(10deg);

}


/* ============================================================

<body>

<video

</video>


<!-- ANGEL / DESKTOP ICON AREA -->

<div id="angels"></div>


<!-- ============================================================

<div id="turtle">

    </div>

</div>


<!-- ============================================================

        RETURN TO LARRY'S
    </button>

</div>


<div id="savedCounter">
    Immortalized: 0 | Lar Bucks: 0
</div>


<!-- ============================================================
     INSPECTION
     ============================================================ -->

<div id="inspection">

    <div id="inspectionFrame">

        <img
            id="inspectionPainting"
            src=""
            alt="">

        <div id="paintingTitle"></div>

    </div>


    <div id="inspectionTools">

            −
        </button>

            RESET
        </button>

            class="inspectButton"
            id="zoomIn">
            +
        </button>

        <button
            class="inspectButton locked"
            id="titleButton">
            TITLE — 20 LAR BUCKS
        </button>

    </div>


    <button id="closeInspection">
        CLOSE
    </button>


    <div class="inspectionGull gullOne">
        <div class="wing left"></div>
        <div class="wing right"></div>
    </div>

    <div class="inspectionGull gullTwo">
        <div class="wing left"></div>
        <div class="wing right"></div>
    </div>

    <div class="inspectionGull gullThree">
        <div class="wing left"></div>
        <div class="wing right"></div>
    </div>

    <div class="inspectionGull gullFour">
        <div class="wing left"></div>
        <div class="wing right"></div>
    </div>

</div>


<script src="images.js"></script>

<script>


/* ============================================================
   FORCE SILENCE
   ============================================================ */

const waterfall =
    document.getElementById(
        "waterfall"
    );


function silenceEverything() {

    /*
       The Niagara video is the only media
       that is supposed to exist.
    */

    waterfall.muted = true;

    waterfall.volume = 0;

    waterfall.setAttribute(
        "muted",
        ""
    );


    /*
       Kill any accidental audio elements.
    */

    document
        .querySelectorAll(
            "audio"
        )
        .forEach(
            function(audio) {

                audio.pause();

                audio.volume = 0;

                audio.remove();

            }
        );


    /*
       Also silence every other media
       element if anything adds one later.
    */

    document
        .querySelectorAll(
            "video"
        )
        .forEach(
            function(video) {

                video.muted = true;

                video.volume = 0;

            }
        );

}


silenceEverything();


/*
   Keep it muted even if the browser or
   page attempts to change the state.
*/

waterfall.addEventListener(
    "volumechange",
    function() {

        waterfall.muted = true;

        waterfall.volume = 0;

    }
);


/* ============================================================
   VARIABLES
   ============================================================ */

let usedImages = [];

let savedPaintings = [];

let activePaintings = [];

let paintingNumber = 0;

let riverGeneration = 0;

let nextGroup =
    7 +
    Math.floor(
        Math.random() * 5
    );

let currentInspectionImage = "";

let inspectionZoom = 1;

let inspectionDragging = false;

let inspectionDragX = 0;

let inspectionDragY = 0;

let inspectionOffsetX = 0;

let inspectionOffsetY = 0;

let titleUnlocked = [];


/* ============================================================
   LAR BUCKS
   ============================================================ */

let larBucks = 0;


try {

    larBucks =
        parseInt(
            localStorage.getItem(
                "larBucks"
            ) || "0",
            10
        );

    if (
        isNaN(larBucks)
    ) {
        larBucks = 0;
    }

} catch (e) {

    larBucks = 0;

}


/* ============================================================
   SAVED PAINTINGS
   ============================================================ */

try {

    savedPaintings =
        JSON.parse(
            localStorage.getItem(
                "larryImmortalizedPaintings"
            ) || "[]"
        );

    if (
        !Array.isArray(
            savedPaintings
        )
    ) {

        savedPaintings = [];

    }

} catch (e) {

    savedPaintings = [];

}


/* ============================================================
   UNLOCKED TITLES
   ============================================================ */

try {

    titleUnlocked =
        JSON.parse(
            localStorage.getItem(
                "larryUnlockedTitles"
            ) || "[]"
        );

    if (
        !Array.isArray(
            titleUnlocked
        )
    ) {

        titleUnlocked = [];

    }

} catch (e) {

    titleUnlocked = [];

}


/* ============================================================
   COUNTER
   ============================================================ */

function updateSavedCounter() {

    document
        .getElementById(
            "savedCounter"
        )
        .textContent =
        "Immortalized: " +
        savedPaintings.length +
        " | Lar Bucks: " +
        larBucks;

}


updateSavedCounter();


/* ============================================================
   LAR BUCK REWARD
   ============================================================ */

function addLarBuck(
    x,
    y,
    amount = 1
) {

    larBucks += amount;


    try {

        localStorage.setItem(
            "larBucks",
            larBucks
        );

    } catch (e) {}


    updateSavedCounter();


    const popup =
        document.createElement(
            "div"
        );

    popup.className =
        "larBuckPopup";

    popup.textContent =
        "+" +
        amount +
        " Lar Buck" +
        (
            amount === 1
                ? ""
                : "s"
        );


    popup.style.left =
        x + "px";

    popup.style.top =
        y + "px";


    document.body.appendChild(
        popup
    );


    setTimeout(
        function() {

            popup.remove();

        },
        1700
    );

}


/* ============================================================
   GENERIC REWARD OBJECT
   ============================================================ */

function rewardObject(
    object,
    amount
) {

    const rect =
        object.getBoundingClientRect();


    addLarBuck(
        rect.left +
        rect.width / 2,

        rect.top,

        amount
    );


    object.style.pointerEvents =
        "none";


    object.style.transition =
        "transform .45s ease, opacity .45s ease";


    object.style.transform +=
        " scale(1.7)";


    object.style.opacity =
        "0";


    setTimeout(
        function() {

            object.remove();

        },
        500
    );

}


/* ============================================================
   ARTWORK CHOICE
   ============================================================ */

function chooseArtwork() {

    if (
        usedImages.length >=
        images.length
    ) {

        usedImages = [];

    }


    let available =
        images.filter(
            function(image) {

                return !usedImages.includes(
                    images.indexOf(
                        image
                    )
                );

            }
        );


    if (
        !available.length
    ) {

        usedImages = [];

        available =
            images.slice();

    }


    const chosen =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    usedImages.push(
        images.indexOf(
            chosen
        )
    );


    return chosen;

}


/* ============================================================
   SAVE PAINTING
   ============================================================ */

function savePainting(
    image
) {

    if (
        !savedPaintings.includes(
            image
        )
    ) {

        savedPaintings.push(
            image
        );


        try {

            localStorage.setItem(
                "larryImmortalizedPaintings",
                JSON.stringify(
                    savedPaintings
                )
            );

        } catch (e) {}

    }


    updateSavedCounter();

}


/* ============================================================
   TITLE
   ============================================================ */

function getPaintingTitle(
    image
) {

    /*
       If images.js contains an optional
       imageTitles object, use it.
    */

    try {

        if (
            typeof imageTitles !==
            "undefined" &&
            imageTitles[image]
        ) {

            return imageTitles[image];

        }

    } catch (e) {}


    /*
       Otherwise use the filename as the
       painting title.
    */

    let name =
        image
            .split("/")
            .pop();


    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        decodeURIComponent(
            name
        );


    name =
        name.replace(
            /[_-]+/g,
            " "
        );


    name =
        name.replace(
            /\s+/g,
            " "
        );


    return name.trim();

}


function titleIsUnlocked(
    image
) {

    return titleUnlocked.includes(
        image
    );

}


/* ============================================================
   INSPECTION WINDOW
   ============================================================ */

function inspectPainting(
    image
) {

    currentInspectionImage =
        image;


    inspectionZoom = 1;

    inspectionOffsetX = 0;

    inspectionOffsetY = 0;


    const inspection =
        document.getElementById(
            "inspection"
        );

    const picture =
        document.getElementById(
            "inspectionPainting"
        );


    picture.src =
        image;


    picture.style.transform =
        "scale(1)";


    const frame =
        document.getElementById(
            "inspectionFrame"
        );


    frame.style.transform =
        "translate(0px,0px)";


    updateTitleButton();


    inspection.classList.add(
        "open"
    );

}


function updateTitleButton() {

    const button =
        document.getElementById(
            "titleButton"
        );

    const title =
        document.getElementById(
            "paintingTitle"
        );


    if (
        titleIsUnlocked(
            currentInspectionImage
        )
    ) {

        button.textContent =
            "TITLE UNLOCKED";

        button.classList.remove(
            "locked"
        );

        button.classList.add(
            "unlocked"
        );


        title.textContent =
            getPaintingTitle(
                currentInspectionImage
            );

        title.style.display =
            "block";


        return;

    }


    button.textContent =
        "TITLE — 20 LAR BUCKS";

    button.classList.add(
        "locked"
    );

    button.classList.remove(
        "unlocked"
    );


    title.style.display =
        "none";

}


function closeInspection() {

    document
        .getElementById(
            "inspection"
        )
        .classList.remove(
            "open"
        );

}


document
    .getElementById(
        "closeInspection"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            closeInspection();

        }
    );


/* ============================================================
   UNLOCK TITLE
   ============================================================ */

document
    .getElementById(
        "titleButton"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();


            if (
                !currentInspectionImage
            ) {

                return;

            }


            if (
                titleIsUnlocked(
                    currentInspectionImage
                )
            ) {

                return;

            }


            if (
                larBucks < 20
            ) {

                const rect =
                    this.getBoundingClientRect();


                addLarBuck(
                    rect.left +
                    rect.width / 2,
                    rect.top,
                    0
                );


                this.textContent =
                    "NEED 20 LAR BUCKS";

                setTimeout(
                    updateTitleButton,
                    1200
                );


                return;

            }


            larBucks -= 20;


            try {

                localStorage.setItem(
                    "larBucks",
                    larBucks
                );

            } catch (e) {}


            titleUnlocked.push(
                currentInspectionImage
            );


            try {

                localStorage.setItem(
                    "larryUnlockedTitles",
                    JSON.stringify(
                        titleUnlocked
                    )
                );

            } catch (e) {}


            updateSavedCounter();

            updateTitleButton();

        }
    );


/* ============================================================
   INSPECTION ZOOM
   ============================================================ */

function setInspectionZoom(
    value
) {

    inspectionZoom =
        Math.max(
            .35,
            Math.min(
                4,
                value
            )
        );


    document
        .getElementById(
            "inspectionPainting"
        )
        .style.transform =
        "scale(" +
        inspectionZoom +
        ")";

}


document
    .getElementById(
        "zoomIn"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            setInspectionZoom(
                inspectionZoom +
                .25
            );

        }
    );


document
    .getElementById(
        "zoomOut"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            setInspectionZoom(
                inspectionZoom -
                .25
            );

        }
    );


document
    .getElementById(
        "zoomReset"
    )
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            inspectionZoom = 1;

            inspectionOffsetX = 0;

            inspectionOffsetY = 0;


            document
                .getElementById(
                    "inspectionPainting"
                )
                .style.transform =
                "scale(1)";


            document
                .getElementById(
                    "inspectionFrame"
                )
                .style.transform =
                "translate(0px,0px)";

        }
    );


/*
   Mouse wheel zoom.
*/

document
    .getElementById(
        "inspectionFrame"
    )
    .addEventListener(
        "wheel",
        function(e) {

            e.preventDefault();

            e.stopPropagation();


            if (
                e.deltaY < 0
            ) {

                setInspectionZoom(
                    inspectionZoom +
                    .12
                );

            } else {

                setInspectionZoom(
                    inspectionZoom -
                    .12
                );

            }

        },
        {
            passive: false
        }
    );


/* ============================================================
   DRAGGABLE INSPECTION FRAME
   ============================================================ */

const inspectionFrame =
    document.getElementById(
        "inspectionFrame"
    );


inspectionFrame.addEventListener(
    "pointerdown",
    function(e) {

        if (
            e.button !== 0
        ) {

            return;

        }


        inspectionDragging =
            true;


        inspectionDragX =
            e.clientX -
            inspectionOffsetX;

        inspectionDragY =
            e.clientY -
            inspectionOffsetY;


        inspectionFrame.classList.add(
            "dragging"
        );


        inspectionFrame.setPointerCapture(
            e.pointerId
        );


        e.preventDefault();

    }
);


inspectionFrame.addEventListener(
    "pointermove",
    function(e) {

        if (
            !inspectionDragging
        ) {

            return;

        }


        inspectionOffsetX =
            e.clientX -
            inspectionDragX;

        inspectionOffsetY =
            e.clientY -
            inspectionDragY;


        inspectionFrame.style.transform =
            "translate(" +
            inspectionOffsetX +
            "px," +
            inspectionOffsetY +
            "px)";

    }
);


function endInspectionDrag(
    e
) {

    if (
        !inspectionDragging
    ) {

        return;

    }


    inspectionDragging =
        false;


    inspectionFrame.classList.remove(
        "dragging"
    );


    try {

        inspectionFrame.releasePointerCapture(
            e.pointerId
        );

    } catch (error) {}

}


inspectionFrame.addEventListener(
    "pointerup",
    endInspectionDrag
);


inspectionFrame.addEventListener(
    "pointercancel",
    endInspectionDrag
);


/* ============================================================
   MAKE IMMORTALIZED PAINTING
   ============================================================ */

function immortalizePainting(
    painting,
    image
) {

    savePainting(
        image
    );


    painting.dataset.rescued =
        "true";


    painting.classList.add(
        "immortalized"
    );


    painting.style.pointerEvents =
        "auto";


    /*
       Put the painting in the upper
       1/5 of the screen.

       VERY SMALL.
    */

    const x =
        8 +
        Math.random() * 84;

    const y =
        4 +
        Math.random() * 11;


    painting.style.transition =
        "left 1.5s ease-out, " +
        "top 1.5s ease-out, " +
        "transform 1.5s ease-out";


    painting.style.left =
        x + "vw";


    painting.style.top =
        y + "vh";


    painting.style.transform =
        "translate(-50%,-50%) scale(.22)";


    /*
       IMPORTANT:
       NO WIND.

       It stays exactly where it lands.
    */


    setTimeout(
        function() {

            if (
                !document.body.contains(
                    painting
                )
            ) {

                return;

            }


            painting.style.transition =
                "none";


            painting.style.transform =
                "translate(-50%,-50%) scale(.22)";


            /*
               Make a tiny angel/icon copy
               in the upper strip.
            */

            createAngelIcon(
                image
            );

        },
        1600
    );

}


/* ============================================================
   ANGEL ICON
   ============================================================ */

function createAngelIcon(
    image
) {

    const angels =
        document.getElementById(
            "angels"
        );


    /*
       Avoid duplicates.
    */

    if (
        angels.querySelector(
            '[data-image="' +
            CSS.escape(image) +
            '"]'
        )
    ) {

        return;

    }


    const angel =
        document.createElement(
            "div"
        );

    angel.className =
        "angel";


    angel.dataset.image =
        image;


    /*
       ONLY the upper 1/5.
    */

    angel.style.left =
        (
            2 +
            Math.random() * 94
        ) + "vw";


    angel.style.top =
        (
            4 +
            Math.random() * 12
        ) + "vh";


    const frame =
        document.createElement(
            "div"
        );

    frame.className =
        "angelFrame";


    const img =
        document.createElement(
            "img"
        );

    img.src =
        image;


    const halo =
        document.createElement(
            "div"
        );

    halo.className =
        "halo";


    frame.appendChild(
        img
    );

    frame.appendChild(
        halo
    );

    angel.appendChild(
        frame
    );

    angels.appendChild(
        angel
    );


    /*
       Desktop-icon-style dragging.
    */

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    angel.addEventListener(
        "pointerdown",
        function(e) {

            if (
                e.button !== 0
            ) {

                return;

            }


            dragging = true;


            const rect =
                angel.getBoundingClientRect();


            offsetX =
                e.clientX -
                rect.left;

            offsetY =
                e.clientY -
                rect.top;


            angel.setPointerCapture(
                e.pointerId
            );


            e.preventDefault();

        }
    );


    angel.addEventListener(
        "pointermove",
        function(e) {

            if (
                !dragging
            ) {

                return;

            }


            let x =
                e.clientX -
                offsetX;

            let y =
                e.clientY -
                offsetY;


            /*
               Keep the icon inside the
               upper 1/5 strip.
            */

            const maxX =
                window.innerWidth -
                angel.offsetWidth;


            const maxY =
                window.innerHeight *
                .20 -
                angel.offsetHeight;


            x =
                Math.max(
                    0,
                    Math.min(
                        maxX,
                        x
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        maxY,
                        y
                    )
                );


            angel.style.left =
                x + "px";

            angel.style.top =
                y + "px";

        }
    );


    angel.addEventListener(
        "pointerup",
        function(e) {

            dragging = false;

            try {

                angel.releasePointerCapture(
                    e.pointerId
                );

            } catch (error) {}

        }
    );


    angel.addEventListener(
        "pointercancel",
        function(e) {

            dragging = false;

        }
    );


    angel.addEventListener(
        "dblclick",
        function(e) {

            e.stopPropagation();

            addLarBuck(
                e.clientX,
                e.clientY,
                1
            );

            inspectPainting(
                image
            );

        }
    );

}


/* ============================================================
   REBUILD SAVED ANGELS
   ============================================================ */

function rebuildAngelIcons() {

    savedPaintings.forEach(
        function(image) {

            createAngelIcon(
                image
            );

        }
    );

}


/* ============================================================
   ROPE RESCUE
   ============================================================ */

function ropeRescue(
    painting,
    image
) {

    if (
        painting.dataset.rescued ===
        "true"
    ) {

        inspectPainting(
            image
        );

        return;

    }


    painting.dataset.rescued =
        "true";


    const rect =

/* ============================================================
   CREATE PAINTING
   ============================================================ */

function createPainting(
    image
) {

    const wrap =
        document.createElement(
            "div"
        );


    wrap.className =
        "paintingWrap";


    const frameNumber =
        1 +
        Math.floor(
            Math.random() * 4
        );


    wrap.classList.add(
        "frame" +
        frameNumber
    );


    const frame =
        document.createElement(
            "div"
        );

    frame.className =
        "paintingFrame";


    const canvas =
        document.createElement(
            "img"
        );

    canvas.className =
        "paintingCanvas";

    canvas.src =
        image;

    canvas.draggable =
        false;


    frame.appendChild(
        canvas
    );

    wrap.appendChild(
        frame
    );


    wrap.dataset.image =
        image;

    wrap.dataset.rescued =
        "false";


    wrap.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();


            /*
               EVERY painting click earns
               one Lar Buck.
            */

            const rect =
                wrap.getBoundingClientRect();


            addLarBuck(
                rect.left +
                rect.width / 2,
                rect.top,
                1
            );


            if (
                wrap.dataset.rescued ===
                "true"
            ) {

                inspectPainting(
                    image
                );

                return;

            }


            ropeRescue(
                wrap,
                image
            );

        }
    );


    document.body.appendChild(
        wrap
    );


    /*
       Start completely outside
       the visible screen.
    */

    wrap.style.left =
        (
            112 +
            Math.random() * 8
        ) + "vw";


    wrap.style.top =
        (
            61 +
            Math.random() * 19
        ) + "vh";


    wrap.style.transform =
        "translate(-50%,-50%) scale(" +
        (
            .10 +
            Math.random() * .12
        ) +
        ")";


    wrap.style.opacity =
        "0";


    void wrap.offsetWidth;


    return wrap;

}


/* ============================================================
   CARRY PAINTING THROUGH RIVER
   ============================================================ */

function revealAndCarry(
    painting,
    image,
    delay = 0,
    generation
) {

    setTimeout(
        function() {

            if (
                generation !==
                riverGeneration
            ) {

                painting.remove();

                return;

            }


            if (
                painting.dataset.rescued ===
                "true"
            ) {

                return;

            }


            /*
               REVEAL.
            */

            painting.style.opacity =
                ".98";


            void painting.offsetWidth;


            /*
               FIRST CURRENT
            */

            painting.style.transition =
                "left 3.5s linear, " +
                "top 3.5s ease-in-out, " +
                "transform 3.5s ease-out";


            painting.style.left =
                (
                    80 +
                    Math.random() * 7
                ) + "vw";


            painting.style.top =
                (
                    64 +
                    Math.random() * 10
                ) + "vh";


            painting.style.transform =
                "translate(-50%,-50%) scale(" +
                (
                    .34 +
                    Math.random() * .12
                ) +
                ")";


            /*
               MIDDLE CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.3s linear, " +
                        "top 4.3s ease-in-out, " +
                        "transform 4.3s linear";


                    painting.style.left =
                        (
                            53 +
                            Math.random() * 8
                        ) + "vw";


                    painting.style.top =
                        (
                            69 +
                            Math.random() * 9
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.72)";


                },
                3500
            );


            /*
               LOWER CURRENT
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 4.1s linear, " +
                        "top 4.1s ease-in-out, " +
                        "transform 4.1s linear";


                    painting.style.left =
                        (
                            29 +
                            Math.random() * 7
                        ) + "vw";


                    painting.style.top =
                        (
                            76 +
                            Math.random() * 8
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.53)";


                },
                7800
            );


            /*
               VERY NEAR LEFT SIDE.

               It travels horizontally to the
               near-left side while remaining SOLID.

               It does NOT become transparent yet.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "left 3.2s linear, " +
                        "top 3.2s ease-in-out, " +
                        "transform 3.2s linear";


                    painting.style.left =
                        (
                            7 +
                            Math.random() * 2
                        ) + "vw";


                    painting.style.top =
                        (
                            79 +
                            Math.random() * 4
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.25)";


                    /*
                       IMPORTANT:
                       opacity stays at .98 here.
                    */

                    painting.style.opacity =
                        ".98";


                },
                11900
            );


            /*
               QUICK VERTICAL DROP.

               It is already very near the left
               edge before it drops.
            */

            setTimeout(
                function() {

                    if (
                        generation !==
                        riverGeneration
                    ) {

                        return;

                    }


                    if (
                        painting.dataset.rescued ===
                        "true"
                    ) {

                        return;

                    }


                    painting.style.transition =
                        "top .85s ease-in, " +
                        "transform .85s ease-in";


                    painting.style.top =
                        (
                            88 +
                            Math.random() * 4
                        ) + "vh";


                    painting.style.transform =
                        "translate(-50%,-50%) scale(.17)";


                    /*
                       ONLY NOW does it become
                       semi-transparent.
                    */

                    setTimeout(
                        function() {

                            if (
                                painting.dataset.rescued ===
                                "true"
                            ) {

                                return;

                            }


                            painting.style.transition =
                                "opacity .35s linear, " +
                                "top 1.3s linear, " +
                                "left 1.3s linear, " +
                                "transform 1.3s linear";


                            painting.style.opacity =
                                ".38";


                            painting.style.top =
                                "99vh";


                            painting.style.left =
                                "-5vw";


                            painting.style.transform =
                                "translate(-50%,-50%) scale(.07)";


                        },
                        80
                    );


                },
                15100
            );


            /*
               FINAL EXIT.
            */

            setTimeout(
                function() {

                    if (
                        painting.dataset.rescued ===
                        "true"
                    ) {

                        return;

                    }


                    painting.remove();

                },
                16800
            );


        },
        delay
    );

}


/* ============================================================
   START SINGLE PAINTING
   ============================================================ */

function startPaintingSequence(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    paintingNumber++;


    const image =
        chooseArtwork();


    const painting =
        createPainting(
            image
        );


    activePaintings.push(
        painting
    );


    revealAndCarry(
        painting,
        image,
        100,
        generation
    );


    setTimeout(
        function() {

            startPaintingSequence(
                generation
            );

        },
        4800 +
        Math.random() * 1100
    );


    if (
        paintingNumber >=
        nextGroup
    ) {

        nextGroup =
            paintingNumber +
            7 +
            Math.floor(
                Math.random() * 5
            );


        setTimeout(
            function() {

                sendPaintingGroup(
                    generation
                );

            },
            1200
        );

    }

}


/* ============================================================
   PAINTING GROUP
   ============================================================ */

function sendPaintingGroup(
    generation
) {

    if (
        generation !==
        riverGeneration
    ) {

        return;

    }


    const amount =
        8 +
        Math.floor(
            Math.random() * 5
        );


    const group = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const image =
            chooseArtwork();


        const painting =
            createPainting(
                image
            );


        painting.style.top =
            (
                58 +
                Math.random() * 23
            ) + "vh";


        painting.style.left =
            (
                112 +
                Math.random() * 8
            ) + "vw";


        painting.style.zIndex =
            25 + i;


        void painting.offsetWidth;


        group.push({

            painting:
                painting,

            image:
                image

        });

    }


    group.forEach(
        function(
            item,
            index
        ) {

            revealAndCarry(
                item.painting,
                item.image,
                300 +
                index * 330,
                generation
            );

        }
    );


    setTimeout(
        function() {

            if (
                generation ===
                riverGeneration
            ) {

                sendTurtle();

            }

        },
        2500
    );

}
