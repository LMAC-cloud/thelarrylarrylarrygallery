<!DOCTYPE html>
<html lang="en" class="rainbow-hover">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Enterprose — Stage 35 Rainbow Effects</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: visible;
    background: #000;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  #space {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    cursor: crosshair;
  }

  /* Menus */
  .window {
    position: fixed;
    min-width: 250px;
    min-height: 135px;
    background: rgba(8, 13, 20, 0.38);
    border: 1px solid rgba(210,225,240,.55);
    border-radius: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 12px rgba(180,210,240,.08);
    backdrop-filter: blur(5px);
    z-index: 20;
    display: none;
    overflow: visible;
  }

  .titlebar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 12px;
    background: linear-gradient(rgba(80,100,120,.28), rgba(30,40,50,.18));
    border-bottom: 1px solid rgba(210,225,240,.22);
    cursor: grab;
    font-size: 16px;
    letter-spacing: .2px;
  }

  .titlebar:active { cursor: grabbing; }

  .close {
    width: 26px;
    height: 26px;
    border: 0;
    background: transparent;
    color: #eee;
    font-size: 22px;
    line-height: 22px;
    cursor: pointer;
    border-radius: 4px;
  }
  .close:hover { background: rgba(255,255,255,.12); }

  .window-body {
    padding: 14px;
    color: rgba(235,240,245,.78);
    font-size: 14px;
  }

  #backgroundWindow { left: 18px; top: 205px; width: 300px; height: 155px; }
  #telephoneWindow {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(850px, calc(100vw - 24px));
    height: min(480px, 58vh);
    min-width: 420px;
    min-height: 280px;
  }

  #telephoneText {
    width: 100%;
    height: calc(100% - 48px);
    resize: none;
    border: 1px solid rgba(210,225,240,.18);
    outline: none;
    background: rgba(0,0,0,.22);
    color: rgba(245,248,250,.9);
    font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    padding: 12px;
    user-select: text;
  }
  /* Main menu: only the word when closed; opened items live in their own box. */
  #mainMenu{
    position:fixed;left:0;bottom:0;z-index:100;
    width:auto;min-width:0;padding:0;margin:0;
    background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;
  }
  #mainMenuHead{
    display:inline-flex;align-items:center;
    height:18px;padding:0 4px;
    cursor:pointer;border:1px solid rgba(235,240,245,.20);
    background:transparent;color:rgba(245,248,252,.68);
    font:9px "Segoe UI",Arial,sans-serif;
  }
  #mainMenuHead .arrow{display:none;}
  #mainMenu.closed #mainItems{display:none;}
  #mainMenu.open #mainItems{display:block;}
  #mainItems{
    position:absolute;left:0;bottom:18px;width:118px;
    padding:0;background:transparent;border:0;
    border-radius:0;box-sizing:border-box;overflow:visible;
  }
  .mainButton{
    display:block;width:100%;height:23px;margin:2px 0;padding:0 6px;
    text-align:left;white-space:nowrap;color:rgba(240,244,248,.78);
    background:rgba(20,28,36,.16);border:1px solid rgba(210,225,240,.17);
    border-radius:0;cursor:pointer;font:10px "Segoe UI",Arial,sans-serif;
  }
  .mainButton:hover{background:rgba(75,92,110,.28);}
  .mainButton.active,.mainButton.selected{background:transparent!important;border-color:rgba(210,225,240,.17)!important;}

  .mainButton:hover { background: rgba(110,125,140,.16); }
.mainButton:hover { background: rgba(75,92,110,.65); }
/* Bottom text input */
  #textGrab {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(820px, 78vw);
    height: 46px;
    z-index: 90;
    cursor: grab;
    touch-action: none;
  }
  #textGrab:active { cursor: grabbing; }

  #textEntry {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 34px;
    border: 0;
    outline: none;
    background: transparent;
    color: rgba(225,230,235,.76);
    text-align: center;
    padding: 0 2px;
    font: 17px/34px "Segoe UI", Arial, sans-serif;
    caret-color: rgba(245,248,252,.58);
    user-select: text;
  }

  #textEntry::placeholder { color: transparent; }

  /* Small destination planet at the lower-left edge */
  #planetOrb{
    position:fixed;
    left:118px;
    bottom:20px;
    width:70px;
    height:64px;
    z-index:40;
    cursor:grab;
    touch-action:none;
    transform-origin:50% 72%;
    animation:planetHover 4.8s ease-in-out infinite;
    pointer-events:auto;
  }
  #planetOrb:active{cursor:grabbing;}
  #planetOrb.dragging{animation:none !important;}
  @keyframes planetHover{
    0%,100%{transform:translate(0,0) scale(1);}
    25%{transform:translate(1px,-2px) scale(.98);}
    50%{transform:translate(-1px,0) scale(.99);}
    75%{transform:translate(1px,-2px) scale(.975);}
  }
  #planetSphere{
    position:absolute;left:8px;top:0;width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#eeeeee 0 10%,#cfcfcf 28%,#a7a7a7 50%,#777 72%,#555 88%,#444 100%);
    box-shadow:inset -9px -5px 11px rgba(0,0,0,.48), inset 5px 4px 8px rgba(255,255,255,.20);
    pointer-events:none;
  }
  #planetLabel{
    position:absolute;
    left:-8px;
    top:50px;
    width:86px;
    height:12px;
    text-align:center;
    white-space:nowrap;
    color:rgba(235,240,245,.62);
    font:7px "Segoe UI",Arial,sans-serif;
    line-height:10px;
    pointer-events:none;
  }
  #planetView{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    background:#020307;
  }
  #planetCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  #returnStarfield{
    position:fixed;
    top:8px;
    right:8px;
    z-index:510;
    width:auto;
    height:24px;
    padding:0 6px;
    border:0;
    border-radius:0;
    background:rgba(0,0,0,.18);
    color:rgba(240,244,248,.72);
    font:9px "Segoe UI",Arial,sans-serif;
    cursor:pointer;
  }

  /* Drawing layer */
  #launchedDrawCanvas,#burningDrawCanvas,#liveGlowCanvas,#drawingCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  #launchedDrawCanvas{z-index:7;}
  #burningDrawCanvas,#liveGlowCanvas,#drawingCanvas{z-index:8;}
  #liveGlowCanvas,#planetGlowCanvas{opacity:.88;}


  .small-note {
    opacity: .65;
    line-height: 1.45;
  }

  .drawDurationBlock{
    margin:2px 0;
    color:rgba(235,240,245,.68);
    font:9px "Segoe UI",Arial,sans-serif;
  }
  .drawDurationTitle{margin-bottom:4px;color:rgba(245,248,252,.72);}
  #drawDuration{display:block;width:100%;height:14px;margin:0;cursor:pointer;}
  .drawDurationLabels{display:flex;justify-content:space-between;font-size:8px;color:rgba(235,240,245,.46);}

  .moveCursorOption{
    display:block;
    margin:0 0 8px;
    color:rgba(235,240,245,.70);
    font:10px "Segoe UI",Arial,sans-serif;
    cursor:pointer;
  }
  .moveCursorOption input{vertical-align:middle;margin-right:5px;}

  .telephoneBody{
    height:calc(100% - 34px);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #telephoneText{
    flex:1;
    width:100%;
    min-height:0;
    resize:none;
    border:1px solid rgba(210,225,240,.18);
    outline:none;
    background:rgba(0,0,0,.22);
    color:rgba(245,248,250,.9);
    font:16px/1.5 "Segoe UI",Arial,sans-serif;
    padding:12px;
    user-select:text;
  }
  .telephoneToolbar{
    height:27px;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .telephoneToolbar button{height:24px;min-width:30px;padding:0 5px;border:1px solid rgba(210,225,240,.16);border-radius:0;background:rgba(0,0,0,.16);color:rgba(225,230,235,.72);cursor:pointer;font:12px "Segoe UI",Arial,sans-serif;}
  .telephoneToolbar button:hover{background:rgba(150,165,180,.14);}
  .toolbarDivider{width:1px;height:17px;background:rgba(220,230,240,.18);margin:0 3px;}
  #returnToPlanet{margin-left:auto;font-size:9px;}

  #rotaryPhone{
    position:fixed;left:7px;bottom:5px;width:30px;height:30px;z-index:95;
    border:0;border-radius:0;background:transparent;color:rgba(8,8,8,.86);
    font-family:"Times New Roman",serif;font-size:25px;line-height:30px;
    cursor:pointer;text-shadow:0 1px 2px rgba(255,255,255,.16);
  }
  #rotaryPhone:hover{color:rgba(35,35,35,.96);}

  #planetEntry{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:min(360px,42vw);height:24px;z-index:505;
    display:none;border:0;outline:none;background:transparent;
    color:rgba(245,248,252,.82);font:14px "Segoe UI",Arial,sans-serif;
    text-align:center;caret-color:rgba(245,248,252,.55);
  }

  #planetPhone{
    position:fixed;left:7px;bottom:6px;width:30px;height:30px;z-index:515;
    border:0;border-radius:0;background:transparent;color:rgba(12,12,12,.90);
    font-family:"Times New Roman",serif;font-size:25px;line-height:30px;
    cursor:pointer;text-shadow:0 1px 2px rgba(255,255,255,.18);
  }
  #planetPhone:hover{color:rgba(40,40,40,.98);}
#menuBtn{
    position:fixed;left:7px;bottom:7px;z-index:900;
    width:auto;height:24px;padding:0 7px;
    border:1px solid rgba(235,240,245,.22);
    background:transparent;color:rgba(245,248,252,.72);
    font:9px "Segoe UI",Arial,sans-serif;
    cursor:pointer;box-sizing:border-box;
  }

  .rangeStepper input[type=range]{flex:1;min-width:0;accent-color:#555;filter:grayscale(1);height:14px;}

  #planetPhone{
    color:rgba(42,42,42,.98)!important;

  }
  #planetPhoneMenu{
    display:none;position:fixed;left:5px;bottom:47px;width:178px;z-index:700;

  .phoneMenuTitle{

  }
  #planetPhoneMenu button{
    display:block;width:100%;box-sizing:border-box;margin:2px 0;padding:5px 6px;
    border:1px solid rgba(220,230,240,.16);background:rgba(0,0,0,.18);
    color:rgba(240,245,250,.78);font:9px "Segoe UI",Arial,sans-serif;text-align:left;
  }
  .phoneMargins{display:flex;gap:2px;margin-top:4px;border-top:1px solid rgba(220,230,240,.14);padding-top:4px;}
  .phoneMargins button{flex:1!important;text-align:center!important;margin:0!important;}

  .textSizeControl{display:block;margin-top:7px;color:rgba(235,240,245,.68);font:9px "Segoe UI",Arial,sans-serif;}

  .mainMenuPanel{box-sizing:border-box;overflow:visible;min-width:178px;padding-bottom:4px;}
.menuButtons{overflow:visible;}

  .window{overflow:visible;box-sizing:border-box;}
  .window .windowHeader,.window .titlebar,.window .panelHeader{cursor:grab;user-select:none;}

  #telephoneWindow.starfieldTelephone{background:rgba(0,0,0,.12)!important;}
  #telephoneWindow.starfieldTelephone .windowBody{background:transparent!important;}

  .window,.window *{border-radius:0!important;}
  .window{overflow:visible!important;}
  .window-body{overflow:visible!important;}

  input[type=range]::-webkit-slider-thumb{
    appearance:none;width:3px;height:14px;border-radius:0;background:#555;border:0;
  }
  input[type=range]::-moz-range-thumb{
    width:3px;height:14px;border-radius:0;background:#555;border:0;
  }

  .phoneOption select{display:block;width:100%;height:20px;margin-top:2px;border:1px solid rgba(210,225,240,.16);border-radius:0;background:rgba(0,0,0,.20);color:rgba(240,244,248,.78);font:8px "Segoe UI",Arial,sans-serif;}

  input[type=range]{accent-color:#555;filter:grayscale(1);}

    display:block;height:2px;background:#777;content:"";position:absolute;
  }
  .marginButton span{width:17px;top:6px;}

  .marginButton span::after{width:9px;left:0;top:8px;}

  .alignCenter span::after{left:4px;width:9px;}
  .alignRight span::before{left:4px;width:13px;}
  .alignRight span::after{left:8px;width:9px;}
  .alignJustify span,.alignJustify span::before,.alignJustify span::after{left:0;width:17px;}

<script>
(() => {
  'use strict';

  const sequence = [
    '#ff00bd', '#ff003b', '#ff0000', '#ff5500', '#ff9000', '#ffde00',
    '#c9ed00', '#55dc00', '#00d947', '#00ce99', '#00cadf', '#008bed',
    '#183bff', '#5325ff', '#7923ef', '#a72bf0', '#ca36ed', '#ed49e4',
    '#ff4fb4'
  ];
  const steps = [6, 3, 5, 3, 7, 4, 3, 7, 5, 6, 6, 7, 7, 5, 5, 5, 4, 5, 4];
  const channels = hex => hex.slice(1).match(/../g).map(value => parseInt(value, 16));
  const ramp = sequence.flatMap((colour, index) => {
    const from = channels(colour);
    const to = channels(sequence[(index + 1) % sequence.length]);
    return Array.from({length:steps[index]}, (_, step) => {
      const rgb = from.map((value, i) =>
        Math.round(value + (to[i] - value) * step / steps[index])
      );
      return `rgb(${rgb.join(',')})`;
    });
  });
  const colourAt = index => ramp[index % ramp.length];

  function drawStroke(ctx, points, {width = 3, glow = true, start = 0, opacity = 1, glowColour = null} = {}) {
    const end = points.length - 1;
    if (end <= start) return;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'round';
    ctx.lineWidth = width;
    for (let first = start + 1; first <= end;) {
      const colour = colourAt(first);
      let last = first;
      while (last < end && colourAt(last + 1) === colour) last++;

      ctx.beginPath();
      ctx.moveTo(points[first - 1].x, points[first - 1].y);
      for (let i = first; i <= last; i++) ctx.lineTo(points[i].x, points[i].y);
      if (last < end) {
        const p = points[last];
        const q = points[last + 1];
        const distance = Math.hypot(q.x - p.x, q.y - p.y) || 1;
        const overlap = Math.min(.35 / distance, .25);
        ctx.lineTo(p.x + (q.x - p.x) * overlap, p.y + (q.y - p.y) * overlap);
      }

      ctx.strokeStyle = colour;
      ctx.shadowBlur = glow ? Math.max(16, width * 4.5) : 0;
      ctx.shadowColor = glowColour ?? colour;
      ctx.stroke();
      ctx.shadowBlur = 0;
      first = last + 1;
    }
    for (const [point, index] of [[points[start], start + 1], [points[end], end]]) {
      ctx.fillStyle = colourAt(index);
      ctx.beginPath();
      ctx.arc(point.x, point.y, width / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  window.Stage35RainbowLine = Object.freeze({drawStroke, colourAt});
})();
</script>
<script>
(() => {
  "use strict";

  /* ---------------- STARFIELD ---------------- */

  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, cx = 0, cy = 0, dpr = 1;

  const stars = [];
  const STAR_COUNT = 520;
  const DEPTH = 1100;
  const SPEED = 0.72;          // deliberately medium-slow
  const FOCAL = 520;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cx = W * 0.5;
    cy = H * 0.5;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function newStar(initial = false) {
    // Keep stars distributed around the viewer rather than creating
    // a rotating or pulsing pattern.
    return {
      x: (Math.random() * 2 - 1) * W,
      y: (Math.random() * 2 - 1) * H,
      z: initial ? Math.random() * DEPTH + 5 : DEPTH,
      r: Math.random() < .78 ? (Math.random() * 1.25 + .35) : (Math.random() * 2.0 + .8),
      a: Math.random() * .45 + .50
    };
  }

  function resetStar(s) {
    s.x = (Math.random() * 2 - 1) * W;
    s.y = (Math.random() * 2 - 1) * H;
    s.z = DEPTH;
    s.r = Math.random() < .78 ? (Math.random() * 1.25 + .35) : (Math.random() * 2.0 + .8);
    s.a = Math.random() * .45 + .50;
  }

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) stars.push(newStar(true));
  }

  function drawStar(s, oldZ) {
    const sx = cx + (s.x / s.z) * FOCAL;
    const sy = cy + (s.y / s.z) * FOCAL;

    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) {
      resetStar(s);
      return;
    }

    const radius = Math.max(.28, (1 - s.z / DEPTH) * 2.2 + s.r * .20);

    // A very short, depth-based trail. This keeps the stars round,
    // while giving the impression of forward travel.
    const prevX = cx + (s.x / oldZ) * FOCAL;
    const prevY = cy + (s.y / oldZ) * FOCAL;
    const trail = Math.hypot(sx-prevX, sy-prevY);

    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(235,242,250,${Math.min(1, s.a)})`;
    ctx.fill();

    if (trail > .7 && radius > .65) {
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = `rgba(220,232,245,${Math.min(.24, trail/20)})`;
      ctx.lineWidth = Math.min(1.15, radius * .42);
      ctx.stroke();
    }
  }

  let last = performance.now();

  function animate(now) {
    const dt = Math.min(32, now - last);
    last = now;

    ctx.clearRect(0, 0, W, H);
    if(burningStrokes.length || hadBurningStrokes)burningCtx.clearRect(0,0,W,H);
    hadBurningStrokes=burningStrokes.length>0;

    const visual=overlayEnabled ? lastVisual : backgroundConfigs[bgMode.value] && bgMode.value!=="stars" ? bgMode.value : null;
    const paintedBase=paintAlternateBackground(now);
    if(visual ? opArtStars : !paintedBase)for (const s of stars) {
      const oldZ = s.z;
      // Smooth constant movement. No sinusoidal pulse, no global reset.
      const speed=backgroundConfigs.stars.speed;
      const direction=backgroundConfigs.stars.direction;
      if(direction==="forward" || direction==="backward"){
        s.z += (direction==="forward"?-1:1) * SPEED * speed * dt * .06;
        if(s.z>DEPTH)s.z=3;
      }else{
        const angle=directionAngle(backgroundConfigs.stars,now);
        if(direction==="spiral"){
          const turn=dt*.0013*speed;
          [s.x,s.y]=[s.x*Math.cos(turn)-s.y*Math.sin(turn),s.x*Math.sin(turn)+s.y*Math.cos(turn)];
        }else{
          s.x-=Math.sin(angle)*dt*speed*.22;
          s.y+=Math.cos(angle)*dt*speed*.22;
        }
      }

      if (s.z < 3) {
        resetStar(s);
        continue;
      }
      drawStar(s, oldZ);
    }

    if(visual)paintEffect(visual,W,H,dt,now);
    drawLaunchedImages(now);
    drawTexts(dt);
    drawIncomingDrawings(dt);
    drawBurningStrokes(dt,burningCtx,false);
    if(drawing)refreshLiveRainbow(liveInk);
    refreshTypedEffect();

    requestAnimationFrame(animate);
  }

  resize();
  initStars();
  window.addEventListener("resize", () => {
    resize();
    for (const s of stars) {
      s.x = Math.max(-W, Math.min(W, s.x));
      s.y = Math.max(-H, Math.min(H, s.y));
    }
  });
  /* ---------------- TEXT TRAVELLING INTO SPACE ---------------- */

  const entry = document.getElementById("textEntry");
  const telephone = document.getElementById("telephoneText");
  const movingTexts = [];
  const submittedLines = [];
  let screenType=false;

  function getTextAnchorCenter() {
    const r = document.getElementById("textGrab").getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + 17 };
  }

  function addText(text,record=true) {
    if (screenType || !text.trim()) return;

    const a = getTextAnchorCenter();

    const settings=captureLaunchedText(text,record);
    for(let copy=0;copy<appliedValue("textRepeat",1);copy++)movingTexts.push({
      settings,
      text: text,
      x: a.x,
      startX: a.x,
      startY: a.y,
      age: -copy*280,
      opacity: .94,
      size: 17
    });

    if(!record)return;
    submittedLines.push(text);
    telephone.value += (telephone.value ? "\n" : "") + text;
    telephone.scrollTop = telephone.scrollHeight;
  }

  entry.addEventListener("keydown", e => {
    if(screenType)return;
    if (e.key === "Enter") {
      e.preventDefault();
      const text = entry.value;
      entry.value = "";
      addText(text);
    }
  });

  // Keep the starfield text entry usable even after visiting menus/planet.
  // Form controls still keep their own normal keyboard behaviour.
  document.addEventListener("keydown", e=>{
    if(planetOpen || screenType)return;
    const a=document.activeElement;
    if(a===entry || a===telephone || a?.matches("button,select,input,textarea"))return;
    if(e.ctrlKey||e.altKey||e.metaKey)return;

    if(e.key==="Enter"){
      e.preventDefault();
      entry.focus({preventScroll:true});
      const text=entry.value;
      entry.value="";
      addText(text);
      return;
    }
    if(e.key==="Backspace"){
      e.preventDefault();
      entry.focus({preventScroll:true});
      entry.value=entry.value.slice(0,-1);
      return;
    }
    if(e.key.length===1){
      e.preventDefault();
      entry.focus({preventScroll:true});
      entry.value+=e.key;
    }
  });

  window.addEventListener("focus",()=>setTimeout(restoreEntryFocus,20));

  function drawTexts(dt) {
    for(let i=movingTexts.length-1;i>=0;i--){
      const t=movingTexts[i];
      t.age+=dt;
      const settings=t.settings;
      if(t.age<0)continue;
      const duration=settings.duration;
      const p=Math.min(1,t.age/duration);
      t.x=t.startX+(cx-t.startX)*p;
      t.y=t.startY+(cy-12-t.startY)*p;
      if(settings.style==="left")t.x-=W*.37*p;
      if(settings.style==="right")t.x+=W*.37*p;
      const maxSize=settings.size;
      const initialSize=17;
      t.size=initialSize+(maxSize-initialSize)*Math.min(1,t.age/7600);
      const fadeStart=.72;
      t.opacity=p<fadeStart?.96:.96*(1-(p-fadeStart)/(1-fadeStart));
      if(p>=1||t.opacity<=.01){movingTexts.splice(i,1);continue;}
      if(settings.invisible)continue;
      ctx.save();
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font=`${t.size}px ${settings.font}`;
      ctx.globalAlpha=t.opacity*(settings.transparent?textTransparency:1);
      ctx.fillStyle=launchedTextPaint(ctx,settings,t.text,t.x,t.age);
      ctx.shadowColor=typeof ctx.fillStyle==="string"?ctx.fillStyle:"#fff";
      ctx.shadowBlur=settings.glow;
      ctx.fillText(t.text,t.x,t.y);
      ctx.restore();
    }
  }


  /* ---------------- DRAWING ---------------- */

  const drawCanvas = document.getElementById("drawingCanvas");
  const dctx = drawCanvas.getContext("2d");
  const liveGlowContext=byId("liveGlowCanvas").getContext("2d");
  const burningCanvas=document.getElementById("burningDrawCanvas");
  const burningCtx=burningCanvas.getContext("2d");
  let hadBurningStrokes=false;
  const launchedDrawCanvas = document.getElementById("launchedDrawCanvas");
  const launchedCtx = launchedDrawCanvas.getContext("2d");
  let colour = "#ffffff";

  function resizeLaunchedCanvas(){
    launchedDrawCanvas.width = Math.floor(window.innerWidth * dpr);
    launchedDrawCanvas.height = Math.floor(window.innerHeight * dpr);
    launchedDrawCanvas.style.width = window.innerWidth + "px";
    launchedDrawCanvas.style.height = window.innerHeight + "px";
    launchedCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeLaunchedCanvas();
  window.addEventListener("resize", resizeLaunchedCanvas);

  let drawing = false;
  let points = [];
  const MAX_LIVE_DRAW_POINTS=1000;
  const POINT_SPACING=2.2;
  const incomingDrawings = [];
  let lastDrawing=null;

  function resizeDrawingCanvas() {
    drawCanvas.width = Math.floor(window.innerWidth * dpr);
    drawCanvas.height = Math.floor(window.innerHeight * dpr);
    drawCanvas.style.width = window.innerWidth + "px";
    drawCanvas.style.height = window.innerHeight + "px";
    dctx.setTransform(dpr,0,0,dpr,0,0);
    resizeLiveGlow(liveGlowContext,window.innerWidth,window.innerHeight);
    burningCanvas.width=drawCanvas.width;
    burningCanvas.height=drawCanvas.height;
    burningCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeDrawingCanvas();
  window.addEventListener("resize", resizeDrawingCanvas);

  function isUIElement(target, x, y) {
    if (target && target.closest &&
        target.closest(".window, #mainMenu, #textGrab, #planetOrb, #planetView")) return true;
    const el = document.elementFromPoint(x,y);
    return !!(el && el.closest &&
        el.closest(".window, #mainMenu, #textGrab, #planetOrb, #planetView"));
  }

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  // The drawing canvas is the only surface that receives drawing gestures.
  // It sits above the starfield but below every menu/window/text control.
  drawCanvas.style.pointerEvents = "auto";
  drawCanvas.style.touchAction = "none";

  drawCanvas.addEventListener("pointerdown", e => {
    if(e.button!==0)return;
    if(takeImagePosition(e))return;
    if(screenType){startScreenBlock(e);return;}
    drawing=true;
    liveStrokeSettings=captureEffect("drawn");
    liveStrokeStart=performance.now();
    const q=pointerPos(e);
    points=[q];
    liveStrokeTip=q;
    const angle=Math.random()*180;
    strokeAngles.set(points,angle);
    liveInk=beginLiveInk(dctx,q,liveStrokeSettings,angle,liveGlowContext);
    window.__drawingPointerId=e.pointerId;
    drawCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  drawCanvas.addEventListener("pointermove", e => {
    if(!drawing || e.pointerId!==window.__drawingPointerId)return;
    const q=pointerPos(e);
    liveStrokeTip=q;
    extendLiveInk(liveInk,q);
    const last=points[points.length-1];
    if(!last){
      points.push(q);
      return;
    }
    const dist=Math.hypot(q.x-last.x,q.y-last.y);
    // Keep enough points for a faithful curve without allowing an extremely
    // long mouse gesture to become an animation bottleneck.
    if(dist>=POINT_SPACING){
      const steps=Math.min(8,Math.max(1,Math.ceil(dist/POINT_SPACING)));
      for(let k=1;k<=steps;k++){
        const t=k/steps;
        points.push({
          x:last.x+(q.x-last.x)*t,
          y:last.y+(q.y-last.y)*t
        });
      }
      if(points.length>MAX_LIVE_DRAW_POINTS){
        points.splice(0, points.length-MAX_LIVE_DRAW_POINTS);
      }
    }
    e.preventDefault();
  });

  function finishDrawing(e){
    if(!drawing || e.pointerId!==window.__drawingPointerId)return;
    drawing=false;
    window.__drawingPointerId=null;

    if(liveStrokeTip && Math.hypot(liveStrokeTip.x-points.at(-1).x,liveStrokeTip.y-points.at(-1).y)>.05)points.push(liveStrokeTip);
    if(points.length===1){
      points.push({x:points[0].x+.5,y:points[0].y+.5});
    }

    if(points.length>1){
      const shape=(liveStrokeSettings.mode==="stage35" && liveInk.path.length>1 ? liveInk.path : points).slice();
      strokeAngles.set(shape,strokeAngles.get(points)||0);
      drawnStrokeStyles.set(shape,liveStrokeSettings);
      rememberDrawing(shape,planetOpen);
      if(!liveStrokeSettings.invisible && (liveStrokeSettings.fuse || deformsReleasedInk(liveStrokeSettings.lineEffect))){
        burningStrokes.push({shape,age:0,settings:releaseInkSettings(liveInk,liveStrokeSettings),elapsed:performance.now()-liveStrokeStart,halo:liveInk.haloSamples});
      }
    }

    points=[];
    dctx.clearRect(0,0,W,H);
    liveGlowContext.clearRect(0,0,W,H);
    e.preventDefault();
  }

  function rememberDrawing(shape,planet,relaunch=false){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const q of shape){
      minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);
      minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y);
    }
    if(!relaunch)lastDrawing=shape;
    if(planet && byId("planetLineLaunch").getAttribute("aria-pressed")!=="true")return;
    const repeat=appliedValue("launchRepeat",1);
    for(let copy=0;copy<repeat;copy++){
      const path=simplifyLaunchPoints(shape,900).slice();
      const settings=captureEffect("line");
      const drawn=drawnStrokeStyles.get(shape);
      if(settings.matchDrawn && drawn){
        for(const key of matchedDrawFields)settings[key]=drawn[key];
        if(drawn.mode==="stage35")Object.assign(settings,{glow:drawn.glow,glowEnabled:drawn.glowEnabled,rainbowGlow:drawn.rainbowGlow});
      }
      if(!settings.lineEffect && drawn?.lineEffect)settings.lineEffect=drawn.lineEffect;
      assignSequenceColour(settings,"launched");
      strokeAngles.set(path,settings.matchDrawn ? (strokeAngles.get(shape)??0) : Math.random()*180);
      incomingDrawings.push({planet,settings,lastLaunch:effectState.line.origin==="stroke"?{x:(minX+maxX)/2,y:(minY+maxY)/2}:null,
        points:path,ox:(minX+maxX)/2,oy:(minY+maxY)/2,age:-copy*280,opacity:1});
    }
  }

  function simplifyLaunchPoints(srcPoints,maxPoints=700){
    if(srcPoints.length<=maxPoints)return srcPoints.slice();
    const out=[];
    const step=(srcPoints.length-1)/(maxPoints-1);
    for(let i=0;i<maxPoints;i++)out.push(srcPoints[Math.round(i*step)]);
    return out;
  }

  function drawIncomingDrawings(dt) {
    launchedCtx.clearRect(0,0,W,H);
    for(let i=incomingDrawings.length-1;i>=0;i--){
      const d=incomingDrawings[i];
      if(d.planet) continue;
      d.age=(Number.isFinite(d.age)?d.age:0)+dt;

      if(d.age<0)continue;
      const settings=d.settings;
      const p=Math.min(1,d.age/settings.duration);
      if(p>=1){incomingDrawings.splice(i,1);continue;}
      if(settings.invisible)continue;

      // One smooth path from the lower-middle launch point upward.
      const {x,y}=linePosition(d,p,W,H,.025);
      // A little larger than the previous version, but still well below
      // the enormous freeze drawing.
      const scale=launchLineScale(settings,p);

      const fadeStart=.70;
      const fade=p<fadeStart ? 1 : Math.max(0,1-(p-fadeStart)/(1-fadeStart));


      launchedCtx.save();
      launchedCtx.translate(x,y);
      if(settings.spinning)launchedCtx.rotate(d.age*.001*settings.spinSpeed*Math.PI/180);
      launchedCtx.scale(scale,scale);
      launchedCtx.translate(-d.ox,-d.oy);

      launchedCtx.globalAlpha=fade;
      launchedCtx.lineCap="round";
      launchedCtx.lineJoin="round";

      paintDrawingStroke(launchedCtx,d.points,settings,d.age,settings.fuse ? d.age*settings.fuseSpeed/1000 : 0);

      launchedCtx.restore();
    }
  }

  function smoothLaunchPath(ctx,pts){
    if(!pts.length)return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    if(pts.length===2){
      ctx.lineTo(pts[1].x,pts[1].y);
      return;
    }
    for(let j=1;j<pts.length-1;j++){
      const mx=(pts[j].x+pts[j+1].x)/2;
      const my=(pts[j].y+pts[j+1].y)/2;
      ctx.quadraticCurveTo(pts[j].x,pts[j].y,mx,my);
    }
    const last=pts[pts.length-1];
    ctx.lineTo(last.x,last.y);
  }

  function rainbowColour(v){
    const stops=[
      [255,0,0],[255,72,0],[255,150,0],[255,220,0],[120,205,40],
      [0,190,155],[0,145,255],[85,80,255],[155,45,220],
      [255,40,165],[255,135,185],[230,175,125],[165,125,80],
      [110,110,110],[62,62,62],[0,0,0],[255,255,255]
    ];
    const t=Math.max(0,Math.min(100,Number(v)||0))/100*(stops.length-1);
    const i=Math.min(stops.length-2,Math.floor(t));
    const f=t-i;
    const a=stops[i],b=stops[i+1];
    return "#"+[0,1,2].map(k=>Math.round(a[k]+(b[k]-a[k])*f).toString(16).padStart(2,"0")).join("");
  }
  function cycleRainbowColour(phase){
    const hue=((Number(phase)||0)%1+1)%1*360;
    const c=1, x=1-Math.abs((hue/60)%2-1);
    let r=0,g=0,b=0;
    if(hue<60){r=c;g=x;} else if(hue<120){r=x;g=c;} else if(hue<180){g=c;b=x;} else if(hue<240){g=x;b=c;} else if(hue<300){r=x;b=c;} else {r=c;b=x;}
    return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
  }

  const planetTextFlights=[];
  let planetTextFont='"Segoe UI",Arial,sans-serif';
  function currentPlanetColour(now){
    if(byId("planetRainbow")?.getAttribute("aria-pressed")==="true")return hexColour(cycleRainbowColour(now/18000));

    return planetCustomColours.planetColourRange || (planetColourRange ? rainbowColour(planetColourRange.value) : "#888888");
  }
  const planetLineColours=["#ff0000","#ff2600","#ff4c00","#ff6900","#ff8500","#ffb600","#ffe600","#ace000","#58da00","#2ced73","#00ffe5","#17d3f2","#2da6ff","#317af9","#344ef3","#543bdf","#7427ca","#9451e5","#b47bff","#da3e80"];
  const planetLetterHues=[0,30,58,122,178,239,286];
  function planetLetterColour(now,index,lineIndex=0,style=planetInkStyle.value){
    switch(style){
      case "cycle":return cycleRainbowColour(now/4400);
      case "fixed":return planetLetterColour(now,0,lineIndex*67+index+1,"lineRandom");
      case "moving":return cycleRainbowColour(planetLetterHues[mod(index+Math.floor(now/220),7)]/360);
      case "alternating":return index%2?"#171717":"#ffffff";
      case "lineRainbow":return planetLineColours[lineIndex%planetLineColours.length];
      case "lineRandom":return cycleRainbowColour((Math.sin((lineIndex+1)*78.233)*43758.5453)%1);
      default:return planetCustomColours.planetTextColourRange || rainbowColour(planetTextColourRange.value);
    }
  }

  function drawPlanetScene(now) {
    if(!planetOpen)return;

    const pw=window.innerWidth,ph=window.innerHeight;
    pctx.clearRect(0,0,pw,ph);

    for(const st of planetStars){
      pctx.beginPath();
      pctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      pctx.fillStyle=st.warm
        ? `rgba(235,220,190,${st.a})`
        : `rgba(225,235,248,${st.a})`;
      pctx.fill();
    }

    const x=pw*.5,y=ph*.53,R=Math.min(pw,ph)*.205;

    // Complete, smooth 3-D sphere. No separate shadow overlay, bands, or edge mask.
    const pc=currentPlanetColour(now);
    const baseR=parseInt(pc.slice(1,3),16), baseG=parseInt(pc.slice(3,5),16), baseB=parseInt(pc.slice(5,7),16);
    const shade=(m,a=1)=>`rgba(${Math.max(0,Math.min(255,Math.round(baseR*m)))},${Math.max(0,Math.min(255,Math.round(baseG*m)))},${Math.max(0,Math.min(255,Math.round(baseB*m)))},${a})`;
    const sphere=pctx.createRadialGradient(x-R*.38,y-R*.42,R*.02,x+R*.18,y+R*.16,R*1.02);
    sphere.addColorStop(0,shade(1.34,1));
    sphere.addColorStop(.18,shade(1.18,1));
    sphere.addColorStop(.48,shade(.98,1));
    sphere.addColorStop(.76,shade(.78,1));
    sphere.addColorStop(.93,shade(.64,1));
    sphere.addColorStop(1,shade(.55,1));
    pctx.beginPath();pctx.arc(x,y,R,0,Math.PI*2);pctx.fillStyle=sphere;pctx.fill();
    const highlight=pctx.createRadialGradient(x-R*.34,y-R*.38,0,x-R*.34,y-R*.38,R*.34);
    highlight.addColorStop(0,"rgba(255,255,255,.18)");
    highlight.addColorStop(1,"rgba(255,255,255,0)");
    pctx.beginPath();pctx.arc(x,y,R,0,Math.PI*2);pctx.fillStyle=highlight;pctx.fill();

    // Text is packed into successive clockwise rings. The oldest phrase is
    // always placed first; new phrases are appended after it. When a ring
    // fills, the next ring is created just outside it.
    const ringLines=submittedLines.slice();
    const motion=planetMotion ? planetMotion.value : "row";
    const dt=Math.max(0,Math.min(.06,(now-planetSpin.at)/1000));
    planetSpin.at=now;
    const targetSize=appliedValue("planetTextSize",17);
    planetSpin.size+=(targetSize-planetSpin.size)*(1-Math.exp(-dt*13));
    const textSize=planetSpin.size;
    const baseRadius=R*1.30;
    const ringGap=11.25;
    const gap=13.5;
    const speedSetting=planetSpeed ? appliedValue("planetSpeed",27) : 27;
    planetSpin.travel+=dt*1000*speedSetting;
    const travel=planetSpin.travel,phase=travel*.0000035;
    pctx.font=`${textSize}px ${planetTextFont}`;
    pctx.textAlign="center";
    pctx.textBaseline="middle";
    const items=ringLines.map((line,index)=>({line,index,w:pctx.measureText(line).width}));
    pctx.font=`15px ${planetTextFont}`;
    for(const item of items)item.orbitWidth=pctx.measureText(item.line).width;
    pctx.font=`${textSize}px ${planetTextFont}`;
    const effect=orbitEffect.value,glow=byId("planetGlow").value;
    const spinTime=(now-planetStart)/1000;
    const direction=effect==="spin"?1:effect==="reverseSpin"?-1:0;
    const targetRate=direction*(.026+(speedSetting-2)*.014)*(1-.45*Math.cos(spinTime/4));
    planetSpin.rate+=(targetRate-planetSpin.rate)*(1-Math.exp(-dt*4));
    planetSpin.angle+=planetSpin.rate*dt;
    if(!direction)planetSpin.angle*=Math.exp(-dt*4);
    const paintLine=(item,tx,ty,rotation=0,hover=false)=>{
      const outLength=Math.hypot(tx-x,ty-y)||1;
      const dx=(tx-x)/outLength,dy=(ty-y)/outLength;
      const angle=rotation+planetSpin.angle;
      const surfaceX=x+(tx-x)*Math.min(.76,R*.78/outLength);
      const surfaceY=y+(ty-y)*Math.min(.76,R*.78/outLength);
      const draw=(px,py,scale=1,alpha=1,paint={})=>{
        pctx.save();
        pctx.translate(px,py);
        pctx.rotate(angle);
        pctx.scale(scale*(paint.mirror?-1:1),scale);
        pctx.globalAlpha*=alpha;
        paintPlanetLine(pctx,item,now,textSize,effect,paint.glow||"off",{...paint,hover,motionTime:travel/14});
        pctx.restore();
      };
      if(glow==="shadow"){
        pctx.save();
        pctx.beginPath();
        pctx.arc(x,y,R,0,Math.PI*2);
        pctx.clip();
        const darkPlanet=Math.max(baseR,baseG,baseB)<30;
        draw(surfaceX,surfaceY,.58,darkPlanet?.82:.65,{colour:darkPlanet?"#343434":"#080808"});
        pctx.restore();
      }
      if(glow==="tracers"){
        for(let trail=3;trail>=1;trail--)draw(tx+dx*trail*8,ty+dy*trail*8,1,.36/trail);
      }
      if(effect==="mirror" || effect==="mirrorSpin"){
        draw(tx+dx*textSize*1.3,ty+dy*textSize*1.3,1,.52,{mirror:true,glow});
      }
      if(effect==="depth"){
        for(let row=5;row>=1;row--){
          const t=row/5;
          const mode=planetInkStyle.value;
          const colour=["lineRainbow","lineRandom"].includes(mode)?planetLetterColour(now,0,item.index+row):undefined;
          draw(tx+(surfaceX-tx)*t,ty+(surfaceY-ty)*t+textSize*t,.96-.78*t,.86-.64*t,{colour,glow});
        }
      }
      if(effect==="sticks" && item.line.trim() && item.lineCentre!==false){
        const end=Math.min(R*.78,outLength*.6);
        pctx.save();
        pctx.strokeStyle=planetLetterColour(now,Math.floor(item.line.length/2),item.index);
        pctx.lineWidth=Math.max(1,textSize*.08);
        pctx.beginPath();
        const bottom=Math.max(textSize*.35,pctx.measureText(item.line).actualBoundingBoxDescent||0);
        const nx=-Math.sin(angle),ny=Math.cos(angle);
        const startX=tx+nx*bottom,startY=ty+ny*bottom;
        const aimX=x+dx*end,aimY=y+dy*end;
        const clearOfText=(aimX-startX)*nx+(aimY-startY)*ny>0;
        const length=Math.max(textSize,Math.hypot(tx-aimX,ty-aimY)-bottom);
        pctx.moveTo(startX,startY);
        pctx.lineTo(clearOfText?aimX:startX+nx*length,clearOfText?aimY:startY+ny*length);
        pctx.stroke();
        pctx.restore();
      }
      draw(tx,ty,1,1,{glow});
    };

    if(motion==="saturn" && items.length){
      // Draw only the foreground half of the belt. Glyphs fade at its shoulders.
      const ringWidth=R*1.26,ringDepth=R*.23;
      const beltLength=Math.PI*ringWidth;
      const ticker=items.flatMap(item=>[...[...item.line].map((letter,index)=>({letter,index,item})),{letter:"     ",index:0,item}]).reverse();
      pctx.font=`15px ${planetTextFont}`;
      for(const glyph of ticker)glyph.orbitWidth=pctx.measureText(glyph.letter).width;
      pctx.font=`${textSize}px ${planetTextFont}`;
      const run=ticker.reduce((sum,glyph)=>sum+glyph.orbitWidth,0);
      if(run>0){
        let distance=mod(travel*.004,run)-run;
        for(let lap=0;lap<Math.ceil(beltLength/run)+2 && distance<beltLength;lap++){
          for(const glyph of ticker){
            if(distance>beltLength)break;
            const width=pctx.measureText(glyph.letter).width;
            const centre=distance+glyph.orbitWidth/2;
            if(centre>=0 && centre<=beltLength){
              const a=centre/beltLength*Math.PI;
              pctx.save();
              pctx.globalAlpha=Math.min(1,Math.sin(a)*5);
              paintLine({line:glyph.letter,index:glyph.item.index,w:width,letterOffset:glyph.index,
                lineCentre:glyph.index===Math.floor([...glyph.item.line].length/2)},
                x+Math.cos(a)*ringWidth,y+Math.sin(a)*ringDepth);
              pctx.restore();
            }
            distance+=glyph.orbitWidth;
          }
        }
      }
    }else if(motion==="row"){
      const slots=30;
      const step=Math.PI*2/slots;
      items.forEach((item,index)=>{
        const radius=R*1.42+Math.floor(index/slots)*36;
        const angle=phase+Math.PI-(index%slots)*step;
        paintLine(item,x+Math.cos(angle)*radius,y+Math.sin(angle)*radius);
      });
    }else if(motion==="orbit" || motion==="orbitRing"){
      items.forEach((item,index)=>{
        const slot=index%8,ring=Math.floor(index/8);
        const angle=phase-Math.PI/2+slot*Math.PI/4;
        const radius=R*1.42+ring*36;
        paintLine(item,x+Math.cos(angle)*radius,y+Math.sin(angle)*radius,
          motion==="orbit"?0:angle+Math.PI/2);
      });
    }else if(motion==="page" && items.length){
      const rowHeight=15*1.45;
      const distance=travel*.0018;
      const count=Math.max(1,Math.ceil(R*1.52/rowHeight));
      for(let i=-1;i<=count;i++){
        const index=mod(i-Math.floor(distance/rowHeight),items.length);
        const baseline=y-R*.76+i*rowHeight+mod(distance,rowHeight);
        if(baseline<y-R*.76-rowHeight/2 || baseline>y+R*.76+rowHeight/2)continue;
        paintLine(items[index],Math.round(x),Math.round(baseline));
      }
    }else{
      const rings=[];
      let radius=baseRadius,current=[];
      for(const item of items){
        const used=current.reduce((sum,existing)=>sum+existing.orbitWidth+gap,0);
        if(current.length && used+item.orbitWidth+gap>2*Math.PI*radius*.90){
          rings.push({items:current,radius});
          radius+=15+ringGap;
          current=[];
        }
        current.push(item);
      }
      if(current.length)rings.push({items:current,radius});
      rings.forEach((ring,ringIndex)=>{
        let cursor=-ring.items.reduce((sum,it)=>sum+it.orbitWidth+gap,0)/2;
        ring.items.forEach((item,index)=>{
          const arc=cursor+item.orbitWidth/2;
          cursor+=item.orbitWidth+gap;
          let angle=phase+arc/ring.radius-Math.PI/2;
          let rr=ring.radius,tx=x+Math.cos(angle)*rr,ty=y+Math.sin(angle)*rr;
          if(motion==="axis"){
            angle=phase*(1+ringIndex*.25)+arc/ring.radius-Math.PI/2;
            rr=ring.radius*.86;tx=x+Math.cos(angle)*rr;ty=y+Math.sin(angle)*rr*.52;
          }else if(motion==="float"){
            tx+=Math.sin(travel*.00014+index*.75)*R*.28;ty+=Math.cos(travel*.00018+index*.61)*R*.26;
          }else if(motion==="scatter"){
            const spread=Math.max(0,Math.sin(now*.00055+index*.72))*R*.26;
            tx+=Math.cos(now*.00072+index)*spread;ty+=Math.sin(now*.00061+index*1.2)*spread;
          }else if(motion==="wave"){
            tx=x+Math.sin(angle)*ring.radius;
            ty=y+Math.sin(tx/R*2+travel*.00042)*R*.5+(ringIndex-.5)*R*.35;
          }else if(motion==="spiral"){
            rr+=Math.sin(travel*.00006-index*.35)*R*.30;tx=x+Math.cos(angle)*rr;ty=y+Math.sin(angle)*rr;
          }else if(motion==="planet"){
            rr=Math.max(R*.64,ring.radius-R*.50);
            angle=phase*.62+arc/Math.max(1,rr)-Math.PI/2;
            tx=x+Math.cos(angle)*rr*.80;ty=y+Math.sin(angle)*rr*.42;
          }
          const rotation=["float","wave"].includes(motion)?0:motion==="axis"||motion==="planet"?Math.sin(angle)*.18:angle+Math.PI/2;
          paintLine(item,tx,ty,rotation,["hover","float"].includes(motion));
        });
      });
    }

    // Drawings made on the planetary surface launch above the planet.
    drawLaunchedImages(now,pctx,pw,ph,true);
    drawPlanetIncomingDrawings(now);
    drawPlanetBurningStrokes(now);
    if(planetPointer!==null)refreshLiveRainbow(planetLiveInk);
    for(let i=planetTextFlights.length-1;i>=0;i--){
      const flight=planetTextFlights[i];
      const p=(now-flight.start)/flight.duration;
      if(p>=1){planetTextFlights.splice(i,1);continue;}
      if(p<0 || flight.invisible)continue;
      const width=pw*.37;
      const dx=flight.style==="left"?-width:flight.style==="right"?width:0;
      pctx.save();
      pctx.textAlign="center";
      pctx.globalAlpha=Math.min(1,(1-p)*3)*(flight.transparent?textTransparency:1);
      pctx.font=`${15+(flight.size-15)*p}px ${flight.font}`;
      pctx.shadowBlur=flight.glow;
      const tx=pw/2+dx*p,ty=ph*.90-p*ph*.65;
      pctx.fillStyle=launchedTextPaint(pctx,flight,flight.text,tx,now-flight.start);
      pctx.shadowColor=typeof pctx.fillStyle==="string"?pctx.fillStyle:"#fff";
      pctx.fillText(flight.text,tx,ty);
      pctx.restore();
    }
    requestAnimationFrame(drawPlanetScene);
  }

  function syncPlanetLaunchOptions(){
    for(const [id,kind] of [["planetTextLaunch","text"],["planetLineLaunch","line"]]){

  function launchPlanetText(text,fromEntry=false){
    if(byId("planetTextLaunch").getAttribute("aria-pressed")!=="true")return;
    const shot=captureLaunchedText(text,fromEntry);
    const start=performance.now();
    const count=appliedValue("textRepeat",1);
    for(let i=0;i<count;i++){
      planetTextFlights.push({...shot,text,start:start+i*280,font:shot.font});
    }
  }
  function paintPlanetLine(context,item,now,size,effect,glow,{hover,colour,motionTime=now}){
    const style=planetInkStyle.value;
    const spin=effect==="letterSpin" || effect==="mirrorSpin";
    const shake=effect==="shake";
    const separated=hover || spin || shake || item.letterOffset!==undefined || ["fixed","moving","alternating"].includes(style);
    let gradient;
    if(style==="gradient" && !colour){
      const period=10*size;
      gradient=context.createLinearGradient(-item.w/2,0,Math.max(1,item.w)/2,0);
      const start=(item.letterOffset || 0)*size*.65/period-now/3800;
      const span=item.w/period;
      const stops=Math.max(2,Math.ceil(span*24));
      for(let i=0;i<=stops;i++)gradient.addColorStop(i/stops,cycleRainbowColour(start+span*i/stops));
    }
    const paint=(text,offset,index)=>{
      const shift=motionTime*.009-index*.58;
      const ripple=Math.pow(Math.max(0,Math.sin(shift*.42)),5);
      const x=offset+(shake?Math.sin(shift*3)*ripple*size*.19:0);
      const y=(hover?Math.sin(motionTime*.004+index*.86+item.index)*7:0)+(shake?Math.cos(shift*2)*ripple*size*.16:0);
      const fill=colour || gradient || planetLetterColour(now,index,item.index);
      context.save();
      context.fillStyle=fill;
      if(spin){
        context.translate(x,y);
        context.scale(Math.cos(motionTime*.005-index*.42),1);
      }
      const tx=spin?0:x,ty=spin?0:y;
      if(glow==="rainbow"){
        const halo=cycleRainbowColour(now/4800);
        context.shadowColor=halo;
        context.shadowBlur=Math.max(13,size*1.3);
        context.strokeStyle=halo;
        context.lineWidth=Math.max(1.6,size*.22);
        context.lineJoin="round";
        context.strokeText(text,tx,ty);
      }
      context.fillText(text,tx,ty);
      context.restore();
    };
    if(!separated){paint(item.line,0,0);return;}
    let offset=-item.w/2,index=item.letterOffset || 0;
    for(const letter of item.line){
      const width=context.measureText(letter).width;
      paint(letter,offset+width/2,index++);
      offset+=width;
    }
  }

  function drawPlanetIncomingDrawings(now){
    for(let i=incomingDrawings.length-1;i>=0;i--){
      const d=incomingDrawings[i];
      if(!d.planet)continue;
      d.age=(Number.isFinite(d.age)?d.age:0)+(now-(d._lastPlanetFrame||now));
      d._lastPlanetFrame=now;
      if(d.age<0)continue;
      const settings=d.settings;
      const p=Math.min(1,d.age/settings.duration);
      if(p>=1){incomingDrawings.splice(i,1);continue;}
      if(settings.invisible)continue;
      const pw=window.innerWidth,ph=window.innerHeight;
      const {x,y}=linePosition(d,p,pw,ph,.10);
      const scale=launchLineScale(settings,p);
      const fade=p<.70?1:Math.max(0,1-(p-.70)/.30);
      pctx.save();
      pctx.translate(x,y);if(settings.spinning)pctx.rotate(d.age*.001*settings.spinSpeed*Math.PI/180);pctx.scale(scale,scale);pctx.translate(-d.ox,-d.oy);
      pctx.globalAlpha=fade;pctx.lineCap="round";pctx.lineJoin="round";
      paintDrawingStroke(pctx,d.points,settings,d.age,settings.fuse ? d.age*settings.fuseSpeed/1000 : 0);
      pctx.restore();
    }
  }

      const r=win.getBoundingClientRect();
      const sx=e.clientX-r.left, sy=e.clientY-r.top;

        win.style.top=(ev.clientY-sy)+"px";
        win.style.right="auto"; win.style.bottom="auto";

      const up=()=>{
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
        window.removeEventListener("pointercancel",up);
      };
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up,{once:true});
      window.addEventListener("pointercancel",up,{once:true});
      e.preventDefault();
    };
    header.addEventListener("pointerdown",startDrag);
    win.addEventListener("pointerdown",e=>{

      // Remove transform once a centred window is moved, so its new

      win.style.bottom = "auto";

        }

      }
    });

  }

  function drawFittedMedia(context,media,width,height,fit){
    if(fit==="mirrorFullRight" || fit==="mirrorFullLeft"){
      const half=W/2;
      const right=fit==="mirrorFullRight";
      context.drawImage(media,right?half:0,0,half,H);
      context.save();
      context.translate(right?half:W,0);
      context.scale(-1,1);
      context.drawImage(media,0,0,half,H);
      context.restore();
      return;
    }
    const scale=fit==="contain"?Math.min(W/width,H/height):Math.max(W/width,H/height);
    const stretched=fit==="stretch" || fit==="mirrorLeft" || fit==="mirrorRight";
    const dw=stretched?W:width*scale,dh=stretched?H:height*scale;
    const x=(W-dw)/2,y=(H-dh)/2;
    if(fit.startsWith("mirror")){
      const left=fit==="mirrorLeft" || fit==="mirrorZoomLeft";
      for(const flipped of [false,true]){
        context.save();
        context.beginPath();
        context.rect(left!==flipped?0:W/2,0,W/2,H);
        context.clip();
        if(flipped){context.translate(W,0);context.scale(-1,1);}
        context.drawImage(media,x,y,dw,dh);
        context.restore();
      }
    }else context.drawImage(media,x,y,dw,dh);
  }
  function drawContainedTiles(context,image,width,height){
    const scale=Math.min(W/width,H/height);
    const w=width*scale,h=height*scale;
    const left=(W-w)/2,top=(H-h)/2;
    const cols=Math.ceil(left/Math.max(1,w)),rows=Math.ceil(top/Math.max(1,h));
    for(let y=-rows;y<=rows;y++){
      for(let x=-cols;x<=cols;x++)context.drawImage(image,left+x*w,top+y*h,w,h);
    }
  }

  function launchAnImage(now=performance.now()){
    const queue=backgroundMedia.images;

    const duration=number("imageLaunchDuration")*1000/number("imageLaunchSpeed");

    const startFlight=()=>{

  function drawLaunchedImages(now,context=ctx,widthAvailable=W,heightAvailable=H,onPlanet=false){
    if(planetOpen===onPlanet && byId("imageLaunchSlides").checked && now>=nextImageLaunch)launchAnImage(now);
    for(let i=0;i<launchedImageQueue.length;i++){
      const flight=launchedImageQueue[i];
      const p=Math.max(0,(now-flight.started)/flight.duration);
      if(p>=1){launchedImageQueue.splice(i--,1);continue;}
      if(flight.planet!==onPlanet)continue;
      const aspect=flight.image.naturalWidth/flight.image.naturalHeight;
      const start=flight.far?flight.endSize:flight.startSize;
      const end=flight.far?flight.startSize:flight.endSize;
      const expansion=flight.effect==="still"?start:start+(end-start)*(p*p*(3-2*p));
      const height=Math.min(heightAvailable,widthAvailable/aspect)*expansion;
      const width=height*aspect;
      const origin=flight.position || {x:.5,y:.5};
      let x=origin.x*widthAvailable,y=origin.y*heightAvailable;
      if(flight.effect==="rise")y-=heightAvailable*.36*p;
      if(flight.effect==="eight"){
        x+=widthAvailable*.13*Math.sin(p*2*Math.PI);
        y+=heightAvailable*.075*Math.sin(p*4*Math.PI);
      }
      if(flight.effect==="shake"){
        const frame=Math.floor((now-flight.started)/32);
        x+=widthAvailable*.009*Math.sin(frame*57.21);
        y+=heightAvailable*.008*Math.sin(frame*31.43);
      }
      context.save();
      context.translate(x,y);
      if(["spin","reverse"].includes(flight.effect))context.rotate(p*Math.PI*2*(flight.effect==="spin"?1:-1));
      context.globalAlpha=flight.effect==="still"?Math.min(1,p*6,(1-p)*4):1-Math.max(0,p-.58)/.42;
      context.drawImage(flight.image,-width/2,-height/2,width,height);
      context.restore();
    }
  }

  function redrawPlanetInk(){

    planetGlowContext.clearRect(0,0,innerWidth,innerHeight);
  }
  planetCanvas.style.pointerEvents="auto";
  planetCanvas.style.touchAction="none";
  planetCanvas.addEventListener("pointerdown",event=>{
    if(event.button!==0)return;
    if(takeImagePosition(event))return;
    if(screenType){startScreenBlock(event);return;}
    planetPointer=event.pointerId;
    planetLivePoints=[pointerPos(event)];
    redrawPlanetInk();
    const angle=Math.random()*180;
    strokeAngles.set(planetLivePoints,angle);
    planetStrokeSettings=captureEffect("drawn");
    assignSequenceColour(planetStrokeSettings,"drawn");
    const visible=byId("planetDrawOnScreen").getAttribute("aria-pressed")==="true";
    const preview={...planetStrokeSettings,invisible:planetStrokeSettings.invisible || !visible};
    planetLiveInk=beginLiveInk(planetInkContext,planetLivePoints[0],preview,angle,planetGlowContext);
    planetCanvas.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  planetCanvas.addEventListener("pointermove",event=>{
    if(event.pointerId!==planetPointer)return;
    const point=pointerPos(event),last=planetLivePoints.at(-1);
    extendLiveInk(planetLiveInk,point);
    if(last && Math.hypot(point.x-last.x,point.y-last.y)>=2){
      planetLivePoints.push(point);
      if(planetLivePoints.length>MAX_LIVE_DRAW_POINTS)planetLivePoints.shift();
    }
  });
  for(const event of ["pointerup","pointercancel","lostpointercapture"])planetCanvas.addEventListener(event,e=>{
    if(e.pointerId!==planetPointer)return;
    if(event==="pointerup"){
      const tip=planetLiveInk.point,last=planetLivePoints.at(-1);
      if(tip!==last)planetLivePoints.push(tip);
      if(planetLivePoints.length===1)planetLivePoints.push({x:last.x+.5,y:last.y+.5});
      if(planetStrokeSettings.mode==="stage35" && planetLiveInk.path.length>1){
        const angle=strokeAngles.get(planetLivePoints);
        planetLivePoints=planetLiveInk.path.slice();
        strokeAngles.set(planetLivePoints,angle);
      }
      drawnStrokeStyles.set(planetLivePoints,planetStrokeSettings);
      rememberDrawing(planetLivePoints,true);
      const settings=planetLiveInk.settings;
      if(!settings.invisible && (settings.fuse || deformsReleasedInk(settings.lineEffect))){
        burningStrokes.push({shape:planetLivePoints,age:0,settings:releaseInkSettings(planetLiveInk,settings),elapsed:performance.now()-planetLiveInk.started,planet:true,halo:planetLiveInk.haloSamples});
      }
    }
    planetPointer=null;planetLivePoints=[];redrawPlanetInk();
  });
  window.addEventListener("resize",resizePlanetInk);

  window.__starfieldControls={
    launchDraw(){
      if(!screenType && lastDrawing)rememberDrawing(lastDrawing,planetOpen,true);
      restoreEntryFocus(true);
    },
    isScreenTyping:()=>screenType,
    launchImage(){
      launchAnImage();
      restoreEntryFocus(true);
    },
    navigateBackground(direction){
      if(!planetOpen){navigateBackground(direction);if(screenType)restoreEntryFocus();return;}
      const styles=[...planetMotion.options];
      const at=styles.findIndex(option=>option.value===planetMotion.value);
      planetMotion.value=styles[mod(at+direction,styles.length)].value;
      planetMotion.dispatchEvent(new Event("change"));
      restoreEntryFocus();
    },
    launchText(){
      if(screenType)return;
      const input=planetOpen?planetEntry:entry;
      if(input.value.trim()){
        input.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}));
      }else if(submittedLines.length){
        if(planetOpen){
          launchPlanetText(submittedLines.at(-1));
        }else addText(submittedLines.at(-1),false);
      }
      input.focus({preventScroll:true});
    },
    clear(){
      const previous=screenType && activeScreenBlock?.planet===planetOpen ? activeScreenBlock : null;
      clearScreenWriting();
      launchedImageQueue.length=0;
      imageLaunchGeneration++;
      nextImageLaunch=performance.now()+number("imageLaunchInterval")*1000;
      planetTextFlights.length=0;
      planetLivePoints=[];
      planetPointer=null;
      redrawPlanetInk();
      movingTexts.length=0;
      incomingDrawings.length=0;
      burningStrokes.length=0;
      points=[];
      drawing=false;
      window.__drawingPointerId=null;
      dctx.clearRect(0,0,W,H);
      liveGlowContext.clearRect(0,0,W,H);
        burningCtx.clearRect(0,0,W,H);
      launchedCtx.clearRect(0,0,W,H);
      if(previous)createScreenBlock(previous.x,previous.y);
      else restoreEntryFocus(true);
    },
    drawPlanet(shape){rememberDrawing(shape,true);}
  };
  installWritingControls();
  installImageLaunch();
  installEffectMenus();
  installWindowStack();
  installWindowRecovery();
  requestAnimationFrame(animate);
})();
</script>

<script id="v49Patch">
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const all=id=>Array.from(document.querySelectorAll('#'+CSS.escape(id)));

/* ----- Numeric steppers: same IDs, therefore V30 renderer stays compatible. ----- */
const configs={
 drawLineWidth:[1,14,2,4],
 drawDuration:[1200,6200,100,3000],typedTextSizeRange:[8,32,2,18],
 launchedTextSizeRange:[10,60,2,30],textGlowRange:[0,30,1,0],
 planetSpeed:[2,35,1,27],planetTextSize:[8,30,2,17]
};
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function setNum(id,n){
 const e=$(id); if(!e)return;
 const [a,b]=configs[id];
 n=clamp(n,a,b);
 e.value=n;
 e.dispatchEvent(new Event('input',{bubbles:true}));
 e.dispatchEvent(new Event('change',{bubbles:true}));
}
function step(id,dir){
 const e=$(id); if(!e)return;
 const [a,b,stepv]=configs[id];
 setNum(id,Number(e.value||a)+dir*stepv);
}
document.querySelectorAll('[data-range-step]').forEach(button => {
 const id=button.dataset.rangeStep;
 if(!configs[id])return;
 const direction=Number(button.dataset.rangeDelta||1);
 let timer=null;
 let repeated=false;
 const stop=()=>{clearTimeout(timer);timer=null;};

 button.addEventListener('click', event=>{
   if(event.detail===0 || !repeated)step(id,direction);
 });
 button.addEventListener('pointerdown', event=>{
   if(event.button!==0 || !event.isPrimary)return;
   stop();
   repeated=false;
   const start=performance.now();
   const repeat=()=>{
     repeated=true;
     const age=performance.now()-start;
     const repeats=age>1800?5:age>900?3:1;
     for(let i=0;i<repeats;i++)step(id,direction);
     timer=setTimeout(repeat,120);
   };
   timer=setTimeout(repeat,350);
 });
 button.addEventListener('pointerup',stop);
 button.addEventListener('pointercancel',stop);
 button.addEventListener('pointerleave',stop);
});

/* ----- Bottom-right launch controls on both fields. ----- */
function buttonBar(id,parent){
 let bar=$(id);
 if(!bar){bar=document.createElement('div');bar.id=id;parent.appendChild(bar);}
 bar.innerHTML='';
 const b1=document.createElement('button'),b2=document.createElement('button'),b3=document.createElement('button');
 b1.textContent='Zamboni';b2.textContent='Text';b3.textContent='Line';
 b2.dataset.screenLaunch='text';b3.dataset.screenLaunch='line';
 const image=document.createElement('button'),prev=document.createElement('button'),next=document.createElement('button');
 image.dataset.imageLaunch='';image.textContent='Image';prev.textContent='◀';next.textContent='▶';
 prev.className=next.className='triangle';
 prev.setAttribute('aria-label','Previous background');next.setAttribute('aria-label','Next background');
 image.onclick=()=>window.__starfieldControls.launchImage();
 prev.onclick=()=>window.__starfieldControls.navigateBackground(-1);
 next.onclick=()=>window.__starfieldControls.navigateBackground(1);
 bar.append(b1,b2,b3,image,prev,next);
 b1.addEventListener("mousedown",event=>event.preventDefault());
 b1.onclick=()=>window.__starfieldControls.clear();
 b2.onclick=()=>window.__starfieldControls.launchText();
 b3.onclick=()=>window.__starfieldControls.launchDraw();
 return bar;
}
buttonBar('v49LaunchBar',document.body);
const pv=$('planetView');
if(pv)buttonBar('planetLaunchBarV49',pv);

/* Ensure menus are not covered by the new bars. */
window.addEventListener('resize',()=>{if($('v49LaunchBar'))$('v49LaunchBar').style.display='flex';});
})();
</script>
