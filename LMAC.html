<style> body { text-align: center; font-family: sans-serif; color: white; overflow-x: hidden; margin: 0; padding: 0; } /* ========================= SPINNING BACKGROUND ========================= */ body::before { content: ""; position: fixed; top: 50%; left: 50%; width: 300vmax; height: 300vmax; background: repeating-conic-gradient( from 0deg, #000 0deg 10deg, #fff 10deg 20deg ); transform: translate(-50%, -50%) rotate(0deg); z-index: -1; animation: spinSpiral 5s linear infinite; } @keyframes spinSpiral { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } } /* ========================= TITLE ========================= */ h1 { color: white; font-size: 42px; text-shadow: 2px 2px 4px black, 0 0 15px black; margin: 30px 0 20px 0; } /* ========================= GALLERY ========================= */ .excerpt-figure { display: inline-block; margin: 15px; text-align: center; position: relative; } .excerpt-figure img { height: 300px; width: auto; display: block; margin: 0 auto; border: 15px solid black; border-radius: 3px; box-shadow: 0 0 20px black, 0 0 40px black, 0 0 60px rgba(0,0,0,0.8), 0 20px 30px rgba(0,0,0,0.9); animation: smokyPulse 4s ease-in-out infinite, floatingShadow 6s ease-in-out infinite; transition: box-shadow 0.25s ease; cursor: pointer; } /* ========================= SMOKY PULSE ========================= */ @keyframes smokyPulse { 0% { box-shadow: 0 0 20px black, 0 0 40px black, 0 0 60px rgba(0,0,0,0.8), 0 20px 30px rgba(0,0,0,0.9); } 50% { box-shadow: 0 0 30px black, 0 0 60px black, 0 0 80px rgba(0,0,0,0.9), 0 25px 35px rgba(0,0,0,1); } 100% { box-shadow: 0 0 20px black, 0 0 40px black, 0 0 60px rgba(0,0,0,0.8), 0 20px 30px rgba(0,0,0,0.9); } } /* ========================= FLOATING ========================= */ @keyframes floatingShadow { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } } /* ========================= HOVER GLOW ========================= */ .excerpt-figure:hover img { box-shadow: 0 0 10px white, 0 0 25px white, 0 0 50px white, 0 0 90px rgba(255,255,255,0.8), 0 20px 35px rgba(0,0,0,0.9); } /* ========================= TITLES ========================= */ .excerpt-figure figcaption { text-align: center; width: 100%; padding-top: 7px; font-size: 14px; font-weight: bold; color: black; text-shadow: none; transition: color 0.15s ease, text-shadow 0.15s ease; } .excerpt-figure:hover figcaption { color: white; text-shadow: 0 0 5px white, 0 0 10px white, 0 0 20px white; } figure { margin: 20px; } /* ============================================================ FLOATING ARTWORK ============================================================ */ #floatingArtwork { display: none; position: fixed; z-index: 1000; top: 50%; left: 50%; width: auto; height: auto; max-width: none; max-height: none; border: 15px solid black; box-shadow: 0 0 20px black, 0 0 40px black, 0 0 70px rgba(0,0,0,0.9), 0 25px 50px rgba(0,0,0,0.9); cursor: grab; user-select: none; -webkit-user-drag: none; transform-origin: center center; } #floatingArtwork.dragging { cursor: grabbing; } /* ========================= CLOSE ========================= */ #closeWindow { display: none; position: fixed; z-index: 1001; top: 20px; right: 25px; color: white; font-size: 38px; font-weight: bold; text-shadow: 0 0 5px black, 0 0 15px black; cursor: pointer; } /* ========================= INSTRUCTIONS ========================= */ #zoomInfo { display: none; position: fixed; z-index: 1001; bottom: 15px; left: 50%; transform: translateX(-50%); color: white; font-size: 13px; text-shadow: 0 0 5px black, 0 0 10px black; pointer-events: none; } </style>

</head>

<script> /* ============================================================ ELEMENTS ============================================================ */ const floatingArtwork = document.getElementById("floatingArtwork"); const closeWindow = document.getElementById("closeWindow"); const zoomInfo = document.getElementById("zoomInfo"); /* ============================================================ STATE ============================================================ */ let zoomLevel = 0.01; let positionX = 0; let positionY = 0; let dragging = false; let startMouseX = 0; let startMouseY = 0; let startPositionX = 0; let startPositionY = 0; /* ============================================================ CALCULATE THE CORRECT "FULL VIEW" SIZE ============================================================ */ function calculateFullViewZoom() { /* * The image's natural dimensions are used. * * We leave a little room around it so that * the painting does NOT fill the entire screen. */ const naturalWidth = floatingArtwork.naturalWidth; const naturalHeight = floatingArtwork.naturalHeight; /* * Available screen space. * * 85% of viewport width * 85% of viewport height */ const availableWidth = window.innerWidth * 0.85; const availableHeight = window.innerHeight * 0.85; /* * Determine which dimension is the * limiting factor. */ const widthRatio = availableWidth / naturalWidth; const heightRatio = availableHeight / naturalHeight; /* * Use the smaller ratio so the * entire painting remains visible. */ return Math.min( widthRatio, heightRatio ); } /* ============================================================ UPDATE ARTWORK ============================================================ */ function updateArtwork() { floatingArtwork.style.transform = "translate(-50%, -50%) " + "translate(" + positionX + "px, " + positionY + "px) " + "scale(" + zoomLevel + ")"; } /* ============================================================ OPEN PAINTING ============================================================ */ document.querySelectorAll(".excerpt-figure img") .forEach(function(image) { image.addEventListener( "click", function(event) { event.stopPropagation(); floatingArtwork.src = image.src; floatingArtwork.alt = image.alt; /* * Reset position. */ positionX = 0; positionY = 0; /* * Start as a tiny pinprick. */ zoomLevel = 0.01; floatingArtwork.style.transition = "none"; floatingArtwork.style.display = "block"; closeWindow.style.display = "block"; zoomInfo.style.display = "block"; updateArtwork(); /* * Wait until the full-resolution * image has loaded. */ if (floatingArtwork.complete) { animateOpen(); } else { floatingArtwork.onload = animateOpen; } } ); }); /* ============================================================ ANIMATE TO FULL VIEW ============================================================ */ function animateOpen() { /* * Calculate the correct size for THIS * particular painting. */ const fullViewZoom = calculateFullViewZoom(); requestAnimationFrame(function() { requestAnimationFrame(function() { zoomLevel = fullViewZoom; floatingArtwork.style.transition = "transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)"; updateArtwork(); }); }); } /* ============================================================ MANUAL ZOOM ============================================================ */ floatingArtwork.addEventListener( "wheel", function(event) { event.preventDefault(); floatingArtwork.style.transition = "transform 0.08s ease"; if (event.deltaY < 0) { zoomLevel *= 1.18; } else { zoomLevel /= 1.18; } /* * Never smaller than a pinprick. */ if (zoomLevel < 0.01) { zoomLevel = 0.01; } /* * Allow substantial magnification * for detailed examination. */ if (zoomLevel > 10) { zoomLevel = 10; } updateArtwork(); } ); /* ============================================================ DRAGGING ============================================================ */ floatingArtwork.addEventListener( "mousedown", function(event) { event.preventDefault(); dragging = true; floatingArtwork.classList.add( "dragging" ); floatingArtwork.style.transition = "none"; startMouseX = event.clientX; startMouseY = event.clientY; startPositionX = positionX; startPositionY = positionY; } ); document.addEventListener( "mousemove", function(event) { if (!dragging) { return; } positionX = startPositionX + (event.clientX - startMouseX); positionY = startPositionY + (event.clientY - startMouseY); updateArtwork(); } ); document.addEventListener( "mouseup", function() { dragging = false; floatingArtwork.classList.remove( "dragging" ); } ); /* ============================================================ RECENTRE WHEN WINDOW SIZE CHANGES ============================================================ */ window.addEventListener( "resize", function() { /* * If the painting has not been deliberately * dragged, keep it centred and recalculate * its appropriate full-view size. */ if (!dragging) { positionX = 0; positionY = 0; updateArtwork(); } } ); /* ============================================================ CLOSE ============================================================ */ function closeArtwork() { floatingArtwork.style.display = "none"; closeWindow.style.display = "none"; zoomInfo.style.display = "none"; dragging = false; positionX = 0; positionY = 0; } closeWindow.addEventListener( "click", function(event) { event.stopPropagation(); closeArtwork(); } ); /* ============================================================ ESCAPE ============================================================ */ document.addEventListener( "keydown", function(event) { if (event.key === "Escape") { closeArtwork(); } } ); </script>

</body> </html>
