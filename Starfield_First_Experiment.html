<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield — First Experiment 30</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: visible;
    background: #000;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  #space {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    cursor: crosshair;
  }

  /* Menus */
  .window {
    position: fixed;
    min-width: 250px;
    min-height: 135px;
    background: rgba(8, 13, 20, 0.38);
    border: 1px solid rgba(210,225,240,.55);
    border-radius: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 12px rgba(180,210,240,.08);
    backdrop-filter: blur(5px);
    z-index: 20;
    display: none;
    overflow: visible;
  }

  .titlebar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 12px;
    background: linear-gradient(rgba(80,100,120,.28), rgba(30,40,50,.18));
    border-bottom: 1px solid rgba(210,225,240,.22);
    cursor: grab;
    font-size: 16px;
    letter-spacing: .2px;
  }

  .titlebar:active { cursor: grabbing; }

  .close {
    width: 26px;
    height: 26px;
    border: 0;
    background: transparent;
    color: #eee;
    font-size: 22px;
    line-height: 22px;
    cursor: pointer;
    border-radius: 4px;
  }
  .close:hover { background: rgba(255,255,255,.12); }

  .window-body {
    padding: 14px;
    color: rgba(235,240,245,.78);
    font-size: 14px;
  }

  #drawWindow { left: 18px; top: 18px; width: 330px; height: 160px; }
  #textWindow { left: 50%; top: 18px; transform: translateX(-50%); width: 500px; height: auto; min-height: 245px; }
  #colourWindow { right: 18px; top: 18px; width: 310px; height: 160px; }
  #backgroundWindow { left: 18px; top: 205px; width: 300px; height: 155px; }
  #telephoneWindow {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(720px, 72vw);
    height: min(480px, 58vh);
    min-width: 420px;
    min-height: 280px;
  }

  #telephoneText {
    width: 100%;
    height: calc(100% - 48px);
    resize: none;
    border: 1px solid rgba(210,225,240,.18);
    outline: none;
    background: rgba(0,0,0,.22);
    color: rgba(245,248,250,.9);
    font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    padding: 12px;
    user-select: text;
  }
  /* Main menu: only the word when closed; opened items live in their own box. */
  #mainMenu{
    position:fixed;left:0;bottom:0;z-index:100;
    width:auto;min-width:0;padding:0;margin:0;
    background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;
  }
  #mainMenuHead{
    display:inline-flex;align-items:center;
    height:18px;padding:0 4px;
    cursor:pointer;border:1px solid rgba(235,240,245,.20);
    background:transparent;color:rgba(245,248,252,.68);
    font:9px "Segoe UI",Arial,sans-serif;
  }
  #mainMenuHead .arrow{display:none;}
  #mainMenu.closed #mainItems{display:none;}
  #mainMenu.open #mainItems{display:block;}
  #mainItems{
    position:absolute;left:0;bottom:18px;width:118px;
    padding:0;background:transparent;border:0;
    border-radius:0;box-sizing:border-box;overflow:visible;
  }
  .mainButton{
    display:block;width:100%;height:23px;margin:2px 0;padding:0 6px;
    text-align:left;white-space:nowrap;color:rgba(240,244,248,.78);
    background:rgba(20,28,36,.16);border:1px solid rgba(210,225,240,.17);
    border-radius:0;cursor:pointer;font:10px "Segoe UI",Arial,sans-serif;
  }
  .mainButton:hover{background:rgba(75,92,110,.28);}
  .mainButton.active,.mainButton.selected{background:transparent!important;border-color:rgba(210,225,240,.17)!important;}

  .mainButton:hover { background: rgba(110,125,140,.16); }
.mainButton:hover { background: rgba(75,92,110,.65); }
/* Bottom text input */
  #textGrab {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(820px, 78vw);
    height: 46px;
    z-index: 90;
    cursor: grab;
    touch-action: none;
  }
  #textGrab:active { cursor: grabbing; }

  #textEntry {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 34px;
    border: 0;
    outline: none;
    background: transparent;
    color: rgba(225,230,235,.76);
    text-align: center;
    padding: 0 2px;
    font: 17px/34px "Segoe UI", Arial, sans-serif;
    caret-color: rgba(245,248,252,.58);
    user-select: text;
  }

  #textEntry::placeholder { color: transparent; }

  /* Small destination planet at the lower-left edge */
  #planetOrb{
    position:fixed;
    left:118px;
    bottom:20px;
    width:70px;
    height:64px;
    z-index:40;
    cursor:grab;
    touch-action:none;
    transform-origin:50% 72%;
    animation:planetHover 4.8s ease-in-out infinite;
    pointer-events:auto;
  }
  #planetOrb:active{cursor:grabbing;}
  #planetOrb.dragging{animation:none !important;}
  @keyframes planetHover{
    0%,100%{transform:translate(0,0) scale(1);}
    25%{transform:translate(1px,-2px) scale(.98);}
    50%{transform:translate(-1px,0) scale(.99);}
    75%{transform:translate(1px,-2px) scale(.975);}
  }
  #planetSphere{
    position:absolute;left:8px;top:0;width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#eeeeee 0 10%,#cfcfcf 28%,#a7a7a7 50%,#777 72%,#555 88%,#444 100%);
    box-shadow:inset -9px -5px 11px rgba(0,0,0,.48), inset 5px 4px 8px rgba(255,255,255,.20);
    pointer-events:none;
  }
  #planetLabel{
    position:absolute;
    left:-8px;
    top:50px;
    width:86px;
    height:12px;
    text-align:center;
    white-space:nowrap;
    color:rgba(235,240,245,.62);
    font:7px "Segoe UI",Arial,sans-serif;
    line-height:10px;
    pointer-events:none;
  }
  #planetView{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    background:#020307;
  }
  #planetCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  #returnStarfield{
    position:fixed;
    top:0;
    right:0;
    z-index:510;
    width:auto;
    height:24px;
    padding:0 6px;
    border:0;
    border-radius:0;
    background:rgba(0,0,0,.18);
    color:rgba(240,244,248,.72);
    font:9px "Segoe UI",Arial,sans-serif;
    cursor:pointer;
  }

  /* Drawing layer */
  #launchedDrawCanvas,#drawingCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  #launchedDrawCanvas{z-index:7;}
  #drawingCanvas{z-index:8;}


  .small-note {
    opacity: .65;
    line-height: 1.45;
  }

  .drawDurationBlock{
    margin:2px 0;
    color:rgba(235,240,245,.68);
    font:9px "Segoe UI",Arial,sans-serif;
  }
  .drawDurationTitle{margin-bottom:4px;color:rgba(245,248,252,.72);}
  #drawDuration{display:block;width:100%;height:14px;margin:0;cursor:pointer;}
  .drawDurationLabels{display:flex;justify-content:space-between;font-size:8px;color:rgba(235,240,245,.46);}

  .moveCursorOption{
    display:block;
    margin:0 0 8px;
    color:rgba(235,240,245,.70);
    font:10px "Segoe UI",Arial,sans-serif;
    cursor:pointer;
  }
  .moveCursorOption input{vertical-align:middle;margin-right:5px;}

  .telephoneBody{
    height:calc(100% - 34px);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #telephoneText{
    flex:1;
    width:100%;
    min-height:0;
    resize:none;
    border:1px solid rgba(210,225,240,.18);
    outline:none;
    background:rgba(0,0,0,.22);
    color:rgba(245,248,250,.9);
    font:16px/1.5 "Segoe UI",Arial,sans-serif;
    padding:12px;
    user-select:text;
  }
  .telephoneToolbar{
    height:27px;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .telephoneToolbar button{height:24px;min-width:30px;padding:0 5px;border:1px solid rgba(210,225,240,.16);border-radius:0;background:rgba(0,0,0,.16);color:rgba(225,230,235,.72);cursor:pointer;font:12px "Segoe UI",Arial,sans-serif;}
  .telephoneToolbar button:hover{background:rgba(150,165,180,.14);}
  .toolbarDivider{width:1px;height:17px;background:rgba(220,230,240,.18);margin:0 3px;}
  #returnToPlanet{margin-left:auto;font-size:9px;}

  #rotaryPhone{
    position:fixed;left:7px;bottom:5px;width:30px;height:30px;z-index:95;
    border:0;border-radius:0;background:transparent;color:rgba(8,8,8,.86);
    font-family:"Times New Roman",serif;font-size:25px;line-height:30px;
    cursor:pointer;text-shadow:0 1px 2px rgba(255,255,255,.16);
  }
  #rotaryPhone:hover{color:rgba(35,35,35,.96);}

  #planetEntry{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:min(360px,42vw);height:24px;z-index:505;
    display:none;border:0;outline:none;background:transparent;
    color:rgba(245,248,252,.82);font:14px "Segoe UI",Arial,sans-serif;
    text-align:center;caret-color:rgba(245,248,252,.55);
  }

  #planetPhone{
    position:fixed;left:7px;bottom:6px;width:30px;height:30px;z-index:515;
    border:0;border-radius:0;background:transparent;color:rgba(12,12,12,.90);
    font-family:"Times New Roman",serif;font-size:25px;line-height:30px;
    cursor:pointer;text-shadow:0 1px 2px rgba(255,255,255,.18);
  }
  #planetPhone:hover{color:rgba(40,40,40,.98);}
#menuBtn{
    position:fixed;left:7px;bottom:7px;z-index:900;
    width:auto;height:24px;padding:0 7px;
    border:1px solid rgba(235,240,245,.22);
    background:transparent;color:rgba(245,248,252,.72);
    font:9px "Segoe UI",Arial,sans-serif;
    cursor:pointer;box-sizing:border-box;
  }

  .rangeStepper{display:flex;align-items:center;gap:2px;width:100%;}
  .rangeStepper input[type=range]{flex:1;min-width:0;accent-color:#555;filter:grayscale(1);height:14px;}
  .rangeStepper button{width:16px;height:18px;padding:0;border:0;background:transparent;color:rgba(145,150,155,.90);font-size:9px;line-height:16px;cursor:pointer;}

  #planetPhone{
    color:rgba(42,42,42,.98)!important;
    text-shadow:0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(255,255,255,.25);
  }
  #planetPhoneMenu{
    display:none;position:fixed;left:5px;bottom:47px;width:178px;z-index:700;
    box-sizing:border-box;padding:6px;
    background:rgba(0,0,0,.34);border:1px solid rgba(220,230,240,.28);
    backdrop-filter:blur(4px);
  }
  #planetPhoneMenu.show{display:block;}
  .phoneMenuTitle{
    font:9px "Segoe UI",Arial,sans-serif;color:rgba(240,245,250,.56);
    border-bottom:1px solid rgba(220,230,240,.18);padding:2px 3px 4px;margin-bottom:4px;
  }
  #planetPhoneMenu button{
    display:block;width:100%;box-sizing:border-box;margin:2px 0;padding:5px 6px;
    border:1px solid rgba(220,230,240,.16);background:rgba(0,0,0,.18);
    color:rgba(240,245,250,.78);font:9px "Segoe UI",Arial,sans-serif;text-align:left;
  }
  .phoneMargins{display:flex;gap:2px;margin-top:4px;border-top:1px solid rgba(220,230,240,.14);padding-top:4px;}
  .phoneMargins button{flex:1!important;text-align:center!important;margin:0!important;}

  .textSizeControl{display:block;margin-top:7px;color:rgba(235,240,245,.68);font:9px "Segoe UI",Arial,sans-serif;}

  .mainMenuPanel{box-sizing:border-box;overflow:visible;min-width:178px;padding-bottom:4px;}
.menuButtons{overflow:visible;}

  .window{overflow:visible;box-sizing:border-box;}
  .window .windowHeader,.window .titlebar,.window .panelHeader{cursor:grab;user-select:none;}
  .window.activeWindow{z-index:10000!important;}

  #telephoneWindow.starfieldTelephone{background:rgba(0,0,0,.12)!important;}
  #telephoneWindow.starfieldTelephone .windowBody{background:transparent!important;}

  .window,.window *{border-radius:0!important;}
  .window{overflow:visible!important;}
  .window-body{overflow:visible!important;}

  input[type=range]::-webkit-slider-thumb{
    appearance:none;width:3px;height:14px;border-radius:0;background:#555;border:0;
  }
  input[type=range]::-moz-range-thumb{
    width:3px;height:14px;border-radius:0;background:#555;border:0;
  }
  .drawControl label{display:block;margin:5px 0;font:9px "Segoe UI",Arial,sans-serif;color:rgba(235,240,245,.70);}

  .phoneOption{display:block;margin-top:5px;color:rgba(235,240,245,.70);font:8px "Segoe UI",Arial,sans-serif;}
  .phoneOption select{display:block;width:100%;height:20px;margin-top:2px;border:1px solid rgba(210,225,240,.16);border-radius:0;background:rgba(0,0,0,.20);color:rgba(240,244,248,.78);font:8px "Segoe UI",Arial,sans-serif;}
  #planetPhoneMenu{width:190px;max-height:calc(100vh - 55px);min-height:230px;overflow:visible;}

  input[type=range]{accent-color:#555;filter:grayscale(1);}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#444;border:0;}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:3px;height:14px;margin-top:-5px;border-radius:0;background:#555;border:0;}
  input[type=range]::-moz-range-track{height:4px;background:#444;border:0;}
  input[type=range]::-moz-range-thumb{width:3px;height:14px;border-radius:0;background:#555;border:0;}
  .rangeStepper{display:flex;align-items:center;gap:2px;width:100%;}
  .rangeStepper input[type=range]{flex:1;min-width:0;}
  .rangeStepper button{width:15px;height:17px;padding:0;border:0;background:transparent;color:#888;font-size:9px;line-height:16px;cursor:pointer;}

  .marginButton{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .marginButton span,.marginButton span::before,.marginButton span::after{
    display:block;height:2px;background:#777;content:"";position:absolute;
  }
  .marginButton span{width:17px;top:6px;}
  .marginButton span::before{width:13px;left:0;top:4px;}
  .marginButton span::after{width:9px;left:0;top:8px;}
  .alignCenter span::before{left:2px;width:13px;}
  .alignCenter span::after{left:4px;width:9px;}
  .alignRight span::before{left:4px;width:13px;}
  .alignRight span::after{left:8px;width:9px;}
  .alignJustify span,.alignJustify span::before,.alignJustify span::after{left:0;width:17px;}

</style>

  #planetEntry{z-index:519!important;}
  #planetPhoneMenu{z-index:530!important;}
  #telephoneWindow{z-index:540!important;}
  .phoneOption{font-size:8px!important;}
  .phoneMenuTitle{font-size:8px!important;}
  .phoneOption select{font-size:8px!important;}
  .telephoneToolbar button{font-size:9px!important;}
  #poemArchive{min-width:105px!important;max-width:150px!important;}
</style>

#textWindow .window-body,
#telephoneWindow .window-body,

  box-sizing:border-box;
  overflow:visible;

  flex-wrap:wrap!important;
  gap:6px!important;
  min-height:24px!important;

<script>
(() => {
  "use strict";

  /* ---------------- STARFIELD ---------------- */

  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, cx = 0, cy = 0, dpr = 1;

  const stars = [];
  const STAR_COUNT = 520;
  const DEPTH = 1100;
  const SPEED = 0.72;          // deliberately medium-slow
  const FOCAL = 520;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cx = W * 0.5;
    cy = H * 0.5;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function newStar(initial = false) {
    // Keep stars distributed around the viewer rather than creating
    // a rotating or pulsing pattern.
    return {
      x: (Math.random() * 2 - 1) * W,
      y: (Math.random() * 2 - 1) * H,
      z: initial ? Math.random() * DEPTH + 5 : DEPTH,
      r: Math.random() < .78 ? (Math.random() * 1.25 + .35) : (Math.random() * 2.0 + .8),
      a: Math.random() * .45 + .50
    };
  }

  function resetStar(s) {
    s.x = (Math.random() * 2 - 1) * W;
    s.y = (Math.random() * 2 - 1) * H;
    s.z = DEPTH;
    s.r = Math.random() < .78 ? (Math.random() * 1.25 + .35) : (Math.random() * 2.0 + .8);
    s.a = Math.random() * .45 + .50;
  }

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) stars.push(newStar(true));
  }

  function drawStar(s, oldZ) {
    const sx = cx + (s.x / s.z) * FOCAL;
    const sy = cy + (s.y / s.z) * FOCAL;

    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) {
      resetStar(s);
      return;
    }

    const radius = Math.max(.28, (1 - s.z / DEPTH) * 2.2 + s.r * .20);

    // A very short, depth-based trail. This keeps the stars round,
    // while giving the impression of forward travel.
    const prevX = cx + (s.x / oldZ) * FOCAL;
    const prevY = cy + (s.y / oldZ) * FOCAL;
    const trail = Math.hypot(sx-prevX, sy-prevY);

    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(235,242,250,${Math.min(1, s.a)})`;
    ctx.fill();

    if (trail > .7 && radius > .65) {
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = `rgba(220,232,245,${Math.min(.24, trail/20)})`;
      ctx.lineWidth = Math.min(1.15, radius * .42);
      ctx.stroke();
    }
  }

  let last = performance.now();

  function animate(now) {
    const dt = Math.min(32, now - last);
    last = now;

    ctx.clearRect(0, 0, W, H);
    dctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      const oldZ = s.z;
      // Smooth constant movement. No sinusoidal pulse, no global reset.
      s.z -= SPEED * dt * .06;

      if (s.z < 3) {
        resetStar(s);
        continue;
      }
      drawStar(s, oldZ);
    }

    drawTexts(dt);
    drawIncomingDrawings(dt);
    if (drawing) drawLiveLine();

    requestAnimationFrame(animate);
  }

  resize();
  initStars();
  window.addEventListener("resize", () => {
    resize();
    for (const s of stars) {
      s.x = Math.max(-W, Math.min(W, s.x));
      s.y = Math.max(-H, Math.min(H, s.y));
    }
  });
  requestAnimationFrame(animate);

  /* ---------------- TEXT TRAVELLING INTO SPACE ---------------- */

  const entry = document.getElementById("textEntry");
  const telephone = document.getElementById("telephoneText");
  const movingTexts = [];
  const submittedLines = [];

  function getTextAnchorCenter() {
    const r = document.getElementById("textGrab").getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + 17 };
  }

  function addText(text) {
    if (!text.trim()) return;

    const a = getTextAnchorCenter();

    movingTexts.push({
      text: text,
      x: a.x,
      startY: a.y,
      age: 0,
      opacity: .94,
      size: 17
    });

    submittedLines.push(text);
    telephone.value += (telephone.value ? "\n" : "") + text;
    telephone.scrollTop = telephone.scrollHeight;
  }

  entry.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = entry.value;
      entry.value = "";
      addText(text);
    }
  });

  // Keep the starfield text entry usable even after visiting menus/planet.
  // Form controls still keep their own normal keyboard behaviour.
  document.addEventListener("keydown", e=>{
    if(planetOpen)return;
    const a=document.activeElement;
    if(a===entry || a===telephone || a?.matches("button,select,input[type=range],input[type=checkbox],textarea"))return;
    if(e.ctrlKey||e.altKey||e.metaKey)return;

    if(e.key==="Enter"){
      e.preventDefault();
      entry.focus({preventScroll:true});
      const text=entry.value;
      entry.value="";
      addText(text);
      return;
    }
    if(e.key==="Backspace"){
      e.preventDefault();
      entry.focus({preventScroll:true});
      entry.value=entry.value.slice(0,-1);
      return;
    }
    if(e.key.length===1){
      e.preventDefault();
      entry.focus({preventScroll:true});
      entry.value+=e.key;
    }
  });

  window.addEventListener("focus",()=>setTimeout(()=>entry?.focus({preventScroll:true}),20));

  function drawTexts(dt) {
    for(let i=movingTexts.length-1;i>=0;i--){
      const t=movingTexts[i];
      t.age+=dt;
      const duration=10500;
      const p=Math.min(1,t.age/duration);
      t.x=cx;
      t.y=t.startY+(cy-12-t.startY)*p;
      const maxSize=appliedValue("launchedTextSizeRange",30);
      const initialSize=17;
      t.size=initialSize+(maxSize-initialSize)*Math.min(1,t.age/7600);
      const fadeStart=.72;
      t.opacity=p<fadeStart?.96:.96*(1-(p-fadeStart)/(1-fadeStart));
      if(p>=1||t.opacity<=.01){movingTexts.splice(i,1);continue;}
      if(document.getElementById("launchedTextInvisible")?.checked)continue;
      ctx.save();
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font=`${t.size}px "Segoe UI",Arial,sans-serif`;
      ctx.globalAlpha=t.opacity;
      const base=rainbowColour(Number(document.getElementById("launchedTextColourRange")?.value||100));
      const useRainbow=launchedTextRainbow;
      const useChange=launchedTextColourChange;
      if(useChange){
        const chars=[...t.text];
        const widths=chars.map(ch=>ctx.measureText(ch).width);
        const total=widths.reduce((a,b)=>a+b,0);
        let px=t.x-total/2;
        chars.forEach((ch,ci)=>{
          const w=widths[ci];
          ctx.fillStyle=rainbowColour(((textRainbowPhase*1.8+ci*4)%75));
          ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=appliedValue("textGlowRange",0);
          ctx.fillText(ch,px+w/2,t.y);px+=w;
        });
      }else{
        ctx.fillStyle=useRainbow?cycleRainbowColour(textRainbowPhase/58):base;
        ctx.shadowColor=ctx.fillStyle;
        ctx.shadowBlur=appliedValue("textGlowRange",0);
        ctx.fillText(t.text,t.x,t.y);
      }
      ctx.restore();
    }
  }


  /* ---------------- DRAWING ---------------- */

  const drawCanvas = document.getElementById("drawingCanvas");
  const dctx = drawCanvas.getContext("2d");
  const launchedDrawCanvas = document.getElementById("launchedDrawCanvas");
  const launchedCtx = launchedDrawCanvas.getContext("2d");
  let drawingDuration = 2800;
  let colour = "#ffffff";

  function resizeLaunchedCanvas(){
    launchedDrawCanvas.width = Math.floor(window.innerWidth * dpr);
    launchedDrawCanvas.height = Math.floor(window.innerHeight * dpr);
    launchedDrawCanvas.style.width = window.innerWidth + "px";
    launchedDrawCanvas.style.height = window.innerHeight + "px";
    launchedCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeLaunchedCanvas();
  window.addEventListener("resize", resizeLaunchedCanvas);

  const drawDuration = document.getElementById("drawDuration");
  if(drawDuration){
    drawDuration.addEventListener("change",()=>{drawingDuration=Number(drawDuration.value);appliedRanges.drawDuration=Number(drawDuration.value);});
  }
  let drawing = false;
  let points = [];
  const MAX_LIVE_DRAW_POINTS=1000;
  const POINT_SPACING=2.2;
  const incomingDrawings = [];

  function resizeDrawingCanvas() {
    drawCanvas.width = Math.floor(window.innerWidth * dpr);
    drawCanvas.height = Math.floor(window.innerHeight * dpr);
    drawCanvas.style.width = window.innerWidth + "px";
    drawCanvas.style.height = window.innerHeight + "px";
    dctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeDrawingCanvas();
  window.addEventListener("resize", resizeDrawingCanvas);

  function isUIElement(target, x, y) {
    if (target && target.closest &&
        target.closest(".window, #mainMenu, #textGrab, #planetOrb, #planetView")) return true;
    const el = document.elementFromPoint(x,y);
    return !!(el && el.closest &&
        el.closest(".window, #mainMenu, #textGrab, #planetOrb, #planetView"));
  }

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  // The drawing canvas is the only surface that receives drawing gestures.
  // It sits above the starfield but below every menu/window/text control.
  drawCanvas.style.pointerEvents = "auto";
  drawCanvas.style.touchAction = "none";

  drawCanvas.addEventListener("pointerdown", e => {
    if(e.button!==0)return;
    drawing=true;
    const q=pointerPos(e);
    points=[q];
    window.__drawingPointerId=e.pointerId;
    drawCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  drawCanvas.addEventListener("pointermove", e => {
    if(!drawing || e.pointerId!==window.__drawingPointerId)return;
    const q=pointerPos(e);
    const last=points[points.length-1];
    if(!last){
      points.push(q);
      return;
    }
    const dist=Math.hypot(q.x-last.x,q.y-last.y);
    // Keep enough points for a faithful curve without allowing an extremely
    // long mouse gesture to become an animation bottleneck.
    if(dist>=POINT_SPACING){
      const steps=Math.min(8,Math.max(1,Math.ceil(dist/POINT_SPACING)));
      for(let k=1;k<=steps;k++){
        const t=k/steps;
        points.push({
          x:last.x+(q.x-last.x)*t,
          y:last.y+(q.y-last.y)*t
        });
      }
      if(points.length>MAX_LIVE_DRAW_POINTS){
        points.splice(0, points.length-MAX_LIVE_DRAW_POINTS);
      }
    }
    e.preventDefault();
  });

  function finishDrawing(e){
    if(!drawing || e.pointerId!==window.__drawingPointerId)return;
    drawing=false;
    window.__drawingPointerId=null;

    if(points.length===1){
      points.push({x:points[0].x+.5,y:points[0].y+.5});
    }

    if(points.length>1){
      const shape=points.map(q=>({x:q.x,y:q.y}));
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      for(const q of shape){
        minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);
        minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y);
      }

      incomingDrawings.push({
        planet:planetOpen,
        color:(launchedDrawRainbowCycle ? cycleRainbowColour(planetRainbowPhase/58) : rainbowColour(Number(document.getElementById("launchedDrawColourRange")?.value||100))),
        points:simplifyLaunchPoints(shape,900),
        ox:(minX+maxX)/2,
        oy:(minY+maxY)/2,
        age:0,
        opacity:1
      });
    }

    points=[];
    dctx.clearRect(0,0,W,H);
    e.preventDefault();
  }

  drawCanvas.addEventListener("pointerup",finishDrawing);
  drawCanvas.addEventListener("pointercancel",finishDrawing);
  drawCanvas.addEventListener("lostpointercapture",e=>{
    if(drawing)finishDrawing(e);
  });

  function drawLiveLine() {
    dctx.clearRect(0,0,W,H);
    if(points.length<2)return;

    dctx.save();
    dctx.lineCap="round";
    dctx.lineJoin="round";
    const liveColour=drawRainbowCycle ? cycleRainbowColour(planetRainbowPhase/58) : rainbowColour(Number(document.getElementById("drawColourRange")?.value||100));
    dctx.shadowBlur=appliedValue("drawGlowRange",12);
    dctx.shadowColor=liveColour;
    dctx.strokeStyle=liveColour;
    dctx.lineWidth=appliedValue("drawLineWidth",2);

    dctx.beginPath();
    dctx.moveTo(points[0].x,points[0].y);
    if(points.length===2){
      dctx.lineTo(points[1].x,points[1].y);
    }else{
      for(let i=1;i<points.length-1;i++){
        const mx=(points[i].x+points[i+1].x)/2;
        const my=(points[i].y+points[i+1].y)/2;
        dctx.quadraticCurveTo(points[i].x,points[i].y,mx,my);
      }
      const last=points[points.length-1];
      dctx.lineTo(last.x,last.y);
    }
    dctx.stroke();

    dctx.shadowBlur=4;
    dctx.strokeStyle="rgba(255,255,255,.50)";
    dctx.lineWidth=.55;
    dctx.stroke();
    dctx.restore();
  }

  function simplifyLaunchPoints(srcPoints,maxPoints=700){
    if(srcPoints.length<=maxPoints)return srcPoints.slice();
    const out=[];
    const step=(srcPoints.length-1)/(maxPoints-1);
    for(let i=0;i<maxPoints;i++)out.push(srcPoints[Math.round(i*step)]);
    return out;
  }

  function drawIncomingDrawings(dt) {
    launchedCtx.clearRect(0,0,W,H);
    for(let i=incomingDrawings.length-1;i>=0;i--){
      const d=incomingDrawings[i];
      if(d.planet) continue;
      d.age=(Number.isFinite(d.age)?d.age:0)+dt;

      const p=Math.min(1,d.age/drawingDuration);
      if(p>=1){incomingDrawings.splice(i,1);continue;}

      // One smooth path from the lower-middle launch point upward.
      const y=H*.66+(H*.025-H*.66)*p;
      // A little larger than the previous version, but still well below
      // the enormous freeze drawing.
      const scale=.035+p*.98;

      const fadeStart=.70;
      const fade=p<fadeStart ? 1 : Math.max(0,1-(p-fadeStart)/(1-fadeStart));

      const glow=appliedValue("launchedDrawGlowRange",16);
      const lineW=appliedValue("drawLineWidth",2);

      launchedCtx.save();
      launchedCtx.translate(cx,y);
      launchedCtx.scale(scale,scale);
      launchedCtx.translate(-d.ox,-d.oy);

      launchedCtx.globalAlpha=fade;
      launchedCtx.lineCap="round";
      launchedCtx.lineJoin="round";
      launchedCtx.lineWidth=lineW;

      // White glow envelope copied from the freeze/paint character.
      launchedCtx.shadowColor="rgba(255,255,255,.95)";
      launchedCtx.shadowBlur=glow;
      launchedCtx.strokeStyle=d.color||"#fff";
      smoothLaunchPath(launchedCtx,d.points);
      launchedCtx.stroke();

      // Crisp bright core.
      launchedCtx.shadowBlur=0;
      launchedCtx.strokeStyle=d.color||"#fff";
      smoothLaunchPath(launchedCtx,d.points);
      launchedCtx.stroke();

      launchedCtx.restore();
    }
  }

  function smoothLaunchPath(ctx,pts){
    if(!pts.length)return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    if(pts.length===2){
      ctx.lineTo(pts[1].x,pts[1].y);
      return;
    }
    for(let j=1;j<pts.length-1;j++){
      const mx=(pts[j].x+pts[j+1].x)/2;
      const my=(pts[j].y+pts[j+1].y)/2;
      ctx.quadraticCurveTo(pts[j].x,pts[j].y,mx,my);
    }
    const last=pts[pts.length-1];
    ctx.lineTo(last.x,last.y);
  }

  function makePlanetStars() {
    planetStars = [];
    const count = Math.min(460, Math.floor(window.innerWidth * window.innerHeight / 3600));
    for (let i = 0; i < count; i++) {
      planetStars.push({

        y: Math.random() * window.innerHeight,
        r: Math.random() < .84 ? Math.random() * .8 + .25 : Math.random() * 1.4 + .7,
        a: Math.random() * .52 + .35,

      });

  }

  function rainbowColour(v){
    const stops=[
      [255,0,0],[255,72,0],[255,150,0],[255,220,0],[120,205,40],
      [0,190,155],[0,145,255],[85,80,255],[155,45,220],
      [255,40,165],[255,135,185],[230,175,125],[165,125,80],
      [110,110,110],[62,62,62],[0,0,0],[255,255,255]
    ];
    const t=Math.max(0,Math.min(100,Number(v)||0))/100*(stops.length-1);
    const i=Math.min(stops.length-2,Math.floor(t));
    const f=t-i;
    const a=stops[i],b=stops[i+1];
    return "#"+[0,1,2].map(k=>Math.round(a[k]+(b[k]-a[k])*f).toString(16).padStart(2,"0")).join("");
  }
  function cycleRainbowColour(phase){
    const hue=((Number(phase)||0)%1+1)%1*360;
    const c=1, x=1-Math.abs((hue/60)%2-1);
    let r=0,g=0,b=0;
    if(hue<60){r=c;g=x;} else if(hue<120){r=x;g=c;} else if(hue<180){g=c;b=x;} else if(hue<240){g=x;b=c;} else if(hue<300){r=x;b=c;} else {r=c;b=x;}
    return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
  }

  function currentPlanetColour(){
    return planetRainbowCycle ? rainbowColour(planetRainbowPhase/58*75) :
      (planetColourRange ? rainbowColour(planetColourRange.value) : "#888888");
  }
  function currentTextColour(){
    return textRainbowCycle ? rainbowColour(textRainbowPhase/58*75) :
      (planetTextColourRange ? rainbowColour(planetTextColourRange.value) : "#ffffff");
  }

  let planetRainbowCycle=false;
  let textRainbowCycle=true;
  let planetRainbowPhase=0;
  let textRainbowPhase=0;

  function updateRainbowCycles(dt){
    const rate=.00075;
    if(planetRainbowCycle) planetRainbowPhase=(planetRainbowPhase+dt*rate)%58;
    if(textRainbowCycle) textRainbowPhase=(textRainbowPhase+dt*rate)%58;
  }

  function drawPlanetScene(now) {
    if(!planetOpen)return;
    updateRainbowCycles(16.67);

    const pw=window.innerWidth,ph=window.innerHeight;
    pctx.clearRect(0,0,pw,ph);

    for(const st of planetStars){
      pctx.beginPath();
      pctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      pctx.fillStyle=st.warm
        ? `rgba(235,220,190,${st.a})`
        : `rgba(225,235,248,${st.a})`;
      pctx.fill();
    }

    const x=pw*.5,y=ph*.53,R=Math.min(pw,ph)*.205;

    // Complete, smooth 3-D sphere. No separate shadow overlay, bands, or edge mask.
    const pc=currentPlanetColour();
    const baseR=parseInt(pc.slice(1,3),16), baseG=parseInt(pc.slice(3,5),16), baseB=parseInt(pc.slice(5,7),16);
    const shade=(m,a=1)=>`rgba(${Math.max(0,Math.min(255,Math.round(baseR*m)))},${Math.max(0,Math.min(255,Math.round(baseG*m)))},${Math.max(0,Math.min(255,Math.round(baseB*m)))},${a})`;
    const sphere=pctx.createRadialGradient(x-R*.38,y-R*.42,R*.02,x+R*.18,y+R*.16,R*1.02);
    sphere.addColorStop(0,shade(1.34,1));
    sphere.addColorStop(.18,shade(1.18,1));
    sphere.addColorStop(.48,shade(.98,1));
    sphere.addColorStop(.76,shade(.78,1));
    sphere.addColorStop(.93,shade(.64,1));
    sphere.addColorStop(1,shade(.55,1));
    pctx.beginPath();pctx.arc(x,y,R,0,Math.PI*2);pctx.fillStyle=sphere;pctx.fill();
    const highlight=pctx.createRadialGradient(x-R*.34,y-R*.38,0,x-R*.34,y-R*.38,R*.34);
    highlight.addColorStop(0,"rgba(255,255,255,.18)");
    highlight.addColorStop(1,"rgba(255,255,255,0)");
    pctx.beginPath();pctx.arc(x,y,R,0,Math.PI*2);pctx.fillStyle=highlight;pctx.fill();

    // Text is packed into successive clockwise rings. The oldest phrase is
    // always placed first; new phrases are appended after it. When a ring
    // fills, the next ring is created just outside it.
    const ringLines=submittedLines.slice();
    const motion=planetMotion ? planetMotion.value : "ring";
    const textSize=Math.max(8,Math.min(30,appliedValue("planetTextSize",15)));
    const baseRadius=motion==="orbit" ? R*1.42 : R*1.30;
    const ringGap=Math.max(8,textSize*.75);
    const gap=Math.max(12,textSize*.9);
    const rings=[];
    let radius=baseRadius;
    let current=[];
    pctx.font=`${textSize}px "Segoe UI",Arial,sans-serif`;
    for(const line of ringLines){
      const w=pctx.measureText(line).width;
      const used=current.reduce((sum,it)=>sum+it.w+gap,0);
      if(current.length && used+w+gap>2*Math.PI*radius*.90){
        rings.push({items:current,radius});
        radius+=textSize+ringGap;
        current=[];
      }
      current.push({line,w});
    }
    if(current.length)rings.push({items:current,radius});

    const speedSetting=planetSpeed ? appliedValue("planetSpeed",14) : 14;
    const angularSpeed=speedSetting*0.0000035;
    rings.forEach((ring,ringIndex)=>{
      const total=ring.items.reduce((sum,it)=>sum+it.w+gap,0);
      let cursor=-total/2;
      ring.items.forEach((item,index)=>{
        const centerArc=cursor+item.w/2;
        cursor+=item.w+gap;
        const phase=(now-planetStart)*angularSpeed;
        let angle=phase+centerArc/ring.radius-Math.PI/2;
        let rr=ring.radius;
        let tx=x+Math.cos(angle)*rr;
        let ty=y+Math.sin(angle)*rr;
        if(motion==="axis"){
          angle=phase*(1+ringIndex*.25)+centerArc/ring.radius-Math.PI/2;
          rr=ring.radius*.86; tx=x+Math.cos(angle)*rr; ty=y+Math.sin(angle)*rr*.52;
        }else if(motion==="float"){
          tx+=Math.sin(now*.00013+index*.75)*R*.10; ty+=Math.cos(now*.00011+index*.61)*R*.10;
        }else if(motion==="scatter"){
          const sc=Math.max(0,Math.sin(now*.00055+index*.72))*R*.26;
          tx+=Math.cos(now*.00072+index)*sc; ty+=Math.sin(now*.00061+index*1.2)*sc;
        }else if(motion==="wave"){
          ty+=Math.sin(now*.00016+index*.62)*R*.14;
        }else if(motion==="spiral"){
          rr+=Math.sin(now*.000065)*R*.18*(ringIndex+1); tx=x+Math.cos(angle)*rr; ty=y+Math.sin(angle)*rr;
        }else if(motion==="planet"){
          rr=Math.max(R*.64,ring.radius-R*.50); angle=phase*.62+centerArc/Math.max(1,rr)-Math.PI/2;
          tx=x+Math.cos(angle)*rr*.80; ty=y+Math.sin(angle)*rr*.42;
        }else if(motion==="launch"){
          rr=ring.radius+Math.min(1,(now-planetStart)/12000)*R*.22; tx=x+Math.cos(angle)*rr; ty=y+Math.sin(angle)*rr;
        }
        pctx.save();
        pctx.translate(tx,ty);
        if(motion==="planet"||motion==="axis") pctx.rotate(Math.sin(angle)*.18); else pctx.rotate(angle+Math.PI/2);
        pctx.font=`${textSize}px "Segoe UI",Arial,sans-serif`;
        if(typedTextColourChange || launchedTextColourChange){
          const chars=[...item.line]; let total=0; chars.forEach(ch=>total+=pctx.measureText(ch).width); let px=-total/2;
          chars.forEach((ch,ci)=>{const mw=pctx.measureText(ch).width;pctx.fillStyle=rainbowColour(((textRainbowPhase+ci*4)%58)/58*75);pctx.fillText(ch,px+mw/2,0);px+=mw;});
        }else{
          pctx.fillStyle=currentTextColour(); pctx.fillText(item.line,0,0);
        }
        pctx.shadowBlur=2; pctx.shadowColor="rgba(255,255,255,.12)";
        pctx.restore();
      });
    });

    // Drawings made on the planetary surface launch above the planet.
    drawPlanetIncomingDrawings(now);

    requestAnimationFrame(drawPlanetScene);
  }

  function drawPlanetIncomingDrawings(now){
    for(let i=incomingDrawings.length-1;i>=0;i--){
      const d=incomingDrawings[i];
      if(!d.planet)continue;
      d.age=(Number.isFinite(d.age)?d.age:0)+(now-(d._lastPlanetFrame||now));
      d._lastPlanetFrame=now;
      const p=Math.min(1,d.age/drawingDuration);
      if(p>=1){incomingDrawings.splice(i,1);continue;}
      const pw=window.innerWidth,ph=window.innerHeight;
      const x=pw*.5, y=ph*.66+(ph*.10-ph*.66)*p;
      const scale=.035+p*.70;
      const fade=p<.70?1:Math.max(0,1-(p-.70)/.30);
      const glow=appliedValue("launchedDrawGlowRange",16);
      const lineW=appliedValue("drawLineWidth",2);
      pctx.save();
      pctx.translate(x,y);pctx.scale(scale,scale);pctx.translate(-d.ox,-d.oy);
      pctx.globalAlpha=fade;pctx.lineCap="round";pctx.lineJoin="round";pctx.lineWidth=lineW;
      pctx.shadowColor=d.color||"#fff";pctx.shadowBlur=glow;
      pctx.strokeStyle=d.color||"#fff";smoothLaunchPath(pctx,d.points);pctx.stroke();
      pctx.shadowBlur=0;pctx.strokeStyle=d.color||"#fff";smoothLaunchPath(pctx,d.points);pctx.stroke();
      pctx.restore();
    }
  }

      const sx=e.clientX-r.left, sy=e.clientY-r.top;
      const move=ev=>{
        win.style.left=(ev.clientX-sx)+"px";
        win.style.top=(ev.clientY-sy)+"px";
        win.style.right="auto"; win.style.bottom="auto";
      };
      const up=()=>{
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
      };
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up,{once:true});
      e.preventDefault();
    });
    win.addEventListener("pointerdown",()=>bringToFront(win),true);
  }
  function installAllWindowDrags(){
    document.querySelectorAll(".window").forEach(installWindowDrag);
  }

  /* ---------------- WINDOWS ---------------- */

  let topZ = 200;

  function bringToFront(el){

  // Draggable title bars. Windows stay cleanly draggable and whichever
  // window is touched becomes the active/top window.
  document.querySelectorAll(".window").forEach(win => {
    const bar = win.querySelector(".titlebar");
    let drag = null;

    bar.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest(".close")) return;
      bringToFront(win);

      const rect = win.getBoundingClientRect();
      drag = {
        startX: e.clientX,
        startY: e.clientY,
        left: rect.left,
        top: rect.top
      };

      // Remove transform once a centred window is moved, so its new
      // position is ordinary left/top coordinates.
      const currentTransform = getComputedStyle(win).transform;
      if (currentTransform !== "none") {
        win.style.left = rect.left + "px";
        win.style.top = rect.top + "px";
        win.style.right = "auto";
        win.style.transform = "none";
      }

      bar.setPointerCapture(e.pointerId);
      e.preventDefault();
      e.stopPropagation();
    });

    bar.addEventListener("pointermove", e => {
      if (!drag) return;

      let left = drag.left + (e.clientX - drag.startX);
      let top = drag.top + (e.clientY - drag.startY);

      const maxLeft = window.innerWidth - win.offsetWidth;
      const maxTop = window.innerHeight - win.offsetHeight;

      left = Math.max(0, Math.min(maxLeft, left));
      top = Math.max(0, Math.min(maxTop, top));

      win.style.left = left + "px";
      win.style.top = top + "px";
      win.style.right = "auto";
      win.style.transform = "none";
    });

    bar.addEventListener("pointerup", () => { drag = null; });
    bar.addEventListener("pointercancel", () => { drag = null; });
  });

  document.querySelectorAll(".window").forEach(win=>win.addEventListener("pointerdown",()=>bringToFront(win),true));

  /* Main menu itself stays attached to the exact lower-left corner. */
  document.getElementById("mainMenuHead").addEventListener("click",e=>{

  /* Text entry: normal editing by default; movement is opt-in. */
  const textGrab=document.getElementById("textGrab");

  let textDrag=null;

  textGrab.addEventListener("pointerdown",e=>{
    if(!movableCursor || !movableCursor.checked)return;

    const r=textGrab.getBoundingClientRect();
    textDrag={
      dx:e.clientX-r.left,
      dy:e.clientY-r.top
    };

    textGrab.style.cursor="grabbing";
    e.preventDefault();
  });

  textGrab.addEventListener("pointermove",e=>{
    if(!textDrag)return;
    const w=textGrab.offsetWidth,h=textGrab.offsetHeight;
    let left=e.clientX-textDrag.dx;
    let top=e.clientY-textDrag.dy;
    left=Math.max(0,Math.min(window.innerWidth-w,left));
    top=Math.max(0,Math.min(window.innerHeight-h,top));

    textGrab.style.transform="none";

  entry.addEventListener("click",()=>entry.focus({preventScroll:true}));
  let typedTextRainbow=false, launchedTextRainbow=false, typedTextColourChange=false, launchedTextColourChange=false;
  let drawRainbowCycle=false, launchedDrawRainbowCycle=false;
  function updateTypedEntryAppearance(){
    entry.style.opacity=document.getElementById("typedTextInvisible")?.checked?"0":"1";

  document.getElementById("launchedTextRainbow")?.addEventListener("change",e=>{

  document.getElementById("drawRainbowCycle")?.addEventListener("change",e=>drawRainbowCycle=e.target.checked);

  entry.focus({preventScroll:true});
  const PALETTE=["#f00000","#ff3b00","#ff7a00","#ffb300","#ffd000","#9dcc32","#35b96d","#00b8a5","#008cff","#4f62ff","#7c3bd4","#b52bc8","#e92b9f","#ff6fae","#ff9fc7","#e7b184","#b88755","#777777","#444444","#000000","#ffffff"];
  function markPalette(id){
    const state=document.getElementById(id),wrap=document.querySelector(`.colourBarWrap[data-colour-target="${id}"]`); if(!state||!wrap)return;

  function buildPalette(id){

    sw.addEventListener("pointerup",stop); sw.addEventListener("pointercancel",stop); window.addEventListener("pointerup",stop);
    markPalette(id);
  }
  ["planetColourRange","planetTextColourRange","drawColourRange","launchedDrawColourRange","typedTextColourRange","launchedTextColourRange"].forEach(buildPalette);

  function restoreEntryFocus(){setTimeout(()=>{
    const telephoneWindow=document.getElementById("telephoneWindow");
    const telephoneVisible=telephoneWindow && getComputedStyle(telephoneWindow).display!=="none";
    const target=planetOpen ? (telephoneVisible ? telephone : planetEntry) : entry;
    if(target && document.activeElement!==target){target.focus({preventScroll:true});target.setSelectionRange(target.value.length,target.value.length);}
  },0);}
  document.querySelectorAll(".window input,.window select,.window button").forEach(el=>{el.addEventListener("pointerup",restoreEntryFocus);el.addEventListener("change",restoreEntryFocus);});
  window.addEventListener("pointerup",()=>document.querySelectorAll('.colourSwatch[data-held="1"]').forEach(b=>delete b.dataset.held));

  const appliedRanges={};
  ["planetSpeed","planetTextSize","drawLineWidth","drawGlowRange","launchedDrawGlowRange","drawDuration","typedTextSizeRange","launchedTextSizeRange","textGlowRange"].forEach(id=>{const r=document.getElementById(id);if(r)appliedRanges[id]=Number(r.value);});
  function appliedValue(id,fallback){return Object.prototype.hasOwnProperty.call(appliedRanges,id)?appliedRanges[id]:fallback;}
  document.querySelectorAll('input[type="range"]:not(.colourState)').forEach(r=>r.addEventListener("change",()=>{appliedRanges[r.id]=Number(r.value);}));

  document.querySelectorAll("[data-range-step]").forEach(btn=>{
    const id=btn.dataset.rangeStep, delta=Number(btn.dataset.rangeDelta||0);
    const change=()=>{
      const r=document.getElementById(id); if(!r)return;
      r.value=String(Math.max(Number(r.min),Math.min(Number(r.max),Number(r.value)+Number(r.step||1)*delta)));
      appliedRanges[r.id]=Number(r.value); r.dispatchEvent(new Event("change",{bubbles:true}));
    };
    let timer=null;
    btn.addEventListener("pointerdown",e=>{
      if(e.button!==0)return;
      change(); timer=setInterval(change,90); e.preventDefault();
    });
    const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
    btn.addEventListener("pointerup",stop); btn.addEventListener("pointercancel",stop);

    telephone.focus({preventScroll:true}); telephone.setSelectionRange(telephone.value.length,telephone.value.length);

  poemArchive?.addEventListener("change",()=>{if(poemArchive.value!=="")loadPoemAt(Number(poemArchive.value));});
  document.getElementById("poemPrev")?.addEventListener("click",()=>loadPoemAt(poemArchiveIndex-1));
  document.getElementById("poemNext")?.addEventListener("click",()=>loadPoemAt(poemArchiveIndex+1));
  document.getElementById("downloadAllPoems")?.addEventListener("click",()=>{const p=poemsFromStorage();downloadPlainText("starfield-poems.txt",p.map(x=>`=== ${x.title||"Untitled"} ===\n${x.text}`).join("\n\n"));});

  document.getElementById("rimePoem")?.addEventListener("click",()=>{

  document.getElementById("poemTitleCancel")?.addEventListener("click",()=>{document.getElementById("poemTitleDialog").classList.remove("show");document.getElementById("poemTitleDialog").setAttribute("aria-hidden","true");telephone.focus({preventScroll:true});});

    const poems=poemsFromStorage(); poems.push({title,text:pendingPoemText,created:new Date().toISOString()});
    localStorage.setItem("starfieldPoems",JSON.stringify(poems)); refreshPoemArchive(); poemArchiveIndex=poems.length-1; poemArchive.value=String(poemArchiveIndex);
    setTelephoneTitle(title); telephone.value=""; submittedLines.length=0;
    document.getElementById("poemTitleDialog").classList.remove("show"); document.getElementById("poemTitleDialog").setAttribute("aria-hidden","true");
    telephone.focus({preventScroll:true});
  });
  document.getElementById("poemTitleInput")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("poemTitleSave").click();}else if(e.key==="Escape"){e.preventDefault();document.getElementById("poemTitleCancel").click();}});
  refreshPoemArchive();

})();
</script>

<script id="v49Patch">
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const all=id=>Array.from(document.querySelectorAll('#'+CSS.escape(id)));

/* ----- Numeric steppers: same IDs, therefore V30 renderer stays compatible. ----- */
const configs={
 drawLineWidth:[1,45,2,4],drawGlowRange:[0,50,1,12],launchedDrawGlowRange:[0,60,1,16],
 drawDuration:[1200,6200,100,3000],typedTextSizeRange:[8,32,2,18],
 launchedTextSizeRange:[10,60,2,30],textGlowRange:[0,30,1,0],
 planetSpeed:[2,35,1,14],planetTextSize:[8,30,2,15]
};
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function setNum(id,n){
 const e=$(id); if(!e)return;
 const [a,b,step]=configs[id];
 n=clamp(Math.round(n/step)*step,a,b);
 e.value=n;
 e.dispatchEvent(new Event('input',{bubbles:true}));
 e.dispatchEvent(new Event('change',{bubbles:true}));
}
function step(id,dir){
 const e=$(id); if(!e)return;
 const [a,b,stepv]=configs[id];
 setNum(id,Number(e.value||a)+dir*stepv);
}
document.querySelectorAll('[data-range-step]').forEach(b=>{
 const id=b.dataset.rangeStep;
 if(!configs[id])return;
 b.addEventListener('click',e=>{e.preventDefault();step(id,Number(b.dataset.rangeDelta||1));});
});
/* Hold = slow, then faster, then fastest. */
document.querySelectorAll('[data-range-step]').forEach(b=>{
 let timer=null,start=0;
 b.addEventListener('pointerdown',e=>{
   e.preventDefault();start=performance.now();step(b.dataset.rangeStep,Number(b.dataset.rangeDelta||1));
   timer=setInterval(()=>{
     const age=performance.now()-start;
     const repeats=age>1800?5:age>900?3:1;
     for(let i=0;i<repeats;i++)step(b.dataset.rangeStep,Number(b.dataset.rangeDelta||1));
   },120);
 });
 const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
 b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop);
});

/* ----- Draw colour controls: one drawn-line palette at top, then launched controls. ----- */
const dw=$('drawWindow');
if(dw){
 const heads=Array.from(dw.querySelectorAll('.lineSubhead'));
 const drawn=heads.find(h=>/drawn line/i.test(h.textContent||''));
 const launched=heads.find(h=>/launched line/i.test(h.textContent||''));
 if(drawn){
   drawn.innerHTML='';
   const s=document.createElement('span');s.textContent='drawn line';drawn.appendChild(s);
   const l=document.createElement('label');l.className='tinyCheck';
   l.innerHTML='<input id="v49DrawRainbow" type="checkbox" checked> rainbow';
   drawn.appendChild(l);
   const m=document.createElement('label');m.className='tinyCheck';
   m.innerHTML='<input id="v49DrawMatch" type="checkbox" checked> match';
   drawn.appendChild(m);
   const a=document.createElement('label');a.className='tinyCheck';
   a.innerHTML='<input id="v49DrawAuto" type="checkbox"> auto';
   drawn.appendChild(a);
   const inv=document.createElement('label');inv.className='tinyCheck';
   inv.innerHTML='<input id="v49DrawInvisible" type="checkbox"> invisible';
   drawn.appendChild(inv);
   const old=dw.querySelector('label:has(#drawColourRange)');
   if(old)drawn.after(old);
 }
 if(launched){
   const rb=document.createElement('label');rb.className='tinyCheck';
   rb.innerHTML='<input id="v49LaunchRainbow" type="checkbox" checked> rainbow';
   launched.appendChild(rb);
 }
}
/* Synchronise the new visible controls to the IDs V30's renderer reads. */
function bindMirror(visibleId,targetId){
 const v=$(visibleId),t=$(targetId);if(!v||!t)return;
 v.checked=t.checked;
 v.addEventListener('change',()=>{t.checked=v.checked;t.dispatchEvent(new Event('change',{bubbles:true}));});
 t.addEventListener('change',()=>{v.checked=t.checked;});
}
bindMirror('v49DrawRainbow','drawRainbowCycle');
bindMirror('v49DrawMatch','drawMatchColours');
bindMirror('v49DrawAuto','drawAutoLaunch');
bindMirror('v49DrawInvisible','invisibleDrawLine');
bindMirror('v49LaunchRainbow','launchedDrawRainbowCycle');

/* Make the original drawn line noticeably thicker at startup. */
setNum('drawLineWidth',4);

/* ----- Shared continuous rainbow ----- */
let v49Hue=0;
function v49Rainbow(){return `hsl(${v49Hue},100%,50%)`;}
function v49RainbowFrame(){v49Hue=(v49Hue+.5)%360;requestAnimationFrame(v49RainbowFrame);}
requestAnimationFrame(v49RainbowFrame);

/* ----- Planet phone menu: rainbow text lives HERE. ----- */
const pm=$('planetPhoneMenu');
if(pm){
 const old=pm.querySelector('.rainbowChecks');
 if(old)old.remove();
 const row=document.createElement('div');row.id='v49PlanetRainbowRow';
 row.innerHTML='<span>rainbow text</span><input id="v49PlanetRainbowText" type="checkbox" checked>';
 pm.appendChild(row);
 const cb=$('v49PlanetRainbowText');
 cb.addEventListener('change',()=>{const t=$('textRainbowCycle');if(t){t.checked=cb.checked;t.dispatchEvent(new Event('change',{bubbles:true}));}});
 const t=$('textRainbowCycle');if(t)t.checked=true;
}

/* ----- Bottom-right launch controls on both fields. ----- */
function buttonBar(id,parent){
 let bar=$(id);
 if(!bar){bar=document.createElement('div');bar.id=id;parent.appendChild(bar);}
 bar.innerHTML='';
 const b1=document.createElement('button'),b2=document.createElement('button'),b3=document.createElement('button');
 b1.textContent='LAUNCH DRAW';b2.textContent='LAUNCH TEXT';b3.textContent='STELLAR ZAMBONI';
 bar.append(b1,b2,b3);
 b1.onclick=()=>{
   /* V30's actual launch path. */
   if(typeof window.launchLastDrawing==='function')window.launchLastDrawing();
   else if(typeof window.launchDrawing==='function')window.launchDrawing();
   else if(window.__starfieldControls?.launchDraw)window.__starfieldControls.launchDraw();
 };
 b2.onclick=()=>{
   if(typeof window.launchLastText==='function')window.launchLastText();
   else if(typeof window.launchText==='function')window.launchText();
   else if(window.__starfieldControls?.launchText)window.__starfieldControls.launchText();
 };
 b3.onclick=()=>{
   document.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');if(x)x.clearRect(0,0,c.width,c.height);});
 };
 return bar;
}
buttonBar('v49LaunchBar',document.body);
const pv=$('planetView');
if(pv)buttonBar('planetLaunchBarV49',pv);

/* Planet drawing: V30's drawing handler excludes planetView because it is UI.
   Give the planet canvas its own drawing gesture and feed it into the existing
   incomingDrawings renderer with planet=true. */
const pc=$('planetCanvas');
if(pc){
 pc.style.pointerEvents='auto';pc.style.touchAction='none';
 let pd=false,pp=[],pid=null;
 const pos=e=>({x:e.clientX,y:e.clientY});
 pc.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;pd=true;pid=e.pointerId;pp=[pos(e)];pc.setPointerCapture(e.pointerId);e.preventDefault();
 });
 pc.addEventListener('pointermove',e=>{
   if(!pd||e.pointerId!==pid)return;const q=pos(e),last=pp[pp.length-1];
   if(Math.hypot(q.x-last.x,q.y-last.y)>2)pp.push(q);e.preventDefault();
 });
 function end(e){
   if(!pd||e.pointerId!==pid)return;pd=false;pid=null;
   if(pp.length<2)return;
   let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
   pp.forEach(q=>{minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y);});
   if(Array.isArray(window.incomingDrawings))window.incomingDrawings.push({planet:true,color:v49Rainbow(),points:pp.slice(),ox:(minX+maxX)/2,oy:(minY+maxY)/2,age:0,opacity:1});
 }
 pc.addEventListener('pointerup',end);pc.addEventListener('pointercancel',end);
}

/* Ensure menus are not covered by the new bars. */
window.addEventListener('resize',()=>{if($('v49LaunchBar'))$('v49LaunchBar').style.display='flex';});
})();
</script>

<script id="v50RainbowMenuRepairScript">
(() => {
"use strict";
const $ = id => document.getElementById(id);

/* ---------------------------------------------------------
   1. Use the supplied HTML's patched rainbow implementation
      as the single rainbow source for DRAW + ALL TEXT.
      Planet text is deliberately excluded.
   --------------------------------------------------------- */
let rainbowHue = 0;
let lastRainbowTime = performance.now();

function rainbowColour(offset = 0) {
  return `hsl(${((rainbowHue + offset) % 360 + 360) % 360}, 100%, 50%)`;
}

function rainbowStep(now) {
  const dt = Math.min(50, now - lastRainbowTime);
  lastRainbowTime = now;
  rainbowHue = (rainbowHue + dt * 0.055) % 360;
  requestAnimationFrame(rainbowStep);
}
requestAnimationFrame(rainbowStep);

window.__V50_RAINBOW_FOR_DRAW_AND_TEXT__ = rainbowColour;
window.__V50_PLANET_RAINBOW_EXCLUDED__ = true;

/* Make all relevant rainbow switches agree, without touching planet
   colour/rainbow state. */
[
  "drawRainbowCycle",
  "launchedDrawRainbowCycle",
  "textRainbowCycle",
  "launchedTextRainbowCycle",
  "v49DrawRainbow",
  "v49LaunchRainbow"
].forEach(id => {
  const e = $(id);
  if (e) e.checked = true;
});

/* ---------------------------------------------------------
   2. Remove the old white-only restriction from start text.
   Search both CSS and inline styles that force the starting
   text to white, then let the rainbow renderer determine it.
   --------------------------------------------------------- */
document.querySelectorAll(
  '#starfieldText, #typedText, #textInput, #planetText, .starfieldText'
).forEach(e => {
  if (e && /white|#fff|#ffffff/i.test(e.style.color || "")) {
    e.style.color = rainbowColour();
  }
});

/* Existing colour input values are left alone; the renderer uses
   the shared rainbow whenever its rainbow checkbox is checked. */

/* ---------------------------------------------------------
   3. Move DRAW colour blocks immediately beneath the draw heading.
   This deliberately happens AFTER the DOM exists, so the layout
   can be measured from its final contents rather than hard-coded
   against an earlier menu version.
   --------------------------------------------------------- */
const drawWindow = $("drawWindow");
if (drawWindow) {
  const body =
    drawWindow.querySelector(".window-body") ||
    drawWindow.querySelector(".window-content") ||
    drawWindow;

  const heading =
    body.querySelector(".lineSubhead") ||
    body.querySelector(".titlebar") ||
    body.firstElementChild;

  const palettes = Array.from(body.querySelectorAll(".colourBarWrap"));

  /* Identify the first palette as the drawn-line palette. */
  const drawnPalette = palettes.find(p =>
    /drawn|draw/i.test(p.textContent || "")
  ) || palettes[0];

  if (heading && drawnPalette) {
    /* Put drawn-line controls directly under the top draw line,
       with no controls crossing through the swatches. */
    heading.after(drawnPalette);
  }

  /* Put all actual drawn-line controls below the palette. */
  const controls = Array.from(body.querySelectorAll(".drawControl"));
  const firstPalette = drawnPalette;

  if (firstPalette && controls.length) {
    let cursor = firstPalette;
    controls.forEach(c => {
      if (c !== firstPalette && !/launched/i.test(c.textContent || "")) {
        cursor.after(c);
        cursor = c;
      }
    });
  }

  /* Let the browser determine the outline from the final contents. */
  drawWindow.style.height = "auto";
  body.style.height = "auto";
}

/* ---------------------------------------------------------
   4. Compact the TEXT number controls and make sure they sit
      below the text controls instead of intruding into palettes.
   --------------------------------------------------------- */
const textWindow = $("textWindow");
if (textWindow) {
  const body = textWindow.querySelector(".window-body") || textWindow;

  body.querySelectorAll(".rangeStepper").forEach(stepper => {
    stepper.style.display = "flex";
    stepper.style.alignItems = "center";
    stepper.style.gap = "3px";
    stepper.style.margin = "1px 0";
  });

  body.querySelectorAll(".v49Number").forEach(n => {
    n.style.width = "42px";
    n.style.height = "21px";
  });

  /* Do not allow controls to be absolutely positioned over palettes. */
  body.querySelectorAll("input, select, button, label").forEach(e => {
    if (e.closest(".colourBarWrap")) return;
    if (getComputedStyle(e).position === "absolute") {
      e.style.position = "relative";
      e.style.left = "auto";
      e.style.top = "auto";
    }
  });

  textWindow.style.height = "auto";
  body.style.height = "auto";
}

/* ---------------------------------------------------------
   5. Remove accidental white start-colour rules from the
      active text renderer if a V30/V49 rule exposed one.
   --------------------------------------------------------- */
["typedText", "launchedText", "starfieldText"].forEach(id => {
  const e = $(id);
  if (!e) return;
  e.dataset.v50RainbowDefault = "true";
});

/* The planet is explicitly NOT altered by this rainbow patch. */
window.__V50_shouldRainbowPlanet = false;
})();
</script>
